<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">SPATIAL PERCEPTION MULTI-OBJECTIVE PARETO FRONTIER</text>
<text x="440.0" y="44" class="subtitle">Operating Trade-Offs: Model Parameter Size vs Inference Latency vs 3D Metric Accuracy</text>
<line x1="100" y1="350" x2="780" y2="350" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
<text x="440.0" y="386" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">Inference Latency Δt_infer (ms) → [Faster to Slower]</text>
<line x1="100" y1="350" x2="100" y2="90" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
<text x="55" y="220.0" font-size="10.5" font-weight="700" fill="#475569" transform="rotate(-90 55 220.0)" text-anchor="middle">3D Metric Accuracy (mAP@0.25) →</text>
<path d="M 140 310 Q 320 150 680 110" fill="none" stroke="#215CAF" stroke-width="2.5" stroke-dasharray="6,3"/>
<text x="500" y="120" font-size="9" font-weight="700" fill="#215CAF">Pareto Optimal Frontier</text>
<circle cx="160" cy="285" r="7" fill="#1F407A" stroke="#FFFFFF" stroke-width="2" filter="url(#shadow)"/>
<rect x="172" y="271" width="145" height="24" rx="4" fill="#FFFFFF" stroke="#1F407A" stroke-width="1"/>
<text x="178" y="287" font-size="8.5" font-weight="700" fill="#1F407A">MobileNetV4-3D <tspan font-weight="500" fill="#64748B">(5.2 ms)</tspan></text>
<circle cx="280" cy="190" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2" filter="url(#shadow)"/>
<rect x="292" y="176" width="145" height="24" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
<text x="298" y="192" font-size="8.5" font-weight="700" fill="#10B981">DINOv2-Small <tspan font-weight="500" fill="#64748B">(14.8 ms)</tspan></text>
<circle cx="440" cy="135" r="7" fill="#B87333" stroke="#FFFFFF" stroke-width="2" filter="url(#shadow)"/>
<rect x="452" y="121" width="145" height="24" rx="4" fill="#FFFFFF" stroke="#B87333" stroke-width="1"/>
<text x="458" y="137" font-size="8.5" font-weight="700" fill="#B87333">DINOv2-Base <tspan font-weight="500" fill="#64748B">(28.5 ms)</tspan></text>
<circle cx="640" cy="105" r="7" fill="#5B4B8A" stroke="#FFFFFF" stroke-width="2" filter="url(#shadow)"/>
<rect x="652" y="91" width="145" height="24" rx="4" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1"/>
<text x="658" y="107" font-size="8.5" font-weight="700" fill="#5B4B8A">PaliGemma-3B <tspan font-weight="500" fill="#64748B">(78.0 ms)</tspan></text>
<rect x="220" y="150" width="160" height="90" rx="6" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-dasharray="3,3"/>
<text x="300" y="235" font-size="8.5" font-weight="700" fill="#10B981" text-anchor="middle">Physical AI Sweet Spot</text>
<text x="300" y="250" font-size="7.5" fill="#475569" text-anchor="middle">Latency ≤ 20 ms, mAP ≥ 0.80</text>
</svg>
