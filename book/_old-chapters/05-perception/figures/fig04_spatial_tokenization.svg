<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">SPATIAL AFFORDANCE TOKENIZATION VS 2D CLASSIFICATION</text>
<text x="440.0" y="44" class="subtitle">Extracting SE(3) Contact Affordances &amp; Metric 3D Bounding Boxes for Downstream Kinematic Execution</text>
<rect x="30" y="70" width="380" height="320" rx="8" fill="#DC2626" fill-opacity="0.04" stroke="#DC2626" stroke-width="1.2"/>
<text x="220.0" y="92" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">✕ 2D PASSIVE SEMANTIC CLASSIFICATION</text>
<text x="220.0" y="108" font-size="9" fill="#64748B" text-anchor="middle">Disembodied Web Vision (e.g. ImageNet, CLIP)</text>
<rect x="60" y="130" width="160" height="110" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<rect x="90" y="150" width="100" height="70" rx="2" fill="#DC2626" fill-opacity="0.15" stroke="#DC2626" stroke-width="1.5"/>
<text x="140" y="190" font-size="9" font-weight="700" fill="#DC2626" text-anchor="middle">"mug" (99.4%)</text>
<text x="50" y="270" font-size="8.5" fill="#475569">• Zero metric depth (no distance z in meters)</text>
<text x="50" y="290" font-size="8.5" fill="#475569">• No contact normal vectors n̂ for grasping</text>
<text x="50" y="310" font-size="8.5" fill="#475569">• Scale ambiguity (toy mug vs industrial vessel)</text>
<text x="50" y="330" font-size="8.5" fill="#475569">• Blind to robot end-effector kinematics</text>
<rect x="470" y="70" width="380" height="320" rx="8" fill="#10B981" fill-opacity="0.04" stroke="#10B981" stroke-width="1.2"/>
<text x="660.0" y="92" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">✓ 3D SPATIAL AFFORDANCE TOKENIZATION</text>
<text x="660.0" y="108" font-size="9" fill="#64748B" text-anchor="middle">Metric Embodied Representation (e.g. DINOv2 3D / PointNet)</text>
<rect x="500" y="130" width="160" height="110" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<polygon points="530,190 580,160 630,170 580,200" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.2"/>
<polygon points="530,190 530,220 580,230 580,200" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.2"/>
<polygon points="580,200 580,230 630,200 630,170" fill="#10B981" fill-opacity="0.3" stroke="#10B981" stroke-width="1.2"/>
<text x="580" y="242" font-size="8" font-weight="700" fill="#10B981" text-anchor="middle">p = [0.42, -0.15, 0.88] m</text>
<text x="490" y="270" font-size="8.5" fill="#475569">• Calibrated SE(3) centroid in world frame</text>
<text x="490" y="290" font-size="8.5" fill="#475569">• Estimated surface normals &amp; friction cone</text>
<text x="490" y="310" font-size="8.5" fill="#475569">• Bounding collision primitive for CBF safety filter</text>
<text x="490" y="330" font-size="8.5" fill="#475569">• Metric affordance lease for trajectory planner</text>
</svg>
