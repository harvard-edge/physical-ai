<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">IEC 60204-1 / ISO 13850 EMERGENCY FALLBACK HIERARCHY</text>
<text x="440.0" y="44" class="subtitle">Deterministic Fallback Escalation: From Controlled Position Hold to Hard Silicon Safe Torque Off (STO)</text>
<rect x="40" y="68" width="800" height="100" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="40" y="68" width="6" height="100" rx="3" fill="#215CAF"/>
<text x="60" y="90" font-size="11" font-weight="700" fill="#215CAF">CATEGORY 2: CONTROLLED STOP</text>
<text x="60" y="106" font-size="9.5" font-weight="600" fill="#1A202C">Normal Operational Pause (Drive Power Maintained)</text>
<text x="60" y="124" font-size="8.5" fill="#475569">• Robot decelerates along path to standstill using motor torque</text>
<text x="60" y="139" font-size="8.5" fill="#475569">• Mechanical position hold active; power remains on</text>
<text x="60" y="154" font-size="8.5" fill="#475569">• Triggered by: Soft geofence warning, task pause, minor latency jitter</text>
<rect x="40" y="182" width="800" height="100" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="40" y="182" width="6" height="100" rx="3" fill="#D97706"/>
<text x="60" y="204" font-size="11" font-weight="700" fill="#D97706">CATEGORY 1: DYNAMIC BRAKE</text>
<text x="60" y="220" font-size="9.5" font-weight="600" fill="#1A202C">Controlled Deceleration + Power Cut at Standstill</text>
<text x="60" y="238" font-size="8.5" fill="#475569">• Motors actively brake at a_max (-4.5 m/s²) using regenerative/dynamic braking</text>
<text x="60" y="253" font-size="8.5" fill="#475569">• Mechanical safety brakes engage once speed v = 0, then power is removed</text>
<text x="60" y="268" font-size="8.5" fill="#475569">• Triggered by: Expired intent lease, watchdog timeout (50 ms), trajectory divergence</text>
<rect x="40" y="296" width="800" height="100" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="40" y="296" width="6" height="100" rx="3" fill="#DC2626"/>
<text x="60" y="318" font-size="11" font-weight="700" fill="#DC2626">CATEGORY 0: SAFE TORQUE OFF (STO)</text>
<text x="60" y="334" font-size="9.5" font-weight="600" fill="#1A202C">Immediate Hardware Power Disconnect (Uncontrolled)</text>
<text x="60" y="352" font-size="8.5" fill="#475569">• Dedicated hardware STO relay drops gate drive voltage instantly</text>
<text x="60" y="367" font-size="8.5" fill="#475569">• Motors coast to stop under pure mechanical brake / friction</text>
<text x="60" y="382" font-size="8.5" fill="#475569">• Triggered by: Physical E-stop button, primary silicon crash, over-current trip</text>
</svg>
