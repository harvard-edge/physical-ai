<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">THERMODYNAMIC JUNCTION HEATING &amp; DVFS DOWNCLOCKING RIPPLE</text>
<text x="440.0" y="44" class="subtitle">Silicon Thermal RC Dynamics: T_j(t) = T_ambient + P · θ_JA · (1 - exp(-t / τ_th))</text>
<line x1="80" y1="260" x2="800" y2="260" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
<text x="440.0" y="300" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">Sustained High-Load Execution Time t (seconds) →</text>
<path d="M 80 235 Q 330 180 760 105" fill="none" stroke="#DC2626" stroke-width="2.5"/>
<text x="760" y="97" font-size="9" font-weight="700" fill="#DC2626" text-anchor="end">Junction Temp T_j (85°C Max)</text>
<path d="M 80 115 L 360 115 L 360 215 L 760 215" fill="none" stroke="#215CAF" stroke-width="2.2" stroke-dasharray="6,3"/>
<text x="760" y="207" font-size="9" font-weight="700" fill="#215CAF" text-anchor="end">DVFS Clock (2.4 GHz → 800 MHz)</text>
<line x1="360" y1="80" x2="360" y2="260" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="300" y="70" width="120" height="22" rx="4" fill="#DC2626"/>
<text x="360" y="85" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">THERMAL TRIP (85°C)</text>
<rect x="40" y="320" width="800" height="80" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="60" y="342" font-size="10" font-weight="700" fill="#1F407A">THE THERMAL DERATING CASCADING FAILURE</text>
<text x="60" y="360" font-size="8.5" fill="#475569">1. NPU thermal throttle cuts frequency by 3× ⇒ Inference latency triples from 20 ms to 60 ms.</text>
<text x="60" y="376" font-size="8.5" fill="#475569">2. Stopping distance d_reaction triples from 10 cm to 30 cm ⇒ Robot breaches clearance buffer unless enforcer backs off speed.</text>
</svg>
