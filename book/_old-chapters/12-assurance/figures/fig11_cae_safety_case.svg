<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="920" height="450" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="460.0" y="30" class="title">CLAIM-ARGUMENT-EVIDENCE (CAE) SAFETY CASE ARCHITECTURE</text>
<text x="460.0" y="46" class="subtitle">Linking High-Level Safety Claims to Defensible Bench Metrology and Signed Release Verdicts</text>
<rect x="40" y="66" width="840" height="46" rx="6" fill="#A51C30" fill-opacity="0.06" stroke="#A51C30" stroke-width="1.3"/>
<text x="460.0" y="84" font-size="11" font-weight="700" fill="#A51C30" text-anchor="middle">TOP-LEVEL SAFETY CLAIM (C_top)</text>
<text x="460.0" y="100" font-size="10" font-weight="600" fill="#1A202C" text-anchor="middle">"The Physical AI Agent operates acceptably safe within Operational Design Domain X_ODD."</text>
<rect x="42.0" y="132" width="200" height="100" rx="6" fill="#215CAF" fill-opacity="0.04" stroke="#215CAF" stroke-width="1.1"/>
<text x="52.0" y="150" font-size="10" font-weight="700" fill="#215CAF">ARGUMENT A1</text>
<text x="52.0" y="164" font-size="10.5" font-weight="700" fill="#1A202C">Fault Containment</text>
<text x="52.0" y="180" font-size="8.5" fill="#475569">All single-point hardware and software</text>
<text x="52.0" y="194" font-size="8.5" fill="#475569">crashes are deterministically arrested by the</text>
<text x="52.0" y="208" font-size="8.5" fill="#475569">MCU safety enforcer within 50 ms.</text>
<line x1="142.0" y1="112" x2="142.0" y2="132" stroke="#A51C30" stroke-width="1.2" marker-end="url(#arr-crimson)"/>
<rect x="42.0" y="248" width="200" height="110" rx="6" fill="#10B981" fill-opacity="0.04" stroke="#10B981" stroke-width="1.1"/>
<text x="52.0" y="266" font-size="10" font-weight="700" fill="#10B981">EVIDENCE E1</text>
<text x="52.0" y="280" font-size="10.5" font-weight="700" fill="#1A202C">HIL Fault Log (REL-01)</text>
<text x="52.0" y="298" font-size="8.5" fill="#475569">• 1000/1000 faults contained</text>
<text x="52.0" y="312" font-size="8.5" fill="#475569">• 0 collisions recorded</text>
<text x="52.0" y="326" font-size="8.5" fill="#475569">• Max stopping time: 42 ms</text>
<text x="52.0" y="340" font-size="8.5" fill="#475569">• Watchdog trip: 50 ms</text>
<line x1="142.0" y1="232" x2="142.0" y2="248" stroke="#215CAF" stroke-width="1.2" marker-end="url(#arr-blue)"/>
<line x1="142.0" y1="358" x2="142.0" y2="380" stroke="#10B981" stroke-width="1.2" marker-end="url(#arr-teal)"/>
<rect x="254.0" y="132" width="200" height="100" rx="6" fill="#215CAF" fill-opacity="0.04" stroke="#215CAF" stroke-width="1.1"/>
<text x="264.0" y="150" font-size="10" font-weight="700" fill="#215CAF">ARGUMENT A2</text>
<text x="264.0" y="164" font-size="10.5" font-weight="700" fill="#1A202C">Latency Freshness</text>
<text x="264.0" y="180" font-size="8.5" fill="#475569">The P99.9 sense-to-actuation latency Δt_wall</text>
<text x="264.0" y="194" font-size="8.5" fill="#475569">remains strictly bounded so stopping distance</text>
<text x="264.0" y="208" font-size="8.5" fill="#475569">d_stop ≤ d_gap.</text>
<line x1="354.0" y1="112" x2="354.0" y2="132" stroke="#A51C30" stroke-width="1.2" marker-end="url(#arr-crimson)"/>
<rect x="254.0" y="248" width="200" height="110" rx="6" fill="#10B981" fill-opacity="0.04" stroke="#10B981" stroke-width="1.1"/>
<text x="264.0" y="266" font-size="10" font-weight="700" fill="#10B981">EVIDENCE E2</text>
<text x="264.0" y="280" font-size="10.5" font-weight="700" fill="#1A202C">Metrology CDF (REQ-01)</text>
<text x="264.0" y="298" font-size="8.5" fill="#475569">• P50 = 22 ms</text>
<text x="264.0" y="312" font-size="8.5" fill="#475569">• P99.9 = 72 ms &lt; 80 ms</text>
<text x="264.0" y="326" font-size="8.5" fill="#475569">• Margin: +18 cm clearance</text>
<text x="264.0" y="340" font-size="8.5" fill="#475569">• Zero seqlock overruns</text>
<line x1="354.0" y1="232" x2="354.0" y2="248" stroke="#215CAF" stroke-width="1.2" marker-end="url(#arr-blue)"/>
<line x1="354.0" y1="358" x2="354.0" y2="380" stroke="#10B981" stroke-width="1.2" marker-end="url(#arr-teal)"/>
<rect x="466.0" y="132" width="200" height="100" rx="6" fill="#215CAF" fill-opacity="0.04" stroke="#215CAF" stroke-width="1.1"/>
<text x="476.0" y="150" font-size="10" font-weight="700" fill="#215CAF">ARGUMENT A3</text>
<text x="476.0" y="164" font-size="10.5" font-weight="700" fill="#1A202C">Human Authority</text>
<text x="476.0" y="180" font-size="8.5" fill="#475569">Human operators retain un-preemptible authority</text>
<text x="476.0" y="194" font-size="8.5" fill="#475569">via bumpless joystick override and dedicated</text>
<text x="476.0" y="208" font-size="8.5" fill="#475569">hardware E-stop circuits.</text>
<line x1="566.0" y1="112" x2="566.0" y2="132" stroke="#A51C30" stroke-width="1.2" marker-end="url(#arr-crimson)"/>
<rect x="466.0" y="248" width="200" height="110" rx="6" fill="#10B981" fill-opacity="0.04" stroke="#10B981" stroke-width="1.1"/>
<text x="476.0" y="266" font-size="10" font-weight="700" fill="#10B981">EVIDENCE E3</text>
<text x="476.0" y="280" font-size="10.5" font-weight="700" fill="#1A202C">Override Logs (AUTH-01)</text>
<text x="476.0" y="298" font-size="8.5" fill="#475569">• 50/50 seamless takeovers</text>
<text x="476.0" y="312" font-size="8.5" fill="#475569">• Peak jerk &lt; 15 rad/s³</text>
<text x="476.0" y="326" font-size="8.5" fill="#475569">• Zero gearbox shock damage</text>
<text x="476.0" y="340" font-size="8.5" fill="#475569">• Tamper-evident hash log</text>
<line x1="566.0" y1="232" x2="566.0" y2="248" stroke="#215CAF" stroke-width="1.2" marker-end="url(#arr-blue)"/>
<line x1="566.0" y1="358" x2="566.0" y2="380" stroke="#10B981" stroke-width="1.2" marker-end="url(#arr-teal)"/>
<rect x="678.0" y="132" width="200" height="100" rx="6" fill="#215CAF" fill-opacity="0.04" stroke="#215CAF" stroke-width="1.1"/>
<text x="688.0" y="150" font-size="10" font-weight="700" fill="#215CAF">ARGUMENT A4</text>
<text x="688.0" y="164" font-size="10.5" font-weight="700" fill="#1A202C">ODD Enforcement</text>
<text x="688.0" y="180" font-size="8.5" fill="#475569">Real-time interoceptive and exteroceptive health</text>
<text x="688.0" y="194" font-size="8.5" fill="#475569">monitors detect out-of-ODD transitions and trigger</text>
<text x="688.0" y="208" font-size="8.5" fill="#475569">safe deceleration.</text>
<line x1="778.0" y1="112" x2="778.0" y2="132" stroke="#A51C30" stroke-width="1.2" marker-end="url(#arr-crimson)"/>
<rect x="678.0" y="248" width="200" height="110" rx="6" fill="#10B981" fill-opacity="0.04" stroke="#10B981" stroke-width="1.1"/>
<text x="688.0" y="266" font-size="10" font-weight="700" fill="#10B981">EVIDENCE E4</text>
<text x="688.0" y="280" font-size="10.5" font-weight="700" fill="#1A202C">ODD Monitor Logs</text>
<text x="688.0" y="298" font-size="8.5" fill="#475569">• Dark/glare detection &lt; 20 ms</text>
<text x="688.0" y="312" font-size="8.5" fill="#475569">• Friction drop fallback</text>
<text x="688.0" y="326" font-size="8.5" fill="#475569">• Thermal derating at 85°C</text>
<text x="688.0" y="340" font-size="8.5" fill="#475569">• Category 1 stop verified</text>
<line x1="778.0" y1="232" x2="778.0" y2="248" stroke="#215CAF" stroke-width="1.2" marker-end="url(#arr-blue)"/>
<line x1="778.0" y1="358" x2="778.0" y2="380" stroke="#10B981" stroke-width="1.2" marker-end="url(#arr-teal)"/>
<rect x="40" y="380" width="840" height="48" rx="6" fill="#F8FAFC" stroke="#1F407A" stroke-width="1.2"/>
<text x="460.0" y="398" font-size="11" font-weight="700" fill="#1F407A" text-anchor="middle">THE 3 ACCOUNTABLE RELEASE VERDICTS</text>
<text x="460.0" y="414" font-size="9.5" text-anchor="middle"><tspan font-weight="700" fill="#10B981">✓ DEPLOY</tspan> (All thresholds met; unconstrained ODD)  |  <tspan font-weight="700" fill="#D97706">⚠ CONDITION</tspan> (Restricted speed / human supervisor)  |  <tspan font-weight="700" fill="#DC2626">✕ REFUSE</tspan> (Gate failure; deployment blocked)</text>
</svg>
