<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="440" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">CROSS-LAYER SEEDED FAULT INJECTION ARCHITECTURE</text>
<text x="440.0" y="44" class="subtitle">Stress-Testing Every Architectural Layer to Verify Deterministic MCU Safety Containment</text>
<rect x="24" y="64" width="240" height="78" rx="6" fill="#DC2626" fill-opacity="0.06" stroke="#DC2626" stroke-width="1"/>
<text x="34" y="80" font-size="9.5" font-weight="700" fill="#DC2626">LAYER 1: SENSORY &amp; TRANSDUCTION</text>
<text x="38" y="96" font-size="8.5" fill="#475569">• Dropped MIPI frames (&gt; 100 ms)</text>
<text x="38" y="110" font-size="8.5" fill="#475569">• Blinding glare / sudden lux drop</text>
<text x="38" y="124" font-size="8.5" fill="#475569">• PTP clock skew (&gt; 5 ms)</text>
<rect x="24" y="152" width="240" height="78" rx="6" fill="#DC2626" fill-opacity="0.06" stroke="#DC2626" stroke-width="1"/>
<text x="34" y="168" font-size="9.5" font-weight="700" fill="#DC2626">LAYER 2: COMPUTE, BUS &amp; MEMORY</text>
<text x="38" y="184" font-size="8.5" fill="#475569">• Linux kernel panic / thread crash</text>
<text x="38" y="198" font-size="8.5" fill="#475569">• Synthetic DMA bus saturation</text>
<text x="38" y="212" font-size="8.5" fill="#475569">• malloc allocation stalls &amp; page faults</text>
<rect x="24" y="240" width="240" height="78" rx="6" fill="#DC2626" fill-opacity="0.06" stroke="#DC2626" stroke-width="1"/>
<text x="34" y="256" font-size="9.5" font-weight="700" fill="#DC2626">LAYER 3: MODEL &amp; ALGORITHMIC</text>
<text x="38" y="272" font-size="8.5" fill="#475569">• Hallucinated 3D bounding boxes</text>
<text x="38" y="286" font-size="8.5" fill="#475569">• Out-of-workspace trajectories</text>
<text x="38" y="300" font-size="8.5" fill="#475569">• Discontinuous acceleration jumps</text>
<rect x="24" y="328" width="240" height="78" rx="6" fill="#DC2626" fill-opacity="0.06" stroke="#DC2626" stroke-width="1"/>
<text x="34" y="344" font-size="9.5" font-weight="700" fill="#DC2626">LAYER 4: ELECTRICAL &amp; PHYSICAL</text>
<text x="38" y="360" font-size="8.5" fill="#475569">• Motor over-temp (&gt; 105°C)</text>
<text x="38" y="374" font-size="8.5" fill="#475569">• Battery voltage sag (&lt; 10.5 V)</text>
<text x="38" y="388" font-size="8.5" fill="#475569">• Encoder line break / phase loss</text>
<rect x="290" y="64" width="330" height="100" rx="6" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2" filter="url(#shadow)"/>
<text x="302" y="84" font-size="11" font-weight="700" fill="#B87333">APPLICATION PROCESSOR (Linux MPU · Sys 2/1.5)</text>
<text x="306" y="102" font-size="8.5" fill="#475569">• Runs Vision Transformers, Deliberation &amp; Action Chunking</text>
<text x="306" y="118" font-size="8.5" fill="#475569">• Untrusted, stochastic, prone to crashes and latency tails</text>
<text x="306" y="134" font-size="8.5" fill="#475569">• Emits candidate trajectory buffer p_t over shared IPC link</text>
<line x1="455.0" y1="164" x2="455.0" y2="194" stroke="#B87333" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arr-bronze)"/>
<rect x="410.0" y="172" width="90" height="15" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="455.0" y="183" font-size="8" font-weight="600" fill="#B87333" text-anchor="middle">Candidate p_t</text>
<rect x="290" y="194" width="330" height="130" rx="6" fill="#10B981" fill-opacity="0.05" stroke="#10B981" stroke-width="1.4" filter="url(#shadow)"/>
<text x="302" y="214" font-size="11.5" font-weight="700" fill="#10B981">REAL-TIME SAFETY ENFORCER (MCU · Sys 1)</text>
<text x="306" y="234" font-size="9" font-weight="700" fill="#1A202C">1. Control Barrier Function Invariant (h(x) ≥ 0):</text>
<text x="314" y="248" font-size="8.5" fill="#475569">Projects candidate p_t onto forward invariant safe set C</text>
<text x="306" y="266" font-size="9" font-weight="700" fill="#1A202C">2. Dynamic Stopping Clearance Check (d_gap &gt; d_stop):</text>
<text x="314" y="280" font-size="8.5" fill="#475569">Vetoes proposals exceeding braking envelope</text>
<text x="306" y="298" font-size="9" font-weight="700" fill="#1A202C">3. Zero-Software Hardware Watchdog Monitor:</text>
<text x="314" y="312" font-size="8.5" fill="#475569">Trips Category 1 dynamic stop if MPU heartbeat &gt; 50 ms</text>
<line x1="455.0" y1="324" x2="455.0" y2="350" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-teal)"/>
<rect x="395.0" y="330" width="120" height="15" rx="3" fill="#FFFFFF" stroke="#10B981" stroke-width="0.8"/>
<text x="455.0" y="341" font-size="8" font-weight="600" fill="#10B981" text-anchor="middle">Permitted u_t / E-Stop</text>
<rect x="290" y="350" width="330" height="56" rx="6" fill="#1F407A" fill-opacity="0.05" stroke="#1F407A" stroke-width="1"/>
<text x="302" y="370" font-size="11" font-weight="700" fill="#1F407A">PHYSICAL PLANT &amp; ACTUATION (W_t → W_t+1)</text>
<text x="306" y="390" font-size="8.5" fill="#475569">Closed-loop motor current loops · Mechanical brakes · Verified safe stop</text>
<path d="M 264 103 H 290" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-coral)"/>
<path d="M 264 191 H 275 V 170 H 290" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-coral)"/>
<path d="M 264 279 H 290" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-coral)"/>
<path d="M 264 367 H 290" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-coral)"/>
<rect x="646" y="64" width="210" height="342" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2" filter="url(#shadow)"/>
<text x="658" y="88" font-size="11.5" font-weight="700" fill="#10B981">✓ PASS CRITERION</text>
<text x="658" y="108" font-size="9" font-weight="700" fill="#1A202C">100% Containment Rate:</text>
<text x="662" y="122" font-size="8.5" fill="#475569">• Zero collisions (d_gap &gt; 0)</text>
<text x="662" y="135" font-size="8.5" fill="#475569">• Bounded stopping time</text>
<text x="662" y="148" font-size="8.5" fill="#475569">• Controlled halt &lt; 50 ms</text>
<text x="658" y="171" font-size="9" font-weight="700" fill="#1A202C">Zero Uncontained Escapes:</text>
<text x="662" y="185" font-size="8.5" fill="#475569">• Any single uncontained fault</text>
<text x="662" y="198" font-size="8.5" fill="#475569">• trips a REFUSE verdict.</text>
<text x="658" y="221" font-size="9" font-weight="700" fill="#1A202C">Hardware Watchdog:</text>
<text x="662" y="235" font-size="8.5" fill="#475569">• Dedicated NMI timer operates</text>
<text x="662" y="248" font-size="8.5" fill="#475569">• independently of Linux OS.</text>
</svg>
