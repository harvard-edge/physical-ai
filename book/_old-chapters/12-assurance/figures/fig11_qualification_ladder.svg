<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="920" height="460" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="460.0" y="30" class="title">THE 4-RUNG QUALIFICATION LADDER FOR PHYSICAL AI</text>
<text x="460.0" y="46" class="subtitle">Progressive Verification from Offline Log Replay to Active Shadow Fleet Deployment</text>
<rect x="35.0" y="68" width="202" height="320" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="35.0" y="68" width="202" height="24" rx="6" fill="#475569" fill-opacity="0.1"/>
<text x="136.0" y="84" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">RUNG 1 · BASELINE</text>
<text x="136.0" y="110" font-size="12" font-weight="700" fill="#1A202C" text-anchor="middle">Historical Log Replay</text>
<text x="136.0" y="124" font-size="9" fill="#64748B" text-anchor="middle">Offline Dataset Metrology</text>
<rect x="45.0" y="134" width="182" height="18" rx="3" fill="#475569" fill-opacity="0.08" stroke="#475569" stroke-width="0.8"/>
<text x="136.0" y="146" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">Gate 0: Affordance Error &lt; 2 cm</text>
<text x="45.0" y="164" font-size="8.5" font-weight="700" fill="#1A202C">Execution Substrate:</text>
<text x="49.0" y="176" font-size="8" fill="#475569">• Static logged sensor streams</text>
<text x="49.0" y="187" font-size="8" fill="#475569">• Offline GPU training server</text>
<text x="49.0" y="198" font-size="8" fill="#475569">• Open-loop prediction loss</text>
<text x="45.0" y="213" font-size="8.5" font-weight="700" fill="#1A202C">Verification Focus:</text>
<text x="49.0" y="225" font-size="8" fill="#475569">• Model affordance accuracy</text>
<text x="49.0" y="236" font-size="8" fill="#475569">• Latent token prediction error</text>
<text x="49.0" y="247" font-size="8" fill="#475569">• Offline inference throughput</text>
<text x="45.0" y="262" font-size="8.5" font-weight="700" fill="#1A202C">Blind Spot / Limit:</text>
<text x="49.0" y="274" font-size="8" fill="#475569">• Zero closed-loop causality</text>
<text x="49.0" y="285" font-size="8" fill="#475569">• Blind to physical momentum</text>
<text x="49.0" y="296" font-size="8" fill="#475569">• Misses P99 latency tails</text>
<line x1="238.0" y1="228.0" x2="250.0" y2="228.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<rect x="251.0" y="68" width="202" height="320" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="251.0" y="68" width="202" height="24" rx="6" fill="#215CAF" fill-opacity="0.1"/>
<text x="352.0" y="84" font-size="9" font-weight="700" fill="#215CAF" text-anchor="middle">RUNG 2 · CLOSED LOOP</text>
<text x="352.0" y="110" font-size="12" font-weight="700" fill="#1A202C" text-anchor="middle">Physics Simulation</text>
<text x="352.0" y="124" font-size="9" fill="#64748B" text-anchor="middle">Domain Randomization</text>
<rect x="261.0" y="134" width="182" height="18" rx="3" fill="#215CAF" fill-opacity="0.08" stroke="#215CAF" stroke-width="0.8"/>
<text x="352.0" y="146" font-size="8" font-weight="700" fill="#215CAF" text-anchor="middle">Gate 1: &gt; 98% Pass (10⁴ Seeds)</text>
<text x="261.0" y="164" font-size="8.5" font-weight="700" fill="#1A202C">Execution Substrate:</text>
<text x="265.0" y="176" font-size="8" fill="#475569">• MuJoCo / Isaac Sim physics</text>
<text x="265.0" y="187" font-size="8" fill="#475569">• Multi-GPU parallel rollouts</text>
<text x="265.0" y="198" font-size="8" fill="#475569">• Randomized mass, friction, light</text>
<text x="261.0" y="213" font-size="8.5" font-weight="700" fill="#1A202C">Verification Focus:</text>
<text x="265.0" y="225" font-size="8" fill="#475569">• Closed-loop policy stability</text>
<text x="265.0" y="236" font-size="8" fill="#475569">• Dynamic collision avoidance</text>
<text x="265.0" y="247" font-size="8" fill="#475569">• Generalization over 10⁴ seeds</text>
<text x="261.0" y="262" font-size="8.5" font-weight="700" fill="#1A202C">Blind Spot / Limit:</text>
<text x="265.0" y="274" font-size="8" fill="#475569">• Sim-to-real physics gap</text>
<text x="265.0" y="285" font-size="8" fill="#475569">• Idealized compute/bus timing</text>
<text x="265.0" y="296" font-size="8" fill="#475569">• Misses silicon fault modes</text>
<line x1="454.0" y1="228.0" x2="466.0" y2="228.0" stroke="#215CAF" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<rect x="467.0" y="68" width="202" height="320" rx="6" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="467.0" y="68" width="202" height="24" rx="6" fill="#B87333" fill-opacity="0.1"/>
<text x="568.0" y="84" font-size="9" font-weight="700" fill="#B87333" text-anchor="middle">RUNG 3 · TARGET SILICON</text>
<text x="568.0" y="110" font-size="12" font-weight="700" fill="#1A202C" text-anchor="middle">Hardware-in-the-Loop</text>
<text x="568.0" y="124" font-size="9" fill="#64748B" text-anchor="middle">Real Silicon + Plant Emulator</text>
<rect x="477.0" y="134" width="182" height="18" rx="3" fill="#B87333" fill-opacity="0.08" stroke="#B87333" stroke-width="0.8"/>
<text x="568.0" y="146" font-size="8" font-weight="700" fill="#B87333" text-anchor="middle">Gate 2: 100% Fault Containment</text>
<text x="477.0" y="164" font-size="8.5" font-weight="700" fill="#1A202C">Execution Substrate:</text>
<text x="481.0" y="176" font-size="8" fill="#475569">• Production MPU + Real-Time MCU</text>
<text x="481.0" y="187" font-size="8" fill="#475569">• 10 kHz FPGA plant emulator</text>
<text x="481.0" y="198" font-size="8" fill="#475569">• Real SPI, CAN, and MIPI buses</text>
<text x="477.0" y="213" font-size="8.5" font-weight="700" fill="#1A202C">Verification Focus:</text>
<text x="481.0" y="225" font-size="8" fill="#475569">• Seeded cross-layer faults</text>
<text x="481.0" y="236" font-size="8" fill="#475569">• MCU safety watchdog timing</text>
<text x="481.0" y="247" font-size="8" fill="#475569">• Memory DMA bus contention</text>
<text x="477.0" y="262" font-size="8.5" font-weight="700" fill="#1A202C">Blind Spot / Limit:</text>
<text x="481.0" y="274" font-size="8" fill="#475569">• Synthetic visual assets</text>
<text x="481.0" y="285" font-size="8" fill="#475569">• Emulated optical lighting</text>
<text x="481.0" y="296" font-size="8" fill="#475569">• Bounded human interaction</text>
<line x1="670.0" y1="228.0" x2="682.0" y2="228.0" stroke="#B87333" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<rect x="683.0" y="68" width="202" height="320" rx="6" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="683.0" y="68" width="202" height="24" rx="6" fill="#A51C30" fill-opacity="0.1"/>
<text x="784.0" y="84" font-size="9" font-weight="700" fill="#A51C30" text-anchor="middle">RUNG 4 · FLEET SHADOW</text>
<text x="784.0" y="110" font-size="12" font-weight="700" fill="#1A202C" text-anchor="middle">Shadow Fleet Mode</text>
<text x="784.0" y="124" font-size="9" fill="#64748B" text-anchor="middle">Passive Real-World Fleet</text>
<rect x="693.0" y="134" width="182" height="18" rx="3" fill="#A51C30" fill-opacity="0.08" stroke="#A51C30" stroke-width="0.8"/>
<text x="784.0" y="146" font-size="8" font-weight="700" fill="#A51C30" text-anchor="middle">Gate 3: 0 Divergence / 500 hrs</text>
<text x="693.0" y="164" font-size="8.5" font-weight="700" fill="#1A202C">Execution Substrate:</text>
<text x="697.0" y="176" font-size="8" fill="#475569">• Physical robot in active fleet</text>
<text x="697.0" y="187" font-size="8" fill="#475569">• Real-world warehouse ODD</text>
<text x="697.0" y="198" font-size="8" fill="#475569">• Inferences run in background</text>
<text x="693.0" y="213" font-size="8.5" font-weight="700" fill="#1A202C">Verification Focus:</text>
<text x="697.0" y="225" font-size="8" fill="#475569">• Uncontained divergence audit</text>
<text x="697.0" y="236" font-size="8" fill="#475569">• Long-tail corner case capture</text>
<text x="697.0" y="247" font-size="8" fill="#475569">• Zero actuator safety authority</text>
<text x="693.0" y="262" font-size="8.5" font-weight="700" fill="#1A202C">Blind Spot / Limit:</text>
<text x="697.0" y="274" font-size="8" fill="#475569">• Policy cannot actuate world</text>
<text x="697.0" y="285" font-size="8" fill="#475569">• Dependent on fleet coverage</text>
<text x="697.0" y="296" font-size="8" fill="#475569">• Requires data privacy filters</text>
<rect x="35.0" y="402" width="850" height="42" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="460.0" y="420" font-size="9.5" font-weight="700" fill="#1F407A" text-anchor="middle">THE PROMOTION PRINCIPLE</text>
<text x="460.0" y="434" font-size="9" fill="#475569" text-anchor="middle">A high score on Rung 1 or 2 is a necessary prerequisite but never sufficient proof of release. Only Rungs 3 and 4 provide defensible evidence for release.</text>
</svg>
