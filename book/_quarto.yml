# Physical AI Engineering — a working outline book (a thinking instrument).
# Not a how-to manual. Builds a website (HTML) and a PDF.
#   quarto render            # both formats
#   quarto preview           # live HTML
#   quarto render --to pdf   # PDF only

project:
  type: book
  output-dir: _build

book:
  title: "Physical AI Engineering"
  subtitle: "A Hands-On Systems Discipline (working outline)"
  author:
    name: Vijay Janapa Reddi
    affiliations: Harvard University
  date: today
  date-format: long
  cover-image: assets/cover.svg
  description: >
    A working outline for physical AI engineering as a discipline: the
    properties a world-coupled, closed-loop system must satisfy, and the
    placement decisions that trade them off.
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - chapters/the-discipline.qmd
        - chapters/the-elements.qmd
    - part: "The Loop"
      chapters:
        - chapters/00-from-tinyml-to-physical-ai.qmd
    - part: "Perception and Meaning"
      chapters:
        - chapters/01-perception-on-the-edge.qmd
        - chapters/02-pixels-to-meaning.qmd
    - part: "Decide and Act"
      chapters:
        - chapters/03-cognition-and-agency.qmd
        - chapters/04-action-and-control.qmd
    - part: "Remember and Improve"
      chapters:
        - chapters/05-memory-and-state.qmd
        - chapters/06-data-flywheel.qmd
    - part: "Where the Properties Dominate"
      chapters:
        - chapters/07-placement-and-systems.qmd
        - chapters/08-safety-privacy-deployment.qmd
    - part: "Capstone"
      chapters:
        - chapters/99-capstone.qmd

# Custom callouts (vendored pae-ext/custom-numbered-blocks Quarto extension).
# One Lua filter renders <details> in HTML and a tcolorbox in PDF. Three themed
# blocks keyed to the brand palette: placement (amber), build it (teal),
# teaching note (indigo). colors = [PDF title-bar fill, accent/border].
filters:
  - pae-ext/custom-numbered-blocks

filter-metadata:
  pae-ext/custom-numbered-blocks:
    groups:
      placement:
        colors: ["FCF1DD", "E8A33D"]
        collapse: false
        numbered: false
      build:
        colors: ["DCEFEB", "18A999"]
        collapse: false
        numbered: false
      teaching:
        colors: ["DEE4EF", "1B2A4A"]
        collapse: false
        numbered: false
    classes:
      callout-placement:
        group: placement
        label: "Placement"
      callout-build:
        group: build
        label: "Build it"
      callout-teaching:
        group: teaching
        label: "Teaching note"

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss]
    toc: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  pdf:
    pdf-engine: lualatex
    documentclass: scrbook
    papersize: letter
    fontsize: 10.5pt
    linestretch: 1.18
    mainfont: "Iowan Old Style"
    sansfont: "Avenir Next"
    sansfontoptions:
      - "Scale=0.93"
    monofont: "Menlo"
    monofontoptions:
      - "Scale=0.86"
    colorlinks: true
    linkcolor: deliberation
    urlcolor: reflex
    citecolor: reflex
    toc: true
    toc-depth: 2
    number-depth: 2
    reference-location: margin
    classoption:
      - open=right
      - numbers=noenddot
      - captions=tableheading
      - parskip=half
    geometry:
      - paper=letterpaper
      - top=0.78in
      - bottom=0.82in
      - inner=0.82in
      - outer=2.28in
      - marginparwidth=1.62in
      - marginparsep=0.28in
      - headheight=16pt
      - headsep=0.24in
      - footskip=0.36in
      - heightrounded
    include-in-header:
      - tex/preamble.tex
