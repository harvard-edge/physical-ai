# Custom callouts (vendored pae-ext/custom-numbered-blocks Quarto extension).
# One Lua filter renders <details> in HTML and a tcolorbox in PDF. The recurring
# recurring roles are learning objective, decision, and end-of-chapter lab.
# Question and teaching-note callouts remain available when a chapter genuinely
# needs them, but they are not part of the universal visible template.
# colors = [PDF title-bar fill, accent].
filters:
  - pae-ext/custom-numbered-blocks

filter-metadata:
  pae-ext/custom-numbered-blocks:
    icon-path: "assets/images/icons/callouts"
    icon-format: "svg"
    groups:
      objective:
        colors: ["F0F4FA", "1F407A"]
        collapse: false
        numbered: false
      definition:
        colors: ["EDF7F7", "007A87"]
        collapse: false
        numbered: false
      decision:
        colors: ["EDF7F7", "007A87"]
        collapse: false
        numbered: false
      lab:
        colors: ["F0F4FA", "1F407A"]
        collapse: false
        numbered: false
      teaching:
        colors: ["F3F0F8", "5B4B8A"]
        collapse: false
        numbered: false
      autopsy:
        colors: ["FBF2F3", "A51C30"]
        collapse: false
        numbered: false
      contract:
        colors: ["FDF8F0", "B87333"]
        collapse: false
        numbered: false
      law:
        colors: ["F0F4FA", "1F407A"]
        collapse: false
        numbered: false
      tip:
        colors: ["EDF7F7", "007A87"]
        collapse: false
        numbered: false
      important:
        colors: ["F3F0F8", "5B4B8A"]
        collapse: false
        numbered: false
      warning:
        colors: ["FBF2F3", "A51C30"]
        collapse: false
        numbered: false
      note:
        colors: ["F0F4FA", "1F407A"]
        collapse: false
        numbered: false
      caution:
        colors: ["FBF2F3", "A51C30"]
        collapse: false
        numbered: false
      archetype:
        colors: ["F0F7F4", "1B6B48"]
        collapse: false
        numbered: false
      fallacy:
        colors: ["FBF2F3", "A51C30"]
        collapse: false
        numbered: false
      case:
        colors: ["FDF8F0", "B87333"]
        collapse: false
        numbered: false
    classes:
      callout-case:
        group: case
        label: "Micro-Case"
      callout-fallacy:
        group: fallacy
        label: "Fallacy & Pitfall"
      callout-archetype:
        group: archetype
        label: "Archetype Focus"
      callout-tip:
        group: tip
        label: "Tip"
      callout-important:
        group: important
        label: "Important"
      callout-warning:
        group: warning
        label: "Warning"
      callout-note:
        group: note
        label: "Note"
      callout-caution:
        group: caution
        label: "Caution"
      callout-objective:
        group: objective
        label: "Learning Objectives"
      callout-definition:
        group: definition
        label: "Definition"
      callout-decision:
        group: decision
        label: "Design Decision"
      callout-lab:
        group: lab
        label: "Hands-On Lab"
      callout-teaching:
        group: teaching
        label: "Teaching Note"
      callout-autopsy:
        group: autopsy
        label: "Incident Autopsy"
      callout-contract:
        group: contract
        label: "Proposal–Permission Contract"
      callout-law:
        group: law
        label: "Bedrock Law"

format:
  html:
    theme:
      light: [default, theme.scss]
      dark: [darkly, theme.scss]
    toc: true
    link-citations: true
    # Default Quarto article measure, centered as a block (see theme.scss).
    grid:
      sidebar-width: 250px
      body-width: 800px
      margin-width: 250px
      gutter-width: 1.5rem
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  pdf:
    keep-tex: true
    pdf-engine: lualatex
    documentclass: scrbook
    fontsize: 9.5pt
    linestretch: 1.08
    mainfont: "STIX Two Text"
    mainfontoptions:
      - "BoldFont=STIX Two Text Bold"
      - "ItalicFont=STIX Two Text Italic"
      - "BoldItalicFont=STIX Two Text Bold Italic"
    sansfont: "Avenir Next"
    sansfontoptions:
      - "Scale=0.90"
    monofont: "Menlo"
    monofontoptions:
      - "Scale=0.78"
    colorlinks: true
    link-citations: true
    linkcolor: structural
    urlcolor: measured
    citecolor: measured
    toc: true
    toc-depth: 1
    number-depth: 3
    reference-location: margin
    fig-pos: "t"
    tbl-pos: "t"
    classoption:
      - open=right
      - numbers=noenddot
      - captions=tableheading
    geometry:
      - paperwidth=7in
      - paperheight=10in
      - top=0.75in
      - bottom=0.80in
      - inner=0.75in
      - textwidth=4.85in
      - marginparsep=0.15in
      - marginparwidth=0.95in
      - footskip=0.35in
      - headheight=14pt
      - headsep=0.18in
      - heightrounded
    include-in-header:
      - tex/preamble.tex   # configuration: palette, type, page furniture
      - tex/cover.tex      # artwork: cover and title pages (needs the palette)





