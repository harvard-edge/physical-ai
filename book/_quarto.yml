# Physical AI — a backward-designed systems book.
# The concept track is complete before its end-of-chapter lab.
#   quarto render            # both formats
#   quarto preview           # live HTML
#   quarto render --to pdf   # PDF only

project:
  type: book
  output-dir: _build

# Numbers in the book come from code (see rules/inline-computation.md). Chapters
# use pure-Python cells, so they execute with the python3 on PATH, no extra deps.
jupyter: python3

book:
  title: "Physical AI"
  subtitle: "Machine Learning Systems That Sense and Act"
  author:
    name: Vijay Janapa Reddi
    affiliations: Harvard University
  date: today
  date-format: long
  cover-image: assets/cover.svg
  description: >
    A systems-first book about turning learned capabilities into continuous,
    measurable, dependable, and accountable systems that sense and act in the
    real world.
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - chapters/01-frame/01-frame.qmd
        - chapters/02-costs/02-costs.qmd
        - chapters/03-measure/03-measure.qmd
        - chapters/04-runtime/04-runtime.qmd
    - part: "Building a TinyAgent"
      chapters:
        - chapters/05-perception/05-perception.qmd
        - chapters/06-state/06-state.qmd
        - chapters/07-intent/07-intent.qmd
        - chapters/08-limits/08-limits.qmd
        - chapters/09-placement/09-placement.qmd
        - chapters/10-assurance/10-assurance.qmd
    - part: "Responsibility"
      chapters:
        - chapters/11-authority/11-authority.qmd
        - chapters/12-learning/12-learning.qmd
        - chapters/13-deploy/13-deploy.qmd
    - chapters/99-review/99-review.qmd

# Custom callouts (vendored pae-ext/custom-numbered-blocks Quarto extension).
# One Lua filter renders <details> in HTML and a tcolorbox in PDF. The recurring
# recurring roles are learning objective, decision, and end-of-chapter lab.
# Question and teaching-note callouts remain available when a chapter genuinely
# needs them, but they are not part of the universal visible template.
# colors = [PDF title-bar fill, accent].
filters:
  - pae-ext/custom-numbered-blocks

filter-metadata:
  pae-ext/custom-numbered-blocks:
    groups:
      question:
        colors: ["FBEAD2", "D98C1F"]
        collapse: false
        numbered: false
      objective:
        colors: ["DEE4EF", "1B2A4A"]
        collapse: false
        numbered: false
      decision:
        colors: ["E4F6F3", "168F84"]
        collapse: false
        numbered: false
      lab:
        colors: ["E8EDF6", "1B2A4A"]
        collapse: false
        numbered: false
      teaching:
        colors: ["DEE4EF", "1B2A4A"]
        collapse: false
        numbered: false
    classes:
      callout-question:
        group: question
        label: "Question"
      callout-objective:
        group: objective
        label: "Learning objective"
      callout-decision:
        group: decision
        label: "Decision"
      callout-lab:
        group: lab
        label: "End-of-chapter lab"
      callout-teaching:
        group: teaching
        label: "Teaching note"

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss]
    toc: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  pdf:
    pdf-engine: lualatex
    documentclass: scrbook
    papersize: letter
    fontsize: 10.5pt
    linestretch: 1.18
    mainfont: "Iowan Old Style"
    sansfont: "Avenir Next"
    sansfontoptions:
      - "Scale=0.93"
    monofont: "Menlo"
    monofontoptions:
      - "Scale=0.86"
    colorlinks: true
    linkcolor: structural
    urlcolor: measured
    citecolor: measured
    toc: true
    toc-depth: 2
    number-depth: 2
    reference-location: margin
    classoption:
      - open=right
      - numbers=noenddot
      - captions=tableheading
      - parskip=half
    geometry:
      - paper=letterpaper
      - top=0.78in
      - bottom=0.82in
      - inner=0.82in
      - outer=2.28in
      - marginparwidth=1.62in
      - marginparsep=0.28in
      - headheight=16pt
      - headsep=0.24in
      - footskip=0.36in
      - heightrounded
    include-in-header:
      - tex/preamble.tex
