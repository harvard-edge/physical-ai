# Physical AI — a backward-designed systems book.
# The concept track is complete before its end-of-chapter lab.
#   quarto render            # both formats
#   quarto preview           # live HTML
#   quarto render --to pdf   # PDF only

project:
  type: book
  output-dir: _build

bibliography: references.bib

# Numbers in the book come from code (see rules/inline-computation.md). Chapters
# use pure-Python cells, so they execute with the python3 on PATH, no extra deps.
jupyter: python3

book:
  title: "Physical AI"
  subtitle: "Machine Learning Systems That Sense and Act"
  author:
    name: Vijay Janapa Reddi
    affiliations:
      - name: Harvard University
      - name: ETH Zurich
  date: today
  date-format: long
  cover-image: assets/cover.svg
  description: >
    A systems-first book about turning learned capabilities into continuous,
    measurable, dependable, and accountable systems that sense and act in the
    real world.
  page-navigation: true
  sidebar:
    style: docked
    search: true
    collapse-level: 2
  chapters:
    - index.qmd
    - front-matter/about-author.qmd
    - front-matter/prerequisites.qmd
    - front-matter/how-to-use.qmd
    - part: parts/01-foundations.qmd
      chapters:
        - chapters/01-boundary/01-boundary.qmd
        - chapters/02-metrology/02-metrology.qmd
        - chapters/03-runtime/03-runtime.qmd
    - part: parts/02-agent-architecture.qmd
      chapters:
        - chapters/04-perception/04-perception.qmd
        - chapters/05-state/05-state.qmd
        - chapters/06-intent/06-intent.qmd
        - chapters/07-planning/07-planning.qmd
        - chapters/08-enforcement/08-enforcement.qmd
    - part: parts/03-integration-release.qmd
      chapters:
        - chapters/09-placement/09-placement.qmd
        - chapters/10-governance/10-governance.qmd
        - chapters/11-assurance/11-assurance.qmd
    - chapters/99-capstone/99-capstone.qmd
  appendices:
    - appendix/dossier-templates.qmd
    - appendix/uno-q-reference.qmd
    - appendix/math-reference.qmd
    - appendix/glossary.qmd

# Custom callouts (vendored pae-ext/custom-numbered-blocks Quarto extension).
# One Lua filter renders <details> in HTML and a tcolorbox in PDF. The recurring
# recurring roles are learning objective, decision, and end-of-chapter lab.
# Question and teaching-note callouts remain available when a chapter genuinely
# needs them, but they are not part of the universal visible template.
# colors = [PDF title-bar fill, accent].
filters:
  - pae-ext/custom-numbered-blocks

filter-metadata:
  pae-ext/custom-numbered-blocks:
    groups:
      question:
        colors: ["FDF8F0", "B87333"]
        collapse: false
        numbered: false
      objective:
        colors: ["F0F4FA", "1F407A"]
        collapse: false
        numbered: false
      definition:
        colors: ["F0F4FA", "1F407A"]
        collapse: false
        numbered: false
      decision:
        colors: ["EDF7F7", "007A87"]
        collapse: false
        numbered: false
      lab:
        colors: ["F0F4FA", "1F407A"]
        collapse: false
        numbered: false
      teaching:
        colors: ["F3F0F8", "5B4B8A"]
        collapse: false
        numbered: false
      autopsy:
        colors: ["FBF2F3", "A51C30"]
        collapse: false
        numbered: false
      contract:
        colors: ["FDF8F0", "B87333"]
        collapse: false
        numbered: false
      tip:
        colors: ["EDF7F7", "007A87"]
        collapse: false
        numbered: false
      important:
        colors: ["F3F0F8", "5B4B8A"]
        collapse: false
        numbered: false
      warning:
        colors: ["FBF2F3", "A51C30"]
        collapse: false
        numbered: false
      note:
        colors: ["F0F4FA", "1F407A"]
        collapse: false
        numbered: false
      caution:
        colors: ["FBF2F3", "A51C30"]
        collapse: false
        numbered: false
    classes:
      callout-tip:
        group: tip
        label: "Tip"
      callout-important:
        group: important
        label: "Important"
      callout-warning:
        group: warning
        label: "Warning"
      callout-note:
        group: note
        label: "Note"
      callout-caution:
        group: caution
        label: "Caution"
      callout-question:
        group: question
        label: "The Core Systems Question"
      callout-objective:
        group: objective
        label: "Learning Objectives"
      callout-definition:
        group: definition
        label: "Definition"
      callout-decision:
        group: decision
        label: "Design Decision"
      callout-lab:
        group: lab
        label: "Hands-On Lab"
      callout-teaching:
        group: teaching
        label: "Teaching Note"
      callout-autopsy:
        group: autopsy
        label: "Incident Autopsy"
      callout-contract:
        group: contract
        label: "Proposal–Permission Contract"

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss]
    toc: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  pdf:
    keep-tex: true
    pdf-engine: lualatex
    documentclass: scrbook
    papersize: letter
    fontsize: 10.5pt
    linestretch: 1.15
    mainfont: "Iowan Old Style"
    sansfont: "Avenir Next"
    sansfontoptions:
      - "Scale=0.92"
    monofont: "Menlo"
    monofontoptions:
      - "Scale=0.80"
    colorlinks: true
    linkcolor: structural
    urlcolor: measured
    citecolor: measured
    toc: true
    toc-depth: 1
    number-depth: 2
    reference-location: margin
    classoption:
      - open=right
      - numbers=noenddot
      - captions=tableheading
      - parskip=half
    geometry:
      - paper=letterpaper
      - top=0.90in
      - bottom=0.90in
      - inner=1.00in
      - outer=1.00in
      - headheight=16pt
      - headsep=0.25in
      - footskip=0.40in
      - heightrounded
    include-in-header:
      - tex/preamble.tex
