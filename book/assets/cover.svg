  </g>
  <text x="110" y="960" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="104" font-weight="700">Physical AI</text>
  <text x="110" y="1070" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="104" font-weight="700">Engineering</text>
  <text x="110" y="1156" fill="#18a999" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="500">A Hands-On Systems Discipline</text>
  <text x="110" y="1206" fill="#9fb3c8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="400">working outline</text>
  <text x="110" y="1392" fill="#cbd5e1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="38">Vijay Janapa Reddi</text>
