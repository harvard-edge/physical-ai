<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-label="Tradeoff knee: quality rises with cost, then flattens; sit at the knee.">
  <style>
    .ax{stroke:currentColor;stroke-width:1.2;opacity:0.65;fill:none}
    .lab{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:12px;opacity:0.75}
    .note{fill:currentColor;font-family:'IBM Plex Sans',Inter,Arial,sans-serif;font-size:11px;opacity:0.9}
    .ttl{fill:currentColor;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;opacity:0.9}
    .curve{stroke:#18a999;stroke-width:2.5;fill:none}
  </style>
  <text class="ttl" x="50" y="22">tradeoff knee</text>
  <!-- axes -->
  <line class="ax" x1="60" y1="250" x2="395" y2="250"/>
  <line class="ax" x1="60" y1="250" x2="60" y2="40"/>
  <!-- the curve: rises, then flattens -->
  <path class="curve" d="M60 238 C 120 238 150 110 200 92 C 280 64 350 58 392 56"/>
  <!-- the knee -->
  <circle cx="196" cy="96" r="5.5" fill="#e8a33d"/>
  <text class="note" x="206" y="120">sit at the knee</text>
  <text class="note" x="322" y="50" text-anchor="middle">diminishing returns</text>
  <!-- axis labels -->
  <text class="lab" x="227" y="278" text-anchor="middle">cost  (latency, energy)</text>
  <text class="lab" x="22" y="150" text-anchor="middle" transform="rotate(-90 22 150)">quality</text>
</svg>
