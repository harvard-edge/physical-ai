      <rect x="6" y="6" width="70" height="15" rx="3" fill="#D1FAE5"/>
      <text class="badge-txt" x="41" y="17" text-anchor="middle" fill="#065F46">CHAPTER 8</text>
      <text class="card-title" x="6" y="36" fill="#065F46">Row 5: Execute</text>
      <text class="card-sub" x="6" y="48">1 kHz MCU Safety Reflex</text>
      <line x1="6" y1="54" x2="168" y2="54" stroke="#E2E8F0" stroke-width="1"/>
      <text class="body-txt" x="6" y="68" font-weight="700">Real-Time Permission:</text>
      <text class="bullet-txt" x="6" y="82">• Bare-metal MCU (malloc=0)</text>
      <text class="bullet-txt" x="6" y="96">• Control Barrier Functions</text>
      <text class="bullet-txt" x="6" y="110">• Dynamic stopping invariant</text>
      <text class="bullet-txt" x="6" y="124">• Hardware STO / gate drivers</text>
      <text class="bullet-txt" x="6" y="138">• Safe state projection (u*)</text>
      <rect x="6" y="152" width="162" height="24" rx="3" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text class="code-txt" x="10" y="167" fill="#065F46">Output: Gate Volts u(t)</text>
    </g>
