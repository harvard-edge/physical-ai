      <text class="badge-txt" x="41" y="17" text-anchor="middle" fill="#065F46">CHAPTER 6</text>
      <text class="card-title" x="6" y="36" fill="#065F46">Row 3: Reason</text>
      <text class="card-sub" x="6" y="48">Goals &amp; Expiring Leases</text>
      <line x1="6" y1="54" x2="188" y2="54" stroke="#E2E8F0" stroke-width="1"/>
      <text class="body-txt" x="6" y="68" font-weight="700">Semantic Deliberation:</text>
      <text class="bullet-txt" x="6" y="82">• Multimodal VLMs as System 2</text>
      <text class="bullet-txt" x="6" y="96">• Expiring Intent Leases (L_intent)</text>
      <text class="bullet-txt" x="6" y="110">• Workspace &amp; reach screening</text>
      <text class="bullet-txt" x="6" y="124">• Grounding open-world prompts</text>
      <text class="bullet-txt" x="6" y="138">• Zero direct motor write access</text>
      <rect x="6" y="152" width="182" height="24" rx="3" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text class="code-txt" x="10" y="167" fill="#065F46">Output: Intent Lease L_intent</text>
    </g>

