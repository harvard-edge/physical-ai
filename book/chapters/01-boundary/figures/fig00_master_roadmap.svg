      <text class="card-title" x="92" y="20" fill="#1E293B">System Assurance</text>
      
      <text class="body-txt" x="8" y="38" fill="#475569">Defensible release cases (CAE)</text>
      <text class="body-txt" x="8" y="50" fill="#475569">&amp; cross-layer fault injection.</text>
      <text class="bullet-txt" x="8" y="68">• STPA hazard analysis</text>
      <text class="bullet-txt" x="8" y="80">• 5-tier qualification ladder</text>
      <text class="bullet-txt" x="8" y="92">• Live bench fault qualification</text>
    </g>

    <!-- Ch 12: Capstone -->
