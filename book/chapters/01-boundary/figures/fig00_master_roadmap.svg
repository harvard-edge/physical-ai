    <text class="part-hdr" x="22" y="24" fill="#FFFFFF">PART III: INTEGRATION, GOVERNANCE &amp; RELEASE</text>
    <text class="part-sub" x="362" y="24">Whole-System Deployment, Placement, and Defensible Release (Chapters 9–12)</text>

