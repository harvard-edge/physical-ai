      <rect width="194" height="186" rx="5" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/>
      <rect x="6" y="6" width="70" height="15" rx="3" fill="#D1FAE5"/>
      <text class="badge-txt" x="41" y="17" text-anchor="middle" fill="#065F46">CHAPTER 5</text>
      <text class="card-title" x="6" y="36" fill="#065F46">Row 2: Remember</text>
      <text class="card-sub" x="6" y="48">World Models &amp; Frame Trees</text>
      <line x1="6" y1="54" x2="188" y2="54" stroke="#E2E8F0" stroke-width="1"/>
      <text class="body-txt" x="6" y="68" font-weight="700">Latent Metric State:</text>
      <text class="bullet-txt" x="6" y="82">• Non-generative JEPAs / RSSMs</text>
      <text class="bullet-txt" x="6" y="96">• Dynamic SE(3) frame trees</text>
      <text class="bullet-txt" x="6" y="110">• Lie algebra (se3) integration</text>
      <text class="bullet-txt" x="6" y="124">• Spatial persistence on dropout</text>
      <text class="bullet-txt" x="6" y="138">• Positional covariance bounds (σ)</text>
      <rect x="6" y="152" width="182" height="24" rx="3" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text class="code-txt" x="10" y="167" fill="#065F46">Output: State Belief B_t</text>
    </g>

