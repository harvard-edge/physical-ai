      <text class="code-txt" x="10" y="167" fill="#065F46">Output: 3D Tokens S_t</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 208 131 L 218 131" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-teal)"/>

