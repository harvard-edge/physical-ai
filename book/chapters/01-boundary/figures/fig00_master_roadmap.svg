      <rect x="8" y="8" width="76" height="16" rx="3" fill="#F1F5F9"/>
      <text class="badge-txt" x="46" y="20" text-anchor="middle" fill="#334155">CHAPTER 9</text>
      <text class="card-title" x="90" y="20" fill="#1E293B">Silicon Placement</text>
      
      <text class="body-txt" x="8" y="38" fill="#475569">Heterogeneous SoC placement and</text>
      <text class="body-txt" x="8" y="50" fill="#475569">MPU/NPU/MCU memory topology.</text>
      <text class="bullet-txt" x="8" y="68">• Edge vs. Cloud split &amp; dropouts</text>
      <text class="bullet-txt" x="8" y="80">• UMA memory bus contention</text>
      <text class="bullet-txt" x="8" y="92">• Thermal derating ripple</text>
    </g>

    <!-- Ch 10: Governance -->
    <g transform="translate(268, 36)">
