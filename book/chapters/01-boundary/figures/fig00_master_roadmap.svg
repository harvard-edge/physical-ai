      <rect width="238" height="114" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="8" y="8" width="84" height="16" rx="3" fill="#F1F5F9"/>
      <text class="badge-txt" x="50" y="20" text-anchor="middle" fill="#334155">CHAPTER 12</text>
      <text class="card-title" x="98" y="20" fill="#1E293B">Capstone Defense</text>
      
      <text class="body-txt" x="8" y="38" fill="#475569">Whole-system dual-brain defense</text>
      <text class="body-txt" x="8" y="50" fill="#475569">under live bench fault injection.</text>
      <text class="bullet-txt" x="8" y="68">• Full 11-artifact dossier</text>
