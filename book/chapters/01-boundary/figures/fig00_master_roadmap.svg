  <!-- Downward Flow Arrows from Part II to Part III -->
  <path d="M 530 480 L 530 496" stroke="#0F766E" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- ================= PART III: SYSTEM INTEGRATION & DEFENSE (BOTTOM SECTION) ================= -->
  <g transform="translate(15, 502)">
    <!-- Container Box -->
