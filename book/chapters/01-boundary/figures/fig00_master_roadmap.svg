    <text class="part-sub" x="302" y="24">Conquering the Co-Design Matrix Row by Row (Chapters 4–8)</text>

    <!-- Stage 1: Perceive (Ch 4) -->
    <g transform="translate(12, 38)">
      <rect width="194" height="186" rx="5" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/>
      <rect x="6" y="6" width="70" height="15" rx="3" fill="#D1FAE5"/>
      <text class="badge-txt" x="41" y="17" text-anchor="middle" fill="#065F46">CHAPTER 4</text>
      <text class="card-title" x="6" y="36" fill="#065F46">Row 1: Perceive</text>
      <text class="card-sub" x="6" y="48">Spatial Tokens in SE(3)</text>
      <line x1="6" y1="54" x2="188" y2="54" stroke="#E2E8F0" stroke-width="1"/>
      <text class="body-txt" x="6" y="68" font-weight="700">Sensory Ingestion Gateway:</text>
      <text class="bullet-txt" x="6" y="82">• CMOS, ToF, and IMU physics</text>
      <text class="bullet-txt" x="6" y="96">• Zero-copy DMA ring buffers</text>
      <text class="bullet-txt" x="6" y="110">• UMA bus QoS arbitration</text>
      <text class="bullet-txt" x="6" y="124">• ViT / DINOv2 patch tokens</text>
      <text class="bullet-txt" x="6" y="138">• Hardware PTP exposure strobe</text>
