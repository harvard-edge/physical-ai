<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 680" width="100%" height="auto" role="img" aria-label="Physical AI Systems: The Co-Design Framework and Curriculum Roadmap">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16.5px; font-weight: 800; fill: #0f2b48; letter-spacing: 0.5px; }
      .main-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #475569; }
      .part-hdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 800; letter-spacing: 0.8px; }
      .part-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #64748b; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #334155; line-height: 1.35; }
      .bullet-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 9px; fill: #475569; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; }
      .code-txt { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 8.5px; font-weight: 600; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f766e" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background Surface -->
  <rect width="1060" height="680" fill="#FFFFFF" rx="8" />

  <!-- Top Title Banner -->
  <rect x="15" y="12" width="1030" height="48" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text class="main-title" x="530" y="32" text-anchor="middle">PHYSICAL AI SYSTEMS: THE CO-DESIGN FRAMEWORK &amp; CURRICULUM ROADMAP</text>
  <text class="main-sub" x="530" y="48" text-anchor="middle">From Disembodied Cloud ML Behind Glass to Autonomous Embodied Agents Governing Matter, Momentum, and Energy</text>

  <!-- ================= PART I: FOUNDATIONS (TOP SECTION) ================= -->
  <g transform="translate(15, 68)">
    <!-- Container Box -->
    <rect width="1030" height="156" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
    
    <!-- Part Header Badge -->
    <rect x="12" y="10" width="190" height="20" rx="4" fill="#1F407A"/>
    <text class="part-hdr" x="22" y="24" fill="#FFFFFF">PART I: FOUNDATIONS</text>
    <text class="part-sub" x="212" y="24">The Three Pillars &amp; The Physical AI Co-Design Matrix</text>

    <!-- Pillar 1: Chapter 1 -->
    <g transform="translate(12, 36)">
      <rect width="324" height="108" rx="5" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
      <rect x="8" y="8" width="76" height="16" rx="3" fill="#DBEAFE"/>
      <text class="badge-txt" x="46" y="20" text-anchor="middle" fill="#1E40AF">CHAPTER 1</text>
      <text class="card-title" x="92" y="20" fill="#1E3A8A">The Causal Boundary</text>
      
      <text class="body-txt" x="8" y="38" fill="#1E293B" font-weight="700">The Problem &amp; The Discipline:</text>
      <text class="body-txt" x="8" y="50" fill="#475569">Crossing from advisory bits into moving matter.</text>
      <text class="bullet-txt" x="8" y="66">• Action mutates world state: A_t → W_t+1 → O_t+1</text>
      <text class="bullet-txt" x="8" y="78">• Proposal–Permission privilege separation</text>
      <text class="bullet-txt" x="8" y="90">• Master 5×5 Physical AI Co-Design Matrix</text>
    </g>

    <!-- Pillar 2: Chapter 2 -->
    <g transform="translate(352, 36)">
      <rect width="324" height="108" rx="5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
      <rect x="8" y="8" width="76" height="16" rx="3" fill="#FEE2E2"/>
      <text class="badge-txt" x="46" y="20" text-anchor="middle" fill="#991B1B">CHAPTER 2</text>
      <text class="card-title" x="92" y="20" fill="#991B1B">The Physical Columns</text>
      
      <text class="body-txt" x="8" y="38" fill="#1E293B" font-weight="700">The "Physical" Half (5 Columns):</text>
      <text class="body-txt" x="8" y="50" fill="#475569">Physical laws bounding intelligence in silicon &amp; steel.</text>
      <text class="bullet-txt" x="8" y="66">• Time (P99 tail latency) &amp; Freshness Wall (Δt_wall)</text>
      <text class="bullet-txt" x="8" y="78">• Inertia &amp; Dynamic Stopping Kinematics (d_stop)</text>
      <text class="bullet-txt" x="8" y="90">• Inductive Rise (L/R), Joule Heat &amp; UMA Bus QoS</text>
    </g>

    <!-- Pillar 3: Chapter 3 -->
    <g transform="translate(692, 36)">
      <rect width="324" height="108" rx="5" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
      <rect x="8" y="8" width="76" height="16" rx="3" fill="#DCFCE7"/>
      <text class="badge-txt" x="46" y="20" text-anchor="middle" fill="#166534">CHAPTER 3</text>
      <text class="card-title" x="92" y="20" fill="#166534">The AI Cognitive Rows</text>
      
      <text class="body-txt" x="8" y="38" fill="#1E293B" font-weight="700">The "AI" Half &amp; Multi-Rate Architecture:</text>
      <text class="body-txt" x="8" y="50" fill="#475569">Cognitive functions &amp; 3 temporal execution cadences.</text>
      <text class="bullet-txt" x="8" y="66">• 5 AI Stages: Perceive, Remember, Reason, Plan, Act</text>
      <text class="bullet-txt" x="8" y="78">• Classical Robotics vs. Modern Physical AI</text>
      <text class="bullet-txt" x="8" y="90">• 3 Cadences: System 2 (1 Hz) ↔ 1.5 (30 Hz) ↔ 1 (1 kHz)</text>
    </g>
  </g>

  <!-- Downward Flow Arrows from Part I to Part II -->
  <path d="M 530 224 L 530 240" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arr-blue)"/>

