      <rect x="6" y="6" width="70" height="15" rx="3" fill="#D1FAE5"/>
      <text class="badge-txt" x="41" y="17" text-anchor="middle" fill="#065F46">CHAPTER 7</text>
      <text class="card-title" x="6" y="36" fill="#065F46">Row 4: Plan</text>
      <text class="card-sub" x="6" y="48">Action Chunks &amp; Splines</text>
      <line x1="6" y1="54" x2="188" y2="54" stroke="#E2E8F0" stroke-width="1"/>
      <text class="body-txt" x="6" y="68" font-weight="700">Trajectory Decoding:</text>
      <text class="bullet-txt" x="6" y="82">• Diffusion / ACT action chunking</text>
      <text class="bullet-txt" x="6" y="96">• Deliberation delay amortization</text>
      <text class="bullet-txt" x="6" y="110">• Receding-horizon ensembling</text>
      <text class="bullet-txt" x="6" y="124">• C² quintic splines (bounded jerk)</text>
      <text class="bullet-txt" x="6" y="138">• Atomic state re-anchoring</text>
      <rect x="6" y="152" width="182" height="24" rx="3" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text class="code-txt" x="10" y="167" fill="#065F46">Output: Action Chunk A_t:t+H</text>
