      <rect x="8" y="8" width="78" height="16" rx="3" fill="#F1F5F9"/>
      <text class="badge-txt" x="47" y="20" text-anchor="middle" fill="#334155">CHAPTER 10</text>
      <text class="card-title" x="92" y="20" fill="#1E293B">Governance &amp; Ops</text>
      
      <text class="body-txt" x="8" y="38" fill="#475569">Human-machine authority arbitration</text>
      <text class="body-txt" x="8" y="50" fill="#475569">&amp; continuous fleet telemetry.</text>
      <text class="bullet-txt" x="8" y="68">• Bumpless control transfer</text>
      <text class="bullet-txt" x="8" y="80">• Intervention tagging &amp; shift</text>
      <text class="bullet-txt" x="8" y="92">• Policy endogeneity flywheels</text>
    </g>

    <!-- Ch 11: Assurance -->
    <g transform="translate(524, 36)">
