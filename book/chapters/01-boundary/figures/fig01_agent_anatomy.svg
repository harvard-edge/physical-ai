<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="auto" role="img" aria-label="The Anatomy and Causal Sensory-Motor Loop of a Physical AI Agent">
  <defs>
    <style>
      .main-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1F407A; letter-spacing: 0.5px; }
      .main-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
      .zone-tag { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.6px; }
      .organ-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .organ-cadence { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 600; }
      .organ-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #475569; line-height: 1.35; }
      .organ-contract { font-family: 'SF Mono', Menlo, monospace; font-size: 9px; font-weight: 600; fill: #0F172A; }
      .boundary-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; fill: #A51C30; letter-spacing: 0.8px; }
      .world-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #A51C30; }
      .world-body { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #1E293B; line-height: 1.4; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="580" fill="#FFFFFF" rx="8"/>

  <!-- Top Banner -->
  <rect x="20" y="12" width="920" height="40" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
  <text class="main-title" x="480" y="29" text-anchor="middle">THE ANATOMY AND CAUSAL SENSORY-MOTOR LOOP OF A PHYSICAL AI AGENT</text>
  <text class="main-sub" x="480" y="43" text-anchor="middle">Tracing the 7 Canonical Pipeline Organs across the Proposal–Permission Privilege Boundary</text>

  <!-- ================= HOST MPU ZONE (UNTRUSTED PROPOSAL REALM) ================= -->
  <g transform="translate(20, 60)">
    <rect width="920" height="230" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    
    <!-- Zone Label -->
    <rect x="12" y="10" width="310" height="20" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
    <text class="zone-tag" x="167" y="24" text-anchor="middle" fill="#475569">HOST BRAIN · LINUX MPU / NPU (UNTRUSTED PROPOSALS)</text>

    <!-- Stage 1: Sensing -->
    <g transform="translate(14, 38)">
      <rect width="165" height="178" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.1"/>
      <rect x="8" y="8" width="149" height="18" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8"/>
      <text class="organ-cadence" x="82" y="21" text-anchor="middle" fill="#D97706">STAGE 1 · 30–1000 Hz</text>
      <text class="organ-title" x="8" y="44" fill="#B45309">Sensing &amp; I/O</text>
      <text class="organ-sub" x="8" y="60">
        <tspan x="8" dy="0">• Photons, IMU, LiDAR</tspan>
        <tspan x="8" dy="14">• Zero-copy DMA rings</tspan>
        <tspan x="8" dy="14">• IEEE 1588 PTP clocks</tspan>
        <tspan x="8" dy="14">• UMA bus QoS priority</tspan>
      </text>
      <rect x="8" y="130" width="149" height="38" rx="4" fill="#FFFFFF" stroke="#FDE68A" stroke-width="0.8"/>
      <text class="organ-contract" x="12" y="145">DMA Ring Buffer</text>
      <text class="organ-contract" x="12" y="158" fill="#B45309">PTP Midpoint t_0</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="181" y1="125" x2="195" y2="125" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Stage 2: Perception -->
    <g transform="translate(197, 38)">
      <rect width="165" height="178" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
      <rect x="8" y="8" width="149" height="18" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="0.8"/>
      <text class="organ-cadence" x="82" y="21" text-anchor="middle" fill="#2563EB">STAGE 2 · 10–60 Hz</text>
      <text class="organ-title" x="8" y="44" fill="#1D4ED8">Perception &amp; ViT</text>
      <text class="organ-sub" x="8" y="60">
        <tspan x="8" dy="0">• DINOv2 / ViT Patch tokens</tspan>
        <tspan x="8" dy="14">• Inverse projection K^-1</tspan>
        <tspan x="8" dy="14">• 3D bounding hulls B_3D</tspan>
        <tspan x="8" dy="14">• Surface normals n_hat</tspan>
      </text>
      <rect x="8" y="130" width="149" height="38" rx="4" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text class="organ-contract" x="12" y="145">Affordance Tokens</text>
      <text class="organ-contract" x="12" y="158" fill="#1D4ED8">o_t ∈ R^(N x D)</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="364" y1="125" x2="378" y2="125" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Stage 3: World Models -->
    <g transform="translate(380, 38)">
      <rect width="165" height="178" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
      <rect x="8" y="8" width="149" height="18" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="0.8"/>
      <text class="organ-cadence" x="82" y="21" text-anchor="middle" fill="#2563EB">STAGE 3 · 20–100 Hz</text>
      <text class="organ-title" x="8" y="44" fill="#1D4ED8">World Models &amp; SE(3)</text>
      <text class="organ-sub" x="8" y="60">
        <tspan x="8" dy="0">• SE(3) Transform Tree</tspan>
        <tspan x="8" dy="14">• Latent JEPA prediction</tspan>
        <tspan x="8" dy="14">• Covariance Σ_t tracking</tspan>
        <tspan x="8" dy="14">• State TTL expiration</tspan>
      </text>
      <rect x="8" y="130" width="149" height="38" rx="4" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text class="organ-contract" x="12" y="145">Latent State z_t</text>
      <text class="organ-contract" x="12" y="158" fill="#1D4ED8">SE(3) Frame Tree</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="547" y1="95" x2="561" y2="95" stroke="#D97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>

    <!-- Stage 4: Semantic Deliberation (System 2) -->
    <g transform="translate(563, 38)">
      <rect width="165" height="178" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
      <rect x="8" y="8" width="149" height="18" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8"/>
      <text class="organ-cadence" x="82" y="21" text-anchor="middle" fill="#D97706">STAGE 4 · 0.5–2 Hz</text>
      <text class="organ-title" x="8" y="44" fill="#B45309">Semantic Intent</text>
      <text class="organ-sub" x="8" y="60">
        <tspan x="8" dy="0">• Multimodal VLM</tspan>
        <tspan x="8" dy="14">• Open-vocabulary query</tspan>
        <tspan x="8" dy="14">• Reachability filter κ(J)</tspan>
        <tspan x="8" dy="14">• Expiring Intent Lease</tspan>
      </text>
      <rect x="8" y="130" width="149" height="38" rx="4" fill="#FFFFFF" stroke="#FDE68A" stroke-width="0.8"/>
      <text class="organ-contract" x="12" y="145">Expiring Lease</text>
      <text class="organ-contract" x="12" y="158" fill="#B45309">L_intent = (T, Δt, δ)</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <line x1="730" y1="125" x2="744" y2="125" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Stage 5: Planning & Action Chunking (System 1.5) -->
    <g transform="translate(746, 38)">
      <rect width="160" height="178" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
      <rect x="8" y="8" width="144" height="18" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="0.8"/>
      <text class="organ-cadence" x="80" y="21" text-anchor="middle" fill="#2563EB">STAGE 5 · 20–50 Hz</text>
      <text class="organ-title" x="8" y="44" fill="#1D4ED8">Action Chunking</text>
      <text class="organ-sub" x="8" y="60">
        <tspan x="8" dy="0">• Diffusion Policy / ACT</tspan>
        <tspan x="8" dy="14">• H=16 trajectory chunk</tspan>
        <tspan x="8" dy="14">• C^2 jerk-bounded spline</tspan>
        <tspan x="8" dy="14">• Shared SRAM mailbox</tspan>
      </text>
      <rect x="8" y="130" width="144" height="38" rx="4" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text class="organ-contract" x="12" y="145">Action Chunk</text>
      <text class="organ-contract" x="12" y="158" fill="#1D4ED8">A_(t:t+H) ∈ R^(H x D)</text>
    </g>
  </g>

  <!-- ================= PROPOSAL–PERMISSION PRIVILEGE BOUNDARY ================= -->
  <g transform="translate(20, 296)">
    <rect width="920" height="24" rx="4" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2" stroke-dasharray="6,4"/>
    <text class="boundary-txt" x="460" y="16" text-anchor="middle">═════ PROPOSAL–PERMISSION PRIVILEGE BOUNDARY (SHARED SRAM MAILBOX · LOCK-FREE SEQLOCK) ═════</text>
  </g>

  <!-- ================= REFLEX BRAIN & GOVERNANCE (SYSTEM 1 REAL-TIME MCU) ================= -->
  <g transform="translate(20, 326)">
    <!-- Stage 6: Deterministic Safety Reflex -->
    <g transform="translate(0, 0)">
      <rect width="450" height="120" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
      <rect x="12" y="8" width="220" height="20" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1"/>
      <text class="organ-cadence" x="122" y="22" text-anchor="middle" fill="#059669">STAGE 6 · 1000 Hz BARE-METAL MCU</text>
      <text class="organ-title" x="12" y="46" fill="#047857">Safety Barrier Reflex &amp; Gate Control</text>
      <text class="organ-sub" x="12" y="64">
        <tspan x="12" dy="0">• Control Barrier Functions (CBF): h(x) ≥ 0 quadratic program solve in &lt; 65 μs</tspan>
        <tspan x="12" dy="16">• Dynamic stopping distance audit: d_stop(v, a_max) ≤ d_clearance</tspan>
        <tspan x="12" dy="16">• Hardware Watchdog interlock: 50 ms timeout triggers Category 1 safe stop</tspan>
      </text>
      <rect x="240" y="8" width="198" height="20" rx="4" fill="#059669"/>
      <text class="organ-contract" x="339" y="22" text-anchor="middle" fill="#FFFFFF">SOLE PWM AUTHORITY</text>
    </g>

    <!-- Stage 7: Governance & Lineage -->
    <g transform="translate(470, 0)">
      <rect width="450" height="120" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
      <rect x="12" y="8" width="220" height="20" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
      <text class="organ-cadence" x="122" y="22" text-anchor="middle" fill="#7C3AED">STAGE 7 · CONTINUOUS GOVERNANCE</text>
      <text class="organ-title" x="12" y="46" fill="#6D28D9">Human Authority &amp; Lineage Audit</text>
      <text class="organ-sub" x="12" y="64">
        <tspan x="12" dy="0">• Bumpless transfer: C^2 torque blending (tau_dot &lt; 15 Nm/s) on human takeover</tspan>
        <tspan x="12" dy="16">• Governed episode slicing: discards pre-crash buffers, isolates recovery demos</tspan>
        <tspan x="12" dy="16">• Cryptographic lineage: SHA-256 telemetry seal for CAE safety cases (REL-01)</tspan>
      </text>
    </g>
  </g>

  <!-- ================= PHYSICAL REALITY & ENDOGENOUS FEEDBACK ================= -->
  <g transform="translate(20, 456)">
    <rect width="920" height="110" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.4"/>
    
    <!-- Title -->
    <text class="world-title" x="16" y="22">PHYSICAL REALITY (W_t → W_t+1): IRREVERSIBILITY, CONSTRAINTS &amp; ENDOGENOUS FEEDBACK</text>
    
    <!-- Details -->
    <text class="world-body" x="16" y="44">
      <tspan x="16" dy="0">• <tspan font-weight="700">Irreversible State Transition:</tspan> Motor phase currents I_phase accelerate mass m with kinetic momentum p=mv. You cannot `ctrl+z` kinetic energy.</tspan>
      <tspan x="16" dy="18">• <tspan font-weight="700">Physical Invariants:</tspan> Motor winding Joule heating (I^2 R), battery voltage sag, gear friction μ, and dynamic obstacle movements.</tspan>
      <tspan x="16" dy="18">• <tspan font-weight="700">Endogenous Sensory Feedback Loop:</tspan> Actuation permanently mutates the physical environment (A_t → W_t+1 → O_t+1), closing the real-time loop back to Stage 1 Sensing.</tspan>
    </text>
  </g>

  <!-- Physical Actuation Command Arrow (MCU -> World) -->
  <line x1="225" y1="446" x2="225" y2="456" stroke="#059669" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- Endogenous Feedback Loop (World -> Sensing) -->
  <path d="M 80 456 L 80 448 Q 80 440 60 440 L 40 440 Q 30 440 30 420 L 30 250 Q 30 240 45 240 L 70 240 L 70 216" 
        fill="none" stroke="#A51C30" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-crimson)"/>
  <rect x="34" y="300" width="130" height="18" rx="4" fill="#FEF2F2" stroke="#A51C30" stroke-width="0.8"/>
  <text class="boundary-txt" x="99" y="313" text-anchor="middle" font-size="8.5px">ENDOGENOUS O_(t+1)</text>
</svg>
