<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">ANATOMY OF AN EMBODIED PHYSICAL AI AGENT</text>
<text x="440.0" y="44" class="subtitle">The Closed Causal Interaction Loop: Perception, Latent Modeling, Action, and Physical Law</text>
<rect x="40" y="70" width="360" height="140" rx="8" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="40" y="70" width="360" height="24" rx="8" fill="#1F407A" fill-opacity="0.12"/>
<text x="52" y="86" font-size="9" font-weight="700" fill="#1F407A">1. TRANSDUCTION &amp; SENSING</text>
<text x="52" y="112" font-size="11" font-weight="700" fill="#1A202C">Physical Photons/Forces → Digital Bits</text>
<text x="52" y="132" font-size="8.5" fill="#475569">• Camera CMOS pixel wells · Shunt current sense</text>
<text x="52" y="148" font-size="8.5" fill="#475569">• IMU Coriolis force gyroscopes · Encoder ticks</text>
<rect x="480" y="70" width="360" height="140" rx="8" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="480" y="70" width="360" height="24" rx="8" fill="#215CAF" fill-opacity="0.12"/>
<text x="492" y="86" font-size="9" font-weight="700" fill="#215CAF">2. COGNITIVE SYNTHESIS</text>
<text x="492" y="112" font-size="11" font-weight="700" fill="#1A202C">Spatial World Model &amp; Reasoning</text>
<text x="492" y="132" font-size="8.5" fill="#475569">• 3D SE(3) Frame Tree · Latent state belief</text>
<text x="492" y="148" font-size="8.5" fill="#475569">• Diffusion action chunks · Expiring intent lease</text>
<rect x="480" y="240" width="360" height="140" rx="8" fill="#FFFFFF" stroke="#007A87" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="480" y="240" width="360" height="24" rx="8" fill="#007A87" fill-opacity="0.12"/>
<text x="492" y="256" font-size="9" font-weight="700" fill="#007A87">3. REAL-TIME SAFETY ENFORCER</text>
<text x="492" y="282" font-size="11" font-weight="700" fill="#1A202C">Proposal Veto &amp; Invariant Projection</text>
<text x="492" y="302" font-size="8.5" fill="#475569">• Active-Set QP solver: h(x) ≥ 0</text>
<text x="492" y="318" font-size="8.5" fill="#475569">• Dynamic stopping clearance: d_stop ≤ d_gap</text>
<text x="492" y="334" font-size="8.5" fill="#475569">• Deterministic 1 kHz FreeRTOS execution</text>
<rect x="40" y="240" width="360" height="140" rx="8" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="40" y="240" width="360" height="24" rx="8" fill="#A51C30" fill-opacity="0.12"/>
<text x="52" y="256" font-size="9" font-weight="700" fill="#A51C30">4. PHYSICAL PLANT &amp; DYNAMICS</text>
<text x="52" y="282" font-size="11" font-weight="700" fill="#1A202C">Silicon Commands → Continuous Physics</text>
<text x="52" y="302" font-size="8.5" fill="#475569">• BLDC motor inverter bridges · Contact mechanics</text>
<text x="52" y="318" font-size="8.5" fill="#475569">• Kinetic energy E_k = 1/2 m v² · Thermal heating</text>
<line x1="400" y1="140" x2="480" y2="140" stroke="#215CAF" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<text x="440" y="132" font-size="8" font-weight="600" fill="#215CAF" text-anchor="middle">z_t (Bits)</text>
<line x1="660" y1="210" x2="660" y2="240" stroke="#B87333" stroke-width="1.8" marker-end="url(#arr-bronze)"/>
<text x="670" y="228" font-size="8" font-weight="600" fill="#B87333">p_t (Proposal)</text>
<line x1="480" y1="310" x2="400" y2="310" stroke="#007A87" stroke-width="1.8" marker-end="url(#arr-petrol)"/>
<text x="440" y="302" font-size="8" font-weight="600" fill="#007A87" text-anchor="middle">u_t (Permission)</text>
<line x1="220" y1="240" x2="220" y2="210" stroke="#A51C30" stroke-width="1.8" marker-end="url(#arr-crimson)"/>
<text x="210" y="228" font-size="8" font-weight="600" fill="#A51C30" text-anchor="end">W_t (Continuous State)</text>
</svg>
