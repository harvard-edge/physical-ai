<rect x="337" y="284" width="260" height="86" rx="5" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.2"/>
<text x="347" y="301" font-size="9.5" font-weight="700" fill="#A51C30">5. Mechanical Dynamics</text>
<text x="347" y="317" font-size="8.5" fill="#475569">Torque tau = M(q)q_ddot + C(q,q_dot)</text>
<text x="347" y="333" font-size="8.5" fill="#475569">Kinetic Momentum: p = mv</text>
<text x="347" y="349" font-size="8" fill="#64748B">Reflected Inertia: N^2 J_rotor</text>
<line x1="597" y1="327.0" x2="632" y2="327.0" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arr-crimson)"/>
<text x="614.5" y="319.0" font-size="7.5" fill="#64748B" text-anchor="middle">work F dx</text>
<rect x="632" y="284" width="260" height="86" rx="5" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.2"/>
<text x="642" y="301" font-size="9.5" font-weight="700" fill="#A51C30">6. Physical Environment</text>
<text x="642" y="317" font-size="8.5" fill="#475569">Environment State: W_t -&gt; W_t+1</text>
