<rect x="632" y="90" width="260" height="86" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
<text x="642" y="107" font-size="9.5" font-weight="700" fill="#D97706">3. Deterministic Safety Referee</text>
