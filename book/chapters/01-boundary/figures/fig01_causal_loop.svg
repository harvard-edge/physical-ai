<text x="460.0" y="416" font-size="8.5" font-weight="700" fill="#007A87" text-anchor="middle">ENDOGENOUS SENSORY FEEDBACK: o_t+1 ~ P(O | s_t+1, W_t+1) [Actions reshape future observations]</text>
