      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="920" height="580" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
<rect x="20" y="18" width="880" height="125" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="35" y="38" font-size="11" font-weight="700" fill="#215CAF">(a) Open-Loop Digital ML: Advisory Computation Behind Glass</text>
<text x="35" y="52" font-size="8.5" fill="#64748B">Statistically evaluated on static benchmark distributions; errors bounded by memory rollback; zero physical force.</text>
<rect x="35" y="64" width="185" height="58" rx="5" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2"/>
<text x="127.5" y="81" font-size="9.5" font-weight="700" fill="#215CAF" text-anchor="middle">Exogenous Input</text>
<text x="127.5" y="96" font-size="8.5" fill="#475569" text-anchor="middle">Static Benchmark x ~ P(X)</text>
<text x="127.5" y="110" font-size="8" fill="#64748B" text-anchor="middle">Independent &amp; Identical</text>
<line x1="220" y1="93" x2="255" y2="93" stroke="#215CAF" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="237" y="85" font-size="7.5" fill="#64748B" text-anchor="middle">batch</text>
<rect x="255" y="64" width="185" height="58" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
<text x="347.5" y="81" font-size="9.5" font-weight="700" fill="#D97706" text-anchor="middle">Neural Model</text>
<text x="347.5" y="96" font-size="8.5" fill="#475569" text-anchor="middle">LLM / VLM / Classifier</text>
<text x="347.5" y="110" font-size="8" fill="#64748B" text-anchor="middle">y_hat = f_theta(x)</text>
<line x1="440" y1="93" x2="475" y2="93" stroke="#215CAF" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="457" y="85" font-size="7.5" fill="#64748B" text-anchor="middle">infer</text>
<rect x="475" y="64" width="185" height="58" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
<text x="567.5" y="81" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Advisory Output</text>
<text x="567.5" y="96" font-size="8.5" fill="#475569" text-anchor="middle">Pixels / JSON / Text Tokens</text>
<text x="567.5" y="110" font-size="8" fill="#64748B" text-anchor="middle">y_hat in Y</text>
<line x1="660" y1="93" x2="695" y2="93" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
<text x="677" y="85" font-size="7.5" fill="#64748B" text-anchor="middle">render</text>
<rect x="695" y="64" width="185" height="58" rx="5" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
<text x="787.5" y="81" font-size="9.5" font-weight="700" fill="#10B981" text-anchor="middle">Human / Sandbox</text>
<text x="787.5" y="96" font-size="8.5" fill="#475569" text-anchor="middle">Dismiss / Accept / Re-run</text>
<text x="787.5" y="110" font-size="8" font-weight="600" fill="#10B981" text-anchor="middle">Idempotent (p = 0, W = 0)</text>
<rect x="20" y="158" width="880" height="405" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
<text x="35" y="178" font-size="11" font-weight="700" fill="#A51C30">(b) Closed Causal Loop of Physical AI: Delegated Force and Endogenous Feedback</text>
<text x="35" y="192" font-size="8.5" fill="#64748B">Inference commands physical energy; errors permanently alter environment state; action history endogenously dictates future sensory inputs o_t+1.</text>
<rect x="90" y="206" width="235" height="66" rx="5" fill="#F8FAFC" stroke="#215CAF" stroke-width="1.2"/>
<text x="100" y="223" font-size="9.5" font-weight="700" fill="#215CAF">1. Endogenous Sensing</text>
<text x="100" y="239" font-size="8.5" fill="#475569">Photons · IMU · Joint Encoders</text>
<text x="100" y="255" font-size="8.5" font-weight="600" fill="#215CAF">o_t ~ P(O | s_t, W_t)</text>
<line x1="325" y1="239.0" x2="360" y2="239.0" stroke="#215CAF" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="342" y="231.0" font-size="7.5" fill="#64748B" text-anchor="middle">DMA</text>
<rect x="360" y="206" width="235" height="66" rx="5" fill="#F8FAFC" stroke="#D97706" stroke-width="1.2"/>
<text x="370" y="223" font-size="9.5" font-weight="700" fill="#D97706">2. Untrusted Brain (MPU/NPU)</text>
<text x="370" y="239" font-size="8.5" fill="#475569">Learned Policy / Diffusion / VLA</text>
<text x="370" y="255" font-size="8.5" font-weight="600" fill="#D97706">Candidate Proposal a_hat ~ pi(o_t)</text>
<line x1="595" y1="239.0" x2="630" y2="239.0" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
<text x="612" y="231.0" font-size="7.5" fill="#64748B" text-anchor="middle">p_t</text>
<rect x="630" y="206" width="235" height="66" rx="5" fill="#F8FAFC" stroke="#007A87" stroke-width="1.2"/>
<text x="640" y="223" font-size="9.5" font-weight="700" fill="#007A87">3. Nervous System (MCU)</text>
<text x="640" y="239" font-size="8.5" fill="#475569">Invariant Check: h(x) &gt;= 0 @ 1 kHz</text>
<text x="640" y="255" font-size="8.5" font-weight="600" fill="#007A87">d_stop(v) &lt;= d_clear ==&gt; Permitted u_t</text>
<line x1="40" y1="285" x2="880" y2="285" stroke="#A51C30" stroke-width="1" stroke-dasharray="4,3"/>
<text x="460.0" y="281" font-size="8" font-weight="700" fill="#A51C30" text-anchor="middle" letter-spacing="1px">--- NON-REVERSIBLE ENERGY RELEASE THRESHOLD ---</text>
<rect x="40" y="292" width="840" height="36" rx="4" fill="#A51C30" fill-opacity="0.08" stroke="#A51C30" stroke-width="1.3"/>
<text x="460.0" y="307" font-size="10" font-weight="700" fill="#A51C30" text-anchor="middle">THE CAUSAL BOUNDARY: MEMORY-MAPPED ACTUATOR REGISTER WRITE</text>
<text x="460.0" y="321" font-size="8" fill="#475569" text-anchor="middle">DAC Reference Latch · PWM Capture/Compare Duty Latch (u_t) · Gate Driver Control Word · Dead-Time Insertion</text>
<line x1="747.5" y1="272" x2="747.5" y2="292" stroke="#007A87" stroke-width="1.8" marker-end="url(#arr-petrol)"/>
<text x="753.5" y="280" font-size="7.5" font-weight="600" fill="#007A87">latch u_t</text>
<line x1="207.5" y1="328" x2="207.5" y2="352" stroke="#A51C30" stroke-width="1.8" marker-end="url(#arr-crimson)"/>
<text x="213.5" y="344" font-size="7.5" font-weight="600" fill="#A51C30">PWM duty</text>
<rect x="90" y="352" width="235" height="70" rx="5" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.2"/>
<text x="100" y="369" font-size="9.5" font-weight="700" fill="#A51C30">4. Actuator Transduction</text>
<text x="100" y="385" font-size="8.5" fill="#475569">Lorentz Force: F = I (L x B)</text>
<text x="100" y="401" font-size="8.5" fill="#475569">Joule Heat: Delta Q = I^2 R Delta t</text>
<line x1="325" y1="387.0" x2="360" y2="387.0" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arr-crimson)"/>
<text x="342" y="379.0" font-size="7.5" fill="#64748B" text-anchor="middle">torque tau</text>
<rect x="360" y="352" width="235" height="70" rx="5" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.2"/>
<text x="370" y="369" font-size="9.5" font-weight="700" fill="#A51C30">5. Mechanical Dynamics</text>
<text x="370" y="385" font-size="8.5" fill="#475569">Torque tau = M(q)q_ddot + C(q,q_dot)</text>
<text x="370" y="401" font-size="8.5" fill="#475569">Kinetic Momentum: p = mv</text>
<line x1="595" y1="387.0" x2="630" y2="387.0" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arr-crimson)"/>
<text x="612" y="379.0" font-size="7.5" fill="#64748B" text-anchor="middle">work F dx</text>
<rect x="630" y="352" width="235" height="70" rx="5" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.2"/>
<text x="640" y="369" font-size="9.5" font-weight="700" fill="#A51C30">6. Physical Environment</text>
<text x="640" y="385" font-size="8.5" fill="#475569">Environment State: W_t -&gt; W_t+1</text>
<text x="640" y="401" font-size="8.5" fill="#475569">Delay as Distance: Delta x = int v dt</text>
<line x1="747.5" y1="422" x2="747.5" y2="450" stroke="#007A87" stroke-width="2"/>
<line x1="747.5" y1="450" x2="710.0" y2="450" stroke="#007A87" stroke-width="2"/>
<line x1="210.0" y1="450" x2="42" y2="450" stroke="#007A87" stroke-width="2"/>
<line x1="42" y1="450" x2="42" y2="239.0" stroke="#007A87" stroke-width="2"/>
<line x1="42" y1="239.0" x2="90" y2="239.0" stroke="#007A87" stroke-width="2" marker-end="url(#arr-petrol)"/>
<rect x="215.0" y="439" width="490" height="22" rx="4" fill="#FFFFFF" stroke="#007A87" stroke-width="1.2" filter="url(#shadow)"/>
<text x="460.0" y="454" font-size="8.5" font-weight="700" fill="#007A87" text-anchor="middle">ENDOGENOUS SENSORY FEEDBACK: o_t+1 ~ P(O | s_t+1, W_t+1) [Actions reshape future observations]</text>
</svg>
