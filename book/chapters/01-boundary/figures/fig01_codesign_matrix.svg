    <rect x="0" y="0" width="170" height="44" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="85" y="18" class="col-header">1. TIME &amp; FRESHNESS</text>
    <text x="85" y="33" class="col-sub">Δt_wall · P99 Tails</text>

    <!-- Col 2 -->
    <rect x="176" y="0" width="170" height="44" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="261" y="18" class="col-header">2. INERTIA &amp; STOPPING</text>
    <text x="261" y="33" class="col-sub">p = mv · d_stop Kinematics</text>

    <!-- Col 3 -->
    <rect x="352" y="0" width="170" height="44" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="437" y="18" class="col-header">3. ACTUATION &amp; JERK</text>
    <text x="437" y="33" class="col-sub">τ_e = L/R · C^2 Continuity</text>

    <!-- Col 4 -->
    <rect x="528" y="0" width="170" height="44" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="613" y="18" class="col-header">4. ENERGY &amp; THERMAL</text>
    <text x="613" y="33" class="col-sub">I^2 R Joule Heat · C_th</text>

    <!-- Col 5 -->
    <rect x="704" y="0" width="170" height="44" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="789" y="18" class="col-header">5. SILICON DETERMINISM</text>
    <text x="789" y="33" class="col-sub">UMA Bus QoS · malloc=0</text>
  </g>

