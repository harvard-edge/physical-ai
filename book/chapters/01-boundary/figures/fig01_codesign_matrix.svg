      .main-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; fill: #1E3A8A; text-anchor: middle; }
      .col-sub { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 9px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .row-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #1E3A8A; }
      .row-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #475569; }
      .ch-tag { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; fill: #990000; }
      .cell-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #0F172A; }
      .cell-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8.5px; fill: #475569; line-height: 1.35; }
    </style>
  </defs>

  <!-- Background container -->
  <rect x="0" y="0" width="1080" height="720" fill="#FFFFFF"/>

  <!-- Master Title Header -->
  <g transform="translate(20, 15)">
    <rect x="0" y="0" width="1040" height="42" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="520" y="18" text-anchor="middle" class="main-title">THE PHYSICAL AGENT CO-DESIGN MATRIX</text>
    <text x="520" y="32" text-anchor="middle" class="main-sub">Crossing Cognitive Agency (5 Lifecycle Rows) with Physical Reality (5 Constraint Columns)</text>
  </g>

  <!-- ================= COLUMN HEADERS (PHYSICAL CONSTRAINTS) ================= -->
  <g transform="translate(170, 65)">
