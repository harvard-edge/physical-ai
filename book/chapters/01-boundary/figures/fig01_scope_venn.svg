<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="530" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="26" class="title">THE PHYSICAL AI SCOPE TEST: TRIPARTITE ARCHITECTURAL CRITERION</text>
<text x="440.0" y="42" class="subtitle">Physical AI exists strictly at the three-way intersection of Learned Policies, Consequential Feedback, and Delegated Authority</text>
<circle cx="355" cy="210" r="135" fill="#215CAF" fill-opacity="0.08" stroke="#215CAF" stroke-width="1.6"/>
<circle cx="525" cy="210" r="135" fill="#A51C30" fill-opacity="0.08" stroke="#A51C30" stroke-width="1.6"/>
<circle cx="440" cy="320" r="135" fill="#007A87" fill-opacity="0.08" stroke="#007A87" stroke-width="1.6"/>
<text x="190" y="58" font-size="10.5" font-weight="700" fill="#215CAF" text-anchor="middle">CRITERION 1: LEARNED MODELS</text>
<text x="190" y="72" font-size="8.5" fill="#475569" text-anchor="middle">Unspecifiable neural policies</text>
<text x="190" y="84" font-size="8.5" fill="#64748B" text-anchor="middle">Acquired inductively from data</text>
<text x="690" y="58" font-size="10.5" font-weight="700" fill="#A51C30" text-anchor="middle">CRITERION 2: DELEGATED AUTHORITY</text>
<text x="690" y="72" font-size="8.5" fill="#475569" text-anchor="middle">Automated actuator register writes</text>
<text x="690" y="84" font-size="8.5" fill="#64748B" text-anchor="middle">Zero synchronous human in the loop</text>
<text x="440" y="478" font-size="10.5" font-weight="700" fill="#007A87" text-anchor="middle">CRITERION 3: CONSEQUENTIAL PHYSICAL FEEDBACK</text>
<text x="440" y="493" font-size="8.5" fill="#475569" text-anchor="middle">Actions alter external world state (s_t+1 ~ P(s|s_t,a_t)) under mechanics, momentum (p=mv), and thermodynamics</text>
<text x="250" y="190" font-size="9.5" font-weight="700" fill="#215CAF" text-anchor="middle">Pure Digital ML</text>
<text x="250" y="204" font-size="8" fill="#64748B" text-anchor="middle">LLMs · Vision Classifiers</text>
<text x="250" y="216" font-size="8" fill="#64748B" text-anchor="middle">(No authority, no feedback)</text>
<text x="630" y="190" font-size="9.5" font-weight="700" fill="#A51C30" text-anchor="middle">Open-Loop Actuation</text>
<text x="630" y="204" font-size="8" fill="#64748B" text-anchor="middle">Dumb Relays · Fixed Timers</text>
<text x="630" y="216" font-size="8" fill="#64748B" text-anchor="middle">(No model, no feedback)</text>
<text x="440" y="390" font-size="9.5" font-weight="700" fill="#007A87" text-anchor="middle">Passive Mechanics</text>
<text x="440" y="404" font-size="8" fill="#64748B" text-anchor="middle">Spring-Mass Dampers · Thermal Insulation</text>
<rect x="370" y="120" width="140" height="44" rx="4" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1" filter="url(#shadow)"/>
<text x="440" y="135" font-size="8.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">Digital Autonomous</text>
<text x="440" y="147" font-size="7.5" fill="#475569" text-anchor="middle">High-Freq Algorithmic Trading</text>
<text x="440" y="157" font-size="7.5" fill="#64748B" text-anchor="middle">Cloud Autoscalers (Rollback p=0)</text>
<rect x="210" y="315" width="145" height="44" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1" filter="url(#shadow)"/>
<text x="282" y="330" font-size="8.5" font-weight="700" fill="#D97706" text-anchor="middle">Advisory Decision</text>
<text x="282" y="342" font-size="7.5" fill="#475569" text-anchor="middle">Driver Drowsiness Alert HUD</text>
<text x="282" y="352" font-size="7.5" fill="#64748B" text-anchor="middle">Surgical Diagnostic Guidance</text>
<rect x="525" y="315" width="145" height="44" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.1" filter="url(#shadow)"/>
<text x="597" y="330" font-size="8.5" font-weight="700" fill="#10B981" text-anchor="middle">Classical Control</text>
<text x="597" y="342" font-size="7.5" fill="#475569" text-anchor="middle">1 kHz Quadrotor PID · MPC</text>
<text x="597" y="352" font-size="7.5" fill="#64748B" text-anchor="middle">Watt Governor (Lyapunov Safe)</text>
<rect x="365" y="220" width="150" height="60" rx="6" fill="#1F407A" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
<text x="440" y="240" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1px">PHYSICAL AI</text>
<text x="440" y="256" font-size="8" fill="#E2E8F0" text-anchor="middle">Autonomous Vehicles · Humanoids</text>
<text x="440" y="268" font-size="8" fill="#93C5FD" text-anchor="middle">Dynamic Contact Manipulators</text>
</svg>
