<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .main-title { font-size: 15px; font-weight: 700; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .main-subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .card-hdr { font-size: 12.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .card-subhdr { font-size: 9.5px; font-weight: 600; fill: #F1F5F9; text-anchor: middle; }
      .section-label { font-size: 10px; font-weight: 700; fill: #1F407A; text-transform: uppercase; letter-spacing: 0.5px; }
      .body-text { font-size: 10px; fill: #334155; line-height: 1.4; }
      .body-bold { font-size: 10px; font-weight: 600; fill: #0F172A; }
      .eq-box { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 10px; font-weight: 600; fill: #1E293B; text-anchor: middle; }
      .tag-text { font-size: 9px; font-weight: 700; text-anchor: middle; }
    </style>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#215CAF"/>
    </marker>
    <marker id="arrow-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#A51C30"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="380" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Top Title Header -->
  <text x="480" y="28" class="main-title">THE THREE CANONICAL MACHINE ARCHETYPES OF PHYSICAL AI</text>
  <text x="480" y="45" class="main-subtitle">Distilling Physical Systems by Governing Physics, Bounding Budgets, and Primary Failure Modes</text>

  <!-- ==================== CARD 1: MASS-DOMINATED ==================== -->
  <g transform="translate(30, 65)">
    <!-- Card Container -->
    <rect width="280" height="295" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)"/>
    
    <!-- Card Header Banner -->
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 44 L 0 44 Z" fill="#215CAF"/>
    <text x="140" y="20" class="card-hdr">1. MASS-DOMINATED</text>
    <text x="140" y="35" class="card-subhdr">Mobility &amp; Navigation</text>

    <!-- Schematic Illustration Area -->
    <rect x="12" y="54" width="256" height="74" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <!-- AMR / Vehicle Vector Art -->
    <rect x="35" y="80" width="70" height="26" rx="4" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5"/>
    <circle cx="50" cy="108" r="8" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    <circle cx="90" cy="108" r="8" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    <!-- LiDAR Puck on top -->
    <rect x="62" y="70" width="16" height="10" rx="2" fill="#0284C7"/>
    <!-- Velocity & Distance Arrow -->
    <line x1="115" y1="93" x2="195" y2="93" stroke="#215CAF" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="155" y="86" class="body-bold" fill="#215CAF">v(t), p = mv</text>
    <!-- Obstacle & Clearance Barrier -->
    <line x1="230" y1="65" x2="230" y2="118" stroke="#DC2626" stroke-width="3" stroke-dasharray="4,3"/>
    <text x="230" y="60" class="tag-text" fill="#DC2626">d_clear</text>

    <!-- Governing Equation Container -->
    <rect x="12" y="136" width="256" height="34" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="140" y="157" class="eq-box" fill="#1E40AF">d_stop = v₀ Δt + v₀² / (2 a_max)</text>

    <!-- Systems Characteristics List -->
    <text x="16" y="188" class="body-bold">Exemplars:</text>
    <text x="80" y="188" class="body-text">AMRs, AVs, Drones, Cranes</text>

    <text x="16" y="208" class="body-bold">First Budget:</text>
    <text x="88" y="208" class="body-bold" fill="#1E40AF">Stopping Distance &amp; Freshness</text>

    <text x="16" y="228" class="body-bold">Failure Mode:</text>
    <text x="92" y="228" class="body-text" fill="#DC2626">Kinematic boundary crash</text>

    <text x="16" y="248" class="body-bold">Safety Gate:</text>
    <text x="86" y="248" class="body-text">Real-time dynamic braking referee</text>

    <!-- Key Insight Badge -->
    <rect x="12" y="262" width="256" height="22" rx="4" fill="#F1F5F9"/>
    <text x="140" y="277" class="tag-text" fill="#475569">Delay converts directly to spatial drift (Δx)</text>
  </g>

  <!-- ==================== CARD 2: CONTACT-DOMINATED ==================== -->
  <g transform="translate(340, 65)">
    <!-- Card Container -->
    <rect width="280" height="295" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)"/>
    
    <!-- Card Header Banner -->
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 44 L 0 44 Z" fill="#A51C30"/>
    <text x="140" y="20" class="card-hdr">2. CONTACT-DOMINATED</text>
    <text x="140" y="35" class="card-subhdr">Manipulation &amp; Assembly</text>

    <!-- Schematic Illustration Area -->
    <rect x="12" y="54" width="256" height="74" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Articulated Robot Arm Vector Art -->
    <rect x="25" y="105" width="30" height="12" rx="2" fill="#475569"/>
    <!-- Link 1 -->
    <line x1="40" y1="105" x2="70" y2="72" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <circle cx="70" cy="72" r="5" fill="#A51C30"/>
    <!-- Link 2 -->
    <line x1="70" y1="72" x2="120" y2="85" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    <circle cx="120" cy="85" r="4" fill="#A51C30"/>
    <!-- Gripper / End-Effector -->
    <path d="M 120 85 L 140 85 L 148 78 M 140 85 L 148 92" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Contact Workpiece & Reaction Force Arrow -->
    <rect x="155" y="68" width="20" height="42" rx="2" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
    <line x1="155" y1="85" x2="125" y2="85" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arrow-crimson)"/>
    <text x="210" y="83" class="body-bold" fill="#A51C30">F_c ≈ k_c Δx</text>
    <text x="210" y="97" class="body-bold" fill="#475569">J_ref = N²J_r</text>

    <!-- Governing Equation Container -->
    <rect x="12" y="136" width="256" height="34" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="140" y="157" class="eq-box" fill="#991B1B">F_contact ≈ k_c Δx,  J_ref = N² J_rotor</text>

    <!-- Systems Characteristics List -->
    <text x="16" y="188" class="body-bold">Exemplars:</text>
    <text x="80" y="188" class="body-text">Manipulators, Grippers, Humanoids</text>

    <text x="16" y="208" class="body-bold">First Budget:</text>
    <text x="88" y="208" class="body-bold" fill="#991B1B">Actuator Bandwidth &amp; Gear Stress</text>

    <text x="16" y="228" class="body-bold">Failure Mode:</text>
    <text x="92" y="228" class="body-text" fill="#DC2626">Gear tooth shear, workpiece damage</text>

    <text x="16" y="248" class="body-bold">Safety Gate:</text>
    <text x="86" y="248" class="body-text">Torque clamping &amp; C² jerk profiler</text>

    <!-- Key Insight Badge -->
    <rect x="12" y="262" width="256" height="22" rx="4" fill="#F1F5F9"/>
    <text x="140" y="277" class="tag-text" fill="#475569">Position errors convert to massive forces (k_c)</text>
  </g>

  <!-- ==================== CARD 3: FLOW-DOMINATED ==================== -->
  <g transform="translate(650, 65)">
    <!-- Card Container -->
    <rect width="280" height="295" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)"/>
    
    <!-- Card Header Banner -->
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 44 L 0 44 Z" fill="#D97706"/>
    <text x="140" y="20" class="card-hdr">3. FLOW-DOMINATED</text>
    <text x="140" y="35" class="card-subhdr">Process, Thermal &amp; Energy</text>

    <!-- Schematic Illustration Area -->
    <rect x="12" y="54" width="256" height="74" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Thermal Exchanger / Reactor Chamber Vector Art -->
    <rect x="35" y="66" width="60" height="50" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <!-- Heating / Cooling Coil -->
    <path d="M 45 76 Q 65 72 65 82 Q 65 92 45 96 Q 65 100 85 104" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
    <!-- Inflow / Outflow Pipes -->
    <rect x="15" y="85" width="20" height="12" fill="#CBD5E1" stroke="#64748B"/>
    <rect x="95" y="85" width="20" height="12" fill="#CBD5E1" stroke="#64748B"/>
    <!-- Flow & Heat Transfer Arrows -->
    <line x1="125" y1="91" x2="185" y2="91" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
    <text x="155" y="83" class="body-bold" fill="#D97706">ΔQ = I²R Δt</text>
    <!-- Thermometer / Sensor -->
    <rect x="210" y="70" width="8" height="35" rx="4" fill="#E2E8F0" stroke="#64748B"/>
    <circle cx="214" cy="105" r="7" fill="#DC2626"/>
    <text x="235" y="93" class="tag-text" fill="#DC2626">T_max</text>

    <!-- Governing Equation Container -->
    <rect x="12" y="136" width="256" height="34" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="140" y="157" class="eq-box" fill="#92400E">D ≤ (T_max - T_amb) / (I² R θ_JA)</text>

    <!-- Systems Characteristics List -->
    <text x="16" y="188" class="body-bold">Exemplars:</text>
    <text x="80" y="188" class="body-text">Thermal loops, Inverters, Bioreactors</text>

    <text x="16" y="208" class="body-bold">First Budget:</text>
    <text x="88" y="208" class="body-bold" fill="#92400E">Thermal Capacity &amp; Phase Timing</text>

    <text x="16" y="228" class="body-bold">Failure Mode:</text>
    <text x="92" y="228" class="body-text" fill="#DC2626">Thermal runaway, insulation blowout</text>

    <text x="16" y="248" class="body-bold">Safety Gate:</text>
    <text x="86" y="248" class="body-text">Hardware thermal observer &amp; interlock</text>

    <!-- Key Insight Badge -->
    <rect x="12" y="262" width="256" height="22" rx="4" fill="#F1F5F9"/>
    <text x="140" y="277" class="tag-text" fill="#475569">Joule heating accumulates across duty cycles</text>
  </g>
</svg>