<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">THE THREE TRIBES OF EMBODIED INTELLIGENCE</text>
<text x="440.0" y="44" class="subtitle">Bridging the Disciplinary Divides Between Computer Science, Embedded Systems, and Mechanical Robotics</text>
<rect x="40" y="70" width="360" height="135" rx="8" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="40" y="70" width="360" height="24" rx="8" fill="#215CAF" fill-opacity="0.12"/>
<text x="52" y="86" font-size="9" font-weight="700" fill="#215CAF">TRIBE 1: COMPUTER SCIENCE / AI</text>
<text x="52" y="112" font-size="11" font-weight="700" fill="#1A202C">Maya's Perspective</text>
<text x="52" y="132" font-size="8.5" fill="#475569">• Loss functions · Transformers · Latent world models</text>
<text x="52" y="148" font-size="8.5" fill="#475569">• Python abstractions · Generative policies · Tokenization</text>
<rect x="480" y="70" width="360" height="135" rx="8" fill="#FFFFFF" stroke="#B87333" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="480" y="70" width="360" height="24" rx="8" fill="#B87333" fill-opacity="0.12"/>
<text x="492" y="86" font-size="9" font-weight="700" fill="#B87333">TRIBE 2: EMBEDDED SYSTEMS / ECE</text>
<text x="492" y="112" font-size="11" font-weight="700" fill="#1A202C">Carlos's Perspective</text>
<text x="492" y="132" font-size="8.5" fill="#475569">• Microsecond jitter · DMA memory buses · Interrupt service routines</text>
<text x="492" y="148" font-size="8.5" fill="#475569">• Static SRAM (malloc=0) · Watchdogs · AXI QoS priorities</text>
<rect x="260" y="255" width="360" height="135" rx="8" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="260" y="255" width="360" height="24" rx="8" fill="#A51C30" fill-opacity="0.12"/>
<text x="272" y="271" font-size="9" font-weight="700" fill="#A51C30">TRIBE 3: ROBOTICS &amp; MECHANICS</text>
<text x="272" y="297" font-size="11" font-weight="700" fill="#1A202C">Alex's Perspective</text>
<text x="272" y="317" font-size="8.5" fill="#475569">• Kinetic momentum · Friction cones · Contact compliance</text>
<text x="272" y="333" font-size="8.5" fill="#475569">• Stopping distance d_stop · Gearbox backlash · Dynamic stability</text>
<circle cx="440" cy="205" r="36" fill="#1F407A" stroke="#FFFFFF" stroke-width="3" filter="url(#shadow)"/>
<text x="440" y="201" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">PHYSICAL</text>
<text x="440" y="215" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI</text>
<line x1="380" y1="160" x2="414" y2="187" stroke="#215CAF" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<line x1="500" y1="160" x2="466" y2="187" stroke="#B87333" stroke-width="1.8" marker-end="url(#arr-bronze)"/>
<line x1="440" y1="255" x2="440" y2="241" stroke="#A51C30" stroke-width="1.8" marker-end="url(#arr-crimson)"/>
</svg>
