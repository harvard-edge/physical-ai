<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 276" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .hdr-title { font-size: 12px; font-weight: 800; fill: #1E3A8A; letter-spacing: 0.06em; }
      .badge-text { font-size: 9.5px; font-weight: 800; text-anchor: middle; letter-spacing: 0.04em; }
      .cadence-badge { font-size: 8px; font-weight: 700; font-family: "SFMono-Regular", Consolas, Menlo, monospace; letter-spacing: 0.03em; }
      .card-title { font-size: 9.5px; font-weight: 700; text-anchor: middle; }
      .card-sub { font-size: 8px; text-anchor: middle; font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
      .banner-text { font-size: 9px; font-weight: 700; text-anchor: middle; letter-spacing: 0.02em; }
      .loop-text { font-size: 7.5px; font-weight: 800; fill: #DC2626; font-family: "SFMono-Regular", Consolas, Menlo, monospace; letter-spacing: 0.02em; }
      .boundary-text { font-size: 8px; font-weight: 800; fill: #B91C1C; text-anchor: middle; letter-spacing: 0.05em; }
    </style>
    <filter id="box-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E3A8A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0D9488"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="276" fill="#FFFFFF" rx="6" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Top Title & Chapter Focus Badge -->
  <text x="35" y="24" class="hdr-title">PHYSICAL AI SYSTEMS ARCHITECTURE LOCATOR</text>
  
  <rect x="685" y="10" width="165" height="20" rx="3" fill="#1E3A8A" fill-opacity="0.1" stroke="#1E3A8A" stroke-width="1"/>
  <text x="767.5" y="24" class="badge-text" fill="#1E3A8A">CHAPTER 01 · BOUNDARY</text>

  <!-- Top Tier: System Governance Banner -->
  <rect x="35" y="38" width="815" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#box-shadow)"/>
  <text x="442.5" y="55" class="banner-text" fill="#4F46E5">SYSTEM GOVERNANCE &amp; ASSURANCE [0.1–1 Hz] · Shared Autonomy (§14) · Verification (§15) · Safety Cases (§16) · Frontier Limits (§17)</text>

  <!-- Middle Tier Cadence Label -->
  <text x="850" y="78" class="cadence-badge" fill="#64748B" text-anchor="end">[ SYSTEM 2: 1–50 Hz · STOCHASTIC DELIBERATION ]</text>

  <!-- 5 Stochastic Deliberation Cards -->
  <!-- Card 1: Data -->
  <rect x="35" y="84" width="155" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#box-shadow)"/>
  <text x="112.5" y="101" class="card-title" fill="#0F172A">DATA &amp; INGESTION</text>
  <text x="112.5" y="116" class="card-sub" fill="#475569">Demos &amp; Wear (§05)</text>

  <line x1="190" y1="105" x2="198" y2="105" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Card 2: Perception -->
  <rect x="200" y="84" width="155" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#box-shadow)"/>
  <text x="277.5" y="101" class="card-title" fill="#0F172A">SPATIAL PERCEPTION</text>
  <text x="277.5" y="116" class="card-sub" fill="#475569">o_t → Tokens z_t (§08)</text>

  <line x1="355" y1="105" x2="363" y2="105" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Card 3: Memory -->
  <rect x="365" y="84" width="155" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#box-shadow)"/>
  <text x="442.5" y="101" class="card-title" fill="#0F172A">TEMPORAL MEMORY</text>
  <text x="442.5" y="116" class="card-sub" fill="#475569">z_t → Belief b_t (§09)</text>

  <line x1="520" y1="105" x2="528" y2="105" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Card 4: Intent -->
  <rect x="530" y="84" width="155" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#box-shadow)"/>
  <text x="607.5" y="101" class="card-title" fill="#0F172A">INTENT &amp; GOALS</text>
  <text x="607.5" y="116" class="card-sub" fill="#475569">b_t → Lease L_t (§10)</text>

  <line x1="685" y1="105" x2="693" y2="105" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Card 5: Planning -->
  <rect x="695" y="84" width="155" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#box-shadow)"/>
  <text x="772.5" y="101" class="card-title" fill="#0F172A">TRAJECTORY PLANNER</text>
  <text x="772.5" y="116" class="card-sub" fill="#475569">L_t → Chunk û_t:t+H (§11)</text>

  <!-- Proposal-Permission Privilege Boundary Line -->
  <line x1="35" y1="139" x2="850" y2="139" stroke="#DC2626" stroke-dasharray="5,4" stroke-width="1.6"/>
  <rect x="235" y="130" width="410" height="18" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="440" y="142.5" class="boundary-text">PROPOSAL–PERMISSION PRIVILEGE BOUNDARY (GATED WRITE û → u*)</text>

  <!-- System 1 Real-Time Cadence Label -->
  <text x="850" y="157" class="cadence-badge" fill="#0D9488" text-anchor="end">[ SYSTEM 1: 1000 Hz · &lt;1 ms HARD REAL-TIME ]</text>

  <!-- System 1 Reflex Cards -->
  <rect x="35" y="163" width="470" height="44" rx="4" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" filter="url(#box-shadow)"/>
  <text x="270" y="180" class="card-title" fill="#0F766E">1 kHz REFLEX ENFORCER (§12)</text>
  <text x="270" y="196" class="card-sub" fill="#334155">Control Barrier Filter (h(x) ≥ 0) → Certified u* (PWM Compare)</text>

  <rect x="515" y="163" width="335" height="44" rx="4" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" filter="url(#box-shadow)"/>
  <text x="682.5" y="180" class="card-title" fill="#0F766E">SILICON PLACEMENT &amp; BUS QoS (§13)</text>
  <text x="682.5" y="196" class="card-sub" fill="#334155">Crossbar QoS · SRAM Seqlock · Hardware Timers</text>

  <!-- Bottom Tier: The Physical Plant (Body) - Highlighted for Chapter 1 Focus -->
  <rect x="35" y="217" width="815" height="46" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8" filter="url(#box-shadow)"/>
  <rect x="35" y="217" width="815" height="3" fill="#DC2626"/>
  <text x="442.5" y="235" class="card-title" fill="#B91C1C">THE PHYSICAL PLANT (THE BODY) · Matter, Momentum, Friction &amp; Thermal Limits (§01, §02)</text>
  <text x="442.5" y="251" class="card-sub" fill="#475569">Causal Boundary (10–20 kHz Inverter) · Stopping Envelope (d_stop ≤ d_clear) · Sim-to-Real Reality Gap (§06, §07)</text>

  <!-- Closed Causal Feedback Arrow -->
  <path d="M 35 240 L 15 240 L 15 105 L 31 105" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-crimson)"/>
  <text x="21" y="172" class="loop-text" transform="rotate(-90 21,172)" text-anchor="middle">ENDOGENOUS SENSORY SHIFT (o_t+1)</text>
</svg>