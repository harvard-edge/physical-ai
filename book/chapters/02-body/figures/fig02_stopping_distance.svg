<text x="480.0" y="28" class="title">DEFENDED DYNAMIC STOPPING ENVELOPE: REACTION LAG VS. KINETIC BRAKING</text>
<text x="480.0" y="45" class="subtitle">Linear Sensitivity to Computational Latency vs. Quadratic Sensitivity to Velocity: d_stop(v₀, Δt) = v₀Δt + v₀²/(2a) + δ_overhead ≤ D_clear</text>
<rect x="20" y="60" width="920" height="75" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
<rect x="30" y="68" width="296.6666666666667" height="59" rx="4" fill="#215CAF" fill-opacity="0.08" stroke="#215CAF" stroke-width="1"/>
<text x="178.33333333333334" y="86" font-size="10.5" font-weight="700" fill="#215CAF" text-anchor="middle">1. LINEAR REACTION TRAVEL</text>
<text x="178.33333333333334" y="102" font-size="11.5" font-weight="700" fill="#1A202C" text-anchor="middle">d_react = v₀ · Δt_delay</text>
<text x="178.33333333333334" y="116" font-size="8" fill="#64748B" text-anchor="middle">Unguided coasting during compute latency</text>
<rect x="331.6666666666667" y="68" width="296.6666666666667" height="59" rx="4" fill="#B87333" fill-opacity="0.08" stroke="#B87333" stroke-width="1"/>
<text x="480.0" y="86" font-size="10.5" font-weight="700" fill="#B87333" text-anchor="middle">2. QUADRATIC BRAKING DISTANCE</text>
<text x="480.0" y="102" font-size="11.5" font-weight="700" fill="#1A202C" text-anchor="middle">d_brake = v₀² / (2 · a_brake)</text>
<text x="480.0" y="116" font-size="8" fill="#64748B" text-anchor="middle">Work-energy dissipation: E_k = ½ m v₀²</text>
<rect x="633.3333333333334" y="68" width="296.6666666666667" height="59" rx="4" fill="#007A87" fill-opacity="0.08" stroke="#007A87" stroke-width="1"/>
<text x="781.6666666666667" y="86" font-size="10.5" font-weight="700" fill="#007A87" text-anchor="middle">3. MAX PERMITTED VELOCITY</text>
<text x="781.6666666666667" y="102" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">v_max = -aΔt + √((aΔt)² + 2aD_avail)</text>
<text x="781.6666666666667" y="116" font-size="8" fill="#64748B" text-anchor="middle">Defended clearance bound: d_stop ≤ D_clear</text>
