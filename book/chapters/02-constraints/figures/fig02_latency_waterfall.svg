<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="auto" role="img" aria-label="The 7-Stage Sense-to-Actuation Latency Waterfall: P50 Nominal vs P99 Tail Contention">
  <defs>
    <style>
      .main-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1F407A; letter-spacing: 0.5px; }
      .main-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
      .stage-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #1E293B; }
      .stage-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #64748B; }
      .bar-p50 { fill: #2563EB; }
      .bar-p99-add { fill: #E11D48; }
      .timing-lbl { font-family: 'SF Mono', Menlo, monospace; font-size: 9.5px; font-weight: 700; }
      .summary-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .summary-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .deadline-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; fill: #A51C30; }
    </style>
  </defs>

  <!-- Background Surface -->
  <rect width="960" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Top Title Banner -->
  <rect x="20" y="12" width="920" height="40" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
  <text class="main-title" x="480" y="29" text-anchor="middle">THE 7-STAGE SENSE-TO-ACTUATION LATENCY WATERFALL</text>
  <text class="main-sub" x="480" y="43" text-anchor="middle">Deconstructing where time is lost: Nominal P50 (52.2 ms) vs. P99 Latency Tail Blowout (126.0 ms) Breaching World Deadlines</text>

  <!-- ================= WATERFALL STAGES (7 COLUMNS) ================= -->
  <g transform="translate(20, 62)">
    <!-- Stage 1: Transduction -->
    <g transform="translate(0, 0)">
      <rect width="124" height="230" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text class="stage-hdr" x="62" y="18" text-anchor="middle">1. Transduction</text>
      <text class="stage-sub" x="62" y="30" text-anchor="middle">Photon / Exposure</text>
      <!-- Bars -->
      <rect x="20" y="130" width="36" height="50" rx="3" class="bar-p50"/>
      <text class="timing-lbl" x="38" y="122" text-anchor="middle" fill="#2563EB">8.0ms</text>
      <rect x="68" y="75" width="36" height="105" rx="3" class="bar-p99-add"/>
      <text class="timing-lbl" x="86" y="67" text-anchor="middle" fill="#E11D48">16.5ms</text>
      <text class="stage-sub" x="62" y="200" text-anchor="middle">Rolling shutter</text>
      <text class="stage-sub" x="62" y="214" text-anchor="middle">Integration time</text>
    </g>

    <!-- Stage 2: Transport & DMA -->
    <g transform="translate(132, 0)">
      <rect width="124" height="230" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text class="stage-hdr" x="62" y="18" text-anchor="middle">2. DMA Transport</text>
      <text class="stage-sub" x="62" y="30" text-anchor="middle">MIPI CSI-2 Deserializer</text>
      <!-- Bars -->
      <rect x="20" y="153" width="36" height="27" rx="3" class="bar-p50"/>
      <text class="timing-lbl" x="38" y="145" text-anchor="middle" fill="#2563EB">4.2ms</text>
      <rect x="68" y="90" width="36" height="90" rx="3" class="bar-p99-add"/>
      <text class="timing-lbl" x="86" y="82" text-anchor="middle" fill="#E11D48">14.0ms</text>
      <text class="stage-sub" x="62" y="200" text-anchor="middle">LPDDR5 memory bus</text>
      <text class="stage-sub" x="62" y="214" text-anchor="middle">DMA buffer copies</text>
    </g>

    <!-- Stage 3: Spatial Tokens -->
    <g transform="translate(264, 0)">
      <rect width="124" height="230" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text class="stage-hdr" x="62" y="18" text-anchor="middle">3. Perception</text>
      <text class="stage-sub" x="62" y="30" text-anchor="middle">ViT Spatial Tokens</text>
      <!-- Bars -->
      <rect x="20" y="125" width="36" height="55" rx="3" class="bar-p50"/>
      <text class="timing-lbl" x="38" y="117" text-anchor="middle" fill="#2563EB">12.0ms</text>
      <rect x="68" y="70" width="36" height="110" rx="3" class="bar-p99-add"/>
      <text class="timing-lbl" x="86" y="62" text-anchor="middle" fill="#E11D48">25.0ms</text>
      <text class="stage-sub" x="62" y="200" text-anchor="middle">3D affordances</text>
      <text class="stage-sub" x="62" y="214" text-anchor="middle">SE(3) projection</text>
    </g>

    <!-- Stage 4: Neural Policy Inference -->
    <g transform="translate(396, 0)">
      <rect width="128" height="230" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
      <text class="stage-hdr" x="64" y="18" text-anchor="middle" fill="#1D4ED8">4. Policy Inference</text>
      <text class="stage-sub" x="64" y="30" text-anchor="middle" fill="#2563EB">Diffusion / ACT Model</text>
      <!-- Bars -->
      <rect x="22" y="100" width="36" height="80" rx="3" class="bar-p50"/>
      <text class="timing-lbl" x="40" y="92" text-anchor="middle" fill="#2563EB">22.0ms</text>
      <rect x="70" y="60" width="36" height="120" rx="3" class="bar-p99-add"/>
      <text class="timing-lbl" x="88" y="52" text-anchor="middle" fill="#E11D48">60.0ms</text>
      <text class="stage-sub" x="64" y="200" text-anchor="middle">NPU compute stall</text>
      <text class="stage-sub" x="64" y="214" text-anchor="middle">Weight bus contention</text>
    </g>

    <!-- Stage 5: SRAM IPC -->
    <g transform="translate(532, 0)">
      <rect width="124" height="230" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text class="stage-hdr" x="62" y="18" text-anchor="middle">5. Inter-Core IPC</text>
      <text class="stage-sub" x="62" y="30" text-anchor="middle">Shared SRAM Mailbox</text>
      <!-- Bars -->
      <rect x="20" y="176" width="36" height="4" rx="2" class="bar-p50"/>
      <text class="timing-lbl" x="38" y="168" text-anchor="middle" fill="#2563EB">0.5ms</text>
      <rect x="68" y="152" width="36" height="28" rx="3" class="bar-p99-add"/>
      <text class="timing-lbl" x="86" y="144" text-anchor="middle" fill="#E11D48">4.5ms</text>
      <text class="stage-sub" x="62" y="200" text-anchor="middle">Seqlock copy</text>
      <text class="stage-sub" x="62" y="214" text-anchor="middle">Lock-free mailbox</text>
    </g>

    <!-- Stage 6: Safety Barrier Reflex -->
    <g transform="translate(664, 0)">
      <rect width="124" height="230" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
      <text class="stage-hdr" x="62" y="18" text-anchor="middle" fill="#047857">6. Safety Reflex</text>
      <text class="stage-sub" x="62" y="30" text-anchor="middle" fill="#059669">1000 Hz MCU (CBF QP)</text>
      <!-- Bars -->
      <rect x="20" y="176" width="36" height="4" rx="2" class="bar-p50"/>
      <text class="timing-lbl" x="38" y="168" text-anchor="middle" fill="#2563EB">0.5ms</text>
      <rect x="68" y="173" width="36" height="7" rx="2" class="bar-p99-add"/>
      <text class="timing-lbl" x="86" y="165" text-anchor="middle" fill="#E11D48">1.0ms</text>
      <text class="stage-sub" x="62" y="200" text-anchor="middle">QP solve &lt; 65 μs</text>
      <text class="stage-sub" x="62" y="214" text-anchor="middle">Deterministic slack</text>
    </g>

    <!-- Stage 7: Electromagnetic & Motor Rise Time -->
    <g transform="translate(796, 0)">
      <rect width="124" height="230" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text class="stage-hdr" x="62" y="18" text-anchor="middle">7. Motor Torque</text>
      <text class="stage-sub" x="62" y="30" text-anchor="middle">L/R Rise Time</text>
      <!-- Bars -->
      <rect x="20" y="148" width="36" height="32" rx="3" class="bar-p50"/>
      <text class="timing-lbl" x="38" y="140" text-anchor="middle" fill="#2563EB">5.0ms</text>
      <rect x="68" y="95" width="36" height="85" rx="3" class="bar-p99-add"/>
      <text class="timing-lbl" x="86" y="87" text-anchor="middle" fill="#E11D48">13.5ms</text>
      <text class="stage-sub" x="62" y="200" text-anchor="middle">Inductive delay</text>
      <text class="stage-sub" x="62" y="214" text-anchor="middle">Inverter PWM latch</text>
    </g>
  </g>

  <!-- ================= COMPARATIVE TOTAL BAR & WORLD DEADLINE ================= -->
  <g transform="translate(20, 305)">
    <rect width="920" height="180" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    
    <!-- Legend -->
    <g transform="translate(14, 12)">
      <rect x="0" y="0" width="14" height="14" rx="2" class="bar-p50"/>
      <text class="stage-hdr" x="20" y="11" fill="#2563EB">P50 Nominal Execution</text>
      
      <rect x="180" y="0" width="14" height="14" rx="2" class="bar-p99-add"/>
      <text class="stage-hdr" x="200" y="11" fill="#E11D48">P99 Contention &amp; Jitter Tail Blowout</text>
      
      <line x1="450" y1="7" x2="480" y2="7" stroke="#A51C30" stroke-width="2" stroke-dasharray="4,3"/>
      <text class="deadline-txt" x="488" y="11">Physical World Stability Deadline (τ_world = 80.0 ms)</text>
    </g>

    <!-- Cumulative Bars Grid -->
    <g transform="translate(14, 38)">
      <!-- P50 Bar -->
      <text class="stage-hdr" x="0" y="20" fill="#2563EB">P50 Total:</text>
      <rect x="80" y="6" width="310" height="22" rx="4" fill="#2563EB"/>
      <text class="timing-lbl" x="400" y="22" fill="#2563EB">52.2 ms  (Margin: +27.8 ms)</text>

      <!-- P99 Bar -->
      <text class="stage-hdr" x="0" y="55" fill="#E11D48">P99 Total:</text>
      <rect x="80" y="41" width="670" height="22" rx="4" fill="#E11D48"/>
      <text class="timing-lbl" x="760" y="57" fill="#E11D48">126.0 ms  (BREACH!)</text>

      <!-- 80ms Deadline Mark -->
      <line x1="510" y1="-5" x2="510" y2="70" stroke="#A51C30" stroke-width="2" stroke-dasharray="4,3"/>
      <rect x="460" y="74" width="100" height="18" rx="3" fill="#FEF2F2" stroke="#A51C30" stroke-width="1"/>
      <text class="deadline-txt" x="510" y="87" text-anchor="middle" font-size="9px">τ_world = 80.0 ms</text>
    </g>

    <!-- Bottom Verdict Text (Multi-line) -->
    <text class="summary-txt" x="14" y="148">
      <tspan x="14" dy="0"><tspan font-weight="700" fill="#A51C30">Systems Insight:</tspan> While mean latency (<tspan font-style="italic">P50 = 52.2 ms</tspan>) sits comfortably within stability margins, real-world memory crossbar contention</tspan>
      <tspan x="14" dy="14">and OS thread preemption inflate <tspan font-style="italic">P99</tspan> to <tspan font-weight="700" fill="#E11D48">126.0 ms</tspan>, breaching the physical deadline and forcing open-loop drift unless arrested by a 1 kHz MCU safety reflex.</tspan>
    </text>
  </g>
</svg>
