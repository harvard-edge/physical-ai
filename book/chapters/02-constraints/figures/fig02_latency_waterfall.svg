<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 700; fill: #1F407A; }
      .subtitle { font-size: 13px; fill: #555555; }
      .bar-label { font-size: 14px; font-weight: 700; fill: #222222; }
      .stage-text { font-size: 11px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .stage-sub { font-size: 10px; fill: #FFFFFF; text-anchor: middle; opacity: 0.9; }
      .axis-text { font-size: 11px; fill: #666666; text-anchor: middle; }
      .legend-text { font-size: 12px; fill: #333333; }
      .callout-title { font-size: 12px; font-weight: 700; }
      .callout-body { font-size: 11px; fill: #444444; }
    </style>
    <linearGradient id="grad-trans" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2B6CB0"/><stop offset="100%" stop-color="#1A4971"/></linearGradient>
    <linearGradient id="grad-dma" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#319795"/><stop offset="100%" stop-color="#234E52"/></linearGradient>
    <linearGradient id="grad-perc" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A5568"/><stop offset="100%" stop-color="#2D3748"/></linearGradient>
    <linearGradient id="grad-plan" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D69E2E"/><stop offset="100%" stop-color="#975A16"/></linearGradient>
    <linearGradient id="grad-ipc" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#805AD5"/><stop offset="100%" stop-color="#553C9A"/></linearGradient>
    <linearGradient id="grad-enf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38A169"/><stop offset="100%" stop-color="#22543D"/></linearGradient>
    <linearGradient id="grad-act" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E53E3E"/><stop offset="100%" stop-color="#9B2C2C"/></linearGradient>
  </defs>

  <!-- Header Banner -->
  <rect x="40" y="20" width="920" height="55" rx="8" fill="#F0F4FA" stroke="#D0DDF0" stroke-width="1.5"/>
  <text x="500" y="43" text-anchor="middle" class="title">THE SENSE-TO-ACTUATION TIMELINE WATERFALL</text>
  <text x="500" y="62" text-anchor="middle" class="subtitle">Tracking Physical Transduction, Memory Buses, Neural Computation, Safety Veto, and Coil Dynamics</text>

  <!-- Time Axis Grid Lines (Scale: 1 ms = 5.5 px, origin at x = 140) -->
  <!-- 0ms -> 140, 20ms -> 250, 40ms -> 360, 60ms -> 470, 80ms -> 580, 100ms -> 690, 120ms -> 800, 140ms -> 910 -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3">
    <line x1="140" y1="95" x2="140" y2="360" stroke="#CBD5E0" stroke-dasharray="none"/>
    <line x1="250" y1="95" x2="250" y2="360"/>
    <line x1="360" y1="95" x2="360" y2="360"/>
    <line x1="470" y1="95" x2="470" y2="360"/>
    <line x1="580" y1="95" x2="580" y2="360" stroke="#E53E3E" stroke-width="2" stroke-dasharray="5,4"/>
    <line x1="690" y1="95" x2="690" y2="360"/>
    <line x1="800" y1="95" x2="800" y2="360"/>
    <line x1="910" y1="95" x2="910" y2="360"/>
  </g>

  <!-- World Deadline Marker -->
  <rect x="515" y="90" width="130" height="22" rx="4" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.2"/>
  <text x="580" y="105" text-anchor="middle" fill="#C53030" font-size="11" font-weight="700">Physical Deadline: 80 ms</text>

  <!-- Axis Labels -->
  <text x="140" y="378" class="axis-text">0 ms</text>
  <text x="250" y="378" class="axis-text">20 ms</text>
  <text x="360" y="378" class="axis-text">40 ms</text>
  <text x="470" y="378" class="axis-text">60 ms</text>
  <text x="580" y="378" class="axis-text" fill="#C53030" font-weight="700">80 ms (Limit)</text>
  <text x="690" y="378" class="axis-text">100 ms</text>
  <text x="800" y="378" class="axis-text">120 ms</text>
  <text x="910" y="378" class="axis-text">140 ms</text>
  <text x="500" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5568">Sense-to-Actuation Physical Elapsed Time (t)</text>

  <!-- ROW 1: NOMINAL PATH (P50 = 52.2 ms) -->
  <text x="130" y="145" text-anchor="end" class="bar-label">Nominal Path</text>
  <text x="130" y="162" text-anchor="end" font-size="11" fill="#276749" font-weight="700">P₅₀: 52.2 ms</text>

  <!-- Segments P50:
       1. Transduce: 8ms  -> 8 * 5.5 = 44px (x: 140 -> 184)
       2. DMA Ingest: 3ms -> 3 * 5.5 = 16.5px (x: 184 -> 200.5)
       3. Perceive: 12ms -> 12 * 5.5 = 66px (x: 200.5 -> 266.5)
       4. Policy: 22ms   -> 22 * 5.5 = 121px (x: 266.5 -> 387.5)
       5. IPC: 0.8ms     -> 0.8 * 5.5 = 4.4px (x: 387.5 -> 391.9)
       6. Enforce: 0.4ms -> 0.4 * 5.5 = 2.2px (x: 391.9 -> 394.1)
       7. Actuator: 6ms  -> 6 * 5.5 = 33px (x: 394.1 -> 427.1, total 52.2 ms)
  -->
  <g>
    <!-- 1. Transduce -->
    <rect x="140" y="130" width="44" height="44" fill="url(#grad-trans)" rx="4" stroke="#FFFFFF" stroke-width="1"/>
    <text x="162" y="152" class="stage-text">Trans</text>
    <text x="162" y="165" class="stage-sub">8ms</text>

    <!-- 2. DMA -->
    <rect x="184" y="130" width="18" height="44" fill="url(#grad-dma)" rx="3" stroke="#FFFFFF" stroke-width="1"/>

    <!-- 3. Perceive -->
    <rect x="202" y="130" width="66" height="44" fill="url(#grad-perc)" rx="4" stroke="#FFFFFF" stroke-width="1"/>
    <text x="235" y="152" class="stage-text">Perceive</text>
    <text x="235" y="165" class="stage-sub">12ms</text>

    <!-- 4. Policy -->
    <rect x="268" y="130" width="121" height="44" fill="url(#grad-plan)" rx="4" stroke="#FFFFFF" stroke-width="1"/>
    <text x="328" y="152" class="stage-text">Neural Policy</text>
    <text x="328" y="165" class="stage-sub">22ms</text>

    <!-- 5 & 6. IPC + Enforce -->
    <rect x="389" y="130" width="14" height="44" fill="url(#grad-enf)" rx="3" stroke="#FFFFFF" stroke-width="1"/>

    <!-- 7. Actuator -->
    <rect x="403" y="130" width="33" height="44" fill="url(#grad-act)" rx="4" stroke="#FFFFFF" stroke-width="1"/>
    <text x="419" y="152" class="stage-text">Coil</text>
    <text x="419" y="165" class="stage-sub">6ms</text>

    <!-- Stability Margin Bracket -->
    <rect x="438" y="136" width="140" height="32" rx="4" fill="#F0FFF4" stroke="#38A169" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="508" y="156" text-anchor="middle" fill="#22543D" font-size="11" font-weight="700">✓ Safe Margin (+27.8 ms)</text>
  </g>

  <!-- ROW 2: TAIL CONTENTION PATH (P99 = 126.0 ms) -->
  <text x="130" y="255" text-anchor="end" class="bar-label">Tail Contention</text>
  <text x="130" y="272" text-anchor="end" font-size="11" fill="#C53030" font-weight="700">P₉₉: 126.0 ms</text>

  <!-- Segments P99:
       1. Transduce: 15ms -> 15 * 5.5 = 82.5px (x: 140 -> 222.5)
       2. DMA Ingest: 8ms -> 8 * 5.5 = 44px (x: 222.5 -> 266.5) [Contention]
       3. Perceive: 25ms  -> 25 * 5.5 = 137.5px (x: 266.5 -> 404)
       4. Policy: 60ms    -> 60 * 5.5 = 330px (x: 404 -> 734) [Model Jitter]
       5. IPC: 2.0ms      -> 2 * 5.5 = 11px (x: 734 -> 745)
       6. Enforce: 1.0ms  -> 1 * 5.5 = 5.5px (x: 745 -> 750.5)
       7. Actuator: 15ms  -> 15 * 5.5 = 82.5px (x: 750.5 -> 833, total 126.0 ms)
  -->
  <g>
    <!-- 1. Transduce -->
    <rect x="140" y="240" width="82" height="44" fill="url(#grad-trans)" rx="4" stroke="#FFFFFF" stroke-width="1"/>
    <text x="181" y="262" class="stage-text">Transduce</text>
    <text x="181" y="275" class="stage-sub">15ms (Low Lux)</text>

    <!-- 2. DMA Contention -->
    <rect x="222" y="240" width="44" height="44" fill="url(#grad-dma)" rx="4" stroke="#FFFFFF" stroke-width="1"/>
    <text x="244" y="262" class="stage-text">DMA</text>
    <text x="244" y="275" class="stage-sub">8ms</text>

    <!-- 3. Perceive -->
    <rect x="266" y="240" width="138" height="44" fill="url(#grad-perc)" rx="4" stroke="#FFFFFF" stroke-width="1"/>
    <text x="335" y="262" class="stage-text">Perception Tokenization</text>
    <text x="335" y="275" class="stage-sub">25ms (Crossbar Stall)</text>

    <!-- 4. Policy -->
    <rect x="404" y="240" width="330" height="44" fill="url(#grad-plan)" rx="4" stroke="#FFFFFF" stroke-width="1"/>
    <text x="569" y="262" class="stage-text">Neural Policy Decoding (Diffusion / ACT Horizon)</text>
    <text x="569" y="275" class="stage-sub">60ms (NPU Memory Stall &amp; Scheduling Tail)</text>

    <!-- 5 & 6. IPC + Enforce -->
    <rect x="734" y="240" width="16" height="44" fill="url(#grad-enf)" rx="3" stroke="#FFFFFF" stroke-width="1"/>

    <!-- 7. Actuator -->
    <rect x="750" y="240" width="83" height="44" fill="url(#grad-act)" rx="4" stroke="#FFFFFF" stroke-width="1"/>
    <text x="791" y="262" class="stage-text">Stator Rise</text>
    <text x="791" y="275" class="stage-sub">15ms (Inductance)</text>

    <!-- Failure Zone Shading -->
    <rect x="580" y="230" width="270" height="64" rx="6" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.5" fill-opacity="0.35" stroke-dasharray="4,3"/>
    <text x="715" y="222" text-anchor="middle" fill="#C53030" font-size="12" font-weight="800">⚠️ DEADLINE BREACH (+46.0 ms Phase Lag)</text>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(50, 425)">
    <rect x="0" y="0" width="900" height="42" rx="6" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <rect x="20" y="15" width="14" height="14" rx="2" fill="url(#grad-trans)"/>
    <text x="38" y="26" class="legend-text">1. Transduce</text>

    <rect x="130" y="15" width="14" height="14" rx="2" fill="url(#grad-dma)"/>
    <text x="148" y="26" class="legend-text">2. DMA Bus</text>

    <rect x="240" y="15" width="14" height="14" rx="2" fill="url(#grad-perc)"/>
    <text x="258" y="26" class="legend-text">3. Perception</text>

    <rect x="360" y="15" width="14" height="14" rx="2" fill="url(#grad-plan)"/>
    <text x="378" y="26" class="legend-text">4. Neural Policy</text>

    <rect x="500" y="15" width="14" height="14" rx="2" fill="url(#grad-ipc)"/>
    <text x="518" y="26" class="legend-text">5. IPC Mailbox</text>

    <rect x="630" y="15" width="14" height="14" rx="2" fill="url(#grad-enf)"/>
    <text x="648" y="26" class="legend-text">6. 1kHz Enforce</text>

    <rect x="760" y="15" width="14" height="14" rx="2" fill="url(#grad-act)"/>
    <text x="778" y="26" class="legend-text">7. Stator Rise</text>
  </g>
</svg>