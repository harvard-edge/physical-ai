<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">HARDWARE-TRIGGERED SENSE-TO-ACTUATION METROLOGY</text>
<text x="440.0" y="44" class="subtitle">End-to-End Latency Instrumentation: Optical LED Flash ⟶ Oscilloscope Digital Logic Analyzer</text>
<rect x="30" y="70" width="230" height="320" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="30" y="70" width="230" height="24" rx="8" fill="#D97706" fill-opacity="0.12"/>
<text x="145.0" y="86" font-size="9.5" font-weight="700" fill="#D97706" text-anchor="middle">1. HARDWARE STIMULUS</text>
<text x="44" y="115" font-size="10.5" font-weight="700" fill="#1A202C">High-Speed LED Target</text>
<text x="44" y="132" font-size="8.5" fill="#475569">• 100 ns rise-time pulsed LED</text>
<text x="44" y="148" font-size="8.5" fill="#475569">• Microcontroller hardware strobe</text>
<text x="44" y="164" font-size="8.5" fill="#475569">• Emits pulse at precise t_0</text>
<text x="44" y="180" font-size="8.5" fill="#475569">• CH1 Trigger on oscilloscope</text>
<circle cx="145.0" cy="260" r="30" fill="#D97706" fill-opacity="0.15" stroke="#D97706" stroke-width="2"/>
<text x="145.0" y="264" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">LED FLASH</text>
<text x="145.0" y="360" font-size="9" font-weight="600" fill="#1A202C" text-anchor="middle">t₀ = 0.000 ms</text>
<rect x="290" y="70" width="300" height="320" rx="8" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="290" y="70" width="300" height="24" rx="8" fill="#1F407A" fill-opacity="0.12"/>
<text x="440.0" y="86" font-size="9.5" font-weight="700" fill="#1F407A" text-anchor="middle">2. PHYSICAL AI AGENT (DUT)</text>
<rect x="302" y="105" width="276" height="38" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="310" y="121" font-size="9" font-weight="700" fill="#1F407A">Camera CMOS Sensor Exposure</text>
<text x="310" y="135" font-size="8" fill="#475569">MIPI CSI-2 transfer: 16.6 ms</text>
<rect x="302" y="150" width="276" height="38" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="310" y="166" font-size="9" font-weight="700" fill="#215CAF">Vision Tokenizer &amp; VLM Planning</text>
<text x="310" y="180" font-size="8" fill="#475569">Neural model inference: 28.4 ms</text>
<rect x="302" y="195" width="276" height="38" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="310" y="211" font-size="9" font-weight="700" fill="#B87333">Shared Memory TCM IPC Transfer</text>
<text x="310" y="225" font-size="8" fill="#475569">Lock-free seqlock: 0.12 ms</text>
<rect x="302" y="240" width="276" height="38" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="310" y="256" font-size="9" font-weight="700" fill="#007A87">MCU 1 kHz Barrier QP Enforcer</text>
<text x="310" y="270" font-size="8" fill="#475569">Active-set safety filter: 0.18 ms</text>
<rect x="302" y="285" width="276" height="38" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="310" y="301" font-size="9" font-weight="700" fill="#A51C30">PWM Gate Driver Motor Stage</text>
<text x="310" y="315" font-size="8" fill="#475569">Current loop response: 0.85 ms</text>
<text x="440.0" y="350" font-size="9.5" font-weight="700" fill="#1F407A" text-anchor="middle">GPIO Toggle Pin at Motor Step</text>
<text x="440.0" y="365" font-size="9" fill="#64748B" text-anchor="middle">CH2 Input on oscilloscope</text>
<rect x="620" y="70" width="230" height="320" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="620" y="70" width="230" height="24" rx="8" fill="#10B981" fill-opacity="0.12"/>
<text x="735.0" y="86" font-size="9.5" font-weight="700" fill="#10B981" text-anchor="middle">3. RIGOROUS METROLOGY</text>
<text x="634" y="115" font-size="10.5" font-weight="700" fill="#1A202C">Digital Storage Scope</text>
<text x="634" y="132" font-size="8.5" fill="#475569">• 1 GSa/s hardware timebase</text>
<text x="634" y="148" font-size="8.5" fill="#475569">• True photon-to-torque wall clock</text>
<text x="634" y="164" font-size="8.5" fill="#475569">• Zero software logging jitter</text>
<text x="634" y="180" font-size="8.5" fill="#475569">• Captures P99.9 tail distribution</text>
<rect x="635" y="210" width="200" height="100" rx="4" fill="#1A202C" stroke="#94A3B8" stroke-width="1"/>
<line x1="645" y1="240" x2="690" y2="240" stroke="#D97706" stroke-width="1.5"/>
<line x1="690" y1="240" x2="690" y2="225" stroke="#D97706" stroke-width="1.5"/>
<line x1="690" y1="225" x2="825" y2="225" stroke="#D97706" stroke-width="1.5"/>
<text x="650" y="235" font-size="7.5" font-weight="700" fill="#D97706">CH1 (LED)</text>
<line x1="645" y1="285" x2="780" y2="285" stroke="#10B981" stroke-width="1.5"/>
<line x1="780" y1="285" x2="780" y2="270" stroke="#10B981" stroke-width="1.5"/>
<line x1="780" y1="270" x2="825" y2="270" stroke="#10B981" stroke-width="1.5"/>
<text x="650" y="280" font-size="7.5" font-weight="700" fill="#10B981">CH2 (Torque)</text>
<line x1="690" y1="295" x2="780" y2="295" stroke="#FFFFFF" stroke-width="1" marker-start="url(#arr-teal)" marker-end="url(#arr-teal)"/>
<text x="735" y="306" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">Δt_wall = 46.15 ms</text>
<text x="735.0" y="360" font-size="9" font-weight="600" fill="#1A202C" text-anchor="middle">True Wall Latency</text>
<line x1="260" y1="230" x2="290" y2="230" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-bronze)"/>
<line x1="590" y1="230" x2="620" y2="230" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-navy)"/>
