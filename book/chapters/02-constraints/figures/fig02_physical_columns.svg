<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="900" height="460" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="450.0" y="28" class="title">THE FIVE PHYSICAL COLUMNS OF EMBODIED INTELLIGENCE</text>
<text x="450.0" y="44" class="subtitle">The Fundamental Physical Bounds Governing Every Closed-Loop Cyber-Physical System</text>
<rect x="27.0" y="66" width="158" height="330" rx="6" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="27.0" y="66" width="158" height="22" rx="6" fill="#1F407A" fill-opacity="0.12"/>
<text x="106.0" y="81" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="middle">COLUMN 1</text>
<text x="106.0" y="104" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">TIME </text>
<text x="106.0" y="116" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">&amp;  FRESHNESS</text>
<text x="106.0" y="130" font-size="8" fill="#64748B" text-anchor="middle">τ_world Latency Bounds</text>
<text x="35.0" y="144" font-size="8" fill="#475569">• Sense-to-actuation delay Δt</text>
<text x="35.0" y="164" font-size="8" fill="#475569">• P99.9 tail latency freshness</text>
<text x="35.0" y="184" font-size="8" fill="#475569">• Stale observations cause drift</text>
<text x="35.0" y="204" font-size="8" fill="#475569">• Hard deadlines: Δt ≤ τ_world</text>
<rect x="199.0" y="66" width="158" height="330" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="199.0" y="66" width="158" height="22" rx="6" fill="#215CAF" fill-opacity="0.12"/>
<text x="278.0" y="81" font-size="8.5" font-weight="700" fill="#215CAF" text-anchor="middle">COLUMN 2</text>
<text x="278.0" y="104" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">INERTIA </text>
<text x="278.0" y="116" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">&amp;  MOMENTUM</text>
<text x="278.0" y="130" font-size="8" fill="#64748B" text-anchor="middle">p = mv Kinetic Energy</text>
<text x="207.0" y="144" font-size="8" fill="#475569">• Mass cannot stop instantaneously</text>
<text x="207.0" y="164" font-size="8" fill="#475569">• Kinetic braking distance d_stop</text>
<text x="207.0" y="184" font-size="8" fill="#475569">• Centrifugal &amp; Coriolis forces</text>
<text x="207.0" y="204" font-size="8" fill="#475569">• Work envelope geofencing</text>
<rect x="371.0" y="66" width="158" height="330" rx="6" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="371.0" y="66" width="158" height="22" rx="6" fill="#B87333" fill-opacity="0.12"/>
<text x="450.0" y="81" font-size="8.5" font-weight="700" fill="#B87333" text-anchor="middle">COLUMN 3</text>
<text x="450.0" y="104" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">ACTUATION DYNAMICS</text>
<text x="450.0" y="118" font-size="8" fill="#64748B" text-anchor="middle">τ_motor &amp; Friction Limits</text>
<text x="379.0" y="144" font-size="8" fill="#475569">• BLDC torque-speed envelopes</text>
<text x="379.0" y="164" font-size="8" fill="#475569">• Gearbox backlash &amp; jerk bounds</text>
<text x="379.0" y="184" font-size="8" fill="#475569">• Coulomb/viscous joint friction</text>
<text x="379.0" y="204" font-size="8" fill="#475569">• Smooth C² acceleration profiles</text>
<rect x="543.0" y="66" width="158" height="330" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="543.0" y="66" width="158" height="22" rx="6" fill="#D97706" fill-opacity="0.12"/>
<text x="622.0" y="81" font-size="8.5" font-weight="700" fill="#D97706" text-anchor="middle">COLUMN 4</text>
<text x="622.0" y="104" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">ENERGY </text>
<text x="622.0" y="116" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">&amp;  THERMODYNAMICS</text>
<text x="622.0" y="130" font-size="8" fill="#64748B" text-anchor="middle">P = IV &amp; Joule Heat</text>
<text x="551.0" y="144" font-size="8" fill="#475569">• Battery voltage sag under load</text>
<text x="551.0" y="164" font-size="8" fill="#475569">• Junction heating T_j = T_a + P·θ_JA</text>
<text x="551.0" y="184" font-size="8" fill="#475569">• DVFS thermal throttling cascades</text>
<text x="551.0" y="204" font-size="8" fill="#475569">• Regenerative braking limits</text>
<rect x="715.0" y="66" width="158" height="330" rx="6" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="715.0" y="66" width="158" height="22" rx="6" fill="#5B4B8A" fill-opacity="0.12"/>
<text x="794.0" y="81" font-size="8.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">COLUMN 5</text>
<text x="794.0" y="104" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">SILICON </text>
<text x="794.0" y="116" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">&amp;  COMPUTE</text>
<text x="794.0" y="130" font-size="8" fill="#64748B" text-anchor="middle">SRAM, AXI &amp; DMA Memory</text>
<text x="723.0" y="144" font-size="8" fill="#475569">• Zero dynamic malloc in RT loops</text>
<text x="723.0" y="164" font-size="8" fill="#475569">• UMA crossbar bus contention</text>
<text x="723.0" y="184" font-size="8" fill="#475569">• Hardware watchdog supervisors</text>
<text x="723.0" y="204" font-size="8" fill="#475569">• Deterministic FreeRTOS priority</text>
<rect x="27.0" y="406" width="846" height="40" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="450.0" y="422" font-size="9" font-weight="700" fill="#1F407A" text-anchor="middle">FIRST-PRINCIPLES PHYSICAL GUARANTEE</text>
<text x="450.0" y="436" font-size="8.5" fill="#475569" text-anchor="middle">Software models propose intent; the Five Physical Columns enforce the boundary of physical possibility.</text>
</svg>
