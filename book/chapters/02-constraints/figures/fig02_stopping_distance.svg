<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="100%" height="auto" role="img" aria-label="Dynamic Stopping Distance Physics: Nominal P50 vs P99 Tail Collision">
  <defs>
    <style>
      .main-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1F407A; letter-spacing: 0.5px; }
      .main-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
      .scenario-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .segment-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; }
      .dimension-txt { font-family: 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 700; }
      .formula-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #1E293B; }
      .barrier-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #A51C30; }
      .verdict-safe { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #059669; }
      .verdict-crash { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #E11D48; }
      .body-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
    </style>
    <pattern id="hatch-red" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#FCA5A5" stroke-width="2.5" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="450" fill="#FFFFFF" rx="8"/>

  <!-- Top Banner -->
  <rect x="20" y="12" width="900" height="40" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
  <text class="main-title" x="470" y="29" text-anchor="middle">DYNAMIC STOPPING DISTANCE PHYSICS (d_stop)</text>
  <text class="main-sub" x="470" y="43" text-anchor="middle">Translating milliseconds of computational delay into physical centimeters of collision hazard: d_stop = v · Δt_delay + v² / (2 a_max)</text>

  <!-- ================= FORMULA BAR ================= -->
  <g transform="translate(20, 60)">
    <rect width="900" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text class="formula-txt" x="20" y="26">
      <tspan font-weight="700" fill="#1F407A">Governing Physics:</tspan> Total Stopping Distance = <tspan fill="#2563EB" font-weight="700">Reaction Travel (v · Δt)</tspan> + <tspan fill="#059669" font-weight="700">Braking Travel (v² / 2a_max)</tspan>  |  Nominal Parameters: <tspan font-style="italic">v = 1.0 m/s, a_max = 2.0 m/s², Clearance Barrier = 35 cm</tspan>
    </text>
  </g>

  <!-- ================= SCENARIO A: NOMINAL P50 ================= -->
  <g transform="translate(20, 114)">
    <rect width="900" height="135" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
    
    <!-- Header -->
    <text class="scenario-hdr" x="16" y="22" fill="#047857">SCENARIO A · NOMINAL P50 LATENCY (t_delay = 30 ms)</text>
    <text class="verdict-safe" x="720" y="22">VERDICT: SAFE STOP (+7 cm margin)</text>

    <!-- Track Axis -->
    <g transform="translate(60, 42)">
      <!-- Start Origin -->
      <circle cx="0" cy="24" r="5" fill="#047857"/>
      <text class="segment-lbl" x="0" y="45" text-anchor="middle" fill="#047857">x = 0</text>

      <!-- Segment 1: Reaction Travel (3 cm -> 50px) -->
      <rect x="0" y="10" width="50" height="28" rx="3" fill="#BFDBFE" stroke="#2563EB" stroke-width="1"/>
      <text class="segment-lbl" x="25" y="-2" text-anchor="middle" fill="#1D4ED8">Reaction (3 cm)</text>

      <!-- Segment 2: Braking Travel (25 cm -> 375px) -->
      <rect x="50" y="10" width="375" height="28" rx="3" fill="#A7F3D0" stroke="#059669" stroke-width="1"/>
      <text class="segment-lbl" x="237" y="27" text-anchor="middle" fill="#047857">Braking Deceleration Phase (25 cm)</text>

      <!-- Total Stop Point Marker -->
      <line x1="425" y1="2" x2="425" y2="48" stroke="#047857" stroke-width="2"/>
      <rect x="385" y="52" width="80" height="18" rx="3" fill="#ECFDF5" stroke="#047857" stroke-width="0.8"/>
      <text class="dimension-txt" x="425" y="65" text-anchor="middle" fill="#047857">d_stop = 28 cm</text>

      <!-- Clearance Margin (7 cm -> 105px) -->
      <rect x="425" y="10" width="105" height="28" rx="3" fill="#FFFFFF" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>
      <text class="segment-lbl" x="477" y="27" text-anchor="middle" fill="#059669">Margin (7 cm)</text>

      <!-- Obstacle Wall (at 35 cm -> 530px) -->
      <rect x="530" y="-8" width="18" height="64" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1.2"/>
      <line x1="530" y1="-8" x2="530" y2="56" stroke="#A51C30" stroke-width="2.5"/>
      <text class="barrier-hdr" x="555" y="28">Obstacle Barrier (35 cm)</text>
    </g>
  </g>

  <!-- ================= SCENARIO B: P99 TAIL BLOWOUT ================= -->
  <g transform="translate(20, 260)">
    <rect width="900" height="175" rx="6" fill="#FEF2F2" stroke="#E11D48" stroke-width="1.4"/>
    
    <!-- Header -->
    <text class="scenario-hdr" x="16" y="22" fill="#E11D48">SCENARIO B · P99 LATENCY TAIL SPIKE (t_delay = 230 ms · OS Jitter + UMA Contention)</text>
    <text class="verdict-crash" x="700" y="22">VERDICT: SEVERE COLLISION (13 cm breach)</text>

    <!-- Track Axis -->
    <g transform="translate(60, 42)">
      <!-- Start Origin -->
      <circle cx="0" cy="24" r="5" fill="#E11D48"/>
      <text class="segment-lbl" x="0" y="45" text-anchor="middle" fill="#E11D48">x = 0</text>

      <!-- Segment 1: Blind Reaction Travel (23 cm -> 345px) -->
      <rect x="0" y="10" width="345" height="28" rx="3" fill="#FCA5A5" stroke="#E11D48" stroke-width="1"/>
      <text class="segment-lbl" x="172" y="27" text-anchor="middle" fill="#991B1B">Blind Reaction Phase: +20 cm added! (23 cm total)</text>

      <!-- Segment 2: Braking Travel (25 cm -> 375px) -->
      <rect x="345" y="10" width="375" height="28" rx="3" fill="url(#hatch-red)" stroke="#E11D48" stroke-width="1"/>
      <text class="segment-lbl" x="430" y="-2" text-anchor="middle" fill="#991B1B">Braking Phase (25 cm)</text>

      <!-- Obstacle Wall (at 35 cm -> 530px) -->
      <rect x="530" y="-8" width="18" height="64" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1.2"/>
      <line x1="530" y1="-8" x2="530" y2="56" stroke="#A51C30" stroke-width="2.5"/>
      <text class="barrier-hdr" x="555" y="-2">Obstacle Barrier (35 cm)</text>

      <!-- Collision Breach Point (at 48 cm -> 720px) -->
      <line x1="720" y1="2" x2="720" y2="48" stroke="#E11D48" stroke-width="2.5"/>
      <rect x="655" y="52" width="130" height="18" rx="3" fill="#FEF2F2" stroke="#E11D48" stroke-width="1"/>
      <text class="dimension-txt" x="720" y="65" text-anchor="middle" fill="#E11D48">d_stop = 48 cm (+13 cm BREACH)</text>
    </g>

    <!-- Bottom Explanation -->
    <text class="body-txt" x="16" y="152">
      <tspan font-weight="700" fill="#E11D48">The Invariant Enforcement Mandate:</tspan> Because an untrusted foundation model on the MPU cannot guarantee bounded latency tails under UMA memory contention, the dedicated 1 kHz MCU must continuously evaluate <tspan font-style="italic">d_stop(v) ≤ d_clearance</tspan> and preemptively initiate safe braking before the clearance envelope is breached.
    </text>
  </g>
</svg>
