<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">DYNAMIC STOPPING DISTANCE: REACTION LAG + KINETIC BRAKING</text>
<text x="440.0" y="44" class="subtitle">d_stop(t) = v(t) · Δt_latency + v(t)² / (2 a_max) ≤ d_clearance</text>
<rect x="40" y="70" width="370" height="140" rx="8" fill="#215CAF" fill-opacity="0.05" stroke="#215CAF" stroke-width="1.2" filter="url(#shadow)"/>
<text x="56" y="92" font-size="11" font-weight="700" fill="#215CAF">1. SENSE-TO-ACTUATION REACTION DISTANCE</text>
<text x="56" y="112" font-size="12" font-weight="700" fill="#1A202C">d_reaction = v₀ · Δt_wall</text>
<text x="56" y="132" font-size="8.5" fill="#475569">• Vehicle travels at initial speed during computation lag</text>
<text x="56" y="148" font-size="8.5" fill="#475569">• Linear growth with latency: doubling latency doubles distance</text>
<text x="56" y="164" font-size="8.5" fill="#475569">• Example: at 1.5 m/s, Δt=80 ms ⇒ d_reaction = 12.0 cm</text>
<rect x="470" y="70" width="370" height="140" rx="8" fill="#A51C30" fill-opacity="0.05" stroke="#A51C30" stroke-width="1.2" filter="url(#shadow)"/>
<text x="486" y="92" font-size="11" font-weight="700" fill="#A51C30">2. PHYSICAL KINETIC BRAKING DISTANCE</text>
<text x="486" y="112" font-size="12" font-weight="700" fill="#1A202C">d_braking = v₀² / (2 · a_max)</text>
<text x="486" y="132" font-size="8.5" fill="#475569">• Dissipating kinetic energy E_k = 1/2 m v² against friction μ</text>
<text x="486" y="148" font-size="8.5" fill="#475569">• Quadratic growth with velocity: doubling speed quadruples distance</text>
<text x="486" y="164" font-size="8.5" fill="#475569">• Example: at 1.5 m/s, a_max=3.0 m/s² ⇒ d_braking = 37.5 cm</text>
<rect x="40" y="230" width="800" height="170" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="254" font-size="11" font-weight="700" fill="#1F407A" text-anchor="middle">TOTAL DYNAMIC STOPPING CLEARANCE ENVELOPE</text>
<line x1="760.0" y1="260" x2="760.0" y2="340" stroke="#DC2626" stroke-width="3"/>
<text x="760.0" y="254" font-size="9" font-weight="700" fill="#DC2626" text-anchor="middle">OBSTACLE WALL (d_clearance = 60 cm)</text>
<rect x="120.0" y="280" width="128" height="36" rx="4" fill="#215CAF" fill-opacity="0.85"/>
<text x="184.0" y="302" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reaction: 12.0 cm</text>
<rect x="248.0" y="280" width="400" height="36" rx="4" fill="#A51C30" fill-opacity="0.85"/>
<text x="448.0" y="302" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Kinetic Braking: 37.5 cm</text>
<rect x="648.0" y="280" width="112" height="36" rx="4" fill="#10B981" fill-opacity="0.85"/>
<text x="704.0" y="302" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Margin: +10.5 cm ✓</text>
<text x="440.0" y="360" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Total Stopping Distance: d_stop = 49.5 cm ≤ Clearance: 60.0 cm (Certified Safe)</text>
<text x="440.0" y="376" font-size="8.5" fill="#64748B" text-anchor="middle">If latency spikes to 200 ms (P99.9 tail), d_reaction becomes 30 cm ⇒ d_stop = 67.5 cm > 60 cm ⇒ COLLISION!</text>
</svg>
