<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
    .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
    .axis-title { font-weight: 700; font-size: 11px; fill: #1E293B; }
    .tick-label { font-size: 9.5px; fill: #64748B; font-weight: 600; }
    .region-label { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-anchor: middle; }
    .point-label { font-size: 9px; font-weight: 700; }
    .point-sub { font-size: 8px; fill: #475569; }
    .knee-label { font-size: 8.5px; font-weight: 700; fill: #A51C30; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0D9488"/>
    </marker>
    <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="960" height="560" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Header -->
  <text x="480" y="28" class="title">THE PATTERSON ROOFLINE MODEL &amp; EMBODIED MEMORY WALL</text>
  <text x="480" y="44" class="subtitle">Operational Arithmetic Intensity (FLOP/Byte) vs. Attainable Throughput on Embedded Edge Silicon (NVIDIA Jetson AGX Orin, 204.8 GB/s LPDDR5)</text>

  <!-- Graph Canvas: x=90..910 (width=820), y=75..455 (height=380) -->
  <rect x="90" y="75" width="820" height="380" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Shaded Regimes -->
  <polygon points="90,455 640,120 90,120" fill="#EEF4FB" fill-opacity="0.7"/>
  <polygon points="640,120 910,120 910,455 640,455" fill="#F0FDF4" fill-opacity="0.6"/>

  <!-- Grid Lines (Log Scale) -->
  <line x1="90" y1="75" x2="90" y2="455" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="226" y1="75" x2="226" y2="455" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="363" y1="75" x2="363" y2="455" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="500" y1="75" x2="500" y2="455" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="636" y1="75" x2="636" y2="455" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="773" y1="75" x2="773" y2="455" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="910" y1="75" x2="910" y2="455" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Y Grid -->
  <line x1="90" y1="455" x2="910" y2="455" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="371" x2="910" y2="371" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="287" x2="910" y2="287" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="203" x2="910" y2="203" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="120" x2="910" y2="120" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Compute Ceiling Line -->
  <line x1="90" y1="120" x2="910" y2="120" stroke="#1F407A" stroke-width="1.8" stroke-dasharray="5,3"/>
  
  <!-- Slanted Roofline -->
  <line x1="90" y1="455" x2="640" y2="120" stroke="#215CAF" stroke-width="3.5"/>
  <!-- Flat Roofline Ceiling -->
  <line x1="640" y1="120" x2="910" y2="120" stroke="#215CAF" stroke-width="3.5"/>

  <!-- Slope Label Placed in Open Memory Area -->
  <g transform="translate(150, 135)">
    <rect width="250" height="22" rx="4" fill="#FFFFFF" stroke="#215CAF" stroke-width="1" filter="url(#shadow)"/>
    <text x="125" y="15" font-size="9" font-weight="700" fill="#215CAF" text-anchor="middle">DRAM Bandwidth: B_mem = 204.8 GB/s (LPDDR5)</text>
  </g>

  <!-- Ridge / Knee Point Indicator -->
  <circle cx="640" cy="120" r="5" fill="#A51C30"/>
  <line x1="640" y1="120" x2="640" y2="455" stroke="#A51C30" stroke-width="1.2" stroke-dasharray="4,3"/>
  
  <!-- Knee Label Box Placed Near Peak -->
  <g transform="translate(560, 85)">
    <rect width="150" height="20" rx="4" fill="#FBF2F3" stroke="#A51C30" stroke-width="1" filter="url(#shadow)"/>
    <text x="75" y="14" class="knee-label">I_knee = 1,342 FLOP/Byte</text>
  </g>

  <!-- Regime Headers -->
  <rect x="100" y="85" width="180" height="24" rx="4" fill="#FFFFFF" stroke="#215CAF" stroke-width="1" filter="url(#shadow)"/>
  <text x="190" y="101" class="region-label" fill="#215CAF">MEMORY-BANDWIDTH BOUND</text>

  <rect x="720" y="85" width="170" height="24" rx="4" fill="#FFFFFF" stroke="#0D9488" stroke-width="1" filter="url(#shadow)"/>
  <text x="805" y="101" class="region-label" fill="#0D9488">COMPUTE-BOUND</text>

  <!-- Peak Compute Text -->
  <text x="900" y="113" font-size="9" font-weight="700" fill="#1F407A" text-anchor="end">Peak Compute: P_peak = 275 TFLOP/s</text>

  <!-- ================= OPERATING POINT 1: SINGLE-STEP AUTOREGRESSIVE ================= -->
  <circle cx="226" cy="371" r="6" fill="#A51C30"/>
  <g transform="translate(45, 230)" filter="url(#shadow)">
    <rect width="205" height="102" rx="6" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.2"/>
    <rect width="205" height="18" rx="6" fill="#A51C30" fill-opacity="0.12"/>
    <text x="10" y="13" font-size="8" font-weight="700" fill="#A51C30">① SINGLE-STEP AUTOREGRESSIVE</text>
    <text x="10" y="32" class="point-label" fill="#1A202C">I ≈ 1.0 FLOP/Byte · P ≈ 0.2 TFLOP/s</text>
    <text x="10" y="47" class="point-sub">• 7B weights @ FP16 = 14 GB sweep per token</text>
    <text x="10" y="61" class="point-sub">• t_stream = 68.4 ms ⟹ f_max ≤ 14.6 Hz</text>
    <text x="10" y="75" class="point-sub">• GPU stalls &gt;99% idle waiting for DRAM</text>
    <text x="10" y="91" font-size="8" font-weight="700" fill="#A51C30">⚠️ Actuators stutter; dynamic instability</text>
  </g>
  <line x1="180" y1="332" x2="223" y2="367" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arr-crimson)"/>

  <!-- ================= OPERATING POINT 2: ACTION CHUNKING BRIDGE ================= -->
  <circle cx="475" cy="225" r="6" fill="#0D9488"/>
  <g transform="translate(390, 320)" filter="url(#shadow)">
    <rect width="225" height="102" rx="6" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.2"/>
    <rect width="225" height="18" rx="6" fill="#0D9488" fill-opacity="0.12"/>
    <text x="10" y="13" font-size="8.5" font-weight="700" fill="#0D9488">② ACTION CHUNKING (H = 32–64 STEPS)</text>
    <text x="10" y="32" class="point-label" fill="#1A202C">I ≈ 50–150 FLOP/Byte · P ≈ 10–30 TFLOP/s</text>
    <text x="10" y="47" class="point-sub">• Predicts 32 continuous waypoints in 1 pass</text>
    <text x="10" y="61" class="point-sub">• Amortizes 14 GB parameter sweep across 640 ms</text>
    <text x="10" y="75" class="point-sub">• 50× increase in operational arithmetic intensity</text>
    <text x="10" y="91" font-size="8" font-weight="700" fill="#0D9488">✅ Deliberative 5 Hz brain feeds 1000 Hz reflex</text>
  </g>
  <line x1="495" y1="320" x2="478" y2="233" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Transition Curve & Badge -->
  <path d="M 235 365 Q 330 260 465 228" fill="none" stroke="#0D9488" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <g transform="translate(260, 245)" filter="url(#shadow)">
    <rect width="130" height="18" rx="4" fill="#FFFFFF" stroke="#0D9488" stroke-width="1"/>
    <text x="65" y="12.5" font-size="8" font-weight="700" fill="#0D9488" text-anchor="middle">50× Arithmetic Intensity Gain</text>
  </g>

  <!-- ================= OPERATING POINT 3: DENSE SPATIAL VISION ================= -->
  <circle cx="580" cy="155" r="5" fill="#215CAF"/>
  <g transform="translate(630, 145)" filter="url(#shadow)">
    <rect width="220" height="75" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2"/>
    <rect width="220" height="18" rx="6" fill="#215CAF" fill-opacity="0.12"/>
    <text x="10" y="13" font-size="8.5" font-weight="700" fill="#215CAF">③ DENSE SPATIAL ENCODER (ViT/DINOv2)</text>
    <text x="10" y="32" class="point-label" fill="#1A202C">I ≈ 300–600 FLOP/Byte</text>
    <text x="10" y="47" class="point-sub">• 256 visual patch tokens evaluated concurrently</text>
    <text x="10" y="61" class="point-sub">• High matrix reuse in on-chip SRAM cache</text>
  </g>
  <line x1="630" y1="165" x2="587" y2="157" stroke="#215CAF" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <!-- ================= QUANTIZATION SHIFT CARD ================= -->
  <g transform="translate(630, 240)" filter="url(#shadow)">
    <rect width="220" height="88" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
    <rect width="220" height="18" rx="6" fill="#B87333" fill-opacity="0.15"/>
    <text x="10" y="13" font-size="8.5" font-weight="700" fill="#B87333">💡 INT8 / FP8 QUANTIZATION SHIFT</text>
    <text x="10" y="32" class="point-sub">• Halves memory footprint: 14 GB ➔ 7 GB</text>
    <text x="10" y="47" class="point-sub">• Doubles effective arithmetic intensity (2× I)</text>
    <text x="10" y="62" class="point-sub">• Cuts DRAM bus energy consumption by ~50%</text>
    <text x="10" y="77" class="point-sub">• Essential for thermal &amp; battery budgets on mobile robots</text>
  </g>

  <!-- ================= AXIS LABELS ================= -->
  <text x="90" y="473" class="tick-label" text-anchor="middle">0.1</text>
  <text x="226" y="473" class="tick-label" text-anchor="middle">1.0</text>
  <text x="363" y="473" class="tick-label" text-anchor="middle">10</text>
  <text x="500" y="473" class="tick-label" text-anchor="middle">100</text>
  <text x="636" y="473" class="tick-label" text-anchor="middle">1,000</text>
  <text x="773" y="473" class="tick-label" text-anchor="middle">10,000</text>
  <text x="910" y="473" class="tick-label" text-anchor="middle">100,000</text>
  <text x="500" y="502" class="axis-title" text-anchor="middle">Operational Arithmetic Intensity I = FLOPs / Byte (Logarithmic Scale)</text>

  <!-- Y-Axis Ticks -->
  <text x="82" y="459" class="tick-label" text-anchor="end">0.1</text>
  <text x="82" y="375" class="tick-label" text-anchor="end">1.0</text>
  <text x="82" y="291" class="tick-label" text-anchor="end">10</text>
  <text x="82" y="207" class="tick-label" text-anchor="end">100</text>
  <text x="82" y="124" class="tick-label" text-anchor="end">1,000</text>
  <text x="28" y="265" class="axis-title" text-anchor="middle" transform="rotate(-90 28 265)">Attainable Compute Throughput P (TFLOP/s, Log Scale)</text>

  <!-- Bottom Legend Banner -->
  <rect x="90" y="520" width="820" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="500" y="537" font-size="8.5" fill="#334155" text-anchor="middle">
    <tspan font-weight="700" fill="#1F407A">The Patterson Roofline Law for Physical AI:</tspan> 
    Single-step foundation model evaluation is memory-wall bound (I ≈ 1). Action chunking amortizes DRAM sweeps (I ≥ 50), escaping the memory wall to feed real-time reflexes.
  </text>
</svg>
