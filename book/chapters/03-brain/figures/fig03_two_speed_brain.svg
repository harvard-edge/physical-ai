<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="940" height="540" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="470.0" y="28" class="title">THE TWO-SPEED BRAIN ARCHITECTURE &amp; PRIVILEGE BOUNDARY</text>
<text x="470.0" y="44" class="subtitle">Slow Deliberative System 2 (1–5 Hz) ⟷ Fast Real-Time System 1 (100–1000 Hz) with Proposal–Permission Gating</text>
<rect x="24" y="66" width="892" height="175" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="24" y="66" width="892" height="24" rx="8" fill="#215CAF" fill-opacity="0.10"/>
<text x="36" y="82" font-size="9" font-weight="700" fill="#1F407A">UNTRUSTED DELIBERATIVE COGNITIVE REALM · APPLICATION PROCESSOR (HOST LINUX MPU / ACCELERATOR, ~35W TDP)</text>
<text x="904" y="82" font-size="8.5" font-weight="700" fill="#D97706" text-anchor="end">AUTHORITY: UNPRIVILEGED CANDIDATE PROPOSALS ONLY</text>
<rect x="38" y="98" width="415" height="130" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2"/>
<rect x="38" y="98" width="415" height="22" rx="6" fill="#215CAF" fill-opacity="0.12"/>
<text x="48" y="113" font-size="9" font-weight="700" fill="#215CAF">SYSTEM 2: COGNITIVE FOUNDATION MODEL / VLM</text>
<text x="443" y="113" font-size="8.5" font-weight="700" fill="#215CAF" text-anchor="end">1 – 5 Hz · Latency: 200–1000 ms</text>
<text x="48" y="136" font-size="8.5" font-weight="700" fill="#1A202C">• Substrate:</text>
<text x="136" y="136" font-size="8.5" fill="#475569">Multi-modal Transformer (7B–70B weights) on NPU/GPU</text>
<text x="48" y="158" font-size="8.5" font-weight="700" fill="#1A202C">• Function:</text>
<text x="136" y="158" font-size="8.5" fill="#475569">Open-world semantic grounding, object affordance &amp; goal logic</text>
<text x="48" y="180" font-size="8.5" font-weight="700" fill="#1A202C">• Artifact Emitted:</text>
<text x="136" y="180" font-size="8.5" fill="#475569">Expiring Intent Lease L_intent = (G, V_scope, t_expire)</text>
<text x="48" y="202" font-size="8.5" font-weight="700" fill="#1A202C">• Failure Profile:</text>
<text x="136" y="202" font-size="8.5" fill="#475569">Semantic hallucinations, P99 tail spikes, OOD unreliability</text>
<line x1="453" y1="163.0" x2="489" y2="163.0" stroke="#B87333" stroke-width="2" marker-end="url(#arr-bronze)"/>
<rect x="457" y="145.0" width="30" height="13" rx="3" fill="#FFFFFF" stroke="#B87333" stroke-width="0.8"/>
<text x="472" y="154.0" font-size="7.5" font-weight="700" fill="#B87333" text-anchor="middle">Lease</text>
<rect x="490" y="98" width="412" height="130" rx="6" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2"/>
<rect x="490" y="98" width="412" height="22" rx="6" fill="#B87333" fill-opacity="0.12"/>
<text x="500" y="113" font-size="9" font-weight="700" fill="#B87333">SYSTEM 1.5: GENERATIVE TRAJECTORY PLANNER</text>
<text x="892" y="113" font-size="8.5" font-weight="700" fill="#B87333" text-anchor="end">20 – 50 Hz · Horizon H=16</text>
<text x="500" y="136" font-size="8.5" font-weight="700" fill="#1A202C">• Substrate:</text>
<text x="586" y="136" font-size="8.5" fill="#475569">Diffusion Policy / Action Chunking Transformer (ACT)</text>
<text x="500" y="158" font-size="8.5" font-weight="700" fill="#1A202C">• Function:</text>
<text x="586" y="158" font-size="8.5" fill="#475569">Synthesizes smooth C² continuous spline waypoints A_{t:t+H}</text>
<text x="500" y="180" font-size="8.5" font-weight="700" fill="#1A202C">• Artifact Emitted:</text>
<text x="586" y="180" font-size="8.5" fill="#475569">Candidate Action Chunk Proposal p_t = {q_k, q̇_k, τ_k}</text>
<text x="500" y="202" font-size="8.5" font-weight="700" fill="#1A202C">• Seam Behavior:</text>
<text x="586" y="202" font-size="8.5" fill="#475569">Recedes on arrival; decelerates to hold if next chunk delays</text>
<line x1="24" y1="262" x2="916" y2="262" stroke="#A51C30" stroke-width="2" stroke-dasharray="6,4"/>
<rect x="240.0" y="250.0" width="460" height="24" rx="12" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="254.0" cy="262" r="4" fill="#A51C30"/>
<text x="474.0" y="266" font-size="9" font-weight="700" fill="#A51C30" text-anchor="middle">PROPOSAL–PERMISSION PRIVILEGE BOUNDARY (NO DIRECT ACTUATOR ACCESS)</text>
<line x1="696" y1="241" x2="696" y2="292" stroke="#A51C30" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-crimson)"/>
<rect x="632" y="268" width="128" height="18" rx="4" fill="#FFFFFF" stroke="#A51C30" stroke-width="1"/>
<text x="696" y="280" font-size="8" font-weight="700" fill="#A51C30" text-anchor="middle">Unverified Proposal p_t</text>
<rect x="24" y="302" width="892" height="160" rx="8" fill="#007A87" fill-opacity="0.04" stroke="#007A87" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="24" y="302" width="892" height="24" rx="8" fill="#007A87" fill-opacity="0.15"/>
<text x="36" y="318" font-size="9" font-weight="700" fill="#007A87">TRUSTED REAL-TIME SAFETY REALM · DUAL LOCK-STEP MCU (BARE-METAL / FreeRTOS, &lt; 1.5W TDP, 0 DYNAMIC MALLOC)</text>
<text x="904" y="318" font-size="8.5" font-weight="700" fill="#007A87" text-anchor="end">AUTHORITY: SOLE PERMISSION TO ENERGIZE ACTUATORS</text>
<rect x="38" y="334" width="460" height="116" rx="6" fill="#FFFFFF" stroke="#007A87" stroke-width="1.2"/>
<rect x="38" y="334" width="460" height="20" rx="6" fill="#007A87" fill-opacity="0.12"/>
<text x="48" y="348" font-size="9" font-weight="700" fill="#007A87">SYSTEM 1: DETERMINISTIC BARRIER ENFORCER &amp; SAFETY GATE</text>
<text x="488" y="348" font-size="8.5" font-weight="700" fill="#007A87" text-anchor="end">1000 Hz · Jitter &lt; 5 µs</text>
<text x="48" y="368" font-size="8" font-weight="700" fill="#1A202C">• Control Barrier Function:</text>
<text x="173" y="368" font-size="8" fill="#475569">Solves Active-Set QP: min ||u - p_t||² s.t. ḣ(x) + α(h(x)) ≥ 0</text>
<text x="48" y="388" font-size="8" font-weight="700" fill="#1A202C">• Dynamic Stopping Distance:</text>
<text x="173" y="388" font-size="8" fill="#475569">Evaluates d_stop(v_t) = v_t·t_react + v_t²/(2 a_max) ≤ D_clear</text>
<text x="48" y="408" font-size="8" font-weight="700" fill="#1A202C">• Temporal &amp; Lease Check:</text>
<text x="173" y="408" font-size="8" fill="#475569">Rejects p_t if t &gt; t_expire or CRC/timing deadline missed</text>
<text x="48" y="428" font-size="8" font-weight="700" fill="#1A202C">• Dual Execution Verdict:</text>
<text x="173" y="428" font-size="8" fill="#475569">Passes safe command u_t = permit(p_t) OR triggers Safe-Stop ⊥</text>
<rect x="520" y="334" width="382" height="116" rx="6" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.2"/>
<rect x="520" y="334" width="382" height="20" rx="6" fill="#1F407A" fill-opacity="0.12"/>
<text x="530" y="348" font-size="9" font-weight="700" fill="#1F407A">ACTUATION POWER STAGE &amp; PHYSICAL BODY</text>
<text x="892" y="348" font-size="8.5" font-weight="700" fill="#A51C30" text-anchor="end">Irreversible State (W_t → W_{t+1})</text>
<text x="530" y="368" font-size="8" font-weight="700" fill="#1A202C">• PWM Gate Driver Registers:</text>
<text x="660" y="368" font-size="8" fill="#475569">Direct H-Bridge gate drive, L/R electrical current rise</text>
<text x="530" y="388" font-size="8" font-weight="700" fill="#1A202C">• Electromagnetic Torque:</text>
<text x="660" y="388" font-size="8" fill="#475569">Delivers mechanical torque τ = k_t · I into gearboxes</text>
<text x="530" y="408" font-size="8" font-weight="700" fill="#1A202C">• Physical Conservation Laws:</text>
<text x="660" y="408" font-size="8" fill="#475569">Momentum p=mv · Joule Heat I²R · Friction dissipation</text>
<text x="530" y="428" font-size="8" font-weight="700" fill="#1A202C">• Irreversible Boundary:</text>
<text x="660" y="428" font-size="8" fill="#475569">Once current energizes stator, mechanical motion is committed</text>
<line x1="498" y1="374" x2="520" y2="374" stroke="#10B981" stroke-width="2.5" marker-end="url(#arr-teal)"/>
<rect x="502" y="360" width="54" height="15" rx="3" fill="#FFFFFF" stroke="#10B981" stroke-width="0.8"/>
<text x="529" y="371" font-size="7.5" font-weight="700" fill="#10B981" text-anchor="middle">u_t (Safe)</text>
<line x1="498" y1="418" x2="520" y2="418" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-coral)"/>
<rect x="502" y="404" width="54" height="15" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.8"/>
<text x="529" y="415" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">⊥ (E-Stop)</text>
<rect x="24" y="474" width="892" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="470.0" y="492" font-size="9.5" font-weight="700" fill="#1F407A" text-anchor="middle">THE BEDROCK PRINCIPLE OF THE TWO-SPEED ARCHITECTURE</text>
<text x="470.0" y="508" font-size="8.5" fill="#475569" text-anchor="middle">High-level neural models propose rich, open-world intentions over extended horizons without physical privilege;</text>
<text x="470.0" y="520" font-size="8.5" fill="#475569" text-anchor="middle">Hard real-time deterministic enforcers audit every proposal at microsecond cadences, retaining exclusive permission to energize motors.</text>
</svg>
