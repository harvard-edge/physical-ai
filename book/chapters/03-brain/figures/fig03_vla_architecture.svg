<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="960" height="560" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
<text x="480.0" y="26" class="title">VISION-LANGUAGE-ACTION (VLA) ARCHITECTURE &amp; PROPOSAL PIPELINE</text>
<text x="480.0" y="42" class="subtitle">Multimodal Ingestion · Visual Patch Tokenization · Autoregressive Transformer Backbone · Action Tokenization Paradigms</text>
<rect x="24" y="60" width="210" height="420" rx="6" fill="#F8FAFC" stroke="#215CAF" stroke-width="1.2"/>
<rect x="24" y="60" width="210" height="24" rx="6" fill="#215CAF" fill-opacity="0.12"/>
<text x="34" y="76" font-size="9.5" font-weight="700" fill="#215CAF">1. MULTIMODAL INGESTION</text>
<rect x="34" y="94" width="190" height="75" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="42" y="110" font-size="9" font-weight="700" fill="#1A202C">Overhead RGB Camera</text>
<text x="42" y="124" font-size="8" fill="#475569">224 x 224 x 3 @ 30 Hz</text>
<text x="42" y="138" font-size="8" fill="#64748B">ViT Patch: 14x14 -&gt; 256 tokens</text>
<text x="42" y="152" font-size="7.5" font-weight="600" fill="#215CAF">Linear Projection z_vis</text>
<rect x="34" y="178" width="190" height="75" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="42" y="194" font-size="9" font-weight="700" fill="#1A202C">Wrist RGB Camera</text>
<text x="42" y="208" font-size="8" fill="#475569">224 x 224 x 3 (Gripper View)</text>
<text x="42" y="222" font-size="8" fill="#64748B">Fine-contact visual alignment</text>
<text x="42" y="236" font-size="7.5" font-weight="600" fill="#215CAF">Linear Projection z_wrist</text>
<rect x="34" y="262" width="190" height="80" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="42" y="278" font-size="9" font-weight="700" fill="#5B4B8A">Task Instruction (Text)</text>
<text x="42" y="292" font-size="8" fill="#475569">"pick red cup, place on tray"</text>
<text x="42" y="306" font-size="8" fill="#64748B">BPE Tokenizer / SentencePiece</text>
<text x="42" y="320" font-size="7.5" font-weight="600" fill="#5B4B8A">Text Tokens: [t_1, t_2, ..., t_L]</text>
<rect x="34" y="350" width="190" height="70" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="42" y="366" font-size="9" font-weight="700" fill="#10B981">Proprioceptive State</text>
<text x="42" y="380" font-size="8" fill="#475569">Joint Angles q, Velocities q_dot</text>
<text x="42" y="394" font-size="8" fill="#64748B">Gripper state g in [0, 1]</text>
<text x="42" y="408" font-size="7.5" font-weight="600" fill="#10B981">State Token: z_state</text>
<rect x="260" y="60" width="320" height="420" rx="6" fill="#F8FAFC" stroke="#D97706" stroke-width="1.2"/>
<rect x="260" y="60" width="320" height="24" rx="6" fill="#D97706" fill-opacity="0.15"/>
<text x="270" y="76" font-size="9.5" font-weight="700" fill="#D97706">2. VLA TRANSFORMER BACKBONE (7B–55B)</text>
<rect x="272" y="94" width="296" height="140" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="280" y="110" font-size="9" font-weight="700" fill="#1A202C">Multimodal Fusion &amp; Self-Attention</text>
<text x="280" y="126" font-size="8" fill="#475569">Concatenated Tokens: [z_vis | z_wrist | z_text | z_state]</text>
<text x="280" y="140" font-size="8" fill="#475569">32–80 Transformer Layers · Multi-Head Attention</text>
<text x="280" y="154" font-size="8" fill="#64748B">Web-scale pretraining + Robot Trajectory co-fine-tuning</text>
<text x="280" y="168" font-size="8" fill="#64748B">Exemplars: OpenVLA (7B), RT-2 (55B), PaLM-E (562B)</text>
<text x="280" y="184" font-size="7.5" font-weight="700" fill="#D97706">Memory Bound: Streams ~7 GB weights per action step</text>
<text x="280" y="198" font-size="7.5" fill="#64748B">Inference Latency: 150–350 ms on Edge NPU (3–5 Hz)</text>
<rect x="272" y="244" width="296" height="110" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="280" y="260" font-size="9" font-weight="700" fill="#1F407A">Edge Silicon Resource Footprint</text>
<text x="280" y="276" font-size="8" fill="#475569">Precision: INT4 / FP8 Quantized Weights</text>
<text x="280" y="290" font-size="8" fill="#475569">Memory: 5.6 GB DRAM (Weights) + 1.2 GB KV Cache</text>
<text x="280" y="304" font-size="8" fill="#475569">Bus Bandwidth: 204.8 GB/s LPDDR5 Memory Wall</text>
<text x="280" y="318" font-size="8" fill="#A51C30">Thermal Draw: 35W–50W sustained on SoC</text>
<text x="280" y="332" font-size="7.5" font-weight="600" fill="#1F407A">Hardware: NVIDIA Jetson AGX Orin / Apple Silicon</text>
<rect x="272" y="364" width="296" height="55" rx="4" fill="#D97706" fill-opacity="0.10" stroke="#D97706" stroke-width="1"/>
<text x="420.0" y="382" font-size="8.5" font-weight="700" fill="#D97706" text-anchor="middle">UNPRIVILEGED CANDIDATE PROPOSALS</text>
<text x="420.0" y="396" font-size="7.5" fill="#475569" text-anchor="middle">Outputs are stochastic samples a_hat ~ pi_theta(o_t)</text>
<text x="420.0" y="408" font-size="7.5" fill="#A51C30" text-anchor="middle">ZERO direct actuator register write authority</text>
<line x1="234" y1="160" x2="260" y2="160" stroke="#215CAF" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<line x1="234" y1="300" x2="260" y2="300" stroke="#5B4B8A" stroke-width="1.8" marker-end="url(#arr-purple)"/>
<rect x="605" y="60" width="330" height="420" rx="6" fill="#F8FAFC" stroke="#10B981" stroke-width="1.2"/>
<rect x="605" y="60" width="330" height="24" rx="6" fill="#10B981" fill-opacity="0.15"/>
<text x="615" y="76" font-size="9.5" font-weight="700" fill="#10B981">3. ACTION TOKENIZATION &amp; EMISSION</text>
<rect x="617" y="94" width="306" height="100" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="625" y="110" font-size="9" font-weight="700" fill="#215CAF">Paradigm A: Discrete Action Binning (RT-2 / OpenVLA)</text>
<text x="625" y="126" font-size="8" fill="#475569">Quantize 7-DoF action space into K=256 uniform bins</text>
<text x="625" y="140" font-size="8" fill="#475569">Delta coords: [dx, dy, dz, droll, dpitch, dyaw, grip]</text>
<text x="625" y="154" font-size="8" fill="#64748B">Emits 7 text vocabulary tokens sequentially</text>
<text x="625" y="168" font-size="7.5" fill="#64748B">Single-step delta proposal: a_t in R^7 @ 3–5 Hz</text>
<text x="625" y="182" font-size="7.5" font-weight="600" fill="#215CAF">Artifact: Discrete Waypoint / Single-Step Goal</text>
<rect x="617" y="204" width="306" height="105" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="625" y="220" font-size="9" font-weight="700" fill="#10B981">Paradigm B: Diffusion Action Chunking (Octo / ACT)</text>
<text x="625" y="236" font-size="8" fill="#475569">Transformer features condition lightweight diffusion head</text>
<text x="625" y="250" font-size="8" fill="#475569">Predicts continuous action chunk A_t:t+H (H = 16 steps)</text>
<text x="625" y="264" font-size="8" fill="#64748B">Temporal ensembling eliminates single-step Markov error</text>
<text x="625" y="278" font-size="7.5" fill="#64748B">Continuous trajectory horizon: 320 ms preview window</text>
<text x="625" y="292" font-size="7.5" font-weight="600" fill="#10B981">Artifact: C^2 Continuous Spline / Action Chunk</text>
<rect x="617" y="318" width="306" height="105" rx="4" fill="#FFFFFF" stroke="#007A87" stroke-width="1.2"/>
<text x="625" y="334" font-size="9" font-weight="700" fill="#007A87">4. Downstream Nervous System Gating (MCU @ 1 kHz)</text>
<text x="625" y="350" font-size="8" fill="#475569">RPMSG / PCIe DMA across isolation boundary</text>
<text x="625" y="364" font-size="8" fill="#475569">Control Barrier Function (CBF-QP): h_dot(x,u) + gamma h(x) &gt;= 0</text>
<text x="625" y="378" font-size="8" fill="#475569">Stopping distance invariant: d_stop(v) &lt;= d_clearance</text>
<text x="625" y="394" font-size="8" font-weight="700" fill="#007A87">Permitted Motor Commits u_t* Latch at 1000 Hz</text>
<text x="625" y="408" font-size="7.5" fill="#64748B">Fallback: Safe Stop 1 (SS1) / Zero-torque if lease expires</text>
<line x1="580" y1="145" x2="605" y2="145" stroke="#D97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
<line x1="580" y1="255" x2="605" y2="255" stroke="#D97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
<rect x="24" y="495" width="912" height="45" rx="5" fill="#1F407A" fill-opacity="0.08" stroke="#1F407A" stroke-width="1"/>
<text x="480.0" y="514" font-size="9" font-weight="700" fill="#1F407A" text-anchor="middle">THE PHYSICAL AI DILEMMA: HIGH CAPACITY (7B–55B) INFERENCE RUNS SLOW (3–5 Hz); PHYSICAL DYNAMICS REQUIRE FAST (1 kHz) SUPERVISION</text>
<text x="480.0" y="528" font-size="8" fill="#475569" text-anchor="middle">VLAs operate strictly as unauthenticated proposal engines across the slow cognitive tier, gated by bare-metal MCU barrier enforcers.</text>
</svg>
