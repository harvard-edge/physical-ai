<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="auto" role="img" aria-label="The Complete End-to-End Physical Agent Lifecycle Workflow">
  <defs>
    <style>
      .main-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1F407A; letter-spacing: 0.5px; }
      .main-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
      .step-num { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }
      .step-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; }
      .step-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #475569; line-height: 1.35; }
      .step-contract { font-family: 'SF Mono', Menlo, monospace; font-size: 9px; font-weight: 600; }
      .boundary-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #A51C30; }
      .world-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #A51C30; }
      .world-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #1E293B; line-height: 1.35; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30" />
    </marker>
  </defs>

  <!-- Canvas Surface -->
  <rect width="960" height="440" fill="#FFFFFF" rx="8"/>

  <!-- Top Title Banner -->
  <rect x="20" y="12" width="920" height="40" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
  <text class="main-title" x="480" y="29" text-anchor="middle">THE COMPLETE END-TO-END PHYSICAL AGENT LIFECYCLE</text>
  <text class="main-sub" x="480" y="43" text-anchor="middle">From Natural Language Instruction to 3D Affordances, Expiring Leases, Action Chunks, Safety Barrier Firing &amp; Physical Consequence</text>

  <!-- ================= TOP ROW: 5 COGNITIVE PROPOSAL STEPS (MPU) ================= -->
  <g transform="translate(20, 60)">
    <rect width="920" height="190" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="step-num" x="14" y="20" fill="#64748B">UNTRUSTED COGNITIVE PROPOSAL REALM · LINUX MPU / NPU (0.5–50 Hz)</text>

    <!-- Step 1: Prompt Ingestion -->
    <g transform="translate(14, 30)">
      <rect width="165" height="145" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
      <rect x="8" y="8" width="149" height="16" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8"/>
      <text class="step-num" x="82" y="20" text-anchor="middle" fill="#D97706">1 · PROMPT &amp; SENSE</text>
      <text class="step-title" x="8" y="42" fill="#B45309">Goal Ingestion</text>
      <text class="step-sub" x="8" y="58">
        <tspan x="8" dy="0">• Open-vocabulary text</tspan>
        <tspan x="8" dy="13">• Photon DMA ring buffers</tspan>
        <tspan x="8" dy="13">• Microsecond PTP stamps</tspan>
      </text>
      <rect x="8" y="102" width="149" height="34" rx="4" fill="#FFFFFF" stroke="#FDE68A" stroke-width="0.8"/>
      <text class="step-contract" x="12" y="117" fill="#B45309">Input: (text, I_0)</text>
      <text class="step-contract" x="12" y="129" fill="#0F172A">QoS: PTP t_mid</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="181" y1="102" x2="195" y2="102" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Step 2: 3D Spatial Perception -->
    <g transform="translate(197, 30)">
      <rect width="165" height="145" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
      <rect x="8" y="8" width="149" height="16" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="0.8"/>
      <text class="step-num" x="82" y="20" text-anchor="middle" fill="#2563EB">2 · 3D PERCEPTION</text>
      <text class="step-title" x="8" y="42" fill="#1D4ED8">Affordance Grounding</text>
      <text class="step-sub" x="8" y="58">
        <tspan x="8" dy="0">• DINOv2 / ViT Patch tokens</tspan>
        <tspan x="8" dy="13">• 3D Bounding Hulls B_3D</tspan>
        <tspan x="8" dy="13">• Surface Normals n_hat</tspan>
      </text>
      <rect x="8" y="102" width="149" height="34" rx="4" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text class="step-contract" x="12" y="117" fill="#1D4ED8">Tokens: o_t ∈ R^(NxD)</text>
      <text class="step-contract" x="12" y="129" fill="#0F172A">Frame: SE(3) Targets</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="364" y1="102" x2="378" y2="102" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Step 3: World Modeling -->
    <g transform="translate(380, 30)">
      <rect width="165" height="145" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
      <rect x="8" y="8" width="149" height="16" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="0.8"/>
      <text class="step-num" x="82" y="20" text-anchor="middle" fill="#2563EB">3 · WORLD MODEL</text>
      <text class="step-title" x="8" y="42" fill="#1D4ED8">SE(3) Frame Tree</text>
      <text class="step-sub" x="8" y="58">
        <tspan x="8" dy="0">• Latent JEPA transition</tspan>
        <tspan x="8" dy="13">• Transform Buffer query</tspan>
        <tspan x="8" dy="13">• State TTL Expiration</tspan>
      </text>
      <rect x="8" y="102" width="149" height="34" rx="4" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text class="step-contract" x="12" y="117" fill="#1D4ED8">State: z_t, Σ_t</text>
      <text class="step-contract" x="12" y="129" fill="#0F172A">Tracking: d_drift ≤ δ</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="547" y1="102" x2="561" y2="102" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Step 4: Semantic Lease -->
    <g transform="translate(563, 30)">
      <rect width="165" height="145" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.1"/>
      <rect x="8" y="8" width="149" height="16" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8"/>
      <text class="step-num" x="82" y="20" text-anchor="middle" fill="#D97706">4 · INTENT LEASE</text>
      <text class="step-title" x="8" y="42" fill="#B45309">VLM Semantic Lease</text>
      <text class="step-sub" x="8" y="58">
        <tspan x="8" dy="0">• Kinematic Reachability</tspan>
        <tspan x="8" dy="13">• Time-to-Live TTL = 800ms</tspan>
        <tspan x="8" dy="13">• Drift abort boundary</tspan>
      </text>
      <rect x="8" y="102" width="149" height="34" rx="4" fill="#FFFFFF" stroke="#FDE68A" stroke-width="0.8"/>
      <text class="step-contract" x="12" y="117" fill="#B45309">Lease: L_intent</text>
      <text class="step-contract" x="12" y="129" fill="#0F172A">Auth: 1 Hz Untrusted</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <line x1="730" y1="102" x2="744" y2="102" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr-gray)"/>

    <!-- Step 5: Action Chunking -->
    <g transform="translate(746, 30)">
      <rect width="160" height="145" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
      <rect x="8" y="8" width="144" height="16" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="0.8"/>
      <text class="step-num" x="80" y="20" text-anchor="middle" fill="#2563EB">5 · ACTION CHUNKS</text>
      <text class="step-title" x="8" y="42" fill="#1D4ED8">Trajectory Synthesis</text>
      <text class="step-sub" x="8" y="58">
        <tspan x="8" dy="0">• Diffusion Policy / ACT</tspan>
        <tspan x="8" dy="13">• H=16 waypoints</tspan>
        <tspan x="8" dy="13">• C^2 quintic spline blend</tspan>
      </text>
      <rect x="8" y="102" width="144" height="34" rx="4" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text class="step-contract" x="12" y="117" fill="#1D4ED8">Chunk: A_(t:t+H)</text>
      <text class="step-contract" x="12" y="129" fill="#0F172A">Rate: 20–50 Hz</text>
    </g>
  </g>

  <!-- ================= PROPOSAL–PERMISSION SPLIT DIVIDER ================= -->
  <g transform="translate(20, 256)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="300" y="-10" width="320" height="20" rx="4" fill="#FEF2F2" stroke="#A51C30" stroke-width="1"/>
    <text class="boundary-lbl" x="460" y="4" text-anchor="middle">SHARED SRAM MAILBOX · PROPOSAL–PERMISSION SPLIT</text>
  </g>

  <!-- ================= BOTTOM ROW: STEP 6 REFLEX & STEP 7 PHYSICAL REALITY ================= -->
  <g transform="translate(20, 274)">
    <!-- Step 6: Safety Barrier Projection (MCU) -->
    <g transform="translate(0, 0)">
      <rect width="450" height="150" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
      <rect x="12" y="8" width="220" height="20" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1"/>
      <text class="step-num" x="122" y="22" text-anchor="middle" fill="#059669">6 · 1000 Hz BARE-METAL MCU REFLEX</text>
      <text class="step-title" x="12" y="46" fill="#047857">Safety Barrier Quadratic Program Projection</text>
      <text class="step-sub" x="12" y="64">
        <tspan x="12" dy="0">• Control Barrier Function (CBF): Solves min ||u - p_t||^2 s.t. h_dot ≥ -α(h) in &lt; 65 μs</tspan>
        <tspan x="12" dy="16">• Dynamic stopping clearance audit: d_stop(v) ≤ d_clearance</tspan>
        <tspan x="12" dy="16">• Hardware Watchdog &amp; IEC 60204-1 emergency fallbacks (Cat 0/1/2 safe stops)</tspan>
      </text>
      <rect x="12" y="112" width="426" height="28" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="0.8"/>
      <text class="step-contract" x="20" y="130" fill="#047857">PWM Output: u_safe(t) latched to gate drivers in &lt; 180 μs (Slack = 820 μs)</text>
    </g>

    <!-- Step 7: Physical Consequence & Endogenous Feedback -->
    <g transform="translate(470, 0)">
      <rect width="450" height="150" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.4"/>
      <rect x="12" y="8" width="240" height="20" rx="10" fill="#FFFFFF" stroke="#A51C30" stroke-width="1"/>
      <text class="step-num" x="132" y="22" text-anchor="middle" fill="#A51C30">7 · PHYSICAL CONSEQUENCE &amp; FEEDBACK</text>
      <text class="world-title" x="12" y="46">State Mutation W_t → W_t+1 &amp; Feedback O_t+1</text>
      <text class="world-sub" x="12" y="64">
        <tspan x="12" dy="0">• Phase currents energize motor windings, accelerating mass m with momentum p = mv.</tspan>
        <tspan x="12" dy="16">• Irreversible physical consequences: you cannot `ctrl+z` kinetic energy.</tspan>
        <tspan x="12" dy="16">• Physical action mutates the environment, producing endogenous new photons O_(t+1).</tspan>
      </text>
      <rect x="12" y="112" width="426" height="28" rx="4" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.8"/>
      <text class="step-contract" x="20" y="130" fill="#A51C30">Closed Loop: A_t → W_(t+1) → O_(t+1) feeds back to Step 1 Sensing</text>
    </g>
  </g>

  <!-- Down Arrow MPU -> MCU -->
  <line x1="826" y1="220" x2="826" y2="245" stroke="#64748B" stroke-width="1.5"/>
  <path d="M 826 245 L 826 256 Q 826 265 800 265 L 450 265" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <line x1="450" y1="265" x2="225" y2="265" stroke="#059669" stroke-width="1.5"/>
  <line x1="225" y1="265" x2="225" y2="274" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <!-- Command Arrow MCU -> World -->
  <line x1="470" y1="349" x2="470" y2="349"/>
  <line x1="450" y1="349" x2="470" y2="349" stroke="#A51C30" stroke-width="1.8" marker-end="url(#arr-crimson)"/>

  <!-- Endogenous Feedback Loop (World -> Step 1) -->
  <path d="M 900 424 L 940 424 Q 950 424 950 400 L 950 80 Q 950 65 930 65 L 100 65 Q 90 65 90 80 L 90 88" 
        fill="none" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-crimson)"/>
</svg>
