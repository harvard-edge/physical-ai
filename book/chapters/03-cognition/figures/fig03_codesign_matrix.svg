<svg width="1020" height="660" viewBox="0 0 1020 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #1F407A; }
      .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1F407A; text-anchor: middle; }
      .col-sub { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; fill: #007A87; text-anchor: middle; }
      .row-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1F407A; }
      .row-sub { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #475569; }
      .cell-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #1E293B; }
      .cell-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748B; }
      .ch-tag { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #A51C30; }
    </style>
  </defs>

  <!-- Background container -->
  <rect x="10" y="10" width="1000" height="640" rx="6" fill="#FAFCFE" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Master Title -->
  <text x="510" y="38" text-anchor="middle" class="main-title">THE PHYSICAL AI CO-DESIGN MATRIX</text>
  <text x="510" y="58" text-anchor="middle" style="font-family: -apple-system, sans-serif; font-size: 12px; fill: #64748B;">Crossing Cognitive Agency (Chapter 3 Rows) with Physical Reality (Chapter 2 Columns)</text>

  <!-- COLUMN HEADERS (CHAPTER 2 PHYSICAL CONSTRAINTS) -->
  <g transform="translate(230, 75)">
    <!-- Col 1 -->
    <rect x="0" y="0" width="180" height="48" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
    <text x="90" y="20" class="col-header">1. TIME &amp; FRESHNESS</text>
    <text x="90" y="36" class="col-sub">Δt_wall, P99 Tails</text>

    <!-- Col 2 -->
    <rect x="190" y="0" width="180" height="48" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
    <text x="280" y="20" class="col-header">2. INERTIA &amp; STOPPING</text>
    <text x="280" y="36" class="col-sub">p = mv, d_stop Envelopes</text>

    <!-- Col 3 -->
    <rect x="380" y="0" width="180" height="48" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
    <text x="470" y="20" class="col-header">3. JERK &amp; ACTUATION</text>
    <text x="470" y="36" class="col-sub">dτ/dt, Gearbox Tooth Shear</text>

    <!-- Col 4 -->
    <rect x="570" y="0" width="180" height="48" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
    <text x="660" y="20" class="col-header">4. SILICON &amp; UMA BUS</text>
    <text x="660" y="36" class="col-sub">DMA Saturation, Zero Heap</text>
  </g>

  <!-- ROW 1: PERCEIVE (CHAPTER 4) -->
  <g transform="translate(30, 135)">
    <rect x="0" y="0" width="190" height="92" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1.4"/>
    <text x="12" y="24" class="row-header" fill="#007A87">STAGE 1: PERCEIVE</text>
    <text x="12" y="44" class="row-sub">VLA Spatial Tokens</text>
    <text x="12" y="62" class="row-sub">3D Affordances SE(3)</text>
    <text x="12" y="82" class="ch-tag">──► CHAPTER 4</text>

    <!-- Cell 1,1 -->
    <rect x="200" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="210" y="24" class="cell-title">Exposure Latency</text>
    <text x="210" y="42" class="cell-desc">Sensor photon collection</text>
    <text x="210" y="58" class="cell-desc">Hardware PTP timestamp</text>
    <text x="210" y="74" class="cell-desc">cross-sensor sync</text>

    <!-- Cell 1,2 -->
    <rect x="390" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="400" y="24" class="cell-title">Motion Blur Smear</text>
    <text x="400" y="42" class="cell-desc">Δx_blur = v · t_exp</text>
    <text x="400" y="58" class="cell-desc">Diffuse gradient destroys</text>
    <text x="400" y="74" class="cell-desc">millimeter grasp precision</text>

    <!-- Cell 1,3 -->
    <rect x="580" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="590" y="24" class="cell-title">Rolling Shutter Shear</text>
    <text x="590" y="42" class="cell-desc">Sequential line readout</text>
    <text x="590" y="58" class="cell-desc">deforms geometric frames</text>
    <text x="590" y="74" class="cell-desc">under angular velocity ω</text>

    <!-- Cell 1,4 -->
    <rect x="770" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="780" y="24" class="cell-title">DMA Ingestion Tax</text>
    <text x="780" y="42" class="cell-desc">1.5 GB/s video write bursts</text>
    <text x="780" y="58" class="cell-desc">saturate UMA crossbar;</text>
    <text x="780" y="74" class="cell-desc">zero-copy ring buffers</text>
  </g>

  <!-- ROW 2: REMEMBER (CHAPTER 5) -->
  <g transform="translate(30, 237)">
    <rect x="0" y="0" width="190" height="92" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1.4"/>
    <text x="12" y="24" class="row-header" fill="#007A87">STAGE 2: REMEMBER</text>
    <text x="12" y="44" class="row-sub">Latent World Models</text>
    <text x="12" y="62" class="row-sub">SE(3) Transform Trees</text>
    <text x="12" y="82" class="ch-tag">──► CHAPTER 5</text>

    <!-- Cell 2,1 -->
    <rect x="200" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="210" y="24" class="cell-title">Belief Age Decay</text>
    <text x="210" y="42" class="cell-desc">Unobserved state aging</text>
    <text x="210" y="58" class="cell-desc">State validity leases</text>
    <text x="210" y="74" class="cell-desc">expire after Δt_TTL</text>

    <!-- Cell 2,2 -->
    <rect x="390" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="400" y="24" class="cell-title">Occlusion Drift</text>
    <text x="400" y="42" class="cell-desc">σ(t) = σ0 + v_target · Δt</text>
    <text x="400" y="58" class="cell-desc">Expanding spatial volume</text>
    <text x="400" y="74" class="cell-desc">enforces speed limits</text>

    <!-- Cell 2,3 -->
    <rect x="580" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="590" y="24" class="cell-title">Winding Thermal Drift</text>
    <text x="590" y="42" class="cell-desc">Stator I²R temperature</text>
    <text x="590" y="58" class="cell-desc">rise derates maximum</text>
    <text x="590" y="74" class="cell-desc">available actuator torque</text>

    <!-- Cell 2,4 -->
    <rect x="770" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="780" y="24" class="cell-title">Frame Graph Lookups</text>
    <text x="780" y="42" class="cell-desc">SE(3) tf2 transform graph</text>
    <text x="780" y="58" class="cell-desc">traversal latency must be</text>
    <text x="780" y="74" class="cell-desc">cached in shared SRAM</text>
  </g>

  <!-- ROW 3: REASON (CHAPTER 6) -->
  <g transform="translate(30, 339)">
    <rect x="0" y="0" width="190" height="92" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1.4"/>
    <text x="12" y="24" class="row-header" fill="#007A87">STAGE 3: REASON</text>
    <text x="12" y="44" class="row-sub">Multimodal VLMs</text>
    <text x="12" y="62" class="row-sub">Intent Leases L_intent</text>
    <text x="12" y="82" class="ch-tag">──► CHAPTER 6</text>

    <!-- Cell 3,1 -->
    <rect x="200" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="210" y="24" class="cell-title">Slow Deliberation (1 Hz)</text>
    <text x="210" y="42" class="cell-desc">High compute latency</text>
    <text x="210" y="58" class="cell-desc">decoupled from control;</text>
    <text x="210" y="74" class="cell-desc">operates as proposal service</text>

    <!-- Cell 3,2 -->
    <rect x="390" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="400" y="24" class="cell-title">Kinematic Reach Bounds</text>
    <text x="400" y="42" class="cell-desc">Algebraic workspace</text>
    <text x="400" y="58" class="cell-desc">filter validates 3D targets</text>
    <text x="400" y="74" class="cell-desc">before trajectory planning</text>

    <!-- Cell 3,3 -->
    <rect x="580" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="590" y="24" class="cell-title">Speed Clamping</text>
    <text x="590" y="42" class="cell-desc">Intent lease enforces</text>
    <text x="590" y="58" class="cell-desc">maximum operational</text>
    <text x="590" y="74" class="cell-desc">velocity clamp ||v|| ≤ vmax</text>

    <!-- Cell 3,4 -->
    <rect x="770" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="780" y="24" class="cell-title">Expiring Leases (L_intent)</text>
    <text x="780" y="42" class="cell-desc">Bounded target volume B,</text>
    <text x="780" y="58" class="cell-desc">hard TTL expiration;</text>
    <text x="780" y="74" class="cell-desc">fall back to safe hold</text>
  </g>

  <!-- ROW 4: PLAN (CHAPTER 7) -->
  <g transform="translate(30, 441)">
    <rect x="0" y="0" width="190" height="92" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1.4"/>
    <text x="12" y="24" class="row-header" fill="#007A87">STAGE 4: PLAN</text>
    <text x="12" y="44" class="row-sub">Action Chunking (ACT)</text>
    <text x="12" y="62" class="row-sub">Diffusion Policies</text>
    <text x="12" y="82" class="ch-tag">──► CHAPTER 7</text>

    <!-- Cell 4,1 -->
    <rect x="200" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="210" y="24" class="cell-title">Delay Amortization</text>
    <text x="210" y="42" class="cell-desc">Chunk horizon H=16</text>
    <text x="210" y="58" class="cell-desc">amortizes 50ms compute lag:</text>
    <text x="210" y="74" class="cell-desc">t_amort = t_infer / H</text>

    <!-- Cell 4,2 -->
    <rect x="390" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="400" y="24" class="cell-title">Receding Horizon</text>
    <text x="400" y="42" class="cell-desc">Overlapping chunk</text>
    <text x="400" y="58" class="cell-desc">temporal ensembling</text>
    <text x="400" y="74" class="cell-desc">prevents end-of-chunk stall</text>

    <!-- Cell 4,3 -->
    <rect x="580" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="590" y="24" class="cell-title">C² Jerk Continuity</text>
    <text x="590" y="42" class="cell-desc">Quintic polynomial splines</text>
    <text x="590" y="58" class="cell-desc">eliminate infinite torque</text>
    <text x="590" y="74" class="cell-desc">rate &amp; gearbox tooth shear</text>

    <!-- Cell 4,4 -->
    <rect x="770" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="780" y="24" class="cell-title">SRAM Chunk Ring Buffer</text>
    <text x="780" y="42" class="cell-desc">Atomic lock-free queue</text>
    <text x="780" y="58" class="cell-desc">bridges 20 Hz MPU planner</text>
    <text x="780" y="74" class="cell-desc">to 1 kHz MCU interpolator</text>
  </g>

  <!-- ROW 5: EXECUTE (CHAPTER 8) -->
  <g transform="translate(30, 543)">
    <rect x="0" y="0" width="190" height="92" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1.4"/>
    <text x="12" y="24" class="row-header" fill="#007A87">STAGE 5: EXECUTE</text>
    <text x="12" y="44" class="row-sub">1 kHz Real-Time Reflex</text>
    <text x="12" y="62" class="row-sub">Control Barrier Functions</text>
    <text x="12" y="82" class="ch-tag">──► CHAPTER 8</text>

    <!-- Cell 5,1 -->
    <rect x="200" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="210" y="24" class="cell-title">1000 Hz Determinism</text>
    <text x="210" y="42" class="cell-desc">Non-negotiable 1ms tick;</text>
    <text x="210" y="58" class="cell-desc">jitter bounded to &lt; 15μs;</text>
    <text x="210" y="74" class="cell-desc">zero OS paging stalls</text>

    <!-- Cell 5,2 -->
    <rect x="390" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="400" y="24" class="cell-title">Dynamic Stopping (d_stop)</text>
    <text x="400" y="42" class="cell-desc">Continuous clearance check:</text>
    <text x="400" y="58" class="cell-desc">d_stop ≤ d_clear;</text>
    <text x="400" y="74" class="cell-desc">IEC 60204-1 dynamic halt</text>

    <!-- Cell 5,3 -->
    <rect x="580" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="590" y="24" class="cell-title">Safe Torque Off (STO)</text>
    <text x="590" y="42" class="cell-desc">Hardware power relays &amp;</text>
    <text x="590" y="58" class="cell-desc">gate enable lines under</text>
    <text x="590" y="74" class="cell-desc">exclusive MCU authority</text>

    <!-- Cell 5,4 -->
    <rect x="770" y="0" width="180" height="92" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="780" y="24" class="cell-title">Bare-Metal CBF QP Solver</text>
    <text x="780" y="42" class="cell-desc">Zero dynamic heap malloc;</text>
    <text x="780" y="58" class="cell-desc">projects proposals onto</text>
    <text x="780" y="74" class="cell-desc">forward safe set: h(x) ≥ 0</text>
  </g>
</svg>