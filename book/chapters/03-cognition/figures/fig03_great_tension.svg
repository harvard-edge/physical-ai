<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="100%" height="auto" role="img" aria-label="The Fundamental Tug-of-War in Physical AI and Its Systems Reconciliation">
  <defs>
    <style>
      .main-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1F407A; letter-spacing: 0.5px; }
      .main-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
      .realm-tag { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.6px; }
      .realm-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
      .realm-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #64748B; }
      .sec-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .body-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #334155; line-height: 1.45; }
      .bullet-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
      .contract-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #047857; }
      .contract-body { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #1E293B; line-height: 1.4; }
      .tension-tag { font-family: 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 700; }
    </style>
    <marker id="arr-left" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#2563EB" />
    </marker>
    <marker id="arr-right" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="460" fill="#FFFFFF" rx="8"/>

  <!-- Top Banner -->
  <rect x="20" y="14" width="900" height="42" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
  <text class="main-title" x="470" y="33" text-anchor="middle">THE FUNDAMENTAL TUG-OF-WAR IN PHYSICAL AI</text>
  <text class="main-sub" x="470" y="47" text-anchor="middle">Reconciling High-Capacity Stochastic Deliberation with Deterministic Real-Time Physics</text>

  <!-- ================= LEFT REALM: AI DELIBERATION ================= -->
  <g transform="translate(20, 68)">
    <rect width="280" height="240" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
    
    <!-- Tag -->
    <rect x="12" y="10" width="160" height="20" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
    <text class="realm-tag" x="92" y="24" text-anchor="middle" fill="#2563EB">AI DELIBERATION REALM</text>
    
    <!-- Titles -->
    <text class="realm-title" x="12" y="48" fill="#1D4ED8">Cognitive Capacity</text>
    <text class="realm-sub" x="12" y="62">Demands Compute, Tokens &amp; Time</text>
    
    <!-- Details -->
    <text class="sec-hdr" x="12" y="82" fill="#1D4ED8">Computational Nature:</text>
    <text class="bullet-txt" x="16" y="98">• High-capacity VLMs &amp; Diffusion policies</text>
    <text class="bullet-txt" x="16" y="114">• Billions of parameters &amp; KV cache matrices</text>
    <text class="bullet-txt" x="16" y="130">• Non-deterministic stochastic outputs</text>
    
    <!-- Divider -->
    <line x1="12" y1="142" x2="268" y2="142" stroke="#DBEAFE" stroke-width="1"/>
    
    <!-- Timing -->
    <text class="sec-hdr" x="12" y="160" fill="#1D4ED8">Temporal Profile:</text>
    <text class="tension-tag" x="12" y="178" fill="#1D4ED8">Slow Cadence: 0.5–50 Hz</text>
    <text class="tension-tag" x="12" y="196" fill="#B45309">P99 Latency Tails ≈ 500–1500 ms</text>
    <text class="body-txt" x="12" y="214" fill="#64748B">Operating substrate: Linux MPU / Edge NPU.</text>
  </g>

  <!-- ================= TENSION TUG-OF-WAR ARROW ================= -->
  <g transform="translate(305, 175)">
    <!-- Tug line -->
    <line x1="10" y1="0" x2="320" y2="0" stroke="#64748B" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="25" y1="0" x2="0" y2="0" stroke="#2563EB" stroke-width="3" marker-end="url(#arr-left)"/>
    <line x1="305" y1="0" x2="330" y2="0" stroke="#A51C30" stroke-width="3" marker-end="url(#arr-right)"/>
    
    <!-- Central Tension Badge -->
    <rect x="75" y="-22" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.4"/>
    <text class="realm-tag" x="165" y="-5" text-anchor="middle" fill="#A51C30">STRUCTURAL TENSION</text>
    <text class="body-txt" x="165" y="11" text-anchor="middle" font-size="9.5px" font-weight="600" fill="#475569">Latent Time vs. Physical Reality</text>
  </g>

  <!-- ================= RIGHT REALM: PHYSICAL DYNAMICS ================= -->
  <g transform="translate(640, 68)">
    <rect width="280" height="240" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2"/>
    
    <!-- Tag -->
    <rect x="12" y="10" width="180" height="20" rx="10" fill="#FFFFFF" stroke="#A51C30" stroke-width="1"/>
    <text class="realm-tag" x="102" y="24" text-anchor="middle" fill="#A51C30">PHYSICAL DYNAMICS REALM</text>
    
    <!-- Titles -->
    <text class="realm-title" x="12" y="48" fill="#A51C30">Kinetic Determinism</text>
    <text class="realm-sub" x="12" y="62">Demands Microseconds &amp; Hard Bounds</text>
    
    <!-- Details -->
    <text class="sec-hdr" x="12" y="82" fill="#A51C30">Physical Reality:</text>
    <text class="bullet-txt" x="16" y="98">• Kinetic momentum p = mv &amp; inertia</text>
    <text class="bullet-txt" x="16" y="114">• Dynamic stopping distance d_stop(v)</text>
    <text class="bullet-txt" x="16" y="130">• Actuator Joule heating &amp; gear shear</text>
    
    <!-- Divider -->
    <line x1="12" y1="142" x2="268" y2="142" stroke="#FEE2E2" stroke-width="1"/>
    
    <!-- Timing -->
    <text class="sec-hdr" x="12" y="160" fill="#A51C30">Temporal Constraint:</text>
    <text class="tension-tag" x="12" y="178" fill="#A51C30">Fast Reflex: 1000 Hz (1.0 ms)</text>
    <text class="tension-tag" x="12" y="196" fill="#047857">Hard Deadline: τ_world ≤ 1–10 ms</text>
    <text class="body-txt" x="12" y="214" fill="#64748B">Operating substrate: Real-Time Bare-Metal MCU.</text>
  </g>

  <!-- ================= BOTTOM CARD: THE 3 RECONCILING CONTRACTS ================= -->
  <g transform="translate(20, 320)">
    <rect width="900" height="126" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
    
    <!-- Header -->
    <text class="contract-hdr" x="16" y="22">HOW PHYSICAL AI RECONCILES THE TUG-OF-WAR: THREE ARCHITECTURAL CONTRACTS</text>
    
    <!-- Three Pillars Grid -->
    <g transform="translate(16, 32)">
      <!-- Pillar 1 -->
      <g transform="translate(0, 0)">
        <rect width="275" height="80" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text class="sec-hdr" x="10" y="18" fill="#047857">1. Proposal–Permission Privilege Split</text>
        <text class="contract-body" x="10" y="34">
          <tspan x="10" dy="0">• Untrusted MPU proposals never touch motors.</tspan>
          <tspan x="10" dy="14">• Dedicated 1 kHz MCU filters commands via</tspan>
          <tspan x="10" dy="14">  Control Barrier Functions: h(x) ≥ 0.</tspan>
        </text>
      </g>

      <!-- Pillar 2 -->
      <g transform="translate(295, 0)">
        <rect width="275" height="80" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text class="sec-hdr" x="10" y="18" fill="#047857">2. Action Chunking (System 1.5)</text>
        <text class="contract-body" x="10" y="34">
          <tspan x="10" dy="0">• Amortizes neural latency over future horizon H.</tspan>
          <tspan x="10" dy="14">• Synthesizes continuous C^2 jerk-bounded</tspan>
          <tspan x="10" dy="14">  trajectories executed locally at 1 kHz.</tspan>
        </text>
      </g>

      <!-- Pillar 3 -->
      <g transform="translate(590, 0)">
        <rect width="278" height="80" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text class="sec-hdr" x="10" y="18" fill="#047857">3. Expiring Intent Leases (L_intent)</text>
        <text class="contract-body" x="10" y="34">
          <tspan x="10" dy="0">• Binds proposals to time-to-live validity (TTL).</tspan>
          <tspan x="10" dy="14">• Continuous state tracker revokes lease on drift,</tspan>
          <tspan x="10" dy="14">  commanding deterministic safe position hold.</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
