<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="100%" height="auto" role="img" aria-label="The Three Cadences of Physical AI: System 2, System 1.5, and System 1">
  <defs>
    <style>
      .banner-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1F407A; letter-spacing: 0.5px; }
      .banner-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; }
      .cadence-badge { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.6px; }
      .col-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
      .col-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #64748B; }
      .sec-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .body-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #334155; line-height: 1.45; }
      .bullet-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #475569; }
      .contract-box { fill: #FFFFFF; stroke-width: 0.8; }
      .contract-title { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; }
      .contract-code { font-family: 'SF Mono', Menlo, monospace; font-size: 9.5px; font-weight: 600; }
      .timing-tag { font-family: 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Background Surface -->
  <rect width="940" height="460" fill="#FFFFFF" rx="8"/>

  <!-- Top Title Banner -->
  <rect x="20" y="14" width="900" height="42" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
  <text class="banner-title" x="470" y="33" text-anchor="middle">THE THREE CADENCES OF PHYSICAL AI</text>
  <text class="banner-sub" x="470" y="47" text-anchor="middle">Multi-Rate Asynchronous Hierarchy: Untrusted Semantic Intent vs. Continuous Trajectory Chunks vs. Bare-Metal Reflex</text>

  <!-- ================= CADENCE 1: SYSTEM 2 (AMBER) ================= -->
  <g transform="translate(20, 68)">
    <rect width="285" height="375" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
    
    <!-- Cadence Pill -->
    <rect x="12" y="12" width="160" height="22" rx="11" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
    <text class="cadence-badge" x="92" y="27" text-anchor="middle" fill="#D97706">SYSTEM 2 · 0.5–2 Hz</text>
    
    <!-- Titles -->
    <text class="col-title" x="12" y="56" fill="#B45309">Semantic Intent Engine</text>
    <text class="col-sub" x="12" y="72">Linux MPU / Neural Accelerator (NPU)</text>
    
    <!-- Execution Profile -->
    <text class="sec-hdr" x="12" y="96" fill="#B45309">Workload &amp; Representation:</text>
    <text class="body-txt" x="12" y="112">Open-world cognitive deliberation</text>
    <text class="bullet-txt" x="16" y="128">• Multimodal VLM (7B–70B parameters)</text>
    <text class="bullet-txt" x="16" y="144">• 3D spatial affordance grounding</text>
    <text class="bullet-txt" x="16" y="160">• Kinematic reachability screening</text>
    <text class="bullet-txt" x="16" y="176">• Untrusted candidate proposals</text>
    
    <!-- Divider -->
    <line x1="12" y1="190" x2="273" y2="190" stroke="#FDE68A" stroke-width="1"/>
    
    <!-- Timing Profile -->
    <text class="sec-hdr" x="12" y="210" fill="#B45309">Latency Tail Profile:</text>
    <text class="timing-tag" x="12" y="228" fill="#B45309">P50 ≈ 650 ms  ·  P99 ≈ 1,450 ms</text>
    <text class="body-txt" x="12" y="244" fill="#64748B">Subject to OS jitter and memory stalls.</text>
    
    <!-- Contract Box -->
    <rect class="contract-box" x="12" y="260" width="261" height="100" rx="4" stroke="#FDE68A"/>
    <text class="contract-title" x="20" y="280" fill="#B45309">OUTPUT CONTRACT: EXPIRING LEASE</text>
    <text class="contract-code" x="20" y="298" fill="#0F172A">L_intent = (T_target, Δt_TTL, δ_drift)</text>
    <text class="body-txt" x="20" y="318" font-size="9.5px">
      <tspan x="20" dy="0">• Metric SE(3) target coordinate frame</tspan>
      <tspan x="20" dy="14">• Time-to-Live lease (e.g., TTL = 800 ms)</tspan>
      <tspan x="20" dy="14">• Continuous drift abort threshold</tspan>
    </text>
  </g>

  <!-- Connection Arrow 1 -> 2 -->
  <line x1="307" y1="240" x2="325" y2="240" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ================= CADENCE 2: SYSTEM 1.5 (COBALT BLUE) ================= -->
  <g transform="translate(328, 68)">
    <rect width="285" height="375" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
    
    <!-- Cadence Pill -->
    <rect x="12" y="12" width="170" height="22" rx="11" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
    <text class="cadence-badge" x="97" y="27" text-anchor="middle" fill="#2563EB">SYSTEM 1.5 · 20–50 Hz</text>
    
    <!-- Titles -->
    <text class="col-title" x="12" y="56" fill="#1D4ED8">Action Chunk Planning</text>
    <text class="col-sub" x="12" y="72">Linux MPU / Neural Accelerator (NPU)</text>
    
    <!-- Execution Profile -->
    <text class="sec-hdr" x="12" y="96" fill="#1D4ED8">Workload &amp; Representation:</text>
    <text class="body-txt" x="12" y="112">Receding-horizon trajectory synthesis</text>
    <text class="bullet-txt" x="16" y="128">• Diffusion Policy / ACT decoders</text>
    <text class="bullet-txt" x="16" y="144">• Predicts H=16 action waypoints</text>
    <text class="bullet-txt" x="16" y="160">• C^2 jerk-continuous spline blend</text>
    <text class="bullet-txt" x="16" y="176">• Exponential temporal ensembling</text>
    
    <!-- Divider -->
    <line x1="12" y1="190" x2="273" y2="190" stroke="#BFDBFE" stroke-width="1"/>
    
    <!-- Timing Profile -->
    <text class="sec-hdr" x="12" y="210" fill="#1D4ED8">Latency Tail Profile:</text>
    <text class="timing-tag" x="12" y="228" fill="#1D4ED8">P50 ≈ 22 ms  ·  P99 ≈ 44 ms</text>
    <text class="body-txt" x="12" y="244" fill="#64748B">Amortizes inference delay over horizon H.</text>
    
    <!-- Contract Box -->
    <rect class="contract-box" x="12" y="260" width="261" height="100" rx="4" stroke="#BFDBFE"/>
    <text class="contract-title" x="20" y="280" fill="#1D4ED8">OUTPUT CONTRACT: TRAJECTORY CHUNK</text>
    <text class="contract-code" x="20" y="298" fill="#0F172A">A_(t:t+H) ∈ R^(H x D_act)</text>
    <text class="body-txt" x="20" y="318" font-size="9.5px">
      <tspan x="20" dy="0">• Lock-free shared SRAM ring buffer</tspan>
      <tspan x="20" dy="14">• Bounded derivative jerk: |j| ≤ j_max</tspan>
      <tspan x="20" dy="14">• Asynchronous state re-anchoring on veto</tspan>
    </text>
  </g>

  <!-- Connection Arrow 2 -> 3 -->
  <line x1="615" y1="240" x2="633" y2="240" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ================= CADENCE 3: SYSTEM 1 (EMERALD TEAL) ================= -->
  <g transform="translate(635, 68)">
    <rect width="285" height="375" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
    
    <!-- Cadence Pill -->
    <rect x="12" y="12" width="180" height="22" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1"/>
    <text class="cadence-badge" x="102" y="27" text-anchor="middle" fill="#059669">SYSTEM 1 · 1000 Hz MCU</text>
    
    <!-- Titles -->
    <text class="col-title" x="12" y="56" fill="#047857">Real-Time Safety Reflex</text>
    <text class="col-sub" x="12" y="72">Bare-Metal / FreeRTOS Microcontroller</text>
    
    <!-- Execution Profile -->
    <text class="sec-hdr" x="12" y="96" fill="#047857">Workload &amp; Representation:</text>
    <text class="body-txt" x="12" y="112">Deterministic mathematical safety barrier</text>
    <text class="bullet-txt" x="16" y="128">• Control Barrier Functions: h(x) ≥ 0</text>
    <text class="bullet-txt" x="16" y="144">• Quadratic program solve in &lt; 65 μs</text>
    <text class="bullet-txt" x="16" y="160">• Dynamic stopping audit: d_stop ≤ d_clear</text>
    <text class="bullet-txt" x="16" y="176">• Zero heap allocation (zero malloc)</text>
    
    <!-- Divider -->
    <line x1="12" y1="190" x2="273" y2="190" stroke="#A7F3D0" stroke-width="1"/>
    
    <!-- Timing Profile -->
    <text class="sec-hdr" x="12" y="210" fill="#047857">Deterministic Execution Budget:</text>
    <text class="timing-tag" x="12" y="228" fill="#047857">Loop = 175 μs  ·  Slack = 825 μs</text>
    <text class="body-txt" x="12" y="244" fill="#64748B">Hard real-time: P99 ≤ 1.000 ms.</text>
    
    <!-- Contract Box -->
    <rect class="contract-box" x="12" y="260" width="261" height="100" rx="4" stroke="#A7F3D0"/>
    <text class="contract-title" x="20" y="280" fill="#047857">OUTPUT CONTRACT: MOTOR GATE PWM</text>
    <text class="contract-code" x="20" y="298" fill="#047857">PWM_register &lt;- u_safe(t)</text>
    <text class="body-txt" x="20" y="318" font-size="9.5px">
      <tspan x="20" dy="0">• Sole physical authority over motor coils</tspan>
      <tspan x="20" dy="14">• Fallback: IEC 60204-1 Cat 0/1/2 safe stop</tspan>
      <tspan x="20" dy="14">• Hardware watchdog trips on MPU stall</tspan>
    </text>
  </g>
</svg>
