<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">THE MULTI-OBJECTIVE PERCEPTION OPERATING FRONTIER</text>
  <text class="subtitle" x="20" y="46">Navigating the five-variable Pareto trade-off: Quality (Q), Latency (L), Memory (M), Energy (E), and Bus Bandwidth (B)</text>

  <!-- ================= LEFT: 2D PARETO FRONTIER CURVE ================= -->
  <g transform="translate(20, 60)">
    <rect width="470" height="420" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="22" fill="#1E293B">PARETO OPTIMAL TRADEOFF: ACCURACY VS. SENSE-TO-ACTUATION LATENCY</text>

    <!-- Plot Area -->
    <g transform="translate(60, 45)">
      <!-- Axes -->
      <line x1="0" y1="310" x2="380" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-axis)"/>
      <line x1="0" y1="310" x2="0" y2="10" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-axis)"/>

      <!-- Axis Labels -->
      <text class="mono-txt" x="380" y="328" text-anchor="end" fill="#475569">Perception Latency L (ms) →</text>
      <text class="mono-txt" x="-10" y="8" text-anchor="end" fill="#475569" transform="rotate(-90 -10,8)">Grasp Affordance Accuracy Q (%) →</text>

      <!-- Freshness Wall Barrier (Vertical Line at Latency = 60ms) -->
      <line x1="260" y1="10" x2="260" y2="310" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,4"/>
      <rect x="265" y="15" width="105" height="32" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1"/>
      <text class="mono-txt" x="317" y="28" text-anchor="middle" font-weight="700" fill="#A51C30">FRESHNESS WALL</text>
      <text class="body-txt" x="317" y="41" text-anchor="middle" fill="#A51C30">Δt_fresh > 60 ms (Unstable)</text>

      <!-- Shaded Inadmissible Region (Right of Freshness Wall) -->
      <rect x="260" y="10" width="115" height="300" fill="#FEF2F2" opacity="0.4"/>

      <!-- Pareto Frontier Curve -->
      <path d="M 40 270 C 80 230, 130 90, 200 60 C 250 45, 300 35, 360 30" fill="none" stroke="#007A87" stroke-width="2.5"/>

      <!-- Operating Point 1: 240p @ 120Hz (Low Latency, Low Quality) -->
      <circle cx="50" cy="260" r="7" fill="#FDF8F0" stroke="#B87333" stroke-width="2"/>
      <text class="mono-txt" x="62" y="260" fill="#B87333" font-weight="700">240p @ 120Hz</text>
      <text class="body-txt" x="62" y="272" fill="#64748B">L = 4.2 ms | Q = 61% (Blind)</text>

      <!-- Operating Point 2: SWEET SPOT (720p/1080p @ 30/60Hz) -->
      <circle cx="195" cy="65" r="9" fill="#F0FDF4" stroke="#059669" stroke-width="2.5"/>
      <rect x="110" y="90" width="170" height="58" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
      <text class="badge-txt" x="195" y="106" text-anchor="middle" fill="#059669">★ OPTIMAL EMBEDDED OPERATING POINT</text>
      <text class="mono-txt" x="195" y="122" text-anchor="middle" font-weight="700" fill="#1E293B">720p @ 60Hz / ViT-B DINOv2</text>
      <text class="body-txt" x="195" y="138" text-anchor="middle" fill="#059669">L = 21.5 ms | Q = 94.2% | BW = 8.2 GB/s</text>

      <!-- Operating Point 3: 4K @ 60Hz (Violates Freshness Wall) -->
      <circle cx="330" cy="32" r="7" fill="#FEF2F2" stroke="#A51C30" stroke-width="2"/>
      <text class="mono-txt" x="330" y="58" text-anchor="middle" fill="#A51C30" font-weight="700">4K @ 60Hz (ViT-G)</text>
      <text class="body-txt" x="330" y="70" text-anchor="middle" fill="#A51C30">L = 118 ms ❌ Stalls Bus</text>

      <!-- Grid ticks -->
      <text class="mono-txt" x="0" y="325" text-anchor="middle" fill="#64748B">0</text>
      <text class="mono-txt" x="100" y="325" text-anchor="middle" fill="#64748B">20ms</text>
      <text class="mono-txt" x="200" y="325" text-anchor="middle" fill="#64748B">45ms</text>
      <text class="mono-txt" x="260" y="325" text-anchor="middle" fill="#A51C30" font-weight="700">60ms</text>
      <text class="mono-txt" x="350" y="325" text-anchor="middle" fill="#64748B">120ms</text>
    </g>
  </g>

  <!-- ================= RIGHT: 5-VARIABLE BUDGET COMPARISON ================= -->
  <g transform="translate(505, 60)">
    <rect width="415" height="420" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="22" fill="#1E293B">5-VARIABLE EMBEDDED SYSTEM BUDGET AUDIT</text>

    <!-- Card 1: 4K @ 60Hz (Unfeasible) -->
    <g transform="translate(14, 35)">
      <rect width="387" height="110" rx="5" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2"/>
      <rect x="0" y="0" width="387" height="22" rx="5" fill="#A51C30"/>
      <rect x="0" y="16" width="387" height="6" fill="#A51C30"/>
      <text class="tag-txt" x="10" y="15" fill="#FFFFFF">❌ CLOUD ML MINDSET: 4K @ 60Hz + ViT-GIANT (7B VLA)</text>
      
      <text class="body-txt" x="12" y="38">
        <tspan x="12" dy="0">• <tspan font-weight="700">Quality (Q):</tspan> 98.1% (Superfluous high resolution)</tspan>
        <tspan x="12" dy="15">• <tspan font-weight="700" fill="#A51C30">Latency (L):</tspan> 118 ms (Freshness Wall breached, P99 = 240 ms)</tspan>
        <tspan x="12" dy="15">• <tspan font-weight="700" fill="#A51C30">Bus Bandwidth (B):</tspan> 31.4 GB/s (92% saturation of LPDDR5)</tspan>
        <tspan x="12" dy="15">• <tspan font-weight="700">Power &amp; Thermal (E):</tspan> 38 Watts (Rapid thermal throttle to 5 Hz)</tspan>
      </text>
    </g>

    <!-- Card 2: 720p @ 60Hz (Optimal Physical AI) -->
    <g transform="translate(14, 155)">
      <rect width="387" height="115" rx="5" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/>
      <rect x="0" y="0" width="387" height="22" rx="5" fill="#059669"/>
      <rect x="0" y="16" width="387" height="6" fill="#059669"/>
      <text class="tag-txt" x="10" y="15" fill="#FFFFFF">✓ PHYSICAL AI SWEET SPOT: 720p @ 60Hz + DINOv2 / ViT-B</text>
      
      <text class="body-txt" x="12" y="38">
        <tspan x="12" dy="0">• <tspan font-weight="700" fill="#059669">Quality (Q):</tspan> 94.2% (Millimeter spatial accuracy for grasping)</tspan>
        <tspan x="12" dy="15">• <tspan font-weight="700" fill="#059669">Latency (L):</tspan> 21.5 ms (Bounded P99 ≤ 24.2 ms with zero-copy DMA)</tspan>
        <tspan x="12" dy="15">• <tspan font-weight="700" fill="#059669">Bus Bandwidth (B):</tspan> 8.2 GB/s (Leaves 75% headroom for CPU/MCU)</tspan>
        <tspan x="12" dy="15">• <tspan font-weight="700" fill="#059669">Power &amp; Thermal (E):</tspan> 12.5 Watts (Sustained steady-state operation)</tspan>
      </text>
    </g>

    <!-- Card 3: 240p @ 120Hz (Degraded Quality) -->
    <g transform="translate(14, 280)">
      <rect width="387" height="110" rx="5" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
      <rect x="0" y="0" width="387" height="22" rx="5" fill="#B87333"/>
      <rect x="0" y="16" width="387" height="6" fill="#B87333"/>
      <text class="tag-txt" x="10" y="15" fill="#FFFFFF">⚠️ TINYML RETROFIT: 240p @ 120Hz + TINY CNN</text>
      
      <text class="body-txt" x="12" y="38">
        <tspan x="12" dy="0">• <tspan font-weight="700" fill="#B87333">Quality (Q):</tspan> 61.0% (Loses thin object edges &amp; contact normal vectors)</tspan>
        <tspan x="12" dy="15">• <tspan font-weight="700">Latency (L):</tspan> 4.2 ms (Extremely fast, but blind to depth nuances)</tspan>
        <tspan x="12" dy="15">• <tspan font-weight="700">Bus Bandwidth (B):</tspan> 0.9 GB/s (Near-zero bus pressure)</tspan>
        <tspan x="12" dy="15">• <tspan font-weight="700">Power &amp; Thermal (E):</tspan> 4.1 Watts (Extremely low power)</tspan>
      </text>
    </g>
  </g>
</svg>
