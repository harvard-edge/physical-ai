<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">SPATIAL AFFORDANCE TOKENIZATION VS. PASSIVE DIGITAL CLASSIFICATION</text>
  <text class="subtitle" x="20" y="46">Transforming 2D camera pixels into metric SE(3) coordinates, contact normals, and physical affordances</text>

  <!-- ================= TOP: DIGITAL ML VS PHYSICAL AI PARADIGM ================= -->
  
  <!-- LEFT: PASSIVE DIGITAL CLASSIFICATION -->
  <g transform="translate(20, 60)">
    <rect width="440" height="150" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.3"/>
    <rect x="0" y="0" width="440" height="24" rx="6" fill="#A51C30"/>
    <rect x="0" y="18" width="440" height="6" fill="#A51C30"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">PASSIVE DIGITAL CLASSIFICATION (DISEMBODIED ML)</text>

    <!-- Flow Diagram -->
    <g transform="translate(14, 34)">
      <!-- 2D Image Box -->
      <rect width="90" height="48" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text class="mono-txt" x="45" y="22" text-anchor="middle" fill="#1E293B">2D Pixels</text>
      <text class="body-txt" x="45" y="38" text-anchor="middle" fill="#64748B">RGB (H×W×3)</text>

      <line x1="95" y1="24" x2="125" y2="24" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arr-crimson)"/>

      <!-- Backbone -->
      <rect x="130" y="0" width="105" height="48" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text class="mono-txt" x="182" y="22" text-anchor="middle" fill="#1E293B">ResNet / CLIP</text>
      <text class="body-txt" x="182" y="38" text-anchor="middle" fill="#64748B">Global Pooling</text>

      <line x1="240" y1="24" x2="270" y2="24" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arr-crimson)"/>

      <!-- Output -->
      <rect x="275" y="0" width="135" height="48" rx="4" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.2"/>
      <text class="mono-txt" x="342" y="20" text-anchor="middle" font-weight="700" fill="#A51C30">"mug": 0.94</text>
      <text class="body-txt" x="342" y="36" text-anchor="middle" fill="#A51C30">Abstract Text Label</text>
    </g>

    <!-- Limitations -->
    <text class="body-txt" x="14" y="102">
      <tspan x="14" dy="0">❌ <tspan font-weight="700">Zero Metric Scale:</tspan> Cannot deduce distance in meters or gripper aperture.</tspan>
      <tspan x="14" dy="16">❌ <tspan font-weight="700">Zero Kinematic Utility:</tspan> Motor controller cannot actuate on a semantic string.</tspan>
      <tspan x="14" dy="16">❌ <tspan font-weight="700">Blind to Geometry:</tspan> Ignores surface normals, collision hulls, and center of mass.</tspan>
    </text>
  </g>

  <!-- RIGHT: PHYSICAL AI SPATIAL AFFORDANCES -->
  <g transform="translate(480, 60)">
    <rect width="440" height="150" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
    <rect x="0" y="0" width="440" height="24" rx="6" fill="#059669"/>
    <rect x="0" y="18" width="440" height="6" fill="#059669"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">SPATIAL AFFORDANCE TOKENIZATION (PHYSICAL AI)</text>

    <!-- Flow Diagram -->
    <g transform="translate(14, 34)">
      <!-- RGB-D Input -->
      <rect width="90" height="48" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text class="mono-txt" x="45" y="22" text-anchor="middle" fill="#1E293B">RGB-D + PTP</text>
      <text class="body-txt" x="45" y="38" text-anchor="middle" fill="#059669">Synchronized</text>

      <line x1="95" y1="24" x2="125" y2="24" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-teal)"/>

      <!-- ViT / DINOv2 -->
      <rect x="130" y="0" width="115" height="48" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text class="mono-txt" x="187" y="22" text-anchor="middle" fill="#1E293B">ViT / DINOv2</text>
      <text class="body-txt" x="187" y="38" text-anchor="middle" fill="#059669">Patch Unproject</text>

      <line x1="250" y1="24" x2="275" y2="24" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-teal)"/>

      <!-- SE(3) Token Output -->
      <rect x="280" y="0" width="130" height="48" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
      <text class="mono-txt" x="345" y="20" text-anchor="middle" font-weight="700" fill="#059669">SE(3) Tokens</text>
      <text class="body-txt" x="345" y="36" text-anchor="middle" fill="#059669">Metric 3D Geometry</text>
    </g>

    <!-- Strengths -->
    <text class="body-txt" x="14" y="102">
      <tspan x="14" dy="0">✓ <tspan font-weight="700">Metric Grounding:</tspan> Explicit coordinate frames relative to base frame (<tspan font-style="italic">T_base_cam</tspan>).</tspan>
      <tspan x="14" dy="16">✓ <tspan font-weight="700">Direct Kinematic Authority:</tspan> Feeds inverse kinematics and trajectory decoders.</tspan>
      <tspan x="14" dy="16">✓ <tspan font-weight="700">Mathematical Safety Barrier:</tspan> Bounding hulls supply distance <tspan font-style="italic">d_clear</tspan> to MCU CBF.</tspan>
    </text>
  </g>

  <!-- ================= BOTTOM: THE 4 ESSENTIAL PHYSICAL AFFORDANCE TOKENS ================= -->
  
  <g transform="translate(20, 225)">
    <rect width="900" height="255" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="22" fill="#1E293B">THE 4 ESSENTIAL PHYSICAL AFFORDANCE TOKENS EMITTED BY EMBODIED PERCEPTION</text>

    <!-- Token 1: Metric Grasp Pose SE(3) -->
    <g transform="translate(16, 35)">
      <rect width="206" height="200" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
      <rect x="0" y="0" width="206" height="26" rx="6" fill="#1F407A"/>
      <rect x="0" y="20" width="206" height="6" fill="#1F407A"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">1. METRIC GRASP POSE (SE(3))</text>
      
      <g transform="translate(10, 36)">
        <text class="mono-txt" x="0" y="12" fill="#1F407A" font-weight="700">T_grasp = [ R | p ]</text>
        <text class="body-txt" x="0" y="32">• Translation <tspan font-style="italic">p = [x, y, z]^T</tspan> (m)</text>
        <text class="body-txt" x="0" y="48">• Orientation <tspan font-style="italic">q = [qw, qx, qy, qz]</tspan></text>
        <text class="body-txt" x="0" y="64">• Gripper width aperture <tspan font-style="italic">w_grip</tspan></text>
        
        <rect y="76" width="186" height="60" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="94" fill="#334155">x = +0.342 m ± 0.004</text>
        <text class="mono-txt" x="8" y="108" fill="#334155">y = -0.118 m ± 0.003</text>
        <text class="mono-txt" x="8" y="122" fill="#334155">z = +0.085 m ± 0.002</text>
      </g>
    </g>

    <!-- Token 2: Surface Geometry & Normals -->
    <g transform="translate(238, 35)">
      <rect width="206" height="200" rx="6" fill="#EDF7F7" stroke="#007A87" stroke-width="1.2"/>
      <rect x="0" y="0" width="206" height="26" rx="6" fill="#007A87"/>
      <rect x="0" y="20" width="206" height="6" fill="#007A87"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">2. CONTACT SURFACE GEOMETRY</text>
      
      <g transform="translate(10, 36)">
        <text class="mono-txt" x="0" y="12" fill="#007A87" font-weight="700">n̂ = [nx, ny, nz]^T, κ</text>
        <text class="body-txt" x="0" y="32">• Unit surface normal vector <tspan font-style="italic">n̂</tspan></text>
        <text class="body-txt" x="0" y="48">• Local principal curvature <tspan font-style="italic">κ</tspan></text>
        <text class="body-txt" x="0" y="64">• Approach alignment axis <tspan font-style="italic">v_app</tspan></text>
        
        <rect y="76" width="186" height="60" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="94" fill="#007A87">n̂ = [0.02, 0.98, -0.19]</text>
        <text class="mono-txt" x="8" y="108" fill="#007A87">Approach: ∡(v, n̂) &lt; 5°</text>
        <text class="mono-txt" x="8" y="122" fill="#007A87">Contact patch: Flat</text>
      </g>
    </g>

    <!-- Token 3: Physical Friction & Material -->
    <g transform="translate(460, 35)">
      <rect width="206" height="200" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
      <rect x="0" y="0" width="206" height="26" rx="6" fill="#B87333"/>
      <rect x="0" y="20" width="206" height="6" fill="#B87333"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">3. MATERIAL &amp; FRICTION TENSOR</text>
      
      <g transform="translate(10, 36)">
        <text class="mono-txt" x="0" y="12" fill="#B87333" font-weight="700">μ_est, K_stiff, m_est</text>
        <text class="body-txt" x="0" y="32">• Friction coefficient <tspan font-style="italic">μ̂ ≈ 0.45</tspan></text>
        <text class="body-txt" x="0" y="48">• Material compliance <tspan font-style="italic">K_stiff</tspan></text>
        <text class="body-txt" x="0" y="64">• Estimated mass <tspan font-style="italic">m_payload</tspan></text>
        
        <rect y="76" width="186" height="60" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="94" fill="#B87333">μ = 0.52 (Ceramic)</text>
        <text class="mono-txt" x="8" y="108" fill="#B87333">F_normal_min = 4.2 N</text>
        <text class="mono-txt" x="8" y="122" fill="#B87333">Payload: 0.380 kg</text>
      </g>
    </g>

    <!-- Token 4: Dynamic Obstacle Clearance Envelope -->
    <g transform="translate(682, 35)">
      <rect width="202" height="200" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2"/>
      <rect x="0" y="0" width="202" height="26" rx="6" fill="#A51C30"/>
      <rect x="0" y="20" width="202" height="6" fill="#A51C30"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">4. OBSTACLE BARRIER ENVELOPE</text>
      
      <g transform="translate(10, 36)">
        <text class="mono-txt" x="0" y="12" fill="#A51C30" font-weight="700">d_clear(x) ≥ d_safe</text>
        <text class="body-txt" x="0" y="32">• Dynamic bounding box <tspan font-style="italic">B_obs</tspan></text>
        <text class="body-txt" x="0" y="48">• Velocity vector <tspan font-style="italic">v_obs</tspan></text>
        <text class="body-txt" x="0" y="64">• Direct feed to MCU CBF</text>
        
        <rect y="76" width="182" height="60" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="94" fill="#A51C30">d_clear = 0.142 m</text>
        <text class="mono-txt" x="8" y="108" fill="#A51C30">d_stop = 0.088 m</text>
        <text class="mono-txt" x="8" y="122" fill="#A51C30">Safety Margin: +54 mm</text>
      </g>
    </g>
  </g>
</svg>
