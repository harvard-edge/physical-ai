<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .metric-val { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; font-size: 14px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">UMA MEMORY BUS CONTENTION &amp; THE PRE-INFERENCE INGESTION TAX</text>
  <text class="subtitle" x="20" y="46">Hardware bus collision between unthrottled camera DMA, NPU tensor streaming, and CPU real-time threads</text>

  <!-- ================= TOP SECTION: THE EMBEDDED SoC UMA ARCHITECTURE ================= -->
  <g transform="translate(20, 60)">
    <!-- Outer SoC Boundary -->
    <rect width="900" height="230" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="6,4"/>
    <text class="badge-txt" x="14" y="20" fill="#64748B">EMBEDDED APPLICATION PROCESSOR (SoC) — UNIFIED MEMORY ARCHITECTURE (UMA)</text>

    <!-- Master 1: Camera ISP & DMA Engine -->
    <g transform="translate(20, 35)">
      <rect width="240" height="80" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.3"/>
      <rect x="0" y="0" width="240" height="22" rx="6" fill="#1F407A"/>
      <rect x="0" y="16" width="240" height="6" fill="#1F407A"/>
      <text class="badge-txt" x="10" y="15" fill="#FFFFFF">MASTER 1: SENSOR INGESTION (ISP/DMA)</text>
      <text class="body-txt" x="10" y="38">• MIPI CSI-2 uncompressed 4K stream</text>
      <text class="body-txt" x="10" y="52">• Ingestion rate: <tspan font-weight="700">1.49 GB/s</tspan> burst writes</text>
      <text class="body-txt" x="10" y="66">• Unregulated DMA floods memory queues</text>
    </g>

    <!-- Master 2: NPU / GPU Tensor Accelerator -->
    <g transform="translate(20, 130)">
      <rect width="240" height="80" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.3"/>
      <rect x="0" y="0" width="240" height="22" rx="6" fill="#B87333"/>
      <rect x="0" y="16" width="240" height="6" fill="#B87333"/>
      <text class="badge-txt" x="10" y="15" fill="#FFFFFF">MASTER 2: VISION-LANGUAGE NPU</text>
      <text class="body-txt" x="10" y="38">• ViT patch tokenization + VLM weights</text>
      <text class="body-txt" x="10" y="52">• Memory demand: <tspan font-weight="700">24.0 GB/s</tspan> peak read</text>
      <text class="body-txt" x="10" y="66">• KV-cache streaming stalls on bus delay</text>
    </g>

    <!-- Master 3: ARM Cortex-A CPU Cores -->
    <g transform="translate(280, 82)">
      <rect width="180" height="80" rx="6" fill="#EDF7F7" stroke="#007A87" stroke-width="1.3"/>
      <rect x="0" y="0" width="180" height="22" rx="6" fill="#007A87"/>
      <rect x="0" y="16" width="180" height="6" fill="#007A87"/>
      <text class="badge-txt" x="10" y="15" fill="#FFFFFF">MASTER 3: CPU CORES</text>
      <text class="body-txt" x="10" y="38">• IPC lease coordination</text>
      <text class="body-txt" x="10" y="52">• Real-time threads: <tspan font-weight="700">2.5 GB/s</tspan></text>
      <text class="body-txt" x="10" y="66">• Suffers priority inversion</text>
    </g>

    <!-- Central Arbiter & Contention Point -->
    <g transform="translate(485, 45)">
      <rect width="170" height="150" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.5"/>
      <rect x="0" y="0" width="170" height="24" rx="6" fill="#A51C30"/>
      <rect x="0" y="18" width="170" height="6" fill="#A51C30"/>
      <text class="badge-txt" x="8" y="16" fill="#FFFFFF">SHARED BUS ARBITER</text>
      
      <!-- Contention Symbol -->
      <circle cx="85" cy="60" r="18" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.5"/>
      <text class="mono-txt" x="85" y="65" text-anchor="middle" font-weight="700" fill="#A51C30">⚡ COLLISION</text>

      <text class="body-txt" x="10" y="96" text-anchor="start" font-weight="700" fill="#A51C30">UMA Bottleneck:</text>
      <text class="body-txt" x="10" y="110">• Shared LPDDR5 Channel</text>
      <text class="body-txt" x="10" y="124">• Peak BW: 34 GB/s Limit</text>
      <text class="body-txt" x="10" y="138">• Unmanaged QoS = Starvation</text>
    </g>

    <!-- Bus Routing Arrows to Arbiter -->
    <line x1="260" y1="75" x2="480" y2="75" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-blue)"/>
    <line x1="260" y1="170" x2="480" y2="150" stroke="#B87333" stroke-width="2" marker-end="url(#arr-amber)"/>
    <line x1="460" y1="122" x2="480" y2="122" stroke="#007A87" stroke-width="2" marker-end="url(#arr-teal)"/>

    <!-- Unified LPDDR5 DRAM -->
    <g transform="translate(680, 35)">
      <rect width="200" height="175" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
      <rect x="0" y="0" width="200" height="22" rx="6" fill="#475569"/>
      <rect x="0" y="16" width="200" height="6" fill="#475569"/>
      <text class="badge-txt" x="10" y="15" fill="#FFFFFF">SHARED LPDDR5 DRAM (8-16 GB)</text>
      
      <!-- DRAM Partitions -->
      <g transform="translate(10, 32)">
        <rect width="180" height="30" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#1F407A">Camera Framebuffers (DMA)</text>
      </g>
      <g transform="translate(10, 68)">
        <rect width="180" height="30" rx="4" fill="#FDF8F0" stroke="#B87333" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#B87333">VLM Weights &amp; KV Cache</text>
      </g>
      <g transform="translate(10, 104)">
        <rect width="180" height="30" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#007A87">Zero-Copy Ring Buffer</text>
      </g>
      <g transform="translate(10, 140)">
        <rect width="180" height="26" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#64748B">Linux OS Kernel &amp; Stack</text>
      </g>
    </g>

    <!-- Arbiter to DRAM Bus Line -->
    <line x1="655" y1="120" x2="675" y2="120" stroke="#A51C30" stroke-width="3" marker-end="url(#arr-crimson)"/>
  </g>

  <!-- ================= BOTTOM SECTION: ARCHITECTURAL COMPARISON ================= -->
  
  <!-- LEFT: NAIVE COPYING & TAIL EXPLOSION -->
  <g transform="translate(20, 305)">
    <rect width="440" height="175" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.3"/>
    <rect x="0" y="0" width="440" height="24" rx="6" fill="#A51C30"/>
    <rect x="0" y="18" width="440" height="6" fill="#A51C30"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">❌ NAIVE APPROACH: MEMCPY &amp; UNMANAGED BUS BURSTS</text>

    <!-- Metrics -->
    <g transform="translate(16, 36)">
      <rect width="195" height="42" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text class="body-txt" x="8" y="16" fill="#64748B">Nominal Latency (P50):</text>
      <text class="metric-val" x="8" y="34" fill="#1E293B">22.4 ms</text>
    </g>
    <g transform="translate(225, 36)">
      <rect width="195" height="42" rx="4" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.2"/>
      <text class="body-txt" x="8" y="16" fill="#A51C30" font-weight="700">Tail Latency (P99):</text>
      <text class="metric-val" x="8" y="34" fill="#A51C30">135.8 ms ⚠️</text>
    </g>

    <!-- Failure Mechanisms -->
    <text class="body-txt" x="16" y="98">
      <tspan x="16" dy="0">• <tspan font-weight="700">3x User/Kernel Space Copies:</tspan> V4L2 kernel buffer → OpenCV Mat → Tensor tensor.</tspan>
      <tspan x="16" dy="16">• <tspan font-weight="700">Bus Starvation:</tspan> Camera bursts lock out NPU weight streaming during critical tokens.</tspan>
      <tspan x="16" dy="16">• <tspan font-weight="700">Causal Consequence:</tspan> Breaches Freshness Wall (<tspan font-style="italic">Δt_fresh > 60 ms</tspan>), triggering motor aborts.</tspan>
    </text>
  </g>

  <!-- RIGHT: ZERO-COPY DMA RING BUFFER WITH QoS -->
  <g transform="translate(480, 305)">
    <rect width="440" height="175" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
    <rect x="0" y="0" width="440" height="24" rx="6" fill="#059669"/>
    <rect x="0" y="18" width="440" height="6" fill="#059669"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">✓ PHYSICAL AI CONTRACT: ZERO-COPY DMA + HARDWARE QoS</text>

    <!-- Metrics -->
    <g transform="translate(16, 36)">
      <rect width="195" height="42" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text class="body-txt" x="8" y="16" fill="#64748B">Nominal Latency (P50):</text>
      <text class="metric-val" x="8" y="34" fill="#059669">5.8 ms</text>
    </g>
    <g transform="translate(225, 36)">
      <rect width="195" height="42" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
      <text class="body-txt" x="8" y="16" fill="#059669" font-weight="700">Tail Latency (P99):</text>
      <text class="metric-val" x="8" y="34" fill="#059669">8.2 ms (Deterministic)</text>
    </g>

    <!-- Success Enablers -->
    <text class="body-txt" x="16" y="98">
      <tspan x="16" dy="0">• <tspan font-weight="700">Zero-Copy DMABUF Pipeline:</tspan> ISP writes directly to memory-mapped tensor buffer.</tspan>
      <tspan x="16" dy="16">• <tspan font-weight="700">Hardware QoS Slots:</tspan> Strict arbiter bandwidth caps guarantee real-time CPU/NPU access.</tspan>
      <tspan x="16" dy="16">• <tspan font-weight="700">Bounded Metrology:</tspan> Bounded <tspan font-style="italic">P99 ≤ 8.2 ms</tspan> preserves metric state estimation freshness.</tspan>
    </text>
  </g>
</svg>
