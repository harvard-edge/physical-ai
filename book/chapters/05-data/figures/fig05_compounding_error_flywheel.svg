<rect width="1000" height="560" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="500.0" y="28" class="title">COVARIATE SHIFT COMPOUNDING ERROR FLYWHEEL &amp; RECOVERY DYNAMICS</text>
<text x="500.0" y="45" class="subtitle">Quadratic Divergence O(T²ε) in Naive Behavioral Cloning vs Linear Bounded Tube O(Tε) in DAgger Corrective Aggregation</text>
<rect x="24" y="65" width="460" height="230" rx="8" fill="#DC2626" fill-opacity="0.03" stroke="#DC2626" stroke-width="1.2"/>
<rect x="24" y="65" width="460" height="26" rx="8" fill="#DC2626" fill-opacity="0.12"/>
<text x="38" y="83" font-size="10.5" font-weight="700" fill="#DC2626">✕ NAIVE BEHAVIORAL CLONING (OPEN-LOOP DRIFT FLYWHEEL)</text>
<text x="470" y="83" font-size="9.5" font-weight="700" fill="#A51C30" text-anchor="end">Error: O(T²ε)</text>
<rect x="40" y="103" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="119" font-size="8.5" font-weight="700" fill="#1A202C">1. Single-Step Error ε</text>
<text x="48" y="133" font-size="7.5" fill="#475569">Friction / noise perturbation</text>
<line x1="235" y1="124" x2="265" y2="124" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-coral)"/>
<rect x="269" y="103" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="277" y="119" font-size="8.5" font-weight="700" fill="#DC2626">2. State Exits Support</text>
<text x="277" y="133" font-size="7.5" fill="#475569">s_{t+1} ∉ supp(d^π*)</text>
<line x1="366.5" y1="145" x2="366.5" y2="167" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-coral)"/>
<rect x="269" y="167" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
<text x="277" y="183" font-size="8.5" font-weight="700" fill="#DC2626">3. Arbitrary Action â</text>
<text x="277" y="197" font-size="7.5" fill="#475569">Zero constraint from ERM loss</text>
<line x1="269" y1="188" x2="239" y2="188" stroke="#DC2626" stroke-width="1.3" marker-end="url(#arr-coral)"/>
<rect x="40" y="167" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.2"/>
<text x="48" y="183" font-size="8.5" font-weight="700" fill="#A51C30">4. Amplified Deviation</text>
<text x="48" y="197" font-size="7.5" fill="#475569">Further away on next step</text>
<line x1="137.5" y1="167" x2="137.5" y2="145" stroke="#A51C30" stroke-width="1.3" marker-end="url(#arr-crimson)"/>
<rect x="40" y="219" width="428" height="64" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="237" font-size="8.5" font-weight="700" fill="#A51C30">Mathematical Compounding Mechanism:</text>
<text x="48" y="255" font-size="8" font-family="monospace" fill="#1A202C">E[Error_BC] ≤ ∑_{t=1}^T t·ε = [T(T+1)/2]·ε = O(T²ε)</text>
<text x="48" y="271" font-size="7.5" fill="#475569">Example (T=500 steps, ε=0.01): Cumulative error multiplier = 2,500×</text>
<rect x="24" y="305" width="460" height="235" rx="8" fill="#10B981" fill-opacity="0.03" stroke="#10B981" stroke-width="1.2"/>
<rect x="24" y="305" width="460" height="26" rx="8" fill="#10B981" fill-opacity="0.12"/>
<text x="38" y="323" font-size="10.5" font-weight="700" fill="#007A87">✓ CORRECTIVE AGGREGATION / DAgger (STABILIZING FLYWHEEL)</text>
<text x="470" y="323" font-size="9.5" font-weight="700" fill="#10B981" text-anchor="end">Error: O(Tε)</text>
<rect x="40" y="343" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="359" font-size="8.5" font-weight="700" fill="#1A202C">1. Policy Visits s ~ d^π̂</text>
<text x="48" y="373" font-size="7.5" fill="#475569">Learner visits perturbed state</text>
<line x1="235" y1="364" x2="265" y2="364" stroke="#10B981" stroke-width="1.3" marker-end="url(#arr-teal)"/>
<rect x="269" y="343" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#007A87" stroke-width="1.2"/>
<text x="277" y="359" font-size="8.5" font-weight="700" fill="#007A87">2. Expert Labels π*(s)</text>
<text x="277" y="373" font-size="7.5" fill="#475569">Recovery action demonstrated</text>
<line x1="366.5" y1="385" x2="366.5" y2="407" stroke="#10B981" stroke-width="1.3" marker-end="url(#arr-teal)"/>
<rect x="269" y="407" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
<text x="277" y="423" font-size="8.5" font-weight="700" fill="#10B981">3. Retrain on Aggregate D</text>
<text x="277" y="437" font-size="7.5" fill="#475569">supp(D) ⊇ recovery envelope</text>
<line x1="269" y1="428" x2="239" y2="428" stroke="#10B981" stroke-width="1.3" marker-end="url(#arr-teal)"/>
<rect x="40" y="407" width="195" height="42" rx="5" fill="#FFFFFF" stroke="#007A87" stroke-width="1.2"/>
<text x="48" y="423" font-size="8.5" font-weight="700" fill="#007A87">4. Closed-Loop Recovery</text>
<text x="48" y="437" font-size="7.5" fill="#475569">Corrective torque returns to tube</text>
<line x1="137.5" y1="407" x2="137.5" y2="385" stroke="#007A87" stroke-width="1.3" marker-end="url(#arr-petrol)"/>
<rect x="40" y="459" width="428" height="68" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="477" font-size="8.5" font-weight="700" fill="#007A87">Mathematical Linear Bounded Corridor:</text>
<text x="48" y="495" font-size="8" font-family="monospace" fill="#1A202C">E[Error_CA] ≤ T·ε = O(Tε)  [Ross &amp; Bagnell 2011]</text>
<text x="48" y="511" font-size="7.5" fill="#475569">Example (T=500 steps, ε=0.01): Cumulative error multiplier = 5.0× (500× reduction!)</text>
