<text x="839" y="303" font-size="8" font-weight="700" fill="#10B981" text-anchor="middle">t_rec</text>
<line x1="656" y1="330" x2="732" y2="330" stroke="#DC2626" stroke-width="1.2"/>
<polyline points="656,327 656,333" fill="none" stroke="#DC2626" stroke-width="1.2"/>
<polyline points="732,327 732,333" fill="none" stroke="#DC2626" stroke-width="1.2"/>
<text x="694.0" y="342" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">Human Reaction Lag (300-800 ms)</text>
<rect x="516" y="390" width="448" height="138" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="526" y="408" font-size="9" font-weight="700" fill="#1F407A">THE 3 DATA CURATION LAWS FOR PHYSICAL INTERVENTIONS:</text>
<text x="526" y="426" font-size="8" font-weight="700" fill="#1A202C">1. Truncate Autonomous Rollout at t_div (NOT t_takeover):</text>
<text x="536" y="440" font-size="7.5" fill="#475569">Cut rollout where policy drifted. Prevents spurious correlation between drift and goal.</text>
<text x="526" y="460" font-size="8" font-weight="700" fill="#1A202C">2. Discard Corrupted Drift Interval [t_div, t_takeover]:</text>
<text x="536" y="474" font-size="7.5" fill="#475569">Omit 30-80 execution frames recorded during human perception/reaction delay.</text>
<text x="526" y="494" font-size="8" font-weight="700" fill="#1A202C">3. Ingest Recovery Demonstration [t_takeover, t_rec] into DAgger Buffer:</text>
<text x="536" y="508" font-size="7.5" fill="#475569">Treat rescue as expert feedback on policy-induced distribution d^π̂, collapsing error to O(Tε).</text>
</svg>
