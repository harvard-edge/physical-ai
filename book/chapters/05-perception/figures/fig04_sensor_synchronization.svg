<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">MULTI-SENSOR HARDWARE SYNCHRONIZATION &amp; TIMESTAMP METROLOGY</text>
  <text class="subtitle" x="20" y="46">Eliminating cross-modal phase skew between camera photons and IMU dynamics via IEEE 1588 PTP hardware timestamps</text>

  <!-- ================= TOP: FLAWED SOFTWARE ARRIVAL TIMESTAMPS ================= -->
  <g transform="translate(20, 60)">
    <rect width="900" height="195" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.3"/>
    <rect x="0" y="0" width="900" height="24" rx="6" fill="#A51C30"/>
    <rect x="0" y="18" width="900" height="6" fill="#A51C30"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">❌ FLAWED: NAIVE SOFTWARE TIMESTAMPS (MEASURING APPLICATION ARRIVAL TIME)</text>

    <!-- Timeline Bar -->
    <g transform="translate(20, 36)">
      <!-- Stage 1: Exposure -->
      <rect x="0" y="20" width="160" height="36" rx="4" fill="#FEE2E2" stroke="#A51C30" stroke-width="1"/>
      <text class="mono-txt" x="80" y="38" text-anchor="middle" font-weight="700" fill="#A51C30">Exposure Window</text>
      <text class="body-txt" x="80" y="50" text-anchor="middle" fill="#64748B">t_mid = 0.0 ms (Truth)</text>

      <!-- Stage 2: Sensor Readout -->
      <rect x="165" y="20" width="180" height="36" rx="4" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1"/>
      <text class="mono-txt" x="255" y="38" text-anchor="middle" fill="#1E293B">Rolling Shutter Readout</text>
      <text class="body-txt" x="255" y="50" text-anchor="middle" fill="#64748B">+16.7 ms (60 Hz)</text>

      <!-- Stage 3: DMA Transport -->
      <rect x="350" y="20" width="150" height="36" rx="4" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1"/>
      <text class="mono-txt" x="425" y="38" text-anchor="middle" fill="#1E293B">MIPI / PCIe DMA</text>
      <text class="body-txt" x="425" y="50" text-anchor="middle" fill="#64748B">+4.2 ms (Contention)</text>

      <!-- Stage 4: Linux IRQ / Context Switch -->
      <rect x="505" y="20" width="160" height="36" rx="4" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1"/>
      <text class="mono-txt" x="585" y="38" text-anchor="middle" fill="#1E293B">V4L2 IRQ + Wakeup</text>
      <text class="body-txt" x="585" y="50" text-anchor="middle" fill="#64748B">+3.8 ms (OS Jitter)</text>

      <!-- Stage 5: Timestamp Taken -->
      <rect x="670" y="14" width="190" height="48" rx="4" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.4"/>
      <text class="mono-txt" x="765" y="32" text-anchor="middle" font-weight="700" fill="#A51C30">t_app = +24.7 ms ⚠️</text>
      <text class="body-txt" x="765" y="48" text-anchor="middle" fill="#A51C30">Software Timestamp Taken</text>

      <!-- Skew Arrow -->
      <line x1="80" y1="64" x2="765" y2="64" stroke="#A51C30" stroke-width="2" stroke-dasharray="4,4"/>
      <text class="mono-txt" x="425" y="78" text-anchor="middle" font-weight="700" fill="#A51C30">Unmeasured Phase Skew Δt = +24.7 ms (Variable Jitter: 12–35 ms)</text>
    </g>

    <!-- Hazard Description -->
    <g transform="translate(20, 130)">
      <rect width="860" height="48" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text class="body-txt" x="12" y="18" fill="#1E293B">
        <tspan font-weight="700" fill="#A51C30">Consequence for State Estimation:</tspan> Kalman Filter / Factor Graph fuses camera pose from <tspan font-style="italic">t = 0.0 ms</tspan> with IMU velocity from <tspan font-style="italic">t = +24.7 ms</tspan>.
      </text>
      <text class="body-txt" x="12" y="34" fill="#64748B">
        At robot speed <tspan font-style="italic">v = 1.5 m/s</tspan>, this +24.7 ms timestamp error injects <tspan font-weight="700" fill="#A51C30">37.0 mm of fictitious kinematic error</tspan>, causing filter divergence and motor instability.
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM: IEEE 1588 PTP HARDWARE TIMESTAMPS ================= -->
  <g transform="translate(20, 270)">
    <rect width="900" height="210" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
    <rect x="0" y="0" width="900" height="24" rx="6" fill="#059669"/>
    <rect x="0" y="18" width="900" height="6" fill="#059669"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">✓ PHYSICAL AI STANDARD: IEEE 1588 PTP HARDWARE EXPOSURE MIDPOINT TIMESTAMPS</text>

    <!-- Hardware Sync Diagram -->
    <g transform="translate(20, 36)">
      <!-- Master Clock -->
      <g transform="translate(0, 0)">
        <rect width="180" height="75" rx="5" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
        <text class="badge-txt" x="10" y="18" fill="#059669">PTP GRANDMASTER CLOCK</text>
        <text class="mono-txt" x="10" y="38" fill="#1E293B">IEEE 1588 / PTPv2</text>
        <text class="body-txt" x="10" y="52">• Microsecond synchronization</text>
        <text class="body-txt" x="10" y="66">• Clock Skew: <tspan font-weight="700" fill="#059669">&lt; 2 μs</tspan></text>
      </g>

      <!-- Sync Pulse Arrows -->
      <line x1="185" y1="38" x2="235" y2="20" stroke="#059669" stroke-width="2" marker-end="url(#arr-teal)"/>
      <line x1="185" y1="38" x2="235" y2="55" stroke="#059669" stroke-width="2" marker-end="url(#arr-teal)"/>

      <!-- Camera Node with Strobe -->
      <g transform="translate(240, 0)">
        <rect width="300" height="75" rx="5" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
        <text class="badge-txt" x="10" y="18" fill="#059669">CAMERA SENSOR (HARDWARE STROBE)</text>
        <text class="body-txt" x="10" y="36">• HW timer latches timestamp at <tspan font-weight="700">exposure midpoint</tspan></text>
        <text class="mono-txt" x="10" y="52" fill="#059669">t_mid = 1724158920.104821 s (±1 μs)</text>
        <text class="body-txt" x="10" y="66">• Timestamp stamped into raw metadata packet header</text>
      </g>

      <!-- IMU Node with FIFO Sync -->
      <g transform="translate(560, 0)">
        <rect width="300" height="75" rx="5" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
        <text class="badge-txt" x="10" y="18" fill="#059669">IMU SENSOR (1000 Hz FIFO LATCH)</text>
        <text class="body-txt" x="10" y="36">• High-rate gyroscope &amp; accelerometer ring buffer</text>
        <text class="mono-txt" x="10" y="52" fill="#059669">t_imu = 1724158920.104820 s (Exact match)</text>
        <text class="body-txt" x="10" y="66">• Direct temporal interpolation at exact <tspan font-style="italic">t_mid</tspan></text>
      </g>
    </g>

    <!-- State Estimation Benefit -->
    <g transform="translate(20, 126)">
      <rect width="860" height="65" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text class="body-txt" x="12" y="18" fill="#1E293B">
        <tspan font-weight="700" fill="#059669">Exact Metric Alignment:</tspan> Even if Linux OS takes 30 ms to deliver the image tensor to Python, the system knows the exact physical photons were captured at <tspan font-style="italic">t_mid</tspan>.
      </text>
      <text class="body-txt" x="12" y="36" fill="#334155">
        • Phase Skew reduced from <tspan font-weight="700" fill="#A51C30">24.7 ms</tspan> to <tspan font-weight="700" fill="#059669">&lt; 0.005 ms (5 μs)</tspan>.
      </text>
      <text class="body-txt" x="12" y="52" fill="#334155">
        • State estimation error drops from <tspan font-weight="700" fill="#A51C30">37.0 mm</tspan> to <tspan font-weight="700" fill="#059669">&lt; 0.01 mm</tspan>, enabling millimeter-precision grasping and rock-solid dynamic stability.
      </text>
    </g>
  </g>
</svg>
