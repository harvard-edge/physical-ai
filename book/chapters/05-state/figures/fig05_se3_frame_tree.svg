<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">DYNAMIC SE(3) COORDINATE FRAME TREE &amp; TIME-INDEXED TRANSFORM BUFFER</text>
  <text class="subtitle" x="20" y="46">Solving sensory latency via historical coordinate lookups and Lie algebra tangent-space forward integration</text>

  <!-- ================= LEFT: SE(3) COORDINATE TREE DAG ================= -->
  <g transform="translate(20, 60)">
    <rect width="440" height="420" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="22" fill="#1E293B">DIRECTED ACYCLIC SE(3) COORDINATE TREE</text>

    <!-- Tree Nodes & Edges -->
    <g transform="translate(20, 35)">
      <!-- World Node (Root) -->
      <g transform="translate(140, 0)">
        <rect width="120" height="34" rx="4" fill="#1E293B"/>
        <text class="mono-txt" x="60" y="21" text-anchor="middle" fill="#FFFFFF" font-weight="700">world (F_w)</text>
      </g>

      <!-- Edge: world -> base_link -->
      <line x1="200" y1="34" x2="200" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <text class="tag-txt" x="208" y="56" fill="#475569">T_world_base</text>

      <!-- base_link Node -->
      <g transform="translate(130, 70)">
        <rect width="140" height="36" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.5"/>
        <text class="mono-txt" x="70" y="22" text-anchor="middle" fill="#1F407A" font-weight="700">base_link (F_base)</text>
      </g>

      <!-- Branch 1: base_link -> camera_link -->
      <line x1="150" y1="106" x2="70" y2="150" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-teal)"/>
      <text class="tag-txt" x="65" y="125" fill="#007A87">T_base_cam (Extrinsics)</text>

      <!-- Branch 2: base_link -> end_effector -->
      <line x1="250" y1="106" x2="320" y2="150" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-amber)"/>
      <text class="tag-txt" x="295" y="125" fill="#B87333">T_base_ee (FK(q))</text>

      <!-- camera_link Node -->
      <g transform="translate(10, 150)">
        <rect width="130" height="34" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1.2"/>
        <text class="mono-txt" x="65" y="21" text-anchor="middle" fill="#007A87">camera_link</text>
      </g>

      <!-- optical_frame Node -->
      <line x1="75" y1="184" x2="75" y2="215" stroke="#007A87" stroke-width="1.2" marker-end="url(#arr-teal)"/>
      <g transform="translate(10, 215)">
        <rect width="130" height="34" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1.2"/>
        <text class="mono-txt" x="65" y="21" text-anchor="middle" fill="#007A87">optical_frame</text>
      </g>

      <!-- Target Object Node (Visual Detection with Lag) -->
      <line x1="75" y1="249" x2="75" y2="280" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arr-crimson)"/>
      <text class="tag-txt" x="85" y="268" fill="#A51C30">T_cam_obj (t_stamp)</text>
      <g transform="translate(10, 280)">
        <rect width="140" height="42" rx="4" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.4"/>
        <text class="mono-txt" x="70" y="18" text-anchor="middle" font-weight="700" fill="#A51C30">target_mug</text>
        <text class="body-txt" x="70" y="32" text-anchor="middle" fill="#A51C30">Lagged: Δt = 65 ms</text>
      </g>

      <!-- end_effector Node -->
      <g transform="translate(260, 150)">
        <rect width="130" height="34" rx="4" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
        <text class="mono-txt" x="65" y="21" text-anchor="middle" fill="#B87333">end_effector</text>
      </g>

      <!-- tool_tip Node -->
      <line x1="325" y1="184" x2="325" y2="225" stroke="#B87333" stroke-width="1.2" marker-end="url(#arr-amber)"/>
      <g transform="translate(260, 225)">
        <rect width="130" height="34" rx="4" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
        <text class="mono-txt" x="65" y="21" text-anchor="middle" fill="#B87333">tool_tip (Gripper)</text>
      </g>
    </g>

    <!-- Bottom Mathematical Invariant -->
    <g transform="translate(16, 370)">
      <rect width="408" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text class="mono-txt" x="204" y="22" text-anchor="middle" fill="#1E293B" font-weight="700">
        T_base_target(t) = T_base_cam(t) · T_cam_target(t)
      </text>
    </g>
  </g>

  <!-- ================= RIGHT: TIME-INDEXED BUFFER & LIE ALGEBRA PROPAGATION ================= -->
  <g transform="translate(480, 60)">
    <rect width="440" height="420" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="22" fill="#1E293B">TIME-INDEXED BUFFER &amp; LIE ALGEBRA PROPAGATION</text>

    <!-- Step 1: Historical Transform Ring Buffer -->
    <g transform="translate(16, 35)">
      <rect width="408" height="95" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text class="badge-txt" x="12" y="16" fill="#1F407A">1. CIRCULAR TRANSFORM RING BUFFER (1000 Hz)</text>
      
      <!-- Time slots -->
      <g transform="translate(12, 28)">
        <rect x="0" y="0" width="70" height="32" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
        <text class="mono-txt" x="35" y="16" text-anchor="middle" fill="#64748B">t = 0 ms</text>
        <text class="body-txt" x="35" y="27" text-anchor="middle" fill="#64748B">T_base_cam</text>

        <rect x="80" y="0" width="105" height="32" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.3"/>
        <text class="mono-txt" x="132" y="15" text-anchor="middle" font-weight="700" fill="#A51C30">t = 35 ms ★</text>
        <text class="body-txt" x="132" y="27" text-anchor="middle" fill="#A51C30">t_stamp Exposure</text>

        <rect x="195" y="0" width="70" height="32" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
        <text class="mono-txt" x="230" y="16" text-anchor="middle" fill="#64748B">t = 70 ms</text>
        <text class="body-txt" x="230" y="27" text-anchor="middle" fill="#64748B">T_base_cam</text>

        <rect x="275" y="0" width="105" height="32" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
        <text class="mono-txt" x="327" y="15" text-anchor="middle" font-weight="700" fill="#059669">t = 100 ms (Now)</text>
        <text class="body-txt" x="327" y="27" text-anchor="middle" fill="#059669">Current Control</text>
      </g>
      <text class="body-txt" x="12" y="80" fill="#64748B">Query buffer at <tspan font-style="italic">t = 35 ms</tspan> to reconstruct exact historical mounting geometry.</text>
    </g>

    <!-- Step 2: Historical Base Re-anchoring -->
    <g transform="translate(16, 140)">
      <rect width="408" height="75" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text class="badge-txt" x="12" y="16" fill="#007A87">2. HISTORICAL STATE RECONSTRUCTION (t = 35 ms)</text>
      <text class="mono-txt" x="12" y="36" fill="#007A87" font-weight="700">T_base_target(35ms) = T_base_cam(35ms) · T_cam_target(35ms)</text>
      <text class="body-txt" x="12" y="56" fill="#334155">• Accurately accounts for robot base/head motion during camera capture.</text>
    </g>

    <!-- Step 3: Lie Algebra se(3) Forward Integration to t_now -->
    <g transform="translate(16, 225)">
      <rect width="408" height="180" rx="5" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
      <text class="badge-txt" x="12" y="18" fill="#059669">3. LIE ALGEBRA se(3) FORWARD INTEGRATION (Δt = 65 ms)</text>

      <g transform="translate(12, 30)">
        <rect width="384" height="42" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
        <text class="mono-txt" x="192" y="26" text-anchor="middle" font-weight="700" fill="#059669">
          T(t_now) = T(t_stamp) · exp( ξ̂ · Δt )
        </text>
      </g>

      <text class="body-txt" x="12" y="94">
        <tspan x="12" dy="0">• <tspan font-weight="700">Tangent Space Twist:</tspan> <tspan font-style="italic">ξ = [v, ω]^T ∈ se(3)</tspan> from 1000 Hz IMU &amp; kinematics.</tspan>
        <tspan x="12" dy="16">• <tspan font-weight="700">Exponential Map:</tspan> Computes exact geodesic on <tspan font-style="italic">SE(3)</tspan> manifold.</tspan>
        <tspan x="12" dy="16">• <tspan font-weight="700">Singularity Free:</tspan> Zero gimbal lock, perfectly preserves orthonormal rotation matrix.</tspan>
        <tspan x="12" dy="16">• <tspan font-weight="700">Result:</tspan> Delivers zero-lag <tspan font-style="italic">t_now</tspan> metric state to 1 kHz Control Barrier Functions!</tspan>
      </text>
    </g>
  </g>
</svg>
