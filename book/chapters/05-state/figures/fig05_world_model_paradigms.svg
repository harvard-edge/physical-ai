<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
      .metric-val { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">THREE PARADIGMS OF PHYSICAL WORLD MODELING</text>
  <text class="subtitle" x="20" y="46">Contrasting Generative Pixel Diffusion, Latent State Transitions (JEPA/RSSM), and Deterministic SE(3) Coordinate Trees</text>

  <!-- ================= 3 COLUMN CARDS ================= -->

  <!-- COLUMN 1: GENERATIVE PIXEL DIFFUSION -->
  <g transform="translate(20, 60)">
    <rect width="286" height="420" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.3"/>
    <rect x="0" y="0" width="286" height="24" rx="6" fill="#A51C30"/>
    <rect x="0" y="18" width="286" height="6" fill="#A51C30"/>
    <text class="badge-txt" x="10" y="16" fill="#FFFFFF">1. GENERATIVE PIXEL DIFFUSION</text>

    <!-- Visual Architecture Box -->
    <g transform="translate(12, 35)">
      <rect width="262" height="95" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text class="mono-txt" x="10" y="18" fill="#A51C30" font-weight="700">Video Diffusion (Sora / Genie)</text>
      <text class="body-txt" x="10" y="34">x_t (Pixels) + a_t → 50 Denoising Steps</text>
      <line x1="10" y1="44" x2="250" y2="44" stroke="#FECACA" stroke-width="1"/>
      <text class="mono-txt" x="10" y="60" fill="#334155">Output: x̂_{t+1} (Rendered Video)</text>
      <text class="body-txt" x="10" y="76" fill="#64748B">Computes all background pixels &amp; lighting</text>
    </g>

    <!-- Systems Metrology Metrics -->
    <g transform="translate(12, 140)">
      <rect width="262" height="65" rx="4" fill="#FEE2E2" stroke="#A51C30" stroke-width="1"/>
      <text class="mono-txt" x="10" y="18" fill="#A51C30">Latency (P50/P99): <tspan font-weight="700">450 / 1200 ms ❌</tspan></text>
      <text class="mono-txt" x="10" y="34" fill="#A51C30">Memory Footprint: <tspan font-weight="700">16+ GB VRAM</tspan></text>
      <text class="mono-txt" x="10" y="50" fill="#A51C30">Compute Load: <tspan font-weight="700">> 30 TFLOPs</tspan></text>
    </g>

    <!-- Failure Modes -->
    <g transform="translate(12, 215)">
      <text class="badge-txt" x="0" y="12" fill="#A51C30">FATAL EMBEDDED DEFECTS:</text>
      <text class="body-txt" x="0" y="28">
        <tspan x="0" dy="0">• <tspan font-weight="700">Pixel Hallucinations:</tspan> Objects phase through solid walls or change mass arbitrarily.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Freshness Wall Violation:</tspan> Latency exceeds 60 ms by 20x, guaranteeing physical collisions.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Compute Starvation:</tspan> Consumes 100% of SoC power, causing thermal throttle.</tspan>
      </text>
    </g>

    <!-- Verdict -->
    <g transform="translate(12, 365)">
      <rect width="262" height="42" rx="4" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.2"/>
      <text class="badge-txt" x="10" y="18" fill="#A51C30">VERDICT FOR PHYSICAL AI:</text>
      <text class="body-txt" x="10" y="32" font-weight="700" fill="#A51C30">❌ Inadmissible for Real-Time Control</text>
    </g>
  </g>

  <!-- COLUMN 2: LATENT TRANSITION DYNAMICS (JEPA / RSSM) -->
  <g transform="translate(326, 60)">
    <rect width="286" height="420" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.3"/>
    <rect x="0" y="0" width="286" height="24" rx="6" fill="#B87333"/>
    <rect x="0" y="18" width="286" height="6" fill="#B87333"/>
    <text class="badge-txt" x="10" y="16" fill="#FFFFFF">2. LATENT DYNAMICS (JEPA / RSSM)</text>

    <!-- Visual Architecture Box -->
    <g transform="translate(12, 35)">
      <rect width="262" height="95" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1"/>
      <text class="mono-txt" x="10" y="18" fill="#B87333" font-weight="700">V-JEPA / DreamerV3 RSSM</text>
      <text class="body-txt" x="10" y="34">E_θ(x_t) = z_t ∈ Z (Feature Space)</text>
      <line x1="10" y1="44" x2="250" y2="44" stroke="#FED7AA" stroke-width="1"/>
      <text class="mono-txt" x="10" y="60" fill="#334155">Transition: ẑ_{t+1} = f_φ(z_t, a_t)</text>
      <text class="body-txt" x="10" y="76" fill="#64748B">Predicts semantics without pixel rendering</text>
    </g>

    <!-- Systems Metrology Metrics -->
    <g transform="translate(12, 140)">
      <rect width="262" height="65" rx="4" fill="#FFEDD5" stroke="#B87333" stroke-width="1"/>
      <text class="mono-txt" x="10" y="18" fill="#B87333">Latency (P50/P99): <tspan font-weight="700">2.2 / 3.8 ms ✓</tspan></text>
      <text class="mono-txt" x="10" y="34" fill="#B87333">Memory Footprint: <tspan font-weight="700">420 MB DRAM</tspan></text>
      <text class="mono-txt" x="10" y="50" fill="#B87333">Compute Load: <tspan font-weight="700">0.08 TFLOPs</tspan></text>
    </g>

    <!-- Benefits -->
    <g transform="translate(12, 215)">
      <text class="badge-txt" x="0" y="12" fill="#B87333">SYSTEMS ADVANTAGES:</text>
      <text class="body-txt" x="0" y="28">
        <tspan x="0" dy="0">• <tspan font-weight="700">150x Faster:</tspan> Skips high-overhead pixel decoders; executes directly on NPU.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Noise Invariance:</tspan> Ignores dynamic background clutter, shadows, and flicker.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Action Evaluation:</tspan> Rolls out 100 candidate trajectories in parallel in &lt;5 ms.</tspan>
      </text>
    </g>

    <!-- Verdict -->
    <g transform="translate(12, 365)">
      <rect width="262" height="42" rx="4" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2"/>
      <text class="badge-txt" x="10" y="18" fill="#B87333">VERDICT FOR PHYSICAL AI:</text>
      <text class="body-txt" x="10" y="32" font-weight="700" fill="#B87333">✓ Ideal for System 1.5 MPC Planning</text>
    </g>
  </g>

  <!-- COLUMN 3: METRIC SE(3) FRAME TREE -->
  <g transform="translate(632, 60)">
    <rect width="288" height="420" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
    <rect x="0" y="0" width="288" height="24" rx="6" fill="#059669"/>
    <rect x="0" y="18" width="288" height="6" fill="#059669"/>
    <text class="badge-txt" x="10" y="16" fill="#FFFFFF">3. METRIC SE(3) TREE + LIE ALGEBRA</text>

    <!-- Visual Architecture Box -->
    <g transform="translate(12, 35)">
      <rect width="264" height="95" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text class="mono-txt" x="10" y="18" fill="#059669" font-weight="700">Dynamic Transform Tree (SE(3))</text>
      <text class="body-txt" x="10" y="34">T_A^B = [ R | p ] ∈ SE(3), Covariance Σ</text>
      <line x1="10" y1="44" x2="252" y2="44" stroke="#A7F3D0" stroke-width="1"/>
      <text class="mono-txt" x="10" y="60" fill="#059669">Tangent: T(t) = T(t0) · exp(ξ̂ Δt)</text>
      <text class="body-txt" x="10" y="76" fill="#64748B">Zero singularities; exact metric coordinates</text>
    </g>

    <!-- Systems Metrology Metrics -->
    <g transform="translate(12, 140)">
      <rect width="264" height="65" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
      <text class="mono-txt" x="10" y="18" fill="#059669">Latency (P50/P99): <tspan font-weight="700">&lt; 0.05 ms (50 μs) ★</tspan></text>
      <text class="mono-txt" x="10" y="34" fill="#059669">Memory Footprint: <tspan font-weight="700">&lt; 64 KB SRAM</tspan></text>
      <text class="mono-txt" x="10" y="50" fill="#059669">Determinism: <tspan font-weight="700">Zero Dynamic Allocations</tspan></text>
    </g>

    <!-- Benefits -->
    <g transform="translate(12, 215)">
      <text class="badge-txt" x="0" y="12" fill="#059669">SYSTEMS ADVANTAGES:</text>
      <text class="body-txt" x="0" y="28">
        <tspan x="0" dy="0">• <tspan font-weight="700">100% Deterministic:</tspan> Runs inside 1 kHz FreeRTOS reflex loop on bare-metal MCU.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Mathematical Safety Barrier:</tspan> Computes exact metric distance <tspan font-style="italic">d_clear</tspan> for CBF.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Sensory Lag Compensation:</tspan> Time-indexed buffer rewinds and forward-propagates state.</tspan>
      </text>
    </g>

    <!-- Verdict -->
    <g transform="translate(12, 365)">
      <rect width="264" height="42" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
      <text class="badge-txt" x="10" y="18" fill="#059669">VERDICT FOR PHYSICAL AI:</text>
      <text class="body-txt" x="10" y="32" font-weight="700" fill="#059669">✓ Mandatory for System 1 Safety Reflex</text>
    </g>
  </g>
</svg>
