<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">EXPIRING INTENT LEASE (L_intent) TIMELINE &amp; SCENE DRIFT ESCALATION</text>
  <text class="subtitle" x="20" y="46">Asynchronous System 2 deliberation (800 ms) vs. continuous real-time environment mutation</text>

  <!-- ================= TOP: TIMELINE INTERACTION ================= -->
  <g transform="translate(20, 60)">
    <rect width="900" height="235" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Timeline Axis -->
    <g transform="translate(30, 20)">
      <line x1="0" y1="90" x2="840" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#arr-axis)"/>
      <text class="mono-txt" x="840" y="110" text-anchor="end" fill="#475569">Time t (ms) →</text>

      <!-- Event 1: t = 0 ms (Snapshot Captured) -->
      <g transform="translate(20, 15)">
        <circle cx="0" cy="75" r="7" fill="#1F407A"/>
        <line x1="0" y1="0" x2="0" y2="68" stroke="#1F407A" stroke-width="1.5"/>
        <rect x="-65" y="0" width="130" height="42" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
        <text class="mono-txt" x="0" y="16" text-anchor="middle" font-weight="700" fill="#1F407A">t = 0 ms</text>
        <text class="body-txt" x="0" y="30" text-anchor="middle" fill="#1F407A">Snapshot O(t0) Captured</text>
      </g>

      <!-- VLM Deliberation Span (0 to 800 ms) -->
      <g transform="translate(20, 95)">
        <rect x="0" y="5" width="580" height="32" rx="4" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2" stroke-dasharray="4,2"/>
        <text class="mono-txt" x="290" y="24" text-anchor="middle" fill="#B87333" font-weight="700">
          VLM System 2 Deliberation on Linux MPU (800 ms computation latency)
        </text>
      </g>

      <!-- Event 2: t = 350 ms (Physical Scene Mutation) -->
      <g transform="translate(270, 15)">
        <circle cx="0" cy="75" r="7" fill="#A51C30"/>
        <line x1="0" y1="0" x2="0" y2="68" stroke="#A51C30" stroke-width="1.5"/>
        <rect x="-75" y="0" width="150" height="42" rx="4" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.2"/>
        <text class="mono-txt" x="0" y="16" text-anchor="middle" font-weight="700" fill="#A51C30">t = 350 ms ⚡</text>
        <text class="body-txt" x="0" y="30" text-anchor="middle" fill="#A51C30">Target Bumped (Δx = 85mm)</text>
      </g>

      <!-- Event 3: t = 800 ms (VLM Emits Proposal) -->
      <g transform="translate(600, 15)">
        <circle cx="0" cy="75" r="7" fill="#B87333"/>
        <line x1="0" y1="0" x2="0" y2="68" stroke="#B87333" stroke-width="1.5"/>
        <rect x="-70" y="0" width="140" height="42" rx="4" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
        <text class="mono-txt" x="0" y="16" text-anchor="middle" font-weight="700" fill="#B87333">t = 800 ms</text>
        <text class="body-txt" x="0" y="30" text-anchor="middle" fill="#B87333">VLM Emits L_intent (Stale)</text>
      </g>

      <!-- Event 4: t = 801 ms (MCU Revocation & Safe Hold) -->
      <g transform="translate(750, 15)">
        <circle cx="0" cy="75" r="7" fill="#059669"/>
        <line x1="0" y1="0" x2="0" y2="68" stroke="#059669" stroke-width="1.5"/>
        <rect x="-85" y="0" width="170" height="52" rx="4" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/>
        <text class="mono-txt" x="0" y="16" text-anchor="middle" font-weight="700" fill="#059669">t = 801 ms ✓</text>
        <text class="badge-txt" x="0" y="30" text-anchor="middle" fill="#A51C30">DRIFT REJECTED (85 > 15mm)</text>
        <text class="body-txt" x="0" y="44" text-anchor="middle" fill="#059669">Category 2 Safe Hold</text>
      </g>
    </g>

    <!-- Bottom summary banner -->
    <g transform="translate(20, 175)">
      <rect width="860" height="48" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text class="body-txt" x="12" y="18" fill="#1E293B">
        <tspan font-weight="700" fill="#059669">Why the Dual-Brain Architecture Prevents Disaster:</tspan> If the VLM held direct motor authority, the robot would blindly strike the empty coordinate at <tspan font-style="italic">t = 800 ms</tspan>.
      </text>
      <text class="body-txt" x="12" y="34" fill="#64748B">
        Because the Reflex Brain enforces <tspan font-style="italic">δ_drift ≤ 15 mm</tspan> against the continuous SE(3) world model, the stale lease is aborted in <tspan font-weight="700">1 millisecond</tspan> before execution starts.
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM: LEASE DATA CONTRACT & STATE MACHINE ================= -->
  <g transform="translate(20, 310)">
    <!-- LEFT: STRUCT CONTRACT -->
    <g transform="translate(0, 0)">
      <rect width="440" height="170" rx="6" fill="#1E293B"/>
      <text class="badge-txt" x="16" y="22" fill="#94A3B8">INTENT LEASE ZERO-ALLOCATION C STRUCT (SHARED SRAM)</text>

      <g transform="translate(16, 36)">
        <text class="mono-txt" x="0" y="14" fill="#38BDF8">struct __attribute__((packed)) IntentLease {</text>
        <text class="mono-txt" x="16" y="30" fill="#F1F5F9">uint64_t  lease_id;          <tspan fill="#64748B">// Monotonic sequence</tspan></text>
        <text class="mono-txt" x="16" y="46" fill="#F1F5F9">float     target_se3[12];     <tspan fill="#64748B">// 3x4 metric affine matrix</tspan></text>
        <text class="mono-txt" x="16" y="62" fill="#FCD34D">uint64_t  valid_from_ns;     <tspan fill="#64748B">// Hardware exposure epoch</tspan></text>
        <text class="mono-txt" x="16" y="78" fill="#FCD34D">uint64_t  valid_until_ns;    <tspan fill="#64748B">// Strict TTL expiration</tspan></text>
        <text class="mono-txt" x="16" y="94" fill="#FCA5A5">float     max_drift_meters;  <tspan fill="#64748B">// Spatial drift gate (0.015m)</tspan></text>
        <text class="mono-txt" x="16" y="110" fill="#4ADE80">uint32_t  crc32_checksum;    <tspan fill="#64748B">// Payload integrity</tspan></text>
        <text class="mono-txt" x="0" y="126" fill="#38BDF8">};</text>
      </g>
    </g>

    <!-- RIGHT: SAFETY ESCALATION STATE MACHINE -->
    <g transform="translate(460, 0)">
      <rect width="440" height="170" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <text class="badge-txt" x="16" y="22" fill="#1E293B">LEASE SAFETY ESCALATION STATE MACHINE</text>

      <!-- 3 State Boxes -->
      <g transform="translate(16, 40)">
        <rect x="0" y="0" width="125" height="50" rx="4" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
        <text class="mono-txt" x="62" y="20" text-anchor="middle" font-weight="700" fill="#059669">STATE: ACTIVE</text>
        <text class="body-txt" x="62" y="36" text-anchor="middle" fill="#059669">Drift ≤ 15mm &amp; Valid TTL</text>

        <line x1="130" y1="25" x2="145" y2="25" stroke="#A51C30" stroke-width="1.5" marker-end="url(#arr-crimson)"/>

        <rect x="150" y="0" width="125" height="50" rx="4" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.2"/>
        <text class="mono-txt" x="212" y="20" text-anchor="middle" font-weight="700" fill="#A51C30">STATE: REVOKED</text>
        <text class="body-txt" x="212" y="36" text-anchor="middle" fill="#A51C30">Drift > 15mm or Expired</text>

        <line x1="280" y1="25" x2="295" y2="25" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-axis)"/>

        <rect x="300" y="0" width="105" height="50" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
        <text class="mono-txt" x="352" y="20" text-anchor="middle" font-weight="700" fill="#1F407A">SAFE HOLD</text>
        <text class="body-txt" x="352" y="36" text-anchor="middle" fill="#1F407A">IEC 60204-1 Cat 2</text>
      </g>

      <g transform="translate(16, 105)">
        <text class="body-txt" x="0" y="14">
          <tspan x="0" dy="0">• <tspan font-weight="700">Zero Dynamic Allocation:</tspan> Static memory footprint evaluated in FreeRTOS ISR.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Automatic Re-trigger:</tspan> System 2 requested to re-snap camera and re-deliberate.</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
