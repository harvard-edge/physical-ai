<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">THE 4-STAGE VLM VISUAL &amp; SPATIAL AFFORDANCE GROUNDING PIPELINE</text>
  <text class="subtitle" x="20" y="46">Lifting open-vocabulary natural language prompts into metric SE(3) grasp targets and expiring intent leases</text>

  <!-- ================= 4 PIPELINE STAGES ================= -->
  <g transform="translate(20, 60)">
    
    <!-- STAGE 1: CROSS-ATTENTION -->
    <g transform="translate(0, 0)">
      <rect width="210" height="300" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#1F407A"/>
      <rect x="0" y="20" width="210" height="6" fill="#1F407A"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">STAGE 1: CROSS-ATTENTION</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#1F407A">Prompt:</text>
        <text class="body-txt" x="8" y="30" font-weight="700" fill="#1E293B">"Grasp the blue thermos"</text>

        <rect y="50" width="190" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#1F407A">Vision Tokens:</text>
        <text class="body-txt" x="8" y="30" fill="#1E293B">RGB Patch Grid (16×16)</text>

        <rect y="100" width="190" height="65" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#475569">VLM TRANSFORMER CORE</text>
        <text class="mono-txt" x="8" y="34" fill="#1E293B">Softmax(Q K^T / √d) V</text>
        <text class="body-txt" x="8" y="50" fill="#64748B">Cross-modal token fusion</text>

        <text class="body-txt" x="0" y="180">
          <tspan x="0" dy="0">• Attention heatmap highlights thermos pixels.</tspan>
          <tspan x="0" dy="15">• Latency: <tspan font-weight="700">320 ms</tspan> on NPU.</tspan>
        </text>
      </g>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="215" y1="150" x2="230" y2="150" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- STAGE 2: 2D SEGMENTATION MASK -->
    <g transform="translate(235, 0)">
      <rect width="210" height="300" rx="6" fill="#EDF7F7" stroke="#007A87" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#007A87"/>
      <rect x="0" y="20" width="210" height="6" fill="#007A87"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">STAGE 2: 2D MASK EXTRACTION</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="75" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#007A87">M_mask ∈ {0, 1}^{H×W}</text>
        <text class="body-txt" x="8" y="36">• SAM-HQ / DINOv2 Mask</text>
        <text class="body-txt" x="8" y="52">• Pixel coordinates (u, v)</text>
        <text class="body-txt" x="8" y="68">• Foreground pixel subset</text>

        <rect y="85" width="190" height="75" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="badge-txt" x="8" y="18" fill="#007A87">METRIC DEPTH CO-REGISTRATION</text>
        <text class="mono-txt" x="8" y="36" fill="#1E293B">Z(u, v) from Time-of-Flight</text>
        <text class="body-txt" x="8" y="52">• Depth: 0.642 m ± 1.5 mm</text>
        <text class="body-txt" x="8" y="68">• Filters background depth</text>

        <text class="body-txt" x="0" y="180">
          <tspan x="0" dy="0">• Isolates target contour.</tspan>
          <tspan x="0" dy="15">• Latency: <tspan font-weight="700">45 ms</tspan> on GPU/NPU.</tspan>
        </text>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="450" y1="150" x2="465" y2="150" stroke="#007A87" stroke-width="2" marker-end="url(#arr-teal)"/>

    <!-- STAGE 3: 3D PINHOLE UNPROJECTION -->
    <g transform="translate(470, 0)">
      <rect width="210" height="300" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#B87333"/>
      <rect x="0" y="20" width="210" height="6" fill="#B87333"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">STAGE 3: 3D UNPROJECTION</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="85" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#B87333" font-weight="700">P_cam = K^{-1} · [u, v, 1]^T · Z</text>
        <text class="body-txt" x="8" y="36">• Intrinsic matrix <tspan font-style="italic">K</tspan> inversion</text>
        <text class="body-txt" x="8" y="52">• Metric Point Cloud <tspan font-style="italic">P ⊂ R^3</tspan></text>
        <text class="body-txt" x="8" y="68">• Robust outlier rejection</text>

        <rect y="95" width="190" height="65" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#B87333">BASE FRAME RE-ANCHORING</text>
        <text class="mono-txt" x="8" y="34" fill="#1E293B">P_base = T_base_cam · P_cam</text>
        <text class="body-txt" x="8" y="50">• Resolves head-to-base offset</text>

        <text class="body-txt" x="0" y="180">
          <tspan x="0" dy="0">• Reconstructs metric hull.</tspan>
          <tspan x="0" dy="15">• Latency: <tspan font-weight="700">8 ms</tspan> on CPU.</tspan>
        </text>
      </g>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="685" y1="150" x2="700" y2="150" stroke="#B87333" stroke-width="2" marker-end="url(#arr-amber)"/>

    <!-- STAGE 4: SE(3) INTENT LEASE EMISSION -->
    <g transform="translate(705, 0)">
      <rect width="195" height="300" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
      <rect x="0" y="0" width="195" height="26" rx="6" fill="#059669"/>
      <rect x="0" y="20" width="195" height="6" fill="#059669"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">STAGE 4: LEASE EMISSION</text>

      <g transform="translate(10, 36)">
        <rect width="175" height="150" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
        <text class="badge-txt" x="8" y="16" fill="#059669">EXPIRING INTENT LEASE (L_intent)</text>
        <text class="mono-txt" x="8" y="36" fill="#1E293B">• Pose: T_target ∈ SE(3)</text>
        <text class="mono-txt" x="8" y="52" fill="#1E293B">• Aperture: 68 mm</text>
        <text class="mono-txt" x="8" y="68" fill="#1E293B">• Approach: [0, 0, -1]</text>
        <text class="mono-txt" x="8" y="84" fill="#059669">• TTL: 500 ms</text>
        <text class="mono-txt" x="8" y="100" fill="#059669">• Max Drift: 15 mm</text>
        <text class="mono-txt" x="8" y="116" fill="#475569">• SHA256 Lease Hash</text>
        <text class="mono-txt" x="8" y="136" font-weight="700" fill="#059669">STATUS: AUTHORIZED</text>

        <text class="body-txt" x="0" y="200">
          <tspan x="0" dy="0">• Sent to Shared SRAM.</tspan>
          <tspan x="0" dy="15">• Feeds System 1.5 Planner.</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM BANNER: PROPOSAL-PERMISSION CONTRACT ================= -->
  <g transform="translate(20, 380)">
    <rect width="900" height="100" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="20" fill="#1E293B">THE PHYSICAL AI INTENT LEASE CONTRACT (UNTRUSTED PROPOSAL → DETERMINISTIC VERIFICATION)</text>

    <g transform="translate(16, 32)">
      <text class="body-txt" x="0" y="12">
        <tspan x="0" dy="0">1. <tspan font-weight="700">Untrusted Origin:</tspan> The VLM runs on Linux MPU and can suffer GC stalls, memory spikes, or hallucinations. Its output is merely a <tspan font-style="italic">candidate proposal</tspan>.</tspan>
        <tspan x="0" dy="16">2. <tspan font-weight="700">Expiring Lease Structure:</tspan> Every intent lease carries a strict time-to-live (<tspan font-style="italic">τ_TTL = 500 ms</tspan>) and maximum scene drift threshold (<tspan font-style="italic">δ_drift ≤ 15 mm</tspan>).</tspan>
        <tspan x="0" dy="16">3. <tspan font-weight="700">Microcontroller Gatekeeping:</tspan> The 1 kHz Reflex Brain on the MCU audits kinematic reachability and CBF invariants before a single motor microstep executes.</tspan>
      </text>
    </g>
  </g>
</svg>
