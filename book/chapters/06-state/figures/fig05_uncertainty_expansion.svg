<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">SPATIAL UNCERTAINTY EXPANSION, TTL LEASE EXPIRATION, &amp; INNOVATION GATING</text>
  <text class="subtitle" x="20" y="46">Autonomous revocation of unverified learned proposals when sensory occlusion expands spatial covariance beyond safety bounds</text>

  <!-- ================= TOP: TIME-SERIES PLOT ================= -->
  <g transform="translate(20, 60)">
    <rect width="900" height="255" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Plot Area -->
    <g transform="translate(50, 20)">
      <!-- Zone Backgrounds -->
      <!-- Zone 1: Active Vision (Green) -->
      <rect x="0" y="0" width="220" height="180" fill="#F0FDF4" opacity="0.6"/>
      <!-- Zone 2: Occlusion (Amber) -->
      <rect x="220" y="0" width="240" height="180" fill="#FFFBEB" opacity="0.6"/>
      <!-- Zone 3: Expired / Safe Hold (Red) -->
      <rect x="460" y="0" width="180" height="180" fill="#FEF2F2" opacity="0.6"/>
      <!-- Zone 4: Re-acquisition (Blue) -->
      <rect x="640" y="0" width="180" height="180" fill="#F0F4FA" opacity="0.6"/>

      <!-- Axes -->
      <line x1="0" y1="180" x2="820" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-axis)"/>
      <line x1="0" y1="180" x2="0" y2="10" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-axis)"/>

      <!-- Axis Labels -->
      <text class="mono-txt" x="820" y="196" text-anchor="end" fill="#475569">Time t (ms) →</text>
      <text class="mono-txt" x="-10" y="15" text-anchor="end" fill="#475569" transform="rotate(-90 -10,15)">Positional Covariance σ(t) (mm) →</text>

      <!-- Safety Threshold Horizon (Horizontal Line at sigma = 15mm) -->
      <line x1="0" y1="65" x2="820" y2="65" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,4"/>
      <rect x="650" y="45" width="160" height="18" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1"/>
      <text class="badge-txt" x="730" y="58" text-anchor="middle" fill="#A51C30">σ_max = 15 mm SAFETY BOUND</text>

      <!-- Uncertainty Envelope (Filled Curve) -->
      <!-- Zone 1: Bounded at ~2mm -->
      <path d="M 0 165 C 50 163, 150 167, 220 165 L 220 175 L 0 175 Z" fill="#A7F3D0" opacity="0.5"/>
      <path d="M 0 165 C 50 163, 150 167, 220 165" fill="none" stroke="#059669" stroke-width="2.5"/>

      <!-- Zone 2: Expanding linearly during occlusion -->
      <path d="M 220 165 L 460 65 L 640 20 L 640 180 L 220 180 Z" fill="#FED7AA" opacity="0.3"/>
      <path d="M 220 165 L 460 65" fill="none" stroke="#B87333" stroke-width="2.5"/>

      <!-- Zone 3: Beyond expiration (Danger / Safe Hold Active) -->
      <path d="M 460 65 L 640 20" fill="none" stroke="#A51C30" stroke-width="2.5" stroke-dasharray="4,3"/>

      <!-- Zone 4: Re-acquisition (Sharp Drop if Valid, or Rejection if Anomaly) -->
      <!-- Valid observation snaps down to 2mm -->
      <line x1="640" y1="20" x2="640" y2="165" stroke="#007A87" stroke-width="2.5" stroke-dasharray="2,2"/>
      <path d="M 640 165 C 680 165, 750 165, 820 165" fill="none" stroke="#007A87" stroke-width="2.5"/>

      <!-- Key Event Markers -->
      <!-- t_occlude -->
      <line x1="220" y1="10" x2="220" y2="180" stroke="#B87333" stroke-width="1.2" stroke-dasharray="2,2"/>
      <text class="mono-txt" x="220" y="196" text-anchor="middle" font-weight="700" fill="#B87333">t_occlude (200ms)</text>
      <text class="tag-txt" x="220" y="25" text-anchor="middle" fill="#B87333">Sensor Occlusion</text>

      <!-- t_expire -->
      <line x1="460" y1="10" x2="460" y2="180" stroke="#A51C30" stroke-width="1.5"/>
      <circle cx="460" cy="65" r="5" fill="#A51C30"/>
      <text class="mono-txt" x="460" y="196" text-anchor="middle" font-weight="700" fill="#A51C30">t_expire (350ms) ⚡</text>
      <rect x="380" y="80" width="160" height="28" rx="4" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.2"/>
      <text class="badge-txt" x="460" y="94" text-anchor="middle" fill="#A51C30">PROPOSAL LEASE REVOKED</text>
      <text class="tag-txt" x="460" y="104" text-anchor="middle" fill="#A51C30">MCU Category 2 Safe Hold</text>

      <!-- t_reacquire -->
      <line x1="640" y1="10" x2="640" y2="180" stroke="#007A87" stroke-width="1.2" stroke-dasharray="2,2"/>
      <text class="mono-txt" x="640" y="196" text-anchor="middle" font-weight="700" fill="#007A87">t_reacquire (500ms)</text>
      <text class="tag-txt" x="730" y="25" text-anchor="middle" fill="#007A87">Innovation Gating Audit (χ² ≤ 3σ)</text>
    </g>
  </g>

  <!-- ================= BOTTOM: 3 CORE SYSTEMS MECHANISMS ================= -->
  <g transform="translate(20, 325)">
    <!-- Card 1: Dead Reckoning Drift -->
    <g transform="translate(0, 0)">
      <rect width="286" height="155" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
      <rect x="0" y="0" width="286" height="22" rx="6" fill="#B87333"/>
      <rect x="0" y="16" width="286" height="6" fill="#B87333"/>
      <text class="badge-txt" x="10" y="15" fill="#FFFFFF">1. UNCERTAINTY DRIFT DYNAMICS</text>
      
      <g transform="translate(10, 32)">
        <text class="mono-txt" x="0" y="12" fill="#B87333" font-weight="700">σ_pos(t) = σ_0 + v_drift · Δt</text>
        <text class="body-txt" x="0" y="26">
          <tspan x="0" dy="0">• Without vision updates, dead reckoning</tspan>
          <tspan x="10" dy="12">accumulates drift and state noise.</tspan>
          <tspan x="0" dy="14">• Moving target (0.1 m/s) adds</tspan>
          <tspan x="10" dy="12"><tspan font-weight="700">10 mm error every 100 ms</tspan>.</tspan>
          <tspan x="0" dy="14">• State covariance matrix <tspan font-style="italic">Σ</tspan> expands.</tspan>
        </text>
      </g>
    </g>

    <!-- Card 2: Expiring Lease Hardware Interlock -->
    <g transform="translate(306, 0)">
      <rect width="286" height="155" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2"/>
      <rect x="0" y="0" width="286" height="22" rx="6" fill="#A51C30"/>
      <rect x="0" y="16" width="286" height="6" fill="#A51C30"/>
      <text class="badge-txt" x="10" y="15" fill="#FFFFFF">2. HARDWARE LEASE REVOCATION</text>
      
      <g transform="translate(10, 32)">
        <text class="mono-txt" x="0" y="12" fill="#A51C30" font-weight="700">if (σ_pos > σ_max) RevokeAuthority()</text>
        <text class="body-txt" x="0" y="26">
          <tspan x="0" dy="0">• MCU audits spatial covariance</tspan>
          <tspan x="10" dy="12">every 1 ms tick in static SRAM.</tspan>
          <tspan x="0" dy="14">• At <tspan font-style="italic">t_expire = 350 ms</tspan>, lease expires</tspan>
          <tspan x="10" dy="12">→ revokes motor authority.</tspan>
          <tspan x="0" dy="14">• Executes Category 2 safe hold.</tspan>
        </text>
      </g>
    </g>

    <!-- Card 3: Chi-Square Innovation Gating -->
    <g transform="translate(614, 0)">
      <rect width="286" height="155" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
      <rect x="0" y="0" width="286" height="22" rx="6" fill="#059669"/>
      <rect x="0" y="16" width="286" height="6" fill="#059669"/>
      <text class="badge-txt" x="10" y="15" fill="#FFFFFF">3. χ² INNOVATION GATING AUDIT</text>
      
      <g transform="translate(10, 32)">
        <text class="mono-txt" x="0" y="12" fill="#059669" font-weight="700">d_M² = (z - ẑ)^T S^{-1} (z - ẑ) ≤ γ</text>
        <text class="body-txt" x="0" y="26">
          <tspan x="0" dy="0">• Upon return, Mahalanobis distance</tspan>
          <tspan x="10" dy="12"><tspan font-style="italic">d_M</tspan> audits candidate observation.</tspan>
          <tspan x="0" dy="14">• <tspan font-weight="700" fill="#059669">Valid (≤ 3σ):</tspan> Resets covariance,</tspan>
          <tspan x="10" dy="12">safely resumes trajectory execution.</tspan>
          <tspan x="0" dy="14">• <tspan font-weight="700" fill="#A51C30">Outlier (> 3σ):</tspan> Rejects spurious visual</tspan>
          <tspan x="10" dy="12">hallucination or reflection.</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
