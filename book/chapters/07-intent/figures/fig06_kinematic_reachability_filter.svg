<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">THE 3-GATE MORPHOLOGICAL REACHABILITY &amp; SINGULARITY VALIDATOR</text>
  <text class="subtitle" x="20" y="46">Deterministic screening of untrusted VLM stochastic proposals before granting physical motor execution authority</text>

  <!-- ================= INPUT PROPOSAL BANNER ================= -->
  <g transform="translate(20, 60)">
    <rect width="900" height="42" rx="5" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2"/>
    <text class="badge-txt" x="14" y="18" fill="#A51C30">UNTRUSTED INPUT PROPOSAL (VLM / LLM SYSTEM 2)</text>
    <text class="mono-txt" x="14" y="32" fill="#1E293B">Candidate Target Pose: T_target = [ R | p ] ∈ SE(3)  |  Payload: m = 0.50 kg  |  Origin: Linux MPU (Untrusted)</text>
  </g>

  <!-- Arrow down to Gates -->
  <line x1="470" y1="105" x2="470" y2="120" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ================= 3 SEQUENTIAL VALIDATION GATES ================= -->
  <g transform="translate(20, 125)">
    
    <!-- GATE 1: GEOMETRIC WORKSPACE BOUNDS -->
    <g transform="translate(0, 0)">
      <rect width="286" height="240" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.3"/>
      <rect x="0" y="0" width="286" height="26" rx="6" fill="#1F407A"/>
      <rect x="0" y="20" width="286" height="6" fill="#1F407A"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">GATE 1: WORKSPACE GEOMETRY (W_reach)</text>

      <g transform="translate(12, 36)">
        <rect y="0" width="262" height="58" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#1F407A" font-weight="700">r_min ≤ ||p|| ≤ r_max</text>
        <text class="mono-txt" x="8" y="32" fill="#334155">0.15 m ≤ r ≤ 0.85 m</text>
        <text class="mono-txt" x="8" y="48" fill="#334155">z_target ≥ z_table + 20 mm</text>

        <text class="body-txt" x="0" y="74">
          <tspan x="0" dy="0">• <tspan font-weight="700">Workspace Sphere:</tspan> Rejects out-of-reach targets.</tspan>
          <tspan x="0" dy="15">• <tspan font-weight="700">Table Plane Hull:</tspan> Prevents surface collision.</tspan>
          <tspan x="0" dy="15">• <tspan font-weight="700">Joint Range Check:</tspan> Validates <tspan font-style="italic">q_min ≤ IK(T) ≤ q_max</tspan>.</tspan>
        </text>

        <rect y="140" width="262" height="26" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
        <text class="badge-txt" x="12" y="157" fill="#059669">✓ PASSED: WITHIN DEXTEROUS WORKSPACE</text>
      </g>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="288" y1="120" x2="303" y2="120" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- GATE 2: SINGULARITY & MANIPULABILITY -->
    <g transform="translate(306, 0)">
      <rect width="286" height="240" rx="6" fill="#EDF7F7" stroke="#007A87" stroke-width="1.3"/>
      <rect x="0" y="0" width="286" height="26" rx="6" fill="#007A87"/>
      <rect x="0" y="20" width="286" height="6" fill="#007A87"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">GATE 2: SINGULARITY &amp; MANIPULABILITY</text>

      <g transform="translate(12, 36)">
        <rect y="0" width="262" height="58" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#007A87" font-weight="700">κ(J) = σ_max / σ_min ≤ 50.0</text>
        <text class="mono-txt" x="8" y="32" fill="#334155">w(q) = √(det(J J^T)) ≥ 0.05</text>
        <text class="mono-txt" x="8" y="48" fill="#334155">det(J) ≠ 0 (No Rank Loss)</text>

        <text class="body-txt" x="0" y="74">
          <tspan x="0" dy="0">• <tspan font-weight="700">Singularity Avoidance:</tspan> Prevents velocity spikes</tspan>
          <tspan x="10" dy="14">(<tspan font-style="italic">q̇ = J^{-1} ẋ → ∞</tspan>) near boundary configurations.</tspan>
          <tspan x="0" dy="15">• <tspan font-weight="700">Yoshikawa Ellipsoid:</tspan> Ensures non-zero dexterity.</tspan>
        </text>

        <rect y="140" width="262" height="26" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
        <text class="badge-txt" x="12" y="157" fill="#059669">✓ PASSED: CONDITION NUMBER κ(J) = 14.2</text>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="594" y1="120" x2="609" y2="120" stroke="#007A87" stroke-width="2" marker-end="url(#arr-teal)"/>

    <!-- GATE 3: GRAVITY & PAYLOAD TORQUE -->
    <g transform="translate(614, 0)">
      <rect width="286" height="240" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.3"/>
      <rect x="0" y="0" width="286" height="26" rx="6" fill="#B87333"/>
      <rect x="0" y="20" width="286" height="6" fill="#B87333"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">GATE 3: STATIC TORQUE &amp; PAYLOAD</text>

      <g transform="translate(12, 36)">
        <rect y="0" width="262" height="58" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#B87333" font-weight="700">τ_static = g(q) + J^T F_ext</text>
        <text class="mono-txt" x="8" y="32" fill="#334155">|τ_i| ≤ 0.80 · τ_continuous</text>
        <text class="mono-txt" x="8" y="48" fill="#334155">Thermal Margin: 20% Headroom</text>

        <text class="body-txt" x="0" y="74">
          <tspan x="0" dy="0">• <tspan font-weight="700">Gravity Holding:</tspan> Computes required motor torque.</tspan>
          <tspan x="0" dy="15">• <tspan font-weight="700">Thermal Protection:</tspan> Prevents winding <tspan font-style="italic">I^2 R</tspan> Joule</tspan>
          <tspan x="10" dy="14">overheating during sustained grasp holds.</tspan>
        </text>

        <rect y="140" width="262" height="26" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
        <text class="badge-txt" x="12" y="157" fill="#059669">✓ PASSED: PEAK TORQUE 62% OF RATED LIMIT</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: FINAL DECISION VERDICT ================= -->
  <g transform="translate(20, 380)">
    <rect width="900" height="100" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/>
    <text class="badge-txt" x="16" y="20" fill="#059669">GATEWAY AUDIT COMPLETE: ALL 3 MORPHOLOGICAL GATES SATISFIED</text>

    <g transform="translate(16, 32)">
      <text class="body-txt" x="0" y="12">
        <tspan x="0" dy="0">• <tspan font-weight="700">Permission Granted:</tspan> Proposal certified as kinematically admissible, singularity-safe, and within motor thermal limits.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Handoff to System 1.5:</tspan> Target pose <tspan font-style="italic">T_target</tspan> is passed to the real-time trajectory planner to synthesize <tspan font-style="italic">C^2</tspan>-continuous action chunks.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Defect Reporting:</tspan> If any gate had failed, an explicit error code (e.g. <tspan font-family="monospace">ERR_SINGULARITY_KAPPA</tspan>) would be returned to System 2 for re-prompting.</tspan>
      </text>
    </g>
  </g>
</svg>

