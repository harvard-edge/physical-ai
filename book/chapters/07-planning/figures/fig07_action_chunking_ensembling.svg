<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">RECEDING-HORIZON ACTION CHUNKING WITH EXPONENTIAL TEMPORAL ENSEMBLING</text>
  <text class="subtitle" x="20" y="46">Blending overlapping trajectory proposals with exponential weight decay w_i = exp(-λ i) to filter high-frequency stochastic noise</text>

  <!-- ================= TOP: OVERLAPPING ACTION CHUNKS ================= -->
  <g transform="translate(20, 60)">
    <rect width="900" height="235" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="22" fill="#1E293B">OVERLAPPING RECEDING-HORIZON TRAJECTORY CHUNKS (H = 8 STEPS)</text>

    <!-- Chunk 0 (Inferred at t = 0) -->
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="360" height="30" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
      <text class="mono-txt" x="10" y="19" fill="#1F407A" font-weight="700">Chunk 0 (t = 0): [ a_0^(0), a_1^(0), a_2^(0), a_3^(0), a_4^(0), a_5^(0), a_6^(0), a_7^(0) ]</text>
    </g>

    <!-- Chunk 1 (Inferred at t = 1) -->
    <g transform="translate(60, 78)">
      <rect x="50" y="0" width="360" height="30" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1.2"/>
      <text class="mono-txt" x="60" y="19" fill="#007A87" font-weight="700">Chunk 1 (t = 1): [ a_0^(1), a_1^(1), a_2^(1), a_3^(1), a_4^(1), a_5^(1), a_6^(1), a_7^(1) ]</text>
    </g>

    <!-- Chunk 2 (Inferred at t = 2) -->
    <g transform="translate(60, 116)">
      <rect x="100" y="0" width="360" height="30" rx="4" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
      <text class="mono-txt" x="110" y="19" fill="#B87333" font-weight="700">Chunk 2 (t = 2): [ a_0^(2), a_1^(2), a_2^(2), a_3^(2), a_4^(2), a_5^(2), a_6^(2), a_7^(2) ]</text>
    </g>

    <!-- Chunk 3 (Inferred at t = 3) -->
    <g transform="translate(60, 154)">
      <rect x="150" y="0" width="360" height="30" rx="4" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2"/>
      <text class="mono-txt" x="160" y="19" fill="#A51C30" font-weight="700">Chunk 3 (t = 3): [ a_0^(3), a_1^(3), a_2^(3), a_3^(3), a_4^(3), a_5^(3), a_6^(3), a_7^(3) ]</text>
    </g>

    <!-- Vertical Ensembling Cross-Section at t = 3 -->
    <g transform="translate(210, 32)">
      <line x1="0" y1="0" x2="0" y2="160" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
      <rect x="-65" y="165" width="130" height="26" rx="3" fill="#1E293B"/>
      <text class="mono-txt" x="0" y="182" text-anchor="middle" fill="#FFFFFF" font-weight="700">ENSEMBLE AT t = 3</text>
    </g>

    <!-- Weight Formula Callout -->
    <g transform="translate(620, 50)">
      <rect width="250" height="120" rx="5" fill="#FFFFFF" stroke="#059669" stroke-width="1.3"/>
      <text class="badge-txt" x="12" y="20" fill="#059669">EXPONENTIAL ENSEMBLING WEIGHTS</text>
      
      <g transform="translate(12, 36)">
        <text class="mono-txt" x="0" y="14" fill="#059669" font-weight="700">â_t = ( ∑ w_i a_t^(i) ) / ( ∑ w_i )</text>
        <text class="mono-txt" x="0" y="34" fill="#1E293B">w_i = exp( -λ · (t - t_0^(i)) )</text>
        <text class="body-txt" x="0" y="52">• λ = 0.75 (Tuning parameter)</text>
        <text class="body-txt" x="0" y="66">• Places higher weight on newer proposals</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: FILTERING EFFECT & C2 CONTINUITY ================= -->
  <g transform="translate(20, 310)">
    
    <!-- LEFT: RAW NOISY PREDICTIONS VS ENSEMBLED -->
    <g transform="translate(0, 0)">
      <rect width="440" height="170" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <text class="badge-txt" x="16" y="22" fill="#1E293B">TEMPORAL FILTERING: RAW STOCHASTIC NOISE VS. ENSEMBLE</text>

      <!-- Plot -->
      <g transform="translate(20, 35)">
        <line x1="0" y1="80" x2="390" y2="80" stroke="#94A3B8" stroke-width="1"/>
        
        <!-- Raw Noisy Path (Red jagged) -->
        <path d="M 0 60 L 40 40 L 80 68 L 120 30 L 160 55 L 200 22 L 240 45 L 280 15 L 320 35 L 360 10 L 390 25" fill="none" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="3,2"/>
        <text class="tag-txt" x="125" y="22" fill="#A51C30">Raw Stochastic Diffusion (Noisy)</text>

        <!-- Ensembled Smooth Path (Green solid) -->
        <path d="M 0 58 C 80 50, 160 38, 240 28 C 300 20, 350 16, 390 15" fill="none" stroke="#059669" stroke-width="2.5"/>
        <text class="tag-txt" x="245" y="16" fill="#059669">Exponentially Ensembled Trajectory</text>
      </g>

      <text class="body-txt" x="16" y="145">
        • Temporal ensembling acts as a zero-phase low-pass filter, eliminating policy jitter.
      </text>
    </g>

    <!-- RIGHT: BENEFITS FOR EMBEDDED ACTUATION -->
    <g transform="translate(460, 0)">
      <rect width="440" height="170" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
      <rect x="0" y="0" width="440" height="24" rx="6" fill="#059669"/>
      <rect x="0" y="18" width="440" height="6" fill="#059669"/>
      <text class="badge-txt" x="12" y="16" fill="#FFFFFF">✓ PHYSICAL SYSTEMS ADVANTAGES OF ENSEMBLING</text>

      <text class="body-txt" x="16" y="44">
        <tspan x="16" dy="0">1. <tspan font-weight="700">Smooth Inter-Chunk Handoff:</tspan> Prevents abrupt positional discontinuities between chunk horizons.</tspan>
        <tspan x="16" dy="16">2. <tspan font-weight="700">Inertial Compliance:</tspan> Blends future intention with immediate kinematic momentum.</tspan>
        <tspan x="16" dy="16">3. <tspan font-weight="700">MCU Execution Feasibility:</tspan> Enables bare-metal spline interpolator to compute smooth derivatives.</tspan>
        <tspan x="16" dy="16">4. <tspan font-weight="700">Reduced Gearbox Stress:</tspan> Decreases peak motor current ripple by up to <tspan font-weight="700" fill="#059669">68%</tspan>.</tspan>
      </text>
    </g>
  </g>
</svg>
