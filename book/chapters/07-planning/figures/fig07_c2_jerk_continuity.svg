<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">DERIVATIVE CONTINUITY (C^2) VS. DISCONTINUOUS WAYPOINT STEPPING</text>
  <text class="subtitle" x="20" y="46">How quintic polynomial spline interpolation bounds acceleration and eliminates infinite jerk spikes (δ(t))</text>

  <!-- ================= LEFT: DISCONTINUOUS C0 STEPPING (CHAOS) ================= -->
  <g transform="translate(20, 60)">
    <rect width="440" height="420" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.3"/>
    <rect x="0" y="0" width="440" height="24" rx="6" fill="#A51C30"/>
    <rect x="0" y="18" width="440" height="6" fill="#A51C30"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">❌ DISCONTINUOUS C0 STEPPING (ZERO-ORDER HOLD)</text>

    <!-- 3 Mini Plots (q, q_dot, q_ddot, jerk) -->
    <g transform="translate(20, 35)">
      
      <!-- Plot 1: Position q(t) - Step function -->
      <g transform="translate(0, 0)">
        <text class="mono-txt" x="0" y="12" fill="#A51C30" font-weight="700">1. Position q(t) — Piecewise Constant Steps</text>
        <line x1="0" y1="50" x2="390" y2="50" stroke="#CBD5E1" stroke-width="1"/>
        <path d="M 0 50 L 70 50 L 70 30 L 160 30 L 160 15 L 260 15 L 260 0 L 390 0" fill="none" stroke="#A51C30" stroke-width="2"/>
      </g>

      <!-- Plot 2: Velocity q̇(t) - Delta spikes -->
      <g transform="translate(0, 65)">
        <text class="mono-txt" x="0" y="12" fill="#A51C30" font-weight="700">2. Velocity q̇(t) — Infinite Dirac Spikes δ(t)</text>
        <line x1="0" y1="50" x2="390" y2="50" stroke="#CBD5E1" stroke-width="1"/>
        <line x1="70" y1="50" x2="70" y2="10" stroke="#A51C30" stroke-width="2"/>
        <line x1="160" y1="50" x2="160" y2="10" stroke="#A51C30" stroke-width="2"/>
        <line x1="260" y1="50" x2="260" y2="10" stroke="#A51C30" stroke-width="2"/>
        <text class="tag-txt" x="80" y="20" fill="#A51C30">q̇ → ∞</text>
      </g>

      <!-- Plot 3: Jerk j(t) - Destructive infinite derivative -->
      <g transform="translate(0, 130)">
        <text class="mono-txt" x="0" y="12" fill="#A51C30" font-weight="700">3. Jerk j(t) = d³q/dt³ — Unbounded Chatter</text>
        <line x1="0" y1="50" x2="390" y2="50" stroke="#CBD5E1" stroke-width="1"/>
        <line x1="70" y1="50" x2="70" y2="0" stroke="#A51C30" stroke-width="2.5"/>
        <line x1="160" y1="50" x2="160" y2="0" stroke="#A51C30" stroke-width="2.5"/>
        <line x1="260" y1="50" x2="260" y2="0" stroke="#A51C30" stroke-width="2.5"/>
        <text class="tag-txt" x="170" y="15" fill="#A51C30">j(t) = dδ/dt (Singularity)</text>
      </g>
    </g>

    <!-- Failure description -->
    <g transform="translate(20, 265)">
      <rect width="400" height="135" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text class="badge-txt" x="10" y="16" fill="#A51C30">PHYSICAL HARDWARE CONSEQUENCES:</text>
      <text class="body-txt" x="10" y="32">
        <tspan x="10" dy="0">• <tspan font-weight="700">Extreme Torque Spikes:</tspan> Motor commanded to accelerate instantly.</tspan>
        <tspan x="10" dy="16">• <tspan font-weight="700">Current Inrush (I^2 R):</tspan> Massive coil heating, blowing power fuses.</tspan>
        <tspan x="10" dy="16">• <tspan font-weight="700">Gearbox Backlash &amp; Wear:</tspan> Strips reduction gear teeth.</tspan>
        <tspan x="10" dy="16">• <tspan font-weight="700">Audio Acoustics:</tspan> Loud, high-pitched mechanical knocking.</tspan>
      </text>
    </g>
  </g>

  <!-- ================= RIGHT: C2 QUINTIC SPLINE CONTINUITY (PERFECTION) ================= -->
  <g transform="translate(480, 60)">
    <rect width="440" height="420" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
    <rect x="0" y="0" width="440" height="24" rx="6" fill="#059669"/>
    <rect x="0" y="18" width="440" height="6" fill="#059669"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">✓ C2 CONTINUITY (QUINTIC POLYNOMIAL SPLINE)</text>

    <!-- 3 Mini Plots (q, q_dot, q_ddot, jerk) -->
    <g transform="translate(20, 35)">
      
      <!-- Plot 1: Position q(t) - Smooth S-curve -->
      <g transform="translate(0, 0)">
        <text class="mono-txt" x="0" y="12" fill="#059669" font-weight="700">1. Position q(t) — Smooth Quintic Interpolation</text>
        <line x1="0" y1="50" x2="390" y2="50" stroke="#CBD5E1" stroke-width="1"/>
        <path d="M 0 50 C 60 50, 80 30, 140 30 C 200 30, 220 15, 280 15 C 330 15, 360 0, 390 0" fill="none" stroke="#059669" stroke-width="2.5"/>
      </g>

      <!-- Plot 2: Velocity q̇(t) - Smooth bounded bell curves -->
      <g transform="translate(0, 65)">
        <text class="mono-txt" x="0" y="12" fill="#059669" font-weight="700">2. Velocity q̇(t) — Continuous &amp; Bounded (|q̇| ≤ v_max)</text>
        <line x1="0" y1="50" x2="390" y2="50" stroke="#CBD5E1" stroke-width="1"/>
        <path d="M 0 50 C 30 50, 40 20, 70 20 C 100 20, 110 50, 140 50 C 170 50, 180 25, 210 25 C 240 25, 250 50, 280 50 C 310 50, 330 20, 360 20 C 380 20, 385 50, 390 50" fill="none" stroke="#059669" stroke-width="2"/>
      </g>

      <!-- Plot 3: Jerk j(t) - Smooth & bounded (|j(t)| ≤ j_max) -->
      <g transform="translate(0, 130)">
        <text class="mono-txt" x="0" y="12" fill="#059669" font-weight="700">3. Jerk j(t) = d³q/dt³ — Bounded &amp; Smooth</text>
        <line x1="0" y1="50" x2="390" y2="50" stroke="#CBD5E1" stroke-width="1"/>
        <path d="M 0 50 Q 35 15, 70 50 Q 105 85, 140 50 Q 175 25, 210 50 Q 245 75, 280 50 Q 320 20, 360 50 Q 380 65, 390 50" fill="none" stroke="#059669" stroke-width="1.8"/>
      </g>
    </g>

    <!-- Success description -->
    <g transform="translate(20, 265)">
      <rect width="400" height="135" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text class="badge-txt" x="10" y="16" fill="#059669">PHYSICAL SYSTEMS ADVANTAGES:</text>
      <text class="body-txt" x="10" y="32">
        <tspan x="10" dy="0">• <tspan font-weight="700">Smooth Motor Commutation:</tspan> Current follows gradual sinusoidal curves.</tspan>
        <tspan x="10" dy="16">• <tspan font-weight="700">Thermal Protection:</tspan> Operates within nominal continuous torque ratings.</tspan>
        <tspan x="10" dy="16">• <tspan font-weight="700">10x Extended Lifespan:</tspan> Zero harmonic resonance or gearbox damage.</tspan>
        <tspan x="10" dy="16">• <tspan font-weight="700">Rock-Solid Tracking:</tspan> 1 kHz MCU PID loops track trajectory perfectly.</tspan>
      </text>
    </g>
  </g>
</svg>
