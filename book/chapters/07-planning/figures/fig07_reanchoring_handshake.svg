<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">ASYNCHRONOUS STATE RE-ANCHORING HANDSHAKE UNDER SAFETY INTERVENTION</text>
  <text class="subtitle" x="20" y="46">Surviving real-time MCU safety vetoes: atomic mailbox notification, queue purge, KV-cache reset, and bumpless restart</text>

  <!-- ================= 4-STEP RE-ANCHORING WORKFLOW ================= -->
  <g transform="translate(20, 60)">
    
    <!-- STEP 1: SAFETY VETO ON MCU -->
    <g transform="translate(0, 0)">
      <rect width="210" height="300" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#A51C30"/>
      <rect x="0" y="20" width="210" height="6" fill="#A51C30"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">1. MCU SAFETY VETO (t = 120ms)</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="55" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#A51C30" font-weight="700">CBF Invariant Breached!</text>
        <text class="mono-txt" x="8" y="34" fill="#334155">ḣ(x) + γ h(x) &lt; 0</text>
        <text class="body-txt" x="8" y="48" fill="#64748B">Dynamic obstacle encroaches</text>

        <rect y="65" width="190" height="55" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#A51C30" font-weight="700">Action: Veto Trajectory</text>
        <text class="body-txt" x="8" y="34">• Overrides proposed action</text>
        <text class="body-txt" x="8" y="48">• Executes Category 2 Stop</text>

        <text class="body-txt" x="0" y="140">
          <tspan x="0" dy="0">• Latches physical state:</tspan>
          <tspan x="0" dy="16" font-family="monospace" fill="#1E293B">q_actual = [1.24, -0.42, ...]</tspan>
          <tspan x="0" dy="16" font-family="monospace" fill="#1E293B">q̇_actual = [0.0, 0.0, ...]</tspan>
        </text>
      </g>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="215" y1="150" x2="230" y2="150" stroke="#A51C30" stroke-width="2" marker-end="url(#arr-crimson)"/>

    <!-- STEP 2: ATOMIC MAILBOX NOTIFICATION -->
    <g transform="translate(235, 0)">
      <rect width="210" height="300" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#B87333"/>
      <rect x="0" y="20" width="210" height="6" fill="#B87333"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">2. SHARED SRAM POSTING</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="75" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1"/>
        <text class="badge-txt" x="8" y="18" fill="#B87333">ATOMIC MAILBOX WRITE</text>
        <text class="mono-txt" x="8" y="36" fill="#1E293B">veto_flag = 1;</text>
        <text class="mono-txt" x="8" y="52" fill="#1E293B">actual_state = q_actual;</text>
        <text class="mono-txt" x="8" y="68" fill="#B87333">epoch_seq = 4092;</text>

        <rect y="85" width="190" height="65" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1"/>
        <text class="badge-txt" x="8" y="18" fill="#B87333">INTER-CORE IRQ PULSE</text>
        <text class="mono-txt" x="8" y="36" fill="#1E293B">IPC Hardware Mailbox</text>
        <text class="body-txt" x="8" y="52">• Microsecond interrupt latency</text>

        <text class="body-txt" x="0" y="170">
          <tspan x="0" dy="0">• Notifies Linux MPU immediately.</tspan>
          <tspan x="0" dy="16">• Zero dynamic memory allocation.</tspan>
        </text>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="450" y1="150" x2="465" y2="150" stroke="#B87333" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- STEP 3: MPU QUEUE PURGE & KV-CACHE RESET -->
    <g transform="translate(470, 0)">
      <rect width="210" height="300" rx="6" fill="#EDF7F7" stroke="#007A87" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#007A87"/>
      <rect x="0" y="20" width="210" height="6" fill="#007A87"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">3. MPU PURGE &amp; RESET</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="60" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#007A87" font-weight="700">1. Flush Action Queue</text>
        <text class="body-txt" x="8" y="34">• Purges all stale chunk waypoints</text>
        <text class="body-txt" x="8" y="48">• Aborts active trajectory decoders</text>

        <rect y="70" width="190" height="65" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#007A87" font-weight="700">2. Clear KV-Cache</text>
        <text class="body-txt" x="8" y="34">• Resets Transformer autoregression</text>
        <text class="body-txt" x="8" y="50">• Eliminates open-loop state hallucination</text>

        <text class="body-txt" x="0" y="155">
          <tspan x="0" dy="0">• Ingests <tspan font-family="monospace">q_actual</tspan> as new initial</tspan>
          <tspan x="0" dy="16">  boundary condition <tspan font-style="italic">q(0)</tspan>.</tspan>
        </text>
      </g>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="685" y1="150" x2="700" y2="150" stroke="#007A87" stroke-width="2" marker-end="url(#arr-teal)"/>

    <!-- STEP 4: BUMPLESS RE-ANCHORING & RESUMPTION -->
    <g transform="translate(705, 0)">
      <rect width="195" height="300" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
      <rect x="0" y="0" width="195" height="26" rx="6" fill="#059669"/>
      <rect x="0" y="20" width="195" height="6" fill="#059669"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">4. BUMPLESS RESUMPTION</text>

      <g transform="translate(10, 36)">
        <rect width="175" height="95" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
        <text class="badge-txt" x="8" y="18" fill="#059669">NEW TRAJECTORY SEED</text>
        <text class="mono-txt" x="8" y="36" fill="#1E293B">q_start = q_actual;</text>
        <text class="mono-txt" x="8" y="52" fill="#1E293B">q̇_start = q̇_actual;</text>
        <text class="mono-txt" x="8" y="68" fill="#059669">C^2 Quintic Fit</text>
        <text class="mono-txt" x="8" y="86" font-weight="700" fill="#059669">BUMPLESS RESUME</text>

        <text class="body-txt" x="0" y="150">
          <tspan x="0" dy="0">• Zero acceleration jump.</tspan>
          <tspan x="0" dy="16">• Resynthesizes safe chunk.</tspan>
          <tspan x="0" dy="16">• Motor resumes smooth motion.</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: THE BUMPLESS TRANSFER INVARIANT ================= -->
  <g transform="translate(20, 380)">
    <rect width="900" height="100" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="20" fill="#1E293B">THE PHYSICAL AI STATE RE-ANCHORING CONTRACT</text>

    <g transform="translate(16, 32)">
      <text class="body-txt" x="0" y="12">
        <tspan x="0" dy="0">1. <tspan font-weight="700">The Hallucination Danger:</tspan> If an MPU planner generates trajectories assuming an un-vetoed path, its next chunk commands a massive step jump from the actual physical stopping point.</tspan>
        <tspan x="0" dy="16">2. <tspan font-weight="700">Strict Hardware Handshake:</tspan> By enforcing that every new chunk starts at the exact measured physical state (<tspan font-style="italic">q_actual, q̇_actual</tspan>), position error is zeroed.</tspan>
        <tspan x="0" dy="16">3. <tspan font-weight="700">Governed Recovery:</tspan> The system gracefully recovers from dynamic obstacles without rebooting the robot or entering an unrecoverable fault state.</tspan>
      </text>
    </g>
  </g>
</svg>
