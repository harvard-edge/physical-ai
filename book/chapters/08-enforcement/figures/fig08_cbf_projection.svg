<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">MINIMAL-INTERVENTION CONTROL BARRIER FUNCTION (CBF) PROJECTION</text>
  <text class="subtitle" x="20" y="46">State space forward invariance ḣ(x, u) ≥ -α(h(x)) and closed-form quadratic program action projection</text>

  <!-- ================= LEFT: STATE SPACE GEOMETRY ================= -->
  <g transform="translate(20, 60)">
    <rect width="440" height="420" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="22" fill="#1E293B">1. STATE SPACE GEOMETRY (FORWARD INVARIANCE OF C)</text>

    <!-- Diagram -->
    <g transform="translate(30, 40)">
      <!-- Unsafe Set (Red) -->
      <path d="M 0 160 Q 180 80, 380 160 L 380 260 L 0 260 Z" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.5"/>
      <text class="badge-txt" x="190" y="230" text-anchor="middle" fill="#A51C30">UNSAFE SET C^c (h(x) &lt; 0)</text>

      <!-- Safe Set (Green) -->
      <path d="M 0 0 L 380 0 L 380 160 Q 180 80, 0 160 Z" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
      <text class="badge-txt" x="190" y="40" text-anchor="middle" fill="#059669">SAFE SET C = { x : h(x) ≥ 0 }</text>

      <!-- Boundary ∂C: h(x) = 0 -->
      <text class="mono-txt" x="20" y="145" fill="#059669" font-weight="700">Boundary ∂C (h(x) = 0)</text>

      <!-- Current State Point x_t -->
      <circle cx="150" cy="115" r="5" fill="#1E293B"/>
      <text class="mono-txt" x="135" y="110" fill="#1E293B" font-weight="700">x_t</text>

      <!-- Untrusted Proposed Vector p_t (Pointing into Unsafe Region) -->
      <line x1="150" y1="115" x2="230" y2="185" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arr-crimson)"/>
      <text class="mono-txt" x="235" y="195" fill="#A51C30" font-weight="700">p_t (Untrusted Proposal)</text>

      <!-- Normal Vector ∇h(x) -->
      <line x1="150" y1="115" x2="110" y2="55" stroke="#007A87" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-teal)"/>
      <text class="mono-txt" x="105" y="48" fill="#007A87">∇h(x_t)</text>

      <!-- Filtered Permitted Action u_t (Tangential Projection) -->
      <line x1="150" y1="115" x2="270" y2="95" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-teal)"/>
      <text class="mono-txt" x="275" y="92" fill="#059669" font-weight="700">u_t* (Filtered Action)</text>

      <!-- Projection dotted line -->
      <line x1="230" y1="185" x2="270" y2="95" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3,3"/>
    </g>

    <!-- Bottom note -->
    <g transform="translate(16, 320)">
      <rect width="408" height="85" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text class="badge-txt" x="10" y="16" fill="#1E293B">FORWARD INVARIANCE GUARANTEE:</text>
      <text class="body-txt" x="10" y="32">
        <tspan x="10" dy="0">• By enforcing Nagumo's condition via CBF (<tspan font-style="italic">L_f h + L_g h u ≥ -α(h)</tspan>),</tspan>
        <tspan x="10" dy="16">  the system guarantees that state <tspan font-style="italic">x_t</tspan> never breaches the boundary <tspan font-style="italic">∂C</tspan>.</tspan>
        <tspan x="10" dy="16">• Preserves maximum task intent while rigidly enforcing safety.</tspan>
      </text>
    </g>
  </g>

  <!-- ================= RIGHT: CLOSED-FORM QP PROJECTION IN ACTION SPACE ================= -->
  <g transform="translate(480, 60)">
    <rect width="440" height="420" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="22" fill="#1E293B">2. ACTION SPACE QP PROJECTION SOLVED IN 65 μs ON MCU</text>

    <!-- Mathematical Formulation Box -->
    <g transform="translate(16, 35)">
      <rect width="408" height="110" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text class="badge-txt" x="12" y="18" fill="#059669">MINIMAL-INTERVENTION QUADRATIC PROGRAM (QP)</text>
      
      <g transform="translate(12, 32)">
        <text class="mono-txt" x="0" y="14" fill="#1E293B" font-weight="700">u_t* = argmin_{u}  (1/2) || u - p_t ||_2^2</text>
        <text class="mono-txt" x="0" y="32" fill="#059669" font-weight="700">subject to:  a^T u ≤ b   (Affine Half-Space)</text>
        <text class="body-txt" x="0" y="50">where <tspan font-style="italic">a = -L_g h(x)</tspan> and <tspan font-style="italic">b = L_f h(x) + α(h(x))</tspan></text>
      </g>
    </g>

    <!-- Closed-Form Analytical Solution -->
    <g transform="translate(16, 160)">
      <rect width="408" height="120" rx="5" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
      <text class="badge-txt" x="12" y="18" fill="#059669">CLOSED-FORM ANALYTICAL PROJECTION (ZERO ITERATIONS)</text>

      <g transform="translate(12, 34)">
        <text class="mono-txt" x="0" y="14" fill="#059669" font-weight="700">if (a^T p_t ≤ b)  return p_t;  // Proposal is Safe</text>
        <text class="mono-txt" x="0" y="32" fill="#A51C30" font-weight="700">else u* = p_t - [ (a^T p_t - b) / ||a||_2^2 ] · a</text>
        <text class="body-txt" x="0" y="52">• Evaluates 1 scalar dot-product and 1 vector subtraction.</text>
        <text class="body-txt" x="0" y="66">• Execution latency: <tspan font-weight="700" fill="#059669">65 microseconds</tspan> on Cortex-M4.</text>
      </g>
    </g>

    <!-- Physical AI Contrast -->
    <g transform="translate(16, 295)">
      <rect width="408" height="110" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text class="badge-txt" x="12" y="18" fill="#1F407A">SYSTEMS METROLOGY ADVANTAGE</text>
      <text class="body-txt" x="12" y="36">
        <tspan x="12" dy="0">• <tspan font-weight="700">Deterministic Bare-Metal:</tspan> Zero matrix inversion, zero numerical convergence loops, zero solver timeouts.</tspan>
        <tspan x="12" dy="16">• <tspan font-weight="700">Continuous 1000 Hz Invariant:</tspan> The MCU reflex operates with guaranteed microsecond latency, completely immune to MPU delays.</tspan>
      </text>
    </g>
  </g>
</svg>
