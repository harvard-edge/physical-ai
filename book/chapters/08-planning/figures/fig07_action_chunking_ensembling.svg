<rect x="60" y="276" width="760" height="54" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
<text x="80" y="298" font-size="10" font-weight="700" fill="#1F407A">MATHEMATICAL FORMULATION: u_t = ∑ w_i · a_t^(i) / ∑ w_i  where  w_i = exp(-m · (t - t_start))</text>
<text x="80" y="316" font-size="8.5" fill="#475569">Recent predictions carry higher exponential weights; older tail steps decay gracefully to eliminate joint torque jerks.</text>
<rect x="60" y="348" width="760" height="42" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="366" font-size="9" font-weight="700" fill="#1F407A" text-anchor="middle">THE ACTION CHUNKING PRINCIPLE</text>
<text x="440.0" y="380" font-size="8.5" fill="#475569" text-anchor="middle">Chunking amortizes high inference latency over future time steps; temporal ensembling eliminates inter-chunk torque discontinuities.</text>
