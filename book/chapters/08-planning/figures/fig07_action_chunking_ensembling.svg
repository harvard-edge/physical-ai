<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">RECEDING-HORIZON ACTION CHUNKING WITH EXPONENTIAL TEMPORAL ENSEMBLING</text>
  <text class="subtitle" x="20" y="46">Blending overlapping trajectory proposals with exponential weight decay w_i = exp(-λ i) to filter high-frequency stochastic noise</text>

  <!-- ================= TOP: OVERLAPPING ACTION CHUNKS ================= -->
  <g transform="translate(20, 60)">
    <rect width="900" height="235" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="22" fill="#1E293B">OVERLAPPING RECEDING-HORIZON TRAJECTORY CHUNKS (H = 8 STEPS)</text>

    <!-- Chunk 0 (Inferred at t = 0) -->
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="480" height="28" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
      <text class="mono-txt" x="10" y="18" fill="#1F407A" font-weight="700">Chunk 0:</text>
      <text class="mono-txt" x="110" y="18" fill="#1F407A">a_0</text>
      <text class="mono-txt" x="150" y="18" fill="#1F407A">a_1</text>
      <text class="mono-txt" x="190" y="18" fill="#1F407A">a_2</text>
      <text class="mono-txt" x="230" y="18" fill="#1F407A" font-weight="700">a_3</text>
      <text class="mono-txt" x="270" y="18" fill="#1F407A">a_4</text>
      <text class="mono-txt" x="310" y="18" fill="#1F407A">a_5</text>
      <text class="mono-txt" x="350" y="18" fill="#1F407A">a_6</text>
      <text class="mono-txt" x="390" y="18" fill="#1F407A">a_7</text>
    </g>

    <!-- Chunk 1 (Inferred at t = 1) -->
    <g transform="translate(20, 74)">
      <rect x="40" y="0" width="480" height="28" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1.2"/>
      <text class="mono-txt" x="50" y="18" fill="#007A87" font-weight="700">Chunk 1:</text>
      <text class="mono-txt" x="150" y="18" fill="#007A87">a_0</text>
      <text class="mono-txt" x="190" y="18" fill="#007A87">a_1</text>
      <text class="mono-txt" x="230" y="18" fill="#007A87" font-weight="700">a_2</text>
      <text class="mono-txt" x="270" y="18" fill="#007A87">a_3</text>
      <text class="mono-txt" x="310" y="18" fill="#007A87">a_4</text>
      <text class="mono-txt" x="350" y="18" fill="#007A87">a_5</text>
      <text class="mono-txt" x="390" y="18" fill="#007A87">a_6</text>
      <text class="mono-txt" x="430" y="18" fill="#007A87">a_7</text>
    </g>

    <!-- Chunk 2 (Inferred at t = 2) -->
    <g transform="translate(20, 110)">
      <rect x="80" y="0" width="480" height="28" rx="4" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
      <text class="mono-txt" x="90" y="18" fill="#B87333" font-weight="700">Chunk 2:</text>
      <text class="mono-txt" x="190" y="18" fill="#B87333">a_0</text>
      <text class="mono-txt" x="230" y="18" fill="#B87333" font-weight="700">a_1</text>
      <text class="mono-txt" x="270" y="18" fill="#B87333">a_2</text>
      <text class="mono-txt" x="310" y="18" fill="#B87333">a_3</text>
      <text class="mono-txt" x="350" y="18" fill="#B87333">a_4</text>
      <text class="mono-txt" x="390" y="18" fill="#B87333">a_5</text>
      <text class="mono-txt" x="430" y="18" fill="#B87333">a_6</text>
      <text class="mono-txt" x="470" y="18" fill="#B87333">a_7</text>
    </g>

    <!-- Chunk 3 (Inferred at t = 3) -->
    <g transform="translate(20, 146)">
      <rect x="120" y="0" width="480" height="28" rx="4" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2"/>
      <text class="mono-txt" x="130" y="18" fill="#A51C30" font-weight="700">Chunk 3:</text>
      <text class="mono-txt" x="230" y="18" fill="#A51C30" font-weight="700">a_0</text>
      <text class="mono-txt" x="270" y="18" fill="#A51C30">a_1</text>
      <text class="mono-txt" x="310" y="18" fill="#A51C30">a_2</text>
      <text class="mono-txt" x="350" y="18" fill="#A51C30">a_3</text>
      <text class="mono-txt" x="390" y="18" fill="#A51C30">a_4</text>
      <text class="mono-txt" x="430" y="18" fill="#A51C30">a_5</text>
      <text class="mono-txt" x="470" y="18" fill="#A51C30">a_6</text>
      <text class="mono-txt" x="510" y="18" fill="#A51C30">a_7</text>
    </g>

    <!-- Vertical Ensembling Cross-Section at t = 3 (x = 20 + 230 + 10 = 260) -->
    <!-- Column highlight rect behind waypoints -->
    <rect x="240" y="32" width="38" height="150" rx="3" fill="#3B82F6" fill-opacity="0.12" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="3,2"/>
    <g transform="translate(259, 186)">
      <rect x="-60" y="0" width="120" height="24" rx="3" fill="#1E293B"/>
      <text class="mono-txt" x="0" y="16" text-anchor="middle" fill="#FFFFFF" font-weight="700">ENSEMBLE AT t = 3</text>
    </g>

    <!-- Weight Formula Callout -->
    <g transform="translate(635, 40)">
      <rect width="245" height="145" rx="5" fill="#FFFFFF" stroke="#059669" stroke-width="1.3"/>
      <text class="badge-txt" x="12" y="20" fill="#059669">EXPONENTIAL ENSEMBLING</text>
      
      <g transform="translate(12, 34)">
        <text class="mono-txt" x="0" y="14" fill="#059669" font-weight="700">â_t = ( ∑ w_i a_t^(i) ) / ( ∑ w_i )</text>
        <text class="mono-txt" x="0" y="34" fill="#1E293B">w_i = exp( -λ · (t - t_0^(i)) )</text>
        <text class="body-txt" x="0" y="56">• <tspan font-weight="700">Decay Rate:</tspan> λ = 0.15</text>
        <text class="body-txt" x="0" y="72">• <tspan font-weight="700">Recency:</tspan> Weights newest token</text>
        <text class="body-txt" x="0" y="88">• <tspan font-weight="700">Filtering:</tspan> Suppresses jitter</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: FILTERING EFFECT & C2 CONTINUITY ================= -->
  <g transform="translate(20, 310)">
    
    <!-- LEFT: RAW NOISY PREDICTIONS VS ENSEMBLED -->
    <g transform="translate(0, 0)">
      <rect width="440" height="170" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <text class="badge-txt" x="16" y="22" fill="#1E293B">TEMPORAL FILTERING: RAW STOCHASTIC NOISE VS. ENSEMBLE</text>

      <!-- Plot -->
      <g transform="translate(20, 35)">
        <line x1="0" y1="80" x2="390" y2="80" stroke="#94A3B8" stroke-width="1"/>
        
        <!-- Legend labels placed cleanly above plot -->
        <text class="tag-txt" x="10" y="12" fill="#A51C30">-- Raw Stochastic Diffusion (Noisy)</text>
        <text class="tag-txt" x="210" y="12" fill="#059669">— Exponentially Ensembled Trajectory</text>

        <!-- Raw Noisy Path (Red jagged) -->
        <path d="M 0 60 L 40 40 L 80 68 L 120 30 L 160 55 L 200 22 L 240 45 L 280 15 L 320 35 L 360 10 L 390 25" fill="none" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="3,2"/>

        <!-- Ensembled Smooth Path (Green solid) -->
        <path d="M 0 58 C 80 50, 160 38, 240 28 C 300 20, 350 16, 390 15" fill="none" stroke="#059669" stroke-width="2.5"/>
      </g>

      <text class="body-txt" x="16" y="145">
        • Temporal ensembling acts as a zero-phase low-pass filter, eliminating policy jitter.
      </text>
    </g>

    <!-- RIGHT: BENEFITS FOR EMBEDDED ACTUATION -->
    <g transform="translate(460, 0)">
      <rect width="460" height="170" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
      <rect x="0" y="0" width="460" height="24" rx="6" fill="#059669"/>
      <rect x="0" y="18" width="460" height="6" fill="#059669"/>
      <text class="badge-txt" x="12" y="16" fill="#FFFFFF">✓ PHYSICAL SYSTEMS ADVANTAGES OF ENSEMBLING</text>

      <text class="body-txt" x="16" y="44">
        <tspan x="16" dy="0">1. <tspan font-weight="700">Smooth Inter-Chunk Handoff:</tspan> Prevents step jumps across chunk horizons.</tspan>
        <tspan x="16" dy="16">2. <tspan font-weight="700">Inertial Compliance:</tspan> Blends future intention with immediate momentum.</tspan>
        <tspan x="16" dy="16">3. <tspan font-weight="700">MCU Feasibility:</tspan> Enables bare-metal spline interpolator to compute C^2 derivatives.</tspan>
        <tspan x="16" dy="16">4. <tspan font-weight="700">Reduced Gearbox Stress:</tspan> Decreases peak motor current ripple by up to <tspan font-weight="700" fill="#059669">68%</tspan>.</tspan>
      </text>
    </g>
  </g>
</svg>

