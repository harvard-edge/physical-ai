<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">THE THREE SPEEDS OF PHYSICAL AI &amp; THE LATENCY STARVATION BOTTLENECK</text>
  <text class="subtitle" x="20" y="46">How multi-step action chunking bridges the gap between neural inference latency and 1 kHz motor control</text>

  <!-- ================= TOP: 3 CADENCES COMPARISON ================= -->
  <g transform="translate(20, 60)">
    <!-- Cadence 1: System 2 -->
    <g transform="translate(0, 0)">
      <rect width="286" height="135" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
      <rect x="0" y="0" width="286" height="24" rx="6" fill="#1F407A"/>
      <rect x="0" y="18" width="286" height="6" fill="#1F407A"/>
      <text class="badge-txt" x="10" y="16" fill="#FFFFFF">SYSTEM 2: SEMANTIC INTENT (0.5 - 2 Hz)</text>
      
      <g transform="translate(10, 34)">
        <text class="mono-txt" x="0" y="12" fill="#1F407A" font-weight="700">VLM Cognition / Expiring Leases</text>
        <text class="body-txt" x="0" y="30">• Workload: Vision-Language grounding</text>
        <text class="body-txt" x="0" y="46">• Latency budget: <tspan font-weight="700">500 – 2000 ms</tspan></text>
        <text class="body-txt" x="0" y="62">• Output: Goal affordance lease <tspan font-style="italic">L_intent</tspan></text>
        <text class="body-txt" x="0" y="78">• Platform: Linux MPU / Cloud</text>
      </g>
    </g>

    <!-- Cadence 2: System 1.5 -->
    <g transform="translate(306, 0)">
      <rect width="286" height="135" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.3"/>
      <rect x="0" y="0" width="286" height="24" rx="6" fill="#B87333"/>
      <rect x="0" y="18" width="286" height="6" fill="#B87333"/>
      <text class="badge-txt" x="10" y="16" fill="#FFFFFF">SYSTEM 1.5: ACTION CHUNKING (20 - 50 Hz)</text>
      
      <g transform="translate(10, 34)">
        <text class="mono-txt" x="0" y="12" fill="#B87333" font-weight="700">Diffusion Policy / Trajectory Decoders</text>
        <text class="body-txt" x="0" y="30">• Workload: Multi-step trajectory synthesis</text>
        <text class="body-txt" x="0" y="46">• Latency budget: <tspan font-weight="700">20 – 50 ms (P99 ≤ 45 ms)</tspan></text>
        <text class="body-txt" x="0" y="62">• Output: Action chunks <tspan font-style="italic">A_{t:t+H} (H=16)</tspan></text>
        <text class="body-txt" x="0" y="78">• Platform: Embedded NPU / GPU</text>
      </g>
    </g>

    <!-- Cadence 3: System 1 -->
    <g transform="translate(614, 0)">
      <rect width="286" height="135" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
      <rect x="0" y="0" width="286" height="24" rx="6" fill="#059669"/>
      <rect x="0" y="18" width="286" height="6" fill="#059669"/>
      <text class="badge-txt" x="10" y="16" fill="#FFFFFF">SYSTEM 1: SAFETY REFLEX (1000 Hz)</text>
      
      <g transform="translate(10, 34)">
        <text class="mono-txt" x="0" y="12" fill="#059669" font-weight="700">Control Barrier Functions / PWM Driver</text>
        <text class="body-txt" x="0" y="30">• Workload: Mathematical safety enforcement</text>
        <text class="body-txt" x="0" y="46">• Latency budget: <tspan font-weight="700">&lt; 1.0 ms (Zero tail jitter)</tspan></text>
        <text class="body-txt" x="0" y="62">• Output: Gate driver motor PWM currents</text>
        <text class="body-txt" x="0" y="78">• Platform: Deterministic Bare-Metal MCU</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: LATENCY STARVATION VS CHUNK BUFFERING ================= -->
  
  <!-- LEFT: FLAWED SINGLE-STEP POLICY (STARVATION) -->
  <g transform="translate(20, 210)">
    <rect width="440" height="270" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.3"/>
    <rect x="0" y="0" width="440" height="24" rx="6" fill="#A51C30"/>
    <rect x="0" y="18" width="440" height="6" fill="#A51C30"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">❌ SINGLE-STEP POLICY: LATENCY STARVATION &amp; CHATTER</text>

    <!-- Timing Diagram -->
    <g transform="translate(16, 36)">
      <!-- Cycle 1 -->
      <rect x="0" y="0" width="65" height="30" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1"/>
      <text class="mono-txt" x="32.5" y="18" text-anchor="middle" fill="#A51C30">Infer a_0</text>
      
      <rect x="69" y="0" width="10" height="30" rx="2" fill="#1E293B"/>
      <text class="mono-txt" x="74" y="44" text-anchor="middle" font-size="8px" fill="#1E293B">a_0 (1ms)</text>

      <!-- Starvation Gap -->
      <rect x="85" y="0" width="90" height="30" rx="3" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" stroke-dasharray="3,3"/>
      <text class="mono-txt" x="130" y="18" text-anchor="middle" font-weight="700" fill="#A51C30">STARVE (49ms)</text>

      <!-- Cycle 2 -->
      <rect x="182" y="0" width="65" height="30" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1"/>
      <text class="mono-txt" x="214.5" y="18" text-anchor="middle" fill="#A51C30">Infer a_1</text>

      <rect x="251" y="0" width="10" height="30" rx="2" fill="#1E293B"/>
      <text class="mono-txt" x="256" y="44" text-anchor="middle" font-size="8px" fill="#1E293B">a_1</text>

      <!-- Starvation Gap 2 -->
      <rect x="267" y="0" width="135" height="30" rx="3" fill="#FFFFFF" stroke="#A51C30" stroke-width="1" stroke-dasharray="3,3"/>
      <text class="mono-txt" x="334.5" y="18" text-anchor="middle" font-weight="700" fill="#A51C30">STARVE (59ms)</text>
    </g>

    <text class="body-txt" x="16" y="115">
      <tspan x="16" dy="0">• <tspan font-weight="700">Physical Defect:</tspan> Motor executes 1 step (1 ms), then starves for 49 ms.</tspan>
      <tspan x="16" dy="16">• <tspan font-weight="700">Zero-Order Hold Jumps:</tspan> Discrete position steps command infinite acceleration.</tspan>
      <tspan x="16" dy="16">• <tspan font-weight="700">Consequence:</tspan> Violent mechanical vibration, gearbox fatigue, coil overheating.</tspan>
    </text>
  </g>

  <!-- RIGHT: SYSTEM 1.5 ACTION CHUNKING (SEAMLESS) -->
  <g transform="translate(480, 210)">
    <rect width="440" height="270" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
    <rect x="0" y="0" width="440" height="24" rx="6" fill="#059669"/>
    <rect x="0" y="18" width="440" height="6" fill="#059669"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">✓ SYSTEM 1.5 ACTION CHUNKING: CONTINUOUS EXECUTION RESERVOIR</text>

    <!-- Timing Diagram -->
    <g transform="translate(16, 36)">
      <!-- Inference Burst -->
      <rect x="0" y="0" width="75" height="30" rx="3" fill="#FDF8F0" stroke="#B87333" stroke-width="1"/>
      <text class="mono-txt" x="37.5" y="18" text-anchor="middle" fill="#B87333">Infer Chunk</text>

      <!-- Chunk Execution Reservoir (16 steps seamlessly filling time) -->
      <g transform="translate(85, 0)">
        <rect x="0" y="0" width="320" height="30" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
        <text class="mono-txt" x="160" y="18" text-anchor="middle" font-size="8.5px" font-weight="700" fill="#059669">
          Action Reservoir: [ a_0, ..., a_15 ] (H=16 / 320ms)
        </text>
      </g>
    </g>

    <text class="body-txt" x="16" y="115">
      <tspan x="16" dy="0">• <tspan font-weight="700">Temporal Amortization:</tspan> 50 ms inference generates 320 ms trajectory.</tspan>
      <tspan x="16" dy="16">• <tspan font-weight="700">Jitter Immunity:</tspan> Motor queue never starves across P99 latency spikes.</tspan>
      <tspan x="16" dy="16">• <tspan font-weight="700">1 kHz Splines:</tspan> MCU evaluates C^2 quintic polynomials every 1 ms tick.</tspan>
    </text>
  </g>
</svg>
