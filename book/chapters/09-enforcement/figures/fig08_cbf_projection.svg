<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">CONTROL BARRIER FUNCTION (CBF) MINIMAL-INTERVENTION PROJECTION</text>
<text x="440.0" y="44" class="subtitle">Quadratic Program Filter: min ||u - p_t||² subject to L_f h(x) + L_g h(x) u + α(h(x)) ≥ 0</text>
<rect x="40" y="70" width="400" height="330" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow)"/>
<path d="M 60 330 L 420 170 L 60 170 Z" fill="#10B981" fill-opacity="0.1"/>
<line x1="60" y1="330" x2="420" y2="170" stroke="#10B981" stroke-width="2.5"/>
<text x="160" y="210" font-size="11" font-weight="700" fill="#10B981">SAFE SET C: {"x | h(x) ≥ 0"}</text>
<text x="300" y="345" font-size="10" font-weight="700" fill="#DC2626">UNSAFE SET: h(x) &lt; 0</text>
<circle cx="240" cy="250" r="6" fill="#1A202C"/>
<text x="230" y="245" font-size="9" font-weight="700" fill="#1A202C" text-anchor="end">State x(t)</text>
<line x1="240" y1="250" x2="340" y2="290" stroke="#B87333" stroke-width="2.5" marker-end="url(#arr-bronze)"/>
<text x="350" y="292" font-size="9" font-weight="700" fill="#B87333">Proposed p_t (Unsafe!)</text>
<line x1="240" y1="250" x2="310" y2="219" stroke="#10B981" stroke-width="3" marker-end="url(#arr-teal)"/>
<text x="320" y="200" font-size="9.5" font-weight="700" fill="#10B981">Permitted u* (Projected)</text>
<line x1="340" y1="290" x2="310" y2="219" stroke="#5B4B8A" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="345" y="250" font-size="8" font-weight="700" fill="#5B4B8A">min ||u - p_t||²</text>
<rect x="460" y="70" width="380" height="330" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="476" y="98" font-size="11" font-weight="700" fill="#1F407A">THE BARRIER GUARANTEE</text>
<text x="476" y="122" font-size="9" font-weight="700" fill="#1A202C">• Minimal Intervention Principle:</text>
<text x="484" y="136" font-size="8.5" fill="#475569">If proposed action p_t is safe, u* = p_t with zero distortion.</text>
<text x="484" y="149" font-size="8.5" fill="#475569">If p_t violates safety, QP applies minimal correction.</text>
<text x="476" y="168" font-size="9" font-weight="700" fill="#1A202C">• Forward Invariance (Nagumo's Theorem):</text>
<text x="484" y="182" font-size="8.5" fill="#475569">If state starts in C (h(x₀) ≥ 0), it remains inside C</text>
<text x="484" y="195" font-size="8.5" fill="#475569">for all future time t ≥ 0: h(x(t)) ≥ 0 certified.</text>
<text x="476" y="214" font-size="9" font-weight="700" fill="#1A202C">• Deterministic Active-Set QP Solver:</text>
<text x="484" y="228" font-size="8.5" fill="#475569">Formulated with linear constraints in 3–6 variables.</text>
<text x="484" y="241" font-size="8.5" fill="#475569">Guaranteed convergence in ≤ 15 iterations (≤ 175 µs).</text>
<text x="476" y="260" font-size="9" font-weight="700" fill="#1A202C">• Zero Dynamic Allocation (malloc=0):</text>
<text x="484" y="274" font-size="8.5" fill="#475569">Matrices pre-allocated in static SRAM.</text>
<text x="484" y="287" font-size="8.5" fill="#475569">Zero page faults or heap jitter in real-time loop.</text>
</svg>
