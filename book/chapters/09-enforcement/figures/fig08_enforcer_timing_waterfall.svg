<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
      .metric-val { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">THE 1000 Hz BARE-METAL MCU TIMING TICK VS. LINUX MPU JITTER</text>
  <text class="subtitle" x="20" y="46">Deterministic 175 μs safety reflex execution vs. non-deterministic 240 ms Linux tail latency blowouts</text>

  <!-- ================= TOP: 1000 Hz (1000 μs) MCU TIMING TICK WATERFALL ================= -->
  <g transform="translate(20, 60)">
    <rect width="900" height="215" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
    <rect x="0" y="0" width="900" height="24" rx="6" fill="#059669"/>
    <rect x="0" y="18" width="900" height="6" fill="#059669"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">✓ DETERMINISTIC REAL-TIME REFLEX BRAIN (ARM CORTEX-M4 / FREERTOS · 1000 Hz TICK = 1000 μs)</text>

    <!-- Waterfall Breakdown Bar -->
    <g transform="translate(20, 36)">
      <!-- Stage 1: IPC Mailbox Read (15 us) -->
      <rect x="0" y="0" width="40" height="50" rx="3" fill="#1F407A"/>
      <text class="mono-txt" x="20" y="28" text-anchor="middle" fill="#FFFFFF" font-weight="700">IPC</text>
      <text class="tag-txt" x="20" y="42" text-anchor="middle" fill="#93C5FD">15 μs</text>

      <!-- Stage 2: State Estimation & IMU EKF (35 us) -->
      <rect x="44" y="0" width="70" height="50" rx="3" fill="#007A87"/>
      <text class="mono-txt" x="79" y="28" text-anchor="middle" fill="#FFFFFF" font-weight="700">EKF / SE(3)</text>
      <text class="tag-txt" x="79" y="42" text-anchor="middle" fill="#A7F3D0">35 μs</text>

      <!-- Stage 3: Closed-Form QP CBF Solve (65 us) -->
      <rect x="118" y="0" width="110" height="50" rx="3" fill="#059669"/>
      <text class="mono-txt" x="173" y="28" text-anchor="middle" fill="#FFFFFF" font-weight="700">QP CBF Solve</text>
      <text class="tag-txt" x="173" y="42" text-anchor="middle" fill="#FFFFFF">65 μs</text>

      <!-- Stage 4: Stopping Distance Clearance (40 us) -->
      <rect x="232" y="0" width="80" height="50" rx="3" fill="#B87333"/>
      <text class="mono-txt" x="272" y="28" text-anchor="middle" fill="#FFFFFF" font-weight="700">d_stop Audit</text>
      <text class="tag-txt" x="272" y="42" text-anchor="middle" fill="#FED7AA">40 μs</text>

      <!-- Stage 5: PWM Register Latch (20 us) -->
      <rect x="316" y="0" width="45" height="50" rx="3" fill="#A51C30"/>
      <text class="mono-txt" x="338" y="28" text-anchor="middle" fill="#FFFFFF" font-weight="700">PWM</text>
      <text class="tag-txt" x="338" y="42" text-anchor="middle" fill="#FECACA">20 μs</text>

      <!-- Total Execution Bracket -->
      <line x1="0" y1="58" x2="361" y2="58" stroke="#059669" stroke-width="2"/>
      <text class="mono-txt" x="180" y="72" text-anchor="middle" font-weight="700" fill="#059669">
        TOTAL EXECUTION: 175 μs (P99 ≤ 178 μs — Zero Jitter!)
      </text>

      <!-- Deterministic Slack Margin (825 us) -->
      <rect x="365" y="0" width="495" height="50" rx="3" fill="#FFFFFF" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text class="mono-txt" x="612" y="26" text-anchor="middle" font-weight="700" fill="#059669">
        DETERMINISTIC SLACK MARGIN: 825 μs (82.5% Headroom)
      </text>
      <text class="body-txt" x="612" y="40" text-anchor="middle" fill="#64748B">
        Low-power sleep / background hardware diagnostic checks
      </text>
    </g>

    <!-- Contract bullets -->
    <g transform="translate(20, 125)">
      <text class="body-txt" x="0" y="14">
        <tspan x="0" dy="0">• <tspan font-weight="700">Zero Dynamic Allocation:</tspan> Static memory arrays, zero OS heap, zero garbage collection pauses.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Guaranteed Deadline:</tspan> Never misses a 1000 Hz PWM motor commutation tick under any physical condition.</tspan>
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM: NON-DETERMINISTIC LINUX MPU JITTER ================= -->
  <g transform="translate(20, 290)">
    <rect width="900" height="190" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.3"/>
    <rect x="0" y="0" width="900" height="24" rx="6" fill="#A51C30"/>
    <rect x="0" y="18" width="900" height="6" fill="#A51C30"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">❌ NON-DETERMINISTIC LINUX MPU TAIL LATENCY BLOWOUT (UNTRUSTED HOST BRAIN)</text>

    <!-- Timeline of Tail Blowout -->
    <g transform="translate(20, 36)">
      <!-- Nominal P50 -->
      <rect x="0" y="0" width="120" height="40" rx="3" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text class="mono-txt" x="60" y="18" text-anchor="middle" fill="#1E293B">P50 = 22 ms</text>
      <text class="body-txt" x="60" y="32" text-anchor="middle" fill="#64748B">Nominal Inference</text>

      <!-- Tail Jitter Spikes -->
      <rect x="130" y="0" width="220" height="40" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.2"/>
      <text class="mono-txt" x="240" y="18" text-anchor="middle" font-weight="700" fill="#A51C30">P99 = 140–240 ms ⚠️</text>
      <text class="body-txt" x="240" y="32" text-anchor="middle" fill="#A51C30">GC Stall + UMA Bus Contention + Thermal Throttle</text>

      <!-- Fatal Comparison -->
      <rect x="360" y="0" width="500" height="40" rx="3" fill="#FFFFFF" stroke="#A51C30" stroke-width="1.4"/>
      <text class="mono-txt" x="610" y="18" text-anchor="middle" font-weight="700" fill="#A51C30">
        240x DEADLINE VIOLATION (240 ms vs 1 ms World Deadline)
      </text>
      <text class="body-txt" x="610" y="32" text-anchor="middle" fill="#A51C30">
        If Linux held motor authority, the robot would crash during every memory contention spike!
      </text>
    </g>

    <!-- Bullets -->
    <g transform="translate(20, 95)">
      <text class="body-txt" x="0" y="14">
        <tspan x="0" dy="0">• <tspan font-weight="700">Root Causes of Linux Jitter:</tspan> Python GIL locks, dynamic memory page faults, kernel context switches, and thermal throttling.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Why the Dual-Brain Architecture is Inescapable:</tspan> The real-time MCU absorbs all MPU jitter, keeping the robot stable and safe!</tspan>
      </text>
    </g>
  </g>
</svg>
