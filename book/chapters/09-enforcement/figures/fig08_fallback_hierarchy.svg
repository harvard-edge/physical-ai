<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">IEC 60204-1 STANDARDIZED EMERGENCY STOP &amp; HARDWARE INTERLOCK HIERARCHY</text>
  <text class="subtitle" x="20" y="46">Deterministic escalation tiers: from nominal CBF projection to Cat 2 position holds, Cat 1 dynamic halts, and Cat 0 Safe Torque Off (STO)</text>

  <!-- ================= 4 TIER ESCALATION CARDS ================= -->
  <g transform="translate(20, 60)">
    
    <!-- TIER 0: NOMINAL CBF -->
    <g transform="translate(0, 0)">
      <rect width="210" height="300" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#059669"/>
      <rect x="0" y="20" width="210" height="6" fill="#059669"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">TIER 0: NOMINAL REFLEX</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="50" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#059669" font-weight="700">CBF Projection</text>
        <text class="body-txt" x="8" y="34">ḣ(x) ≥ -α(h(x))</text>

        <text class="body-txt" x="0" y="70">
          <tspan x="0" dy="0">• <tspan font-weight="700">Trigger:</tspan> Minor trajectory drift.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Action:</tspan> Smooth 1 kHz projection.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Motor Power:</tspan> 100% Retained.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Motion:</tspan> Task continues seamlessly.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Latency:</tspan> &lt; 65 μs on MCU.</tspan>
        </text>

        <rect y="170" width="190" height="40" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#059669">SEVERITY LEVEL: LOW</text>
        <text class="body-txt" x="8" y="30" fill="#059669">Continuous Nominal Control</text>
      </g>
    </g>

    <!-- Arrow 0 -> 1 -->
    <line x1="215" y1="150" x2="230" y2="150" stroke="#059669" stroke-width="2" marker-end="url(#arr-axis)"/>

    <!-- TIER 1: CATEGORY 2 SAFE POSITION HOLD -->
    <g transform="translate(235, 0)">
      <rect width="210" height="300" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#B87333"/>
      <rect x="0" y="20" width="210" height="6" fill="#B87333"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">TIER 1: CATEGORY 2 HOLD</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="50" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#B87333" font-weight="700">Controlled Stop (SS2)</text>
        <text class="body-txt" x="8" y="34">IEC 60204-1 Category 2</text>

        <text class="body-txt" x="0" y="70">
          <tspan x="0" dy="0">• <tspan font-weight="700">Trigger:</tspan> Lease expiry / Occlusion.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Action:</tspan> Smooth deceleration.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Motor Power:</tspan> Active holding torque.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Position:</tspan> Locked at current pose.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Recovery:</tspan> Immediate upon new lease.</tspan>
        </text>

        <rect y="170" width="190" height="40" rx="4" fill="#FFEDD5" stroke="#B87333" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#B87333">SEVERITY LEVEL: MEDIUM</text>
        <text class="body-txt" x="8" y="30" fill="#B87333">Holding Torque Maintained</text>
      </g>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="450" y1="150" x2="465" y2="150" stroke="#B87333" stroke-width="2" marker-end="url(#arr-crimson)"/>

    <!-- TIER 2: CATEGORY 1 CONTROLLED HALT -->
    <g transform="translate(470, 0)">
      <rect width="210" height="300" rx="6" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#E11D48"/>
      <rect x="0" y="20" width="210" height="6" fill="#E11D48"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">TIER 2: CATEGORY 1 HALT (SS1)</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="50" rx="4" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#E11D48" font-weight="700">Dynamic Halt (SS1)</text>
        <text class="body-txt" x="8" y="34">IEC 60204-1 Category 1</text>

        <text class="body-txt" x="0" y="70">
          <tspan x="0" dy="0">• <tspan font-weight="700">Trigger:</tspan> Imminent collision danger.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Action:</tspan> Max dynamic braking.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Braking:</tspan> Decelerate at <tspan font-style="italic">a_max</tspan>.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Power:</tspan> Disconnected after v = 0.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Recovery:</tspan> Manual operator reset.</tspan>
        </text>

        <rect y="170" width="190" height="40" rx="4" fill="#FFE4E6" stroke="#E11D48" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#E11D48">SEVERITY LEVEL: HIGH</text>
        <text class="body-txt" x="8" y="30" fill="#E11D48">Emergency Dynamic Halt</text>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="685" y1="150" x2="700" y2="150" stroke="#E11D48" stroke-width="2" marker-end="url(#arr-crimson)"/>

    <!-- TIER 3: CATEGORY 0 SAFE TORQUE OFF (STO) -->
    <g transform="translate(705, 0)">
      <rect width="195" height="300" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.4"/>
      <rect x="0" y="0" width="195" height="26" rx="6" fill="#A51C30"/>
      <rect x="0" y="20" width="195" height="6" fill="#A51C30"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">TIER 3: CATEGORY 0 (STO)</text>

      <g transform="translate(10, 36)">
        <rect width="175" height="50" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
        <text class="mono-txt" x="8" y="18" fill="#A51C30" font-weight="700">Safe Torque Off (STO)</text>
        <text class="body-txt" x="8" y="34">IEC 60204-1 Category 0</text>

        <text class="body-txt" x="0" y="70">
          <tspan x="0" dy="0">• <tspan font-weight="700">Trigger:</tspan> Watchdog / MPU panic.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Action:</tspan> Hardware relay cut.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Power:</tspan> Instant coil cutoff (0 ms).</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Brake:</tspan> Mechanical spring brake.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Recovery:</tspan> Complete system reboot.</tspan>
        </text>

        <rect y="170" width="175" height="40" rx="4" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.2"/>
        <text class="badge-txt" x="8" y="16" fill="#A51C30">SEVERITY: CRITICAL</text>
        <text class="body-txt" x="8" y="30" font-weight="700" fill="#A51C30">Hardware Power Cutoff</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: HARDWARE INTERLOCK INVARIANT ================= -->
  <g transform="translate(20, 380)">
    <rect width="900" height="100" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="20" fill="#1E293B">THE HARDWARE INTERLOCK &amp; WATCHDOG INVARIANT</text>

    <g transform="translate(16, 32)">
      <text class="body-txt" x="0" y="12">
        <tspan x="0" dy="0">1. <tspan font-weight="700">Hardware Watchdog Interlock:</tspan> If the Linux MPU panics, crashes, or stalls for > 50 ms, the hardware watchdog pin transitions low.</tspan>
        <tspan x="0" dy="16">2. <tspan font-weight="700">MCU Autonomy:</tspan> The real-time MCU holds independent gate driver authority and instantly trips Category 0 STO without software cooperation.</tspan>
        <tspan x="0" dy="16">3. <tspan font-weight="700">Physical Containment:</tspan> Kinetic energy is absorbed safely by mechanical brakes, proving that software failures cannot produce catastrophic physical injury.</tspan>
      </text>
    </g>
  </g>
</svg>
