<rect width="900" height="440" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="450.0" y="28" class="title">4-TIER HETEROGENEOUS COMPUTE PLACEMENT TOPOLOGY</text>
<text x="450.0" y="44" class="subtitle">Partitioning Latency-Critical Reflexes from High-Throughput Deliberation Across Power Envelopes</text>
<rect x="29.0" y="66" width="200" height="340" rx="8" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="29.0" y="66" width="200" height="24" rx="8" fill="#5B4B8A" fill-opacity="0.12"/>
<text x="129.0" y="82" font-size="8.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">TIER 1 · CLOUD / SERVER</text>
<text x="129.0" y="108" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">Remote Cluster (> 1000 W)</text>
<text x="129.0" y="124" font-size="8.5" font-weight="600" fill="#5B4B8A" text-anchor="middle">0.1–1 Hz · Latency: 100–500 ms</text>
<text x="39.0" y="146" font-size="8.5" fill="#475569">• Foundation World Models (100B+)</text>
<text x="39.0" y="166" font-size="8.5" fill="#475569">• Fleet Map Synthesis & Semantic Search</text>
<text x="39.0" y="186" font-size="8.5" fill="#475569">• Non-Critical High-Level Mission Goals</text>
<rect x="37.0" y="366" width="184" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="129.0" y="378" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle">DOWNSTREAM LINK</text>
<text x="129.0" y="390" font-size="8" font-weight="600" fill="#1A202C" text-anchor="middle">Wireless 5G / Wi-Fi (Untrusted)</text>
<line x1="230.0" y1="236.0" x2="242.0" y2="236.0" stroke="#5B4B8A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="243.0" y="66" width="200" height="340" rx="8" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="243.0" y="66" width="200" height="24" rx="8" fill="#215CAF" fill-opacity="0.12"/>
<text x="343.0" y="82" font-size="8.5" font-weight="700" fill="#215CAF" text-anchor="middle">TIER 2 · EDGE WORKSTATION</text>
<text x="343.0" y="108" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">On-Premises Base (100–300 W)</text>
<text x="343.0" y="124" font-size="8.5" font-weight="600" fill="#215CAF" text-anchor="middle">1–5 Hz · Latency: 20–80 ms</text>
<text x="253.0" y="146" font-size="8.5" fill="#475569">• Spatial VLM Reasoning (PaliGemma)</text>
<text x="253.0" y="166" font-size="8.5" fill="#475569">• Local Workspace Digital Twin</text>
<text x="253.0" y="186" font-size="8.5" fill="#475569">• Dynamic Multi-Agent Traffic Deconfliction</text>
<rect x="251.0" y="366" width="184" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="343.0" y="378" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle">DOWNSTREAM LINK</text>
<text x="343.0" y="390" font-size="8" font-weight="600" fill="#1A202C" text-anchor="middle">Private Subnet / TSN Link</text>
<line x1="444.0" y1="236.0" x2="456.0" y2="236.0" stroke="#215CAF" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="457.0" y="66" width="200" height="340" rx="8" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="457.0" y="66" width="200" height="24" rx="8" fill="#B87333" fill-opacity="0.12"/>
<text x="557.0" y="82" font-size="8.5" font-weight="700" fill="#B87333" text-anchor="middle">TIER 3 · ONBOARD MPU / NPU</text>
<text x="557.0" y="108" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">Mobile Linux Host (15–60 W)</text>
<text x="557.0" y="124" font-size="8.5" font-weight="600" fill="#B87333" text-anchor="middle">20–60 Hz · Latency: 15–50 ms</text>
<text x="467.0" y="146" font-size="8.5" fill="#475569">• Vision Tokenizers (DINOv2 / MobileNet)</text>
<text x="467.0" y="166" font-size="8.5" fill="#475569">• Action Chunking (ACT / Diffusion, H=16)</text>
<text x="467.0" y="186" font-size="8.5" fill="#475569">• Local SE(3) Frame Tree Updates</text>
<rect x="465.0" y="366" width="184" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="557.0" y="378" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle">DOWNSTREAM LINK</text>
<text x="557.0" y="390" font-size="8" font-weight="600" fill="#1A202C" text-anchor="middle">PCIe / Shared TCM SRAM</text>
<line x1="658.0" y1="236.0" x2="670.0" y2="236.0" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="671.0" y="66" width="200" height="340" rx="8" fill="#FFFFFF" stroke="#007A87" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="671.0" y="66" width="200" height="24" rx="8" fill="#007A87" fill-opacity="0.12"/>
<text x="771.0" y="82" font-size="8.5" font-weight="700" fill="#007A87" text-anchor="middle">TIER 4 · REAL-TIME MCU</text>
<text x="771.0" y="108" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">Dedicated Enforcer (< 2 W)</text>
<text x="771.0" y="124" font-size="8.5" font-weight="600" fill="#007A87" text-anchor="middle">1000 Hz · Latency: < 1 ms (Jitter < 5 µs)</text>
<text x="681.0" y="146" font-size="8.5" fill="#475569">• Active-Set CBF QP Filter (h(x) ≥ 0)</text>
<text x="681.0" y="166" font-size="8.5" fill="#475569">• Dynamic Stopping Envelope Watchdog</text>
<text x="681.0" y="186" font-size="8.5" fill="#475569">• Category 0/1 Hardware Fallback FSM</text>
<rect x="679.0" y="366" width="184" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="771.0" y="378" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle">DOWNSTREAM LINK</text>
<text x="771.0" y="390" font-size="8" font-weight="600" fill="#1A202C" text-anchor="middle">Direct Memory-Mapped PWM / Gate Drivers</text>
</svg>
