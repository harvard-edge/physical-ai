<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">THE 4-TIER HETEROGENEOUS SILICON PLACEMENT MAP</text>
  <text class="subtitle" x="20" y="46">Partitioning 7 agent organs across Cloud, Linux MPU, Neural Accelerator NPU, and Real-Time MCU tiers</text>

  <!-- ================= 4 SILICON TIERS ================= -->
  <g transform="translate(20, 60)">
    
    <!-- TIER 1: CLOUD / EDGE SERVER -->
    <g transform="translate(0, 0)">
      <rect width="210" height="300" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#475569"/>
      <rect x="0" y="20" width="210" height="6" fill="#475569"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">TIER 1: CLOUD / SERVER</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#1E293B" font-weight="700">70B VLA / Fleet Data</text>
        <text class="body-txt" x="8" y="30" fill="#64748B">Massive Multi-GPU Nodes</text>

        <text class="body-txt" x="0" y="65">
          <tspan x="0" dy="0">• <tspan font-weight="700">Cadence:</tspan> 0.1 – 0.5 Hz</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Latency:</tspan> 800 – 3000 ms (RTT)</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Authority:</tspan> Strategic goals only</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Memory:</tspan> Terabytes NVMe/HBM</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Trust:</tspan> Completely untrusted</tspan>
        </text>

        <g transform="translate(0, 165)">
          <rect width="190" height="42" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
          <text class="badge-txt" x="8" y="16" fill="#475569">NETWORK BOUNDARY (WiFi/5G)</text>
          <text class="body-txt" x="8" y="30" fill="#64748B">Packet loss, jitter, disconnects</text>
        </g>
      </g>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="215" y1="150" x2="230" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- TIER 2: HOST APPLICATION PROCESSOR (MPU) -->
    <g transform="translate(235, 0)">
      <rect width="210" height="300" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#B87333"/>
      <rect x="0" y="20" width="210" height="6" fill="#B87333"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">TIER 2: HOST MPU (LINUX)</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="42" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#B87333" font-weight="700">System 2 &amp; SE(3) Trees</text>
        <text class="body-txt" x="8" y="30" fill="#64748B">ARM Cortex-A78 / Linux</text>

        <text class="body-txt" x="0" y="65">
          <tspan x="0" dy="0">• <tspan font-weight="700">Cadence:</tspan> 1 – 10 Hz</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Latency:</tspan> 20 – 100 ms (Jitter)</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Authority:</tspan> Expiring intent leases</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Memory:</tspan> 8–16 GB LPDDR5</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Role:</tspan> Proposal Cortex</tspan>
        </text>

        <g transform="translate(0, 165)">
          <rect width="190" height="42" rx="4" fill="#FFEDD5" stroke="#B87333" stroke-width="1"/>
          <text class="badge-txt" x="8" y="16" fill="#B87333">CO-PROCESSOR BUS (PCIe/AXI)</text>
          <text class="body-txt" x="8" y="30" fill="#B87333">High-bandwidth DMA tensor pipe</text>
        </g>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="450" y1="150" x2="465" y2="150" stroke="#B87333" stroke-width="2" marker-end="url(#arr-amber)"/>

    <!-- TIER 3: EMBEDDED NPU / GPU -->
    <g transform="translate(470, 0)">
      <rect width="210" height="300" rx="6" fill="#EDF7F7" stroke="#007A87" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#007A87"/>
      <rect x="0" y="20" width="210" height="6" fill="#007A87"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">TIER 3: NEURAL NPU / GPU</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#007A87" font-weight="700">System 1.5 Trajectory Plan</text>
        <text class="body-txt" x="8" y="30" fill="#64748B">ViT / Diffusion Chunking</text>

        <text class="body-txt" x="0" y="65">
          <tspan x="0" dy="0">• <tspan font-weight="700">Cadence:</tspan> 20 – 50 Hz</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Latency:</tspan> 15 – 35 ms (TensorRT)</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Authority:</tspan> Multi-step action chunks</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Memory:</tspan> Shared UMA SRAM</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Compute:</tspan> 20–100 INT8 TOPS</tspan>
        </text>

        <g transform="translate(0, 165)">
          <rect width="190" height="42" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1"/>
          <text class="badge-txt" x="8" y="16" fill="#007A87">PRIVILEGE BOUNDARY (SRAM)</text>
          <text class="body-txt" x="8" y="30" fill="#007A87">Lock-free mailbox + IRQ handshake</text>
        </g>
      </g>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="685" y1="150" x2="700" y2="150" stroke="#007A87" stroke-width="2" marker-end="url(#arr-teal)"/>

    <!-- TIER 4: REAL-TIME SAFETY REFLEX (MCU) -->
    <g transform="translate(705, 0)">
      <rect width="195" height="300" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/>
      <rect x="0" y="0" width="195" height="26" rx="6" fill="#059669"/>
      <rect x="0" y="20" width="195" height="6" fill="#059669"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">TIER 4: REAL-TIME MCU</text>

      <g transform="translate(10, 36)">
        <rect width="175" height="42" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#059669" font-weight="700">System 1 Safety Reflex</text>
        <text class="body-txt" x="8" y="30" fill="#64748B">Cortex-M4 / FreeRTOS</text>

        <text class="body-txt" x="0" y="65">
          <tspan x="0" dy="0">• <tspan font-weight="700">Cadence:</tspan> 1000 Hz</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Latency:</tspan> 175 μs (Zero jitter)</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Authority:</tspan> Sole PWM Gate Drive</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Memory:</tspan> 512 KB SRAM</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Safety:</tspan> CBF + STO Interlock</tspan>
        </text>

        <g transform="translate(0, 165)">
          <rect width="175" height="42" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
          <text class="badge-txt" x="8" y="16" fill="#059669">PHYSICAL ACTUATION</text>
          <text class="body-txt" x="8" y="30" fill="#059669">Inverters, Motors, Brakes</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: PLACEMENT CODESIGN RULES ================= -->
  <g transform="translate(20, 380)">
    <rect width="900" height="100" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="20" fill="#1E293B">HETEROGENEOUS PLACEMENT CODESIGN PRINCIPLES</text>

    <g transform="translate(16, 32)">
      <text class="body-txt" x="0" y="12">
        <tspan x="0" dy="0">1. <tspan font-weight="700">Physical Privilege Rule:</tspan> Only Tier 4 (Deterministic MCU) may hold physical motor PWM authority; Tiers 1–3 are untrusted proposal engines.</tspan>
        <tspan x="0" dy="16">2. <tspan font-weight="700">Memory Hierarchy:</tspan> As rate increases (1 Hz → 50 Hz → 1000 Hz), memory transitions from high-capacity DRAM to lock-free zero-allocation SRAM.</tspan>
        <tspan x="0" dy="16">3. <tspan font-weight="700">Panic Isolation:</tspan> Complete Linux MPU kernel crash or NPU bus hang leaves the 1 kHz MCU safety reflex executing deterministically.</tspan>
      </text>
    </g>
  </g>
</svg>
