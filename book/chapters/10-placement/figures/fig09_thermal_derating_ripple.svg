<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">THERMAL DERATING CLIFF &amp; THE RE-PLACEMENT RIPPLE EFFECT</text>
  <text class="subtitle" x="20" y="46">Silicon DVFS throttling crossing the 85°C junction knee: latency tripling, deadline breach, and stopping distance expansion</text>

  <!-- ================= LEFT: THERMAL DERATING CURVE ================= -->
  <g transform="translate(20, 60)">
    <rect width="440" height="420" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="22" fill="#1E293B">SILICON JUNCTION TEMPERATURE VS. INFERENCE TAIL LATENCY</text>

    <!-- Plot Area -->
    <g transform="translate(50, 40)">
      <!-- Axes -->
      <line x1="0" y1="280" x2="360" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-axis)"/>
      <line x1="0" y1="280" x2="0" y2="10" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-axis)"/>

      <!-- Axis Labels -->
      <text class="mono-txt" x="360" y="314" text-anchor="end" fill="#475569">Junction Temp T_j (°C) →</text>
      <text class="mono-txt" x="-10" y="10" text-anchor="end" fill="#475569" transform="rotate(-90 -10,10)">Inference Latency P99 (ms) →</text>

      <!-- Thermal Knee Vertical Line at 85 C -->
      <line x1="220" y1="10" x2="220" y2="280" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,4"/>
      <rect x="170" y="15" width="100" height="20" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1"/>
      <text class="badge-txt" x="220" y="29" text-anchor="middle" fill="#A51C30">85°C DVFS KNEE</text>

      <!-- Physical World Stability Deadline Horizon (Horizontal Line at 80 ms) -->
      <line x1="0" y1="110" x2="360" y2="110" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text class="tag-txt" x="10" y="104" fill="#E11D48">τ_world = 80 ms Stability Deadline</text>

      <!-- Inadmissible Shaded Region -->
      <rect x="0" y="10" width="360" height="100" fill="#FEF2F2" opacity="0.4"/>

      <!-- Curve: Flat until 85°C, then sharp exponential cliff -->
      <path d="M 0 240 L 180 235 Q 220 230, 240 180 T 320 30" fill="none" stroke="#A51C30" stroke-width="2.5"/>

      <!-- Nominal Point (65°C, 22ms) -->
      <circle cx="100" cy="238" r="6" fill="#059669"/>
      <text class="mono-txt" x="110" y="235" fill="#059669" font-weight="700">Nominal: 65°C</text>
      <text class="body-txt" x="110" y="248" fill="#64748B">P99 = 24 ms (1.8 GHz)</text>

      <!-- Throttled Point (95°C, 105ms) -->
      <circle cx="280" cy="80" r="7" fill="#A51C30"/>
      <text class="mono-txt" x="230" y="65" fill="#A51C30" font-weight="700">Throttled: 95°C ⚠️</text>
      <text class="body-txt" x="230" y="78" fill="#A51C30">P99 = 105 ms (600 MHz)</text>

      <!-- Grid ticks -->
      <text class="mono-txt" x="0" y="294" text-anchor="middle" fill="#64748B">25°C</text>
      <text class="mono-txt" x="100" y="294" text-anchor="middle" fill="#64748B">65°C</text>
      <text class="mono-txt" x="220" y="294" text-anchor="middle" fill="#A51C30" font-weight="700">85°C</text>
      <text class="mono-txt" x="320" y="294" text-anchor="middle" fill="#64748B">105°C</text>
    </g>
  </g>

  <!-- ================= RIGHT: STOPPING DISTANCE EXPANSION & PLACEMENT TRADE SPACE ================= -->
  <g transform="translate(480, 60)">
    <rect width="440" height="420" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="22" fill="#1E293B">PHYSICAL RE-PLACEMENT RIPPLE EFFECT</text>

    <!-- Card 1: Stopping Distance Expansion -->
    <g transform="translate(16, 35)">
      <rect width="408" height="150" rx="5" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2"/>
      <rect x="0" y="0" width="408" height="22" rx="5" fill="#A51C30"/>
      <rect x="0" y="16" width="408" height="6" fill="#A51C30"/>
      <text class="tag-txt" x="10" y="15" fill="#FFFFFF">KINETIC CONSEQUENCE: STOPPING DISTANCE COLLAPSE</text>

      <g transform="translate(12, 32)">
        <text class="mono-txt" x="0" y="14" fill="#A51C30" font-weight="700">d_stop = v · (t_latency + t_brake) + v² / (2 a_max)</text>
        
        <!-- Nominal vs Throttled comparison -->
        <g transform="translate(0, 25)">
          <rect width="185" height="45" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
          <text class="badge-txt" x="8" y="16" fill="#059669">NOMINAL (T_j = 65°C)</text>
          <text class="mono-txt" x="8" y="32" fill="#1E293B">d_stop = 0.35 m (Safe)</text>
        </g>

        <g transform="translate(195, 25)">
          <rect width="185" height="45" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.2"/>
          <text class="badge-txt" x="8" y="16" fill="#A51C30">THROTTLED (T_j = 95°C)</text>
          <text class="mono-txt" x="8" y="32" fill="#A51C30">d_stop = 0.82 m ❌ COLLISION</text>
        </g>

        <text class="body-txt" x="0" y="88" fill="#334155">
          • Thermal throttle causes <tspan font-weight="700">134% increase in stopping distance</tspan>, breaching clearance.
        </text>
      </g>
    </g>

    <!-- Card 2: Strategic Re-placement Decision -->
    <g transform="translate(16, 200)">
      <rect width="408" height="205" rx="5" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
      <rect x="0" y="0" width="408" height="22" rx="5" fill="#059669"/>
      <rect x="0" y="16" width="408" height="6" fill="#059669"/>
      <text class="tag-txt" x="10" y="15" fill="#FFFFFF">ADAPTIVE RE-PLACEMENT CODESIGN STRATEGIES</text>

      <g transform="translate(12, 34)">
        <text class="body-txt" x="0" y="12">
          <tspan x="0" dy="0">1. <tspan font-weight="700">Dynamic Model Switching:</tspan> Shift from heavy ViT to quantized INT4</tspan>
          <tspan x="14" dy="14">MobileNet to stay strictly within onboard thermal power envelope.</tspan>
          <tspan x="0" dy="18">2. <tspan font-weight="700">Adaptive Velocity Scaling:</tspan> Reduce robot max velocity <tspan font-style="italic">v_max</tspan></tspan>
          <tspan x="14" dy="14">proportionally to measured silicon junction temperature.</tspan>
          <tspan x="0" dy="18">3. <tspan font-weight="700">Cloud Offloading with Local Leases:</tspan> Offload System 2 deliberation</tspan>
          <tspan x="14" dy="14">while keeping System 1 reflexes anchored to bare-metal MCU.</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
