<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">UMA SHARED MEMORY CONTENTION &amp; AXI QOS ARBITRATION</text>
<text x="440.0" y="44" class="subtitle">Preventing Tail-Latency Spikes When Vision Ingestion Saturates the Memory Crossbar</text>
<rect x="40" y="80" width="220" height="70" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2" filter="url(#shadow)"/>
<text x="52" y="100" font-size="10.5" font-weight="700" fill="#DC2626">NPU / GPU (Vision Transformer)</text>
<text x="52" y="118" font-size="8.5" fill="#475569">Batch DMA Ingestion · 4.2 GB/s</text>
<rect x="52" y="126" width="140" height="16" rx="3" fill="#DC2626" fill-opacity="0.1"/>
<text x="58" y="138" font-size="8" font-weight="700" fill="#DC2626">Low Priority (QoS=2)</text>
<line x1="260" y1="115" x2="340" y2="210" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<rect x="40" y="175" width="220" height="70" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2" filter="url(#shadow)"/>
<text x="52" y="195" font-size="10.5" font-weight="700" fill="#215CAF">CPU (Linux World Model)</text>
<text x="52" y="213" font-size="8.5" fill="#475569">SE(3) Frame Tree Updates · 800 MB/s</text>
<rect x="52" y="221" width="140" height="16" rx="3" fill="#215CAF" fill-opacity="0.1"/>
<text x="58" y="233" font-size="8" font-weight="700" fill="#215CAF">Medium Priority (QoS=8)</text>
<line x1="260" y1="210" x2="340" y2="210" stroke="#215CAF" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<rect x="40" y="270" width="220" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2" filter="url(#shadow)"/>
<text x="52" y="290" font-size="10.5" font-weight="700" fill="#10B981">MCU Safety Enforcer</text>
<text x="52" y="308" font-size="8.5" fill="#475569">1 kHz QP Barrier Solver · 12 MB/s</text>
<rect x="52" y="316" width="140" height="16" rx="3" fill="#10B981" fill-opacity="0.1"/>
<text x="58" y="328" font-size="8" font-weight="700" fill="#10B981">Highest Priority (QoS=15)</text>
<line x1="260" y1="305" x2="340" y2="210" stroke="#10B981" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<rect x="340" y="80" width="200" height="260" rx="8" fill="#1F407A" fill-opacity="0.06" stroke="#1F407A" stroke-width="1.4"/>
<text x="440.0" y="110" font-size="11" font-weight="700" fill="#1F407A" text-anchor="middle">AXI-4 INTERCONNECT</text>
<text x="440.0" y="128" font-size="9" fill="#64748B" text-anchor="middle">Crossbar Switch &amp; Arbiter</text>
<rect x="355" y="150" width="170" height="70" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="170" font-size="9" font-weight="700" fill="#DC2626" text-anchor="middle">UNREGULATED BUS</text>
<text x="440.0" y="188" font-size="8" fill="#475569" text-anchor="middle">NPU saturates DRAM channels</text>
<text x="440.0" y="202" font-size="8" font-weight="600" fill="#DC2626" text-anchor="middle">MCU Enforcer Latency: 14.8 ms ✕</text>
<rect x="355" y="235" width="170" height="70" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
<text x="440.0" y="255" font-size="9" font-weight="700" fill="#10B981" text-anchor="middle">AXI QOS ARBITRATION</text>
<text x="440.0" y="273" font-size="8" fill="#475569" text-anchor="middle">MCU packets preempt bulk DMA</text>
<text x="440.0" y="287" font-size="8" font-weight="600" fill="#10B981" text-anchor="middle">MCU Enforcer Latency: 120 µs ✓</text>
<rect x="620" y="130" width="220" height="160" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.3" filter="url(#shadow)"/>
<text x="730.0" y="156" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">SHARED LPDDR5 MEMORY</text>
<text x="730.0" y="172" font-size="8.5" fill="#64748B" text-anchor="middle">Unified Memory Architecture (UMA)</text>
<rect x="635" y="185" width="190" height="32" rx="4" fill="#DC2626" fill-opacity="0.1"/>
<text x="730.0" y="205" font-size="8.5" font-weight="600" fill="#DC2626" text-anchor="middle">Bulk Framebuffers (RGB + Depth)</text>
<rect x="635" y="225" width="190" height="32" rx="4" fill="#10B981" fill-opacity="0.1"/>
<text x="730.0" y="245" font-size="8.5" font-weight="600" fill="#10B981" text-anchor="middle">Dedicated Locked SRAM Bank (TCM)</text>
<line x1="540" y1="210" x2="620" y2="210" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-navy)"/>
<rect x="40" y="360" width="800" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="378" font-size="9.5" font-weight="700" fill="#1F407A" text-anchor="middle">THE UMA MEMORY INVARIANT</text>
<text x="440.0" y="392" font-size="8.5" fill="#475569" text-anchor="middle">Real-time safety loops must never share un-arbitrated memory buses with high-bandwidth sensory ingestion pipelines without hardware QoS rate limiting.</text>
</svg>
