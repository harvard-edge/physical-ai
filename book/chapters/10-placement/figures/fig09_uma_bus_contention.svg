<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">UNIFIED MEMORY ARCHITECTURE (UMA) BUS CONTENTION &amp; AXI QoS ARBITRATION</text>
  <text class="subtitle" x="20" y="46">Guaranteed &lt; 2 μs preemption for real-time safety mailboxes under heavy multi-master memory traffic</text>

  <!-- ================= TOP: 4 BUS MASTERS & ARBITER ================= -->
  <g transform="translate(20, 60)">
    <rect width="900" height="190" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- 4 Masters -->
    <g transform="translate(20, 20)">
      <!-- Master 1: Camera ISP DMA -->
      <rect x="0" y="0" width="180" height="65" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
      <text class="tag-txt" x="10" y="18" fill="#1F407A">MASTER 1: CAMERA DMA</text>
      <text class="mono-txt" x="10" y="34" fill="#1E293B">1.49 GB/s Burst</text>
      <text class="body-txt" x="10" y="48" fill="#64748B">MIPI 4K Framebuffer</text>

      <!-- Master 2: NPU Tensor Engine -->
      <rect x="200" y="0" width="180" height="65" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1.2"/>
      <text class="tag-txt" x="210" y="18" fill="#007A87">MASTER 2: NPU TENSOR</text>
      <text class="mono-txt" x="210" y="34" fill="#1E293B">24.0 GB/s Peak Read</text>
      <text class="body-txt" x="210" y="48" fill="#64748B">VLM Weight Streaming</text>

      <!-- Master 3: CPU Cortex-A Cores -->
      <rect x="400" y="0" width="180" height="65" rx="4" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
      <text class="tag-txt" x="410" y="18" fill="#B87333">MASTER 3: CPU CORES</text>
      <text class="mono-txt" x="410" y="34" fill="#1E293B">2.5 GB/s Mixed</text>
      <text class="body-txt" x="410" y="48" fill="#64748B">Linux OS &amp; Python Stack</text>

      <!-- Master 4: Real-Time MCU Mailbox -->
      <rect x="600" y="0" width="260" height="65" rx="4" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/>
      <text class="tag-txt" x="610" y="18" fill="#059669">MASTER 4: REAL-TIME MCU SAFETY (1 kHz)</text>
      <text class="mono-txt" x="610" y="34" fill="#059669" font-weight="700">64 KB SRAM Mailbox (QoS High)</text>
      <text class="body-txt" x="610" y="48" fill="#059669">Atomic Intent Lease Audit &amp; Veto</text>
    </g>

    <!-- Bus Interconnect & Arbiter -->
    <g transform="translate(20, 105)">
      <rect width="860" height="65" rx="4" fill="#1E293B"/>
      <text class="badge-txt" x="14" y="22" fill="#38BDF8">AXI INTERCONNECT BUS ARBITER (34.0 GB/s SHARED LPDDR5 CHANNEL)</text>
      
      <!-- Routing Lines -->
      <text class="mono-txt" x="14" y="44" fill="#F1F5F9">
        Arbiter Mode: <tspan fill="#FCA5A5">Unmanaged Round-Robin (Naive)</tspan>  vs.  <tspan fill="#4ADE80">Strict AXI Priority QoS (Physical AI)</tspan>
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM: UNMANAGED FIFO VS STRICT AXI QoS ================= -->
  
  <!-- LEFT: UNMANAGED (STARVATION & TAIL BLOWOUT) -->
  <g transform="translate(20, 265)">
    <rect width="440" height="215" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.3"/>
    <rect x="0" y="0" width="440" height="24" rx="6" fill="#A51C30"/>
    <rect x="0" y="18" width="440" height="6" fill="#A51C30"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">❌ UNMANAGED FIFO: MEMORY STARVATION &amp; JITTER</text>

    <!-- Visual queue -->
    <g transform="translate(16, 36)">
      <rect width="408" height="42" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text class="mono-txt" x="8" y="18" fill="#A51C30">DRAM Queue: [ Camera DMA ] [ Camera DMA ] [ NPU ] ❌ [ MCU Blocked ]</text>
      <text class="body-txt" x="8" y="32" fill="#64748B">Camera bursts lock out MCU safety access for up to 4.8 ms</text>
    </g>

    <text class="body-txt" x="16" y="98">
      <tspan x="16" dy="0">• <tspan font-weight="700">Priority Inversion:</tspan> 1 kHz safety tick stalled by uncompressed video.</tspan>
      <tspan x="16" dy="16">• <tspan font-weight="700">Inference Tail Spikes:</tspan> NPU weight fetch stalls $\implies$ P99 explodes to 135 ms.</tspan>
      <tspan x="16" dy="16">• <tspan font-weight="700">Physical Breach:</tspan> Exceeds dynamic stability deadline $\implies$ Hardware E-Stop.</tspan>
    </text>
  </g>

  <!-- RIGHT: STRICT AXI QoS (DETERMINISTIC BOUNDS) -->
  <g transform="translate(480, 265)">
    <rect width="440" height="215" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
    <rect x="0" y="0" width="440" height="24" rx="6" fill="#059669"/>
    <rect x="0" y="18" width="440" height="6" fill="#059669"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">✓ STRICT AXI QoS: DEDICATED BANDWIDTH &amp; &lt; 2 μs PREEMPTION</text>

    <!-- Visual queue -->
    <g transform="translate(16, 36)">
      <rect width="408" height="42" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text class="mono-txt" x="8" y="18" fill="#059669">DRAM Queue: [ MCU Safety ★ (QoS=15) ] → Instant Priority Bypass</text>
      <text class="body-txt" x="8" y="32" fill="#059669">Preempts background video DMA in &lt; 2 microseconds</text>
    </g>

    <text class="body-txt" x="16" y="98">
      <tspan x="16" dy="0">• <tspan font-weight="700">Hardware QoS Priority Tags:</tspan> MCU Mailbox (QoS=15), NPU (QoS=10), Camera (QoS=4).</tspan>
      <tspan x="16" dy="16">• <tspan font-weight="700">Zero Copy Ring Buffer:</tspan> Eliminates 3x user/kernel memory copying.</tspan>
      <tspan x="16" dy="16">• <tspan font-weight="700">Deterministic Metrology:</tspan> Tail latency bounded at <tspan font-weight="700" fill="#059669">P99 = 24.2 ms &lt;&lt; τ_world</tspan>.</tspan>
    </text>
  </g>
</svg>
