<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">THE 4-RUNG QUALIFICATION LADDER FOR PHYSICAL AI SYSTEMS</text>
  <text class="subtitle" x="20" y="46">Progressive promotion gates: Offline Replay → Physics Sim → Hardware-in-the-Loop Fault Injection → Shadow Fleet Deployment</text>

  <!-- ================= 4 LADDER RUNGS (LEFT TO RIGHT / BOTTOM TO TOP) ================= -->
  <g transform="translate(20, 60)">
    
    <!-- RUNG 1: OFFLINE DATASET REPLAY -->
    <g transform="translate(0, 0)">
      <rect width="210" height="300" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#475569"/>
      <rect x="0" y="20" width="210" height="6" fill="#475569"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">RUNG 1: OFFLINE REPLAY</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#1E293B" font-weight="700">Static Telemetry Replay</text>
        <text class="body-txt" x="8" y="30" fill="#64748B">Open-loop metric validation</text>

        <text class="body-txt" x="0" y="65">
          <tspan x="0" dy="0">• <tspan font-weight="700">Environment:</tspan> Recorded bags.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Metrics:</tspan> L2 loss, cosine sim.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Blindspot:</tspan> Zero causal feedback.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Gate:</tspan> L2 error &lt; 0.02 m.</tspan>
        </text>

        <rect y="165" width="190" height="42" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#475569">PROMOTION GATE 1</text>
        <text class="body-txt" x="8" y="30" fill="#475569">Passes static sanity test</text>
      </g>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="215" y1="150" x2="230" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arr-axis)"/>

    <!-- RUNG 2: DOMAIN-RANDOMIZED PHYSICS SIMULATION -->
    <g transform="translate(235, 0)">
      <rect width="210" height="300" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#B87333"/>
      <rect x="0" y="20" width="210" height="6" fill="#B87333"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">RUNG 2: PHYSICS SIM (DR)</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="42" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#B87333" font-weight="700">MuJoCo / Isaac Sim</text>
        <text class="body-txt" x="8" y="30" fill="#64748B">Closed-loop mass/friction randomized</text>

        <text class="body-txt" x="0" y="65">
          <tspan x="0" dy="0">• <tspan font-weight="700">Environment:</tspan> GPU physics cluster.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Stress:</tspan> Friction μ ∈ [0.1, 1.2].</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Latency Injection:</tspan> 20–80 ms lag.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Gate:</tspan> 99.5% task success.</tspan>
        </text>

        <rect y="165" width="190" height="42" rx="4" fill="#FFEDD5" stroke="#B87333" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#B87333">PROMOTION GATE 2</text>
        <text class="body-txt" x="8" y="30" fill="#B87333">Robust to physical parameter shift</text>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="450" y1="150" x2="465" y2="150" stroke="#B87333" stroke-width="2" marker-end="url(#arr-axis)"/>

    <!-- RUNG 3: HARDWARE-IN-THE-LOOP (HIL) SEEDED FAULTS -->
    <g transform="translate(470, 0)">
      <rect width="210" height="300" rx="6" fill="#EDF7F7" stroke="#007A87" stroke-width="1.3"/>
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#007A87"/>
      <rect x="0" y="20" width="210" height="6" fill="#007A87"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">RUNG 3: HIL BENCH FAULT AUDIT</text>

      <g transform="translate(10, 36)">
        <rect width="190" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#007A87" font-weight="700">Actual MPU + MCU Silicon</text>
        <text class="body-txt" x="8" y="30" fill="#64748B">Real-time cross-layer fault injection</text>

        <text class="body-txt" x="0" y="65">
          <tspan x="0" dy="0">• <tspan font-weight="700">Stress:</tspan> MPU crash, bus stalls.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">MCU Reflex:</tspan> 100% CBF containment.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Thermal:</tspan> 95°C junction stress.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Gate:</tspan> 0 boundary breaches.</tspan>
        </text>

        <rect y="165" width="190" height="42" rx="4" fill="#EDF7F7" stroke="#007A87" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#007A87">PROMOTION GATE 3</text>
        <text class="body-txt" x="8" y="30" fill="#007A87">Survives all hardware faults</text>
      </g>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="685" y1="150" x2="700" y2="150" stroke="#007A87" stroke-width="2" marker-end="url(#arr-teal)"/>

    <!-- RUNG 4: SHADOW FLEET OPERATION -->
    <g transform="translate(705, 0)">
      <rect width="195" height="300" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/>
      <rect x="0" y="0" width="195" height="26" rx="6" fill="#059669"/>
      <rect x="0" y="20" width="195" height="6" fill="#059669"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">RUNG 4: SHADOW FLEET DEPLOY</text>

      <g transform="translate(10, 36)">
        <rect width="175" height="42" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#059669" font-weight="700">Production Fleet Trial</text>
        <text class="body-txt" x="8" y="30" fill="#64748B">Passive shadow execution</text>

        <text class="body-txt" x="0" y="65">
          <tspan x="0" dy="0">• <tspan font-weight="700">Validation:</tspan> 10,000 km / 500 hrs.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Intervention Rate:</tspan> &lt; 0.01 / hr.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Signed Dossier:</tspan> 4-expert signoff.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Verdict:</tspan> Accountable Release.</tspan>
        </text>

        <rect y="165" width="175" height="42" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#059669">FINAL RELEASE GATE</text>
        <text class="body-txt" x="8" y="30" font-weight="700" fill="#059669">ACCOUNTABLE RELEASE</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: QUALIFICATION CONTRACT ================= -->
  <g transform="translate(20, 380)">
    <rect width="900" height="100" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="20" fill="#1E293B">DEFENSIBLE RELEASE PRINCIPLE (DEMOS ARE NOT PROOF OF SAFETY)</text>

    <g transform="translate(16, 32)">
      <text class="body-txt" x="0" y="12">
        <tspan x="0" dy="0">1. <tspan font-weight="700">No Skipping Rungs:</tspan> A foundation model cannot be deployed to real hardware solely on the basis of leaderboard benchmarks or simulation demos.</tspan>
        <tspan x="0" dy="16">2. <tspan font-weight="700">Empirical Falsification:</tspan> Each promotion gate is designed specifically to expose unmodeled physical, temporal, or silicon failure modes.</tspan>
        <tspan x="0" dy="16">3. <tspan font-weight="700">Accountable Sign-Off:</tspan> Complete release is backed by immutable hardware traces and a Claim-Argument-Evidence (CAE) safety case.</tspan>
      </text>
    </g>
  </g>
</svg>
