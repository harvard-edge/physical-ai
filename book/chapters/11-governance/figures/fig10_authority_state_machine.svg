<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="880" height="460" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">RUNTIME AUTHORITY ARBITRATION STATE MACHINE</text>
<text x="440.0" y="44" class="subtitle">Deterministic Transitions between Autonomous Execution, Shared Authority, and Safe Fallback</text>
<rect x="60" y="90" width="320" height="110" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="60" y="90" width="320" height="24" rx="8" fill="#10B981" fill-opacity="0.12"/>
<text x="74" y="106" font-size="9" font-weight="700" fill="#10B981">STATE 1 · NOMINAL</text>
<text x="74" y="132" font-size="11.5" font-weight="700" fill="#1A202C">Fully Autonomous</text>
<text x="74" y="152" font-size="9" fill="#475569">• Policy has full control authority u_t = p_t</text>
<text x="74" y="168" font-size="9" fill="#475569">• h(x) ≥ 0 invariants certified by MCU</text>
<rect x="500" y="90" width="320" height="110" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="500" y="90" width="320" height="24" rx="8" fill="#D97706" fill-opacity="0.12"/>
<text x="514" y="106" font-size="9" font-weight="700" fill="#D97706">STATE 2 · SHARED</text>
<text x="514" y="132" font-size="11.5" font-weight="700" fill="#1A202C">Shared Authority / Assist</text>
<text x="514" y="152" font-size="9" fill="#475569">• Torque blending u_t = (1-α)p_t + α u_human</text>
<text x="514" y="168" font-size="9" fill="#475569">• C² smoothstep transition S(α)</text>
<rect x="500" y="290" width="320" height="110" rx="8" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="500" y="290" width="320" height="24" rx="8" fill="#5B4B8A" fill-opacity="0.12"/>
<text x="514" y="306" font-size="9" font-weight="700" fill="#5B4B8A">STATE 3 · OVERRIDE</text>
<text x="514" y="332" font-size="11.5" font-weight="700" fill="#1A202C">Manual Teleoperation</text>
<text x="514" y="352" font-size="9" fill="#475569">• Human has 100% control authority</text>
<text x="514" y="368" font-size="9" fill="#475569">• Policy actions logged in shadow mode</text>
<rect x="60" y="290" width="320" height="110" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="60" y="290" width="320" height="24" rx="8" fill="#DC2626" fill-opacity="0.12"/>
<text x="74" y="306" font-size="9" font-weight="700" fill="#DC2626">STATE 4 · SAFE FALLBACK</text>
<text x="74" y="332" font-size="11.5" font-weight="700" fill="#1A202C">Controlled Dynamic Stop</text>
<text x="74" y="352" font-size="9" fill="#475569">• Hardware watchdog / fault trigger</text>
<text x="74" y="368" font-size="9" fill="#475569">• Category 1 deceleration to safe rest</text>
<line x1="380" y1="130" x2="500" y2="130" stroke="#D97706" stroke-width="1.4" marker-end="url(#arr-bronze)"/>
<text x="440" y="122" font-size="8" font-weight="600" fill="#D97706" text-anchor="middle">Operator Touch / Joy > 5%</text>
<line x1="660" y1="200" x2="660" y2="290" stroke="#5B4B8A" stroke-width="1.4" marker-end="url(#arr-purple)"/>
<text x="670" y="248" font-size="8" font-weight="600" fill="#5B4B8A">Full Displacement (α = 1.0)</text>
<line x1="500" y1="345" x2="380" y2="345" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arr-coral)"/>
<rect x="385" y="335" width="110" height="20" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.8"/>
<text x="440" y="348" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">E-Stop / Geofence</text>
<line x1="210" y1="290" x2="210" y2="200" stroke="#10B981" stroke-width="1.4" marker-end="url(#arr-teal)"/>
<text x="200" y="248" font-size="8" font-weight="600" fill="#10B981" text-anchor="end">Signed Release Handshake</text>
<line x1="230" y1="200" x2="230" y2="290" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-coral)"/>
<text x="240" y="248" font-size="8" font-weight="600" fill="#DC2626">Fault / Watchdog (50 ms)</text>
</svg>
