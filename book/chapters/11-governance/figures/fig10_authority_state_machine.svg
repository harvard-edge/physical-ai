<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">DETERMINISTIC HUMAN–MACHINE AUTHORITY STATE MACHINE</text>
  <text class="subtitle" x="20" y="46">Stateful arbitration between Autonomous Intent Lease, Shared Co-Pilot, and Manual Operator Override</text>

  <!-- ================= TOP: 3 AUTHORITY STATES ================= -->
  <g transform="translate(20, 60)">
    
    <!-- STATE 1: AUTONOMOUS LEASE -->
    <g transform="translate(0, 0)">
      <rect width="270" height="280" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
      <rect x="0" y="0" width="270" height="26" rx="6" fill="#059669"/>
      <rect x="0" y="20" width="270" height="6" fill="#059669"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">STATE 1: AUTONOMOUS LEASE MODE</text>

      <g transform="translate(12, 36)">
        <rect width="246" height="42" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#059669" font-weight="700">Authority: Learned Policy (VLA)</text>
        <text class="body-txt" x="8" y="30" fill="#64748B">Supervised by 1 kHz MCU CBF</text>

        <text class="body-txt" x="0" y="65">
          <tspan x="0" dy="0">• Neural action chunks execute continuously.</tspan>
          <tspan x="0" dy="16">• Human operator is passive observer.</tspan>
          <tspan x="0" dy="16">• Enforces <tspan font-style="italic">L_intent</tspan> expiration and drift gates.</tspan>
          <tspan x="0" dy="16">• Blending weight: <tspan font-family="monospace" font-weight="700">α = 1.0 (Autonomous)</tspan></tspan>
        </text>

        <g transform="translate(0, 150)">
          <rect width="246" height="36" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
          <text class="badge-txt" x="8" y="15" fill="#059669">TRANSITION TO SHARED / MANUAL:</text>
          <text class="body-txt" x="8" y="28" fill="#059669">Trigger: Joystick deflection or grip sensor</text>
        </g>
      </g>
    </g>

    <!-- Transition Arrow 1 -> 2 -->
    <g transform="translate(275, 120)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#B87333" stroke-width="2" marker-end="url(#arr-blue)"/>
      <text class="tag-txt" x="18" y="-8" text-anchor="middle" fill="#B87333">Human Grip</text>
    </g>

    <!-- STATE 2: SHARED CO-PILOT -->
    <g transform="translate(315, 0)">
      <rect width="270" height="280" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.3"/>
      <rect x="0" y="0" width="270" height="26" rx="6" fill="#B87333"/>
      <rect x="0" y="20" width="270" height="6" fill="#B87333"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">STATE 2: SHARED CO-PILOT BLEND</text>

      <g transform="translate(12, 36)">
        <rect width="246" height="42" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#B87333" font-weight="700">u(t) = α(t) u_policy + (1-α(t)) u_human</text>
        <text class="body-txt" x="8" y="30" fill="#64748B">Continuous C^2 sigmoid transition</text>

        <text class="body-txt" x="0" y="65">
          <tspan x="0" dy="0">• Blends human guidance with policy.</tspan>
          <tspan x="0" dy="16">• Prevents sudden torque steps.</tspan>
          <tspan x="0" dy="16">• Slices recovery trajectory demonstration.</tspan>
          <tspan x="0" dy="16">• Transition duration: <tspan font-family="monospace" font-weight="700">T_blend = 100 ms</tspan></tspan>
        </text>

        <g transform="translate(0, 150)">
          <rect width="246" height="36" rx="3" fill="#FFEDD5" stroke="#B87333" stroke-width="1"/>
          <text class="badge-txt" x="8" y="15" fill="#B87333">TRANSITION TO MANUAL / AUTO:</text>
          <text class="body-txt" x="8" y="28" fill="#B87333">Full human takeover (α=0) or Release (α=1)</text>
        </g>
      </g>
    </g>

    <!-- Transition Arrow 2 -> 3 -->
    <g transform="translate(590, 120)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#A51C30" stroke-width="2" marker-end="url(#arr-crimson)"/>
      <text class="tag-txt" x="18" y="-8" text-anchor="middle" fill="#A51C30">Full E-Stop</text>
    </g>

    <!-- STATE 3: DIRECT MANUAL OVERRIDE -->
    <g transform="translate(630, 0)">
      <rect width="270" height="280" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.3"/>
      <rect x="0" y="0" width="270" height="26" rx="6" fill="#A51C30"/>
      <rect x="0" y="20" width="270" height="6" fill="#A51C30"/>
      <text class="tag-txt" x="10" y="17" fill="#FFFFFF">STATE 3: MANUAL OVERRIDE (STO)</text>

      <g transform="translate(12, 36)">
        <rect width="246" height="42" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
        <text class="mono-txt" x="8" y="16" fill="#A51C30" font-weight="700">Authority: Human Operator (100%)</text>
        <text class="body-txt" x="8" y="30" fill="#A51C30">Zero Neural Proposal Authority</text>

        <text class="body-txt" x="0" y="65">
          <tspan x="0" dy="0">• Hardware interlock / E-Stop engaged.</tspan>
          <tspan x="0" dy="16">• Flushes all pending MPU chunk buffers.</tspan>
          <tspan x="0" dy="16">• Clears Transformer KV-cache.</tspan>
          <tspan x="0" dy="16">• Blending weight: <tspan font-family="monospace" font-weight="700">α = 0.0 (Manual)</tspan></tspan>
        </text>

        <g transform="translate(0, 150)">
          <rect width="246" height="36" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1"/>
          <text class="badge-txt" x="8" y="15" fill="#A51C30">RE-ENGAGEMENT CONTRACT:</text>
          <text class="body-txt" x="8" y="28" fill="#A51C30">Requires intentional re-arm handshake</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: ABSOLUTE HUMAN PREEMPTION PRIVILEGE ================= -->
  <g transform="translate(20, 360)">
    <rect width="900" height="120" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="20" fill="#1E293B">THE PHYSICAL AI GOVERNANCE INVARIANT</text>

    <g transform="translate(16, 32)">
      <text class="body-txt" x="0" y="12">
        <tspan x="0" dy="0">1. <tspan font-weight="700">Zero-Software Hardware Preemption:</tspan> Physical E-stop buttons and safety lid switches cut gate power directly at the hardware layer.</tspan>
        <tspan x="0" dy="16">2. <tspan font-weight="700">Bumpless Transition Guarantee:</tspan> Motor torque transitions follow continuous sigmoid blends ($\dot{u} \le 11\text{ Nm/s}$), preventing gear stripping.</tspan>
        <tspan x="0" dy="16">3. <tspan font-weight="700">Cryptographic Provenance:</tspan> Every takeover event is signed with monotonic hardware timestamp and SHA-256 telemetry hash.</tspan>
      </text>
    </g>
  </g>
</svg>
