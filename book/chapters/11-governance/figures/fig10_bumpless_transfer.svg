<rect width="880" height="430" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="440.0" y="28" class="title">BUMPLESS TRANSFER: STEP DISCONTINUITY VS C² QUINTIC BLENDING</text>
<text x="440.0" y="44" class="subtitle">Eliminating Mechanical Jerk Shock During Human Takeover via S(α) = 10α³ - 15α⁴ + 6α⁵</text>
<rect x="30" y="66" width="390" height="330" rx="8" fill="#DC2626" fill-opacity="0.04" stroke="#DC2626" stroke-width="1.2"/>
<text x="225.0" y="90" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="middle">✕ STEP DISCONTINUITY (Naïve Hard Switch)</text>
<text x="225.0" y="106" font-size="9" fill="#64748B" text-anchor="middle">Instantaneous authority handover u_t = u_human</text>
<line x1="70" y1="220" x2="370" y2="220" stroke="#475569" stroke-width="1"/>
<line x1="220" y1="140" x2="220" y2="300" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
<text x="220" y="316" font-size="8.5" fill="#64748B" text-anchor="middle">Takeover t₀</text>
<line x1="70" y1="250" x2="220" y2="250" stroke="#215CAF" stroke-width="2"/>
<line x1="220" y1="250" x2="220" y2="170" stroke="#DC2626" stroke-width="2.5"/>
<line x1="220" y1="170" x2="370" y2="170" stroke="#5B4B8A" stroke-width="2"/>
<text x="230" y="210" font-size="8.5" font-weight="700" fill="#DC2626">⚡ JERK SPIKE (J → ∞)</text>
<text x="225.0" y="350" font-size="9" fill="#475569" text-anchor="middle">Gearbox tooth impact · Joint shock oscillation · Mechanical fatigue</text>
<rect x="460" y="66" width="390" height="330" rx="8" fill="#10B981" fill-opacity="0.04" stroke="#10B981" stroke-width="1.2"/>
<text x="655.0" y="90" font-size="11.5" font-weight="700" fill="#10B981" text-anchor="middle">✓ C² QUINTIC SMOOTHSTEP BLENDING</text>
<text x="655.0" y="106" font-size="9" fill="#64748B" text-anchor="middle">u_t = (1 - S(α))·p_t + S(α)·u_human (Δt = 150 ms)</text>
<line x1="500" y1="220" x2="800" y2="220" stroke="#475569" stroke-width="1"/>
<line x1="600" y1="140" x2="600" y2="300" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="700" y1="140" x2="700" y2="300" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
<text x="600" y="316" font-size="8.5" fill="#64748B" text-anchor="middle">t₀</text>
<text x="700" y="316" font-size="8.5" fill="#64748B" text-anchor="middle">t₀ + 150 ms</text>
<path d="M 500 250 L 600 250 C 650 250, 650 170, 700 170 L 800 170" fill="none" stroke="#10B981" stroke-width="2.5"/>
<rect x="590" y="150" width="140" height="20" rx="4" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="0.8"/>
<text x="660" y="164" font-size="8.5" font-weight="700" fill="#10B981" text-anchor="middle">Bounded Jerk (j ≤ 15 rad/s³)</text>
<text x="655.0" y="350" font-size="9" fill="#475569" text-anchor="middle">Continuous acceleration · Zero contact bounce · Seamless operator feel</text>
</svg>
