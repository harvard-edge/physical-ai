<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">COMPARISON OF HARD STEP TAKEOVER VS. C^2 BUMPLESS TORQUE BLENDING</text>
  <text class="subtitle" x="20" y="46">Eliminating motor current inrush spikes (7.4 A → 1.8 A) and infinite torque rate-of-change (u̇) during human intervention</text>

  <!-- ================= LEFT: HARD STEP SWITCHING (CHAOS) ================= -->
  <g transform="translate(20, 60)">
    <rect width="440" height="420" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.3"/>
    <rect x="0" y="0" width="440" height="24" rx="6" fill="#A51C30"/>
    <rect x="0" y="18" width="440" height="6" fill="#A51C30"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">❌ HARD STEP SWITCHING (DISCONTINUOUS TAKEOVER)</text>

    <!-- 3 Subplots -->
    <g transform="translate(20, 35)">
      
      <!-- Plot A: Commanded Torque u(t) -->
      <g transform="translate(0, 0)">
        <text class="mono-txt" x="0" y="12" fill="#A51C30" font-weight="700">(a) Commanded Torque u(t) — Discontinuous Step</text>
        <line x1="0" y1="50" x2="390" y2="50" stroke="#CBD5E1" stroke-width="1"/>
        <!-- Step at t = 100ms -->
        <path d="M 0 50 L 160 50 L 160 15 L 390 15" fill="none" stroke="#A51C30" stroke-width="2"/>
        <text class="tag-txt" x="165" y="30" fill="#A51C30">Δu = +0.7 Nm (0 ms)</text>
      </g>

      <!-- Plot B: Torque Rate u̇(t) -->
      <g transform="translate(0, 70)">
        <text class="mono-txt" x="0" y="12" fill="#A51C30" font-weight="700">(b) Torque Rate u̇(t) — Dirac Impulse δ(t)</text>
        <line x1="0" y1="50" x2="390" y2="50" stroke="#CBD5E1" stroke-width="1"/>
        <line x1="160" y1="50" x2="160" y2="5" stroke="#A51C30" stroke-width="2.5"/>
        <text class="tag-txt" x="170" y="15" fill="#A51C30">u̇ → ∞ (Gear Shock)</text>
      </g>

      <!-- Plot C: Phase Current I(t) -->
      <g transform="translate(0, 140)">
        <text class="mono-txt" x="0" y="12" fill="#A51C30" font-weight="700">(c) Phase Current I(t) — 7.4 A Inrush Spike</text>
        <line x1="0" y1="50" x2="390" y2="50" stroke="#CBD5E1" stroke-width="1"/>
        <path d="M 0 45 L 155 45 L 160 5 L 175 35 L 390 35" fill="none" stroke="#A51C30" stroke-width="2"/>
        <text class="tag-txt" x="170" y="10" fill="#A51C30">7.4 A Inrush (Trips Overcurrent)</text>
      </g>
    </g>

    <!-- Failure Card -->
    <g transform="translate(20, 275)">
      <rect width="400" height="125" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1"/>
      <text class="badge-txt" x="10" y="16" fill="#A51C30">PHYSICAL HARDWARE DAMAGE:</text>
      <text class="body-txt" x="10" y="32">
        <tspan x="10" dy="0">• Inrush current trips inverter overcurrent fault (OCP).</tspan>
        <tspan x="10" dy="16">• Instantaneous torque step shears harmonic drive teeth.</tspan>
        <tspan x="10" dy="16">• Robot jerks violently against human operator's hand.</tspan>
      </text>
    </g>
  </g>

  <!-- ================= RIGHT: C2 BUMPLESS TORQUE BLENDING ================= -->
  <g transform="translate(480, 60)">
    <rect width="440" height="420" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
    <rect x="0" y="0" width="440" height="24" rx="6" fill="#059669"/>
    <rect x="0" y="18" width="440" height="6" fill="#059669"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">✓ C2 BUMPLESS BLENDING (SIGMOID INTERPOLATION)</text>

    <!-- 3 Subplots -->
    <g transform="translate(20, 35)">
      
      <!-- Plot A: Commanded Torque u(t) -->
      <g transform="translate(0, 0)">
        <text class="mono-txt" x="0" y="12" fill="#059669" font-weight="700">(a) Commanded Torque u(t) — Smooth Sigmoid S-Curve</text>
        <line x1="0" y1="50" x2="390" y2="50" stroke="#CBD5E1" stroke-width="1"/>
        <path d="M 0 50 L 140 50 C 180 50, 200 15, 240 15 L 390 15" fill="none" stroke="#059669" stroke-width="2.5"/>
        <text class="tag-txt" x="180" y="30" fill="#059669">T_blend = 100 ms</text>
      </g>

      <!-- Plot B: Torque Rate u̇(t) -->
      <g transform="translate(0, 70)">
        <text class="mono-txt" x="0" y="12" fill="#059669" font-weight="700">(b) Torque Rate u̇(t) — Bounded Bell Curve (≤ 11 Nm/s)</text>
        <line x1="0" y1="50" x2="390" y2="50" stroke="#CBD5E1" stroke-width="1"/>
        <path d="M 0 50 L 140 50 Q 190 10, 240 50 L 390 50" fill="none" stroke="#059669" stroke-width="2"/>
        <text class="tag-txt" x="195" y="15" fill="#059669">u̇_max = 10.8 Nm/s</text>
      </g>

      <!-- Plot C: Phase Current I(t) -->
      <g transform="translate(0, 140)">
        <text class="mono-txt" x="0" y="12" fill="#059669" font-weight="700">(c) Phase Current I(t) — Continuous Delivery (1.8 A)</text>
        <line x1="0" y1="50" x2="390" y2="50" stroke="#CBD5E1" stroke-width="1"/>
        <path d="M 0 45 L 140 45 C 180 45, 200 35, 240 35 L 390 35" fill="none" stroke="#059669" stroke-width="2"/>
        <text class="tag-txt" x="180" y="28" fill="#059669">Continuous 1.8 A (Safe)</text>
      </g>
    </g>

    <!-- Success Card -->
    <g transform="translate(20, 275)">
      <rect width="400" height="125" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text class="badge-txt" x="10" y="16" fill="#059669">PHYSICAL SYSTEMS ADVANTAGES:</text>
      <text class="body-txt" x="10" y="32">
        <tspan x="10" dy="0">• Zero inverter overcurrent trip risk; 100% uptime.</tspan>
        <tspan x="10" dy="16">• Gearbox torque derivative strictly bounded within mechanical specs.</tspan>
        <tspan x="10" dy="16">• Intuitive, smooth haptic feel for the human co-pilot.</tspan>
      </text>
    </g>
  </g>
</svg>
