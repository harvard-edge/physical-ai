<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">POLICY ENDOGENEITY: NAIVE DATA FLYWHEEL VS. GOVERNED EPISODE SLICING</text>
  <text class="subtitle" x="20" y="46">Preventing policy collapse from spurious causal correlations via MCU intervention tagging and pre-crash failure buffer purging</text>

  <!-- ================= TOP: NAIVE DATA FLYWHEEL (COLLAPSE) ================= -->
  <g transform="translate(20, 60)">
    <rect width="900" height="190" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.3"/>
    <rect x="0" y="0" width="900" height="24" rx="6" fill="#A51C30"/>
    <rect x="0" y="18" width="900" height="6" fill="#A51C30"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">❌ NAIVE DATA FLYWHEEL: SPURIOUS CORRELATION &amp; POLICY COLLAPSE</text>

    <!-- Episode Timeline Diagram -->
    <g transform="translate(20, 36)">
      <!-- Autonomous pre-failure phase -->
      <rect x="0" y="0" width="220" height="36" rx="3" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1"/>
      <text class="mono-txt" x="110" y="18" text-anchor="middle" fill="#1E293B">Policy Drifts Toward Wall</text>
      <text class="body-txt" x="110" y="30" text-anchor="middle" fill="#64748B">t = 0 – 3.2 s</text>

      <!-- Failure / Pre-Crash zone -->
      <rect x="225" y="0" width="160" height="36" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.2"/>
      <text class="mono-txt" x="305" y="18" text-anchor="middle" font-weight="700" fill="#A51C30">Pre-Crash Buffer ⚠️</text>
      <text class="body-txt" x="305" y="30" text-anchor="middle" fill="#A51C30">t = 3.2 – 4.0 s (Unsafe)</text>

      <!-- Human Takeover -->
      <rect x="390" y="0" width="200" height="36" rx="3" fill="#FDF8F0" stroke="#B87333" stroke-width="1"/>
      <text class="mono-txt" x="490" y="18" text-anchor="middle" fill="#B87333">Human Steers Away</text>
      <text class="body-txt" x="490" y="30" text-anchor="middle" fill="#B87333">t = 4.0 – 6.5 s (Recovery)</text>

      <!-- Retraining arrow -->
      <line x1="595" y1="18" x2="640" y2="18" stroke="#A51C30" stroke-width="2" marker-end="url(#arr-crimson)"/>

      <!-- Contaminated Dataset Box -->
      <rect x="645" y="0" width="215" height="36" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1.3"/>
      <text class="mono-txt" x="752" y="16" text-anchor="middle" font-weight="700" fill="#A51C30">NAIVE RE-TRAINING</text>
      <text class="body-txt" x="752" y="30" text-anchor="middle" fill="#A51C30">Learns: "Drive into wall to succeed"</text>
    </g>

    <g transform="translate(20, 95)">
      <text class="body-txt" x="0" y="14">
        <tspan x="0" dy="0">• <tspan font-weight="700">Endogeneity Trap:</tspan> Without provenance tags, the model treats the human recovery as consequence of its own pre-crash states.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Catastrophic Policy Collapse:</tspan> The retrained model actively steers into obstacles to trigger imagined recoveries!</tspan>
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM: GOVERNED EPISODE SLICING ================= -->
  <g transform="translate(20, 270)">
    <rect width="900" height="210" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
    <rect x="0" y="0" width="900" height="24" rx="6" fill="#059669"/>
    <rect x="0" y="18" width="900" height="6" fill="#059669"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">✓ PHYSICAL AI GOVERNED EPISODE SLICING &amp; CRYPTOGRAPHIC LINEAGE</text>

    <!-- Governed Slicing Diagram -->
    <g transform="translate(20, 36)">
      <!-- Segment 1: Truncated Autonomous Demo -->
      <rect x="0" y="0" width="220" height="42" rx="3" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
      <text class="mono-txt" x="110" y="18" text-anchor="middle" fill="#059669" font-weight="700">Segment 1: Valid Execution</text>
      <text class="body-txt" x="110" y="32" text-anchor="middle" fill="#64748B">Truncated at t = 3.2 s (Purged)</text>

      <!-- Discarded Pre-crash buffer (Strikethrough) -->
      <rect x="225" y="0" width="160" height="42" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1" stroke-dasharray="3,3"/>
      <text class="mono-txt" x="305" y="18" text-anchor="middle" fill="#A51C30" text-decoration="line-through">Pre-Crash Buffer</text>
      <text class="badge-txt" x="305" y="32" text-anchor="middle" fill="#A51C30">❌ PURGED &amp; DISCARDED</text>

      <!-- Segment 2: Pure Human Recovery -->
      <rect x="390" y="0" width="200" height="42" rx="3" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
      <text class="mono-txt" x="490" y="18" text-anchor="middle" fill="#059669" font-weight="700">Segment 2: Human Recovery</text>
      <text class="body-txt" x="490" y="32" text-anchor="middle" fill="#059669">Tagged with SHA-256 Provenance</text>

      <!-- Verified Retraining arrow -->
      <line x1="595" y1="21" x2="640" y2="21" stroke="#059669" stroke-width="2" marker-end="url(#arr-teal)"/>

      <!-- Clean Dataset Box -->
      <rect x="645" y="0" width="215" height="42" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
      <text class="mono-txt" x="752" y="18" text-anchor="middle" font-weight="700" fill="#059669">GOVERNED RE-TRAINING</text>
      <text class="body-txt" x="752" y="32" text-anchor="middle" fill="#059669">Learns robust recovery primitives</text>
    </g>

    <g transform="translate(20, 105)">
      <text class="body-txt" x="0" y="14">
        <tspan x="0" dy="0">• <tspan font-weight="700">Atomic Hardware Timestamping:</tspan> The MCU logs the microsecond timestamp of human torque override.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Failure Buffer Purge:</tspan> Automatically deletes the preceding 800 ms of trajectory preceding the intervention.</tspan>
        <tspan x="0" dy="16">• <tspan font-weight="700">Continuous Policy Improvement:</tspan> The data flywheel stays healthy, driving asymptotic convergence to zero interventions!</tspan>
      </text>
    </g>
  </g>
</svg>
