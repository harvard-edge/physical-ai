<line x1="655.0" y1="288" x2="655.0" y2="298" stroke="#10B981" stroke-width="1.2" marker-end="url(#arr-teal)"/>
<rect x="480" y="298" width="350" height="46" rx="5" fill="#FFFFFF" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
