<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">THE CLAIM-ARGUMENT-EVIDENCE (CAE) SAFETY CASE ARCHITECTURE</text>
  <text class="subtitle" x="20" y="46">Structured justification decomposing top-level safety claim into 4 engineering pillars backed by immutable bench evidence</text>

  <!-- ================= TOP: TOP-LEVEL CLAIM (C_top) ================= -->
  <g transform="translate(20, 60)">
    <rect width="900" height="52" rx="6" fill="#1F407A"/>
    <text class="badge-txt" x="20" y="22" fill="#93C5FD">TOP-LEVEL RELEASE CLAIM (C_top)</text>
    <text class="mono-txt" x="20" y="38" fill="#FFFFFF" font-weight="700">
      "The Physical AI Agent is certified safe for operation within its defined Operational Design Domain (ODD)."
    </text>
  </g>

  <!-- Connectors from Top Claim to 4 Argument Pillars -->
  <line x1="125" y1="112" x2="125" y2="135" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="355" y1="112" x2="355" y2="135" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="585" y1="112" x2="585" y2="135" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="815" y1="112" x2="815" y2="135" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ================= MIDDLE: 4 ARGUMENT PILLARS (A1 - A4) ================= -->
  <g transform="translate(20, 135)">
    
    <!-- PILLAR A1: BOUNDED LATENCY TAILS -->
    <g transform="translate(0, 0)">
      <rect width="210" height="135" rx="5" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="22" rx="5" fill="#1F407A"/>
      <rect x="0" y="16" width="210" height="6" fill="#1F407A"/>
      <text class="tag-txt" x="8" y="15" fill="#FFFFFF">ARGUMENT A1: FRESHNESS</text>
      
      <g transform="translate(10, 30)">
        <text class="mono-txt" x="0" y="12" fill="#1F407A" font-weight="700">P99 Latency ≤ 24.2 ms</text>
        <text class="body-txt" x="0" y="28">• Sensory-motor lag stays strictly within dynamic stability deadline τ_world.</text>
        <text class="body-txt" x="0" y="58">• Zero-copy DMA + QoS eliminates UMA memory contention.</text>
      </g>
    </g>

    <!-- PILLAR A2: MATHEMATICAL BARRIERS -->
    <g transform="translate(230, 0)">
      <rect width="210" height="135" rx="5" fill="#EDF7F7" stroke="#007A87" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="22" rx="5" fill="#007A87"/>
      <rect x="0" y="16" width="210" height="6" fill="#007A87"/>
      <text class="tag-txt" x="8" y="15" fill="#FFFFFF">ARGUMENT A2: BARRIERS</text>
      
      <g transform="translate(10, 30)">
        <text class="mono-txt" x="0" y="12" fill="#007A87" font-weight="700">CBF Invariance h(x) ≥ 0</text>
        <text class="body-txt" x="0" y="28">• 1 kHz deterministic MCU reflex projects proposals in &lt; 65 μs.</text>
        <text class="body-txt" x="0" y="58">• Forward invariant safe set guarantees zero physical collision.</text>
      </g>
    </g>

    <!-- PILLAR A3: DETERMINISTIC FAULT CONTAINMENT -->
    <g transform="translate(460, 0)">
      <rect width="210" height="135" rx="5" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="22" rx="5" fill="#B87333"/>
      <rect x="0" y="16" width="210" height="6" fill="#B87333"/>
      <text class="tag-txt" x="8" y="15" fill="#FFFFFF">ARGUMENT A3: FAULTS</text>
      
      <g transform="translate(10, 30)">
        <text class="mono-txt" x="0" y="12" fill="#B87333" font-weight="700">100% Fault Containment</text>
        <text class="body-txt" x="0" y="28">• Hardware watchdog + Cat 0/1/2 hierarchy absorbs MPU panics.</text>
        <text class="body-txt" x="0" y="58">• Zero reliance on software cooperation for emergency cutoff.</text>
      </g>
    </g>

    <!-- PILLAR A4: GOVERNED FLYWHEEL & AUDIT -->
    <g transform="translate(690, 0)">
      <rect width="210" height="135" rx="5" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="22" rx="5" fill="#059669"/>
      <rect x="0" y="16" width="210" height="6" fill="#059669"/>
      <text class="tag-txt" x="8" y="15" fill="#FFFFFF">ARGUMENT A4: GOVERNANCE</text>
      
      <g transform="translate(10, 30)">
        <text class="mono-txt" x="0" y="12" fill="#059669" font-weight="700">Governed Slicing &amp; Logs</text>
        <text class="body-txt" x="0" y="28">• Truncates failure buffers; prevents causal policy collapse.</text>
        <text class="body-txt" x="0" y="58">• Immutable SHA-256 telemetry logs for complete legal auditability.</text>
      </g>
    </g>
  </g>

  <!-- Connectors from Arguments to Evidence -->
  <line x1="125" y1="270" x2="125" y2="290" stroke="#1F407A" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="355" y1="270" x2="355" y2="290" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <line x1="585" y1="270" x2="585" y2="290" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="815" y1="270" x2="815" y2="290" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <!-- ================= BOTTOM: 4 EVIDENCE BOXES (E1 - E4) ================= -->
  <g transform="translate(20, 290)">
    
    <!-- EVIDENCE E1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="110" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text class="tag-txt" x="8" y="16" fill="#1F407A">EVIDENCE E1 (BENCH METROLOGY)</text>
      <text class="mono-txt" x="8" y="32" fill="#334155">• Oscilloscope trace logs</text>
      <text class="mono-txt" x="8" y="46" fill="#334155">• IEEE 1588 PTP skew audit</text>
      <text class="mono-txt" x="8" y="60" fill="#334155">• 10,000 cycle latency histogram</text>
      <text class="badge-txt" x="8" y="80" fill="#059669">✓ Artifact: METROLOGY_P99.csv</text>
    </g>

    <!-- EVIDENCE E2 -->
    <g transform="translate(230, 0)">
      <rect width="210" height="110" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text class="tag-txt" x="8" y="16" fill="#007A87">EVIDENCE E2 (CBF FORMAL PROOFS)</text>
      <text class="mono-txt" x="8" y="32" fill="#334155">• Lie derivative derivation</text>
      <text class="mono-txt" x="8" y="46" fill="#334155">• d_stop clearance bench runs</text>
      <text class="mono-txt" x="8" y="60" fill="#334155">• 0 boundary violations log</text>
      <text class="badge-txt" x="8" y="80" fill="#059669">✓ Artifact: CBF_PROOF_REPORT.pdf</text>
    </g>

    <!-- EVIDENCE E3 -->
    <g transform="translate(460, 0)">
      <rect width="210" height="110" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text class="tag-txt" x="8" y="16" fill="#B87333">EVIDENCE E3 (FAULT INJECTION)</text>
      <text class="mono-txt" x="8" y="32" fill="#334155">• 5,000 automated HIL runs</text>
      <text class="mono-txt" x="8" y="46" fill="#334155">• 100% STO interlock cutoff</text>
      <text class="mono-txt" x="8" y="60" fill="#334155">• 95°C thermal soak tests</text>
      <text class="badge-txt" x="8" y="80" fill="#059669">✓ Artifact: HIL_FAULT_MATRIX.json</text>
    </g>

    <!-- EVIDENCE E4 -->
    <g transform="translate(690, 0)">
      <rect width="210" height="110" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text class="tag-txt" x="8" y="16" fill="#059669">EVIDENCE E4 (SHADOW TELEMETRY)</text>
      <text class="mono-txt" x="8" y="32" fill="#334155">• 500 operating hours in shadow</text>
      <text class="mono-txt" x="8" y="46" fill="#334155">• Cryptographic log audit</text>
      <text class="mono-txt" x="8" y="60" fill="#334155">• 4-expert unanimous signoff</text>
      <text class="badge-txt" x="8" y="80" fill="#059669">✓ Artifact: DOSSIER_RELEASE.sig</text>
    </g>
  </g>

  <!-- ================= FINAL RELEASE VERDICT BAR ================= -->
  <g transform="translate(20, 415)">
    <rect width="900" height="65" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/>
    <text class="badge-txt" x="16" y="22" fill="#059669">UNANIMOUS RELEASE DECISION: DEPLOY (ACCOUNTABLE PHYSICAL RELEASE)</text>
    <text class="body-txt" x="16" y="42" fill="#1E293B">
      Signed by Silicon Lead, Embodied ML Lead, Safety Lead, and Operations UX Lead. All safety claims empirically proven on bench hardware.
    </text>
  </g>
</svg>
