<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">CROSS-LAYER SEEDED FAULT INJECTION ARCHITECTURE</text>
  <text class="subtitle" x="20" y="46">Systematic fault injection across Sensory, Compute/Bus, Model/VLA, and Electrical layers into the Dual-Brain Platform</text>

  <!-- ================= 4 FAULT INJECTION DOMAINS ================= -->
  <g transform="translate(20, 60)">
    
    <!-- DOMAIN 1: SENSORY LAYER FAULTS -->
    <g transform="translate(0, 0)">
      <rect width="210" height="195" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="24" rx="6" fill="#1F407A"/>
      <rect x="0" y="18" width="210" height="6" fill="#1F407A"/>
      <text class="tag-txt" x="10" y="16" fill="#FFFFFF">1. SENSORY &amp; TIMING FAULTS</text>

      <g transform="translate(10, 32)">
        <text class="body-txt" x="0" y="12">
          <tspan x="0" dy="0">• <tspan font-weight="700">PTP Timestamp Drift:</tspan> +35 ms phase skew.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Camera Occlusion:</tspan> 500 ms black frames.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">MIPI CRC Corruption:</tspan> 5% dropped packets.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">IMU Bias Jump:</tspan> Sudden +0.5 rad/s offset.</tspan>
        </text>
      </g>
    </g>

    <!-- DOMAIN 2: COMPUTE & BUS FAULTS -->
    <g transform="translate(230, 0)">
      <rect width="210" height="195" rx="6" fill="#EDF7F7" stroke="#007A87" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="24" rx="6" fill="#007A87"/>
      <rect x="0" y="18" width="210" height="6" fill="#007A87"/>
      <text class="tag-txt" x="10" y="16" fill="#FFFFFF">2. COMPUTE &amp; BUS FAULTS</text>

      <g transform="translate(10, 32)">
        <text class="body-txt" x="0" y="12">
          <tspan x="0" dy="0">• <tspan font-weight="700">Linux Kernel Panic:</tspan> MPU hard freeze.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">UMA Memory Bus Stall:</tspan> 95% saturation.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Python GIL Lock:</tspan> 150 ms pause.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">DVFS Throttle:</tspan> 1.8 GHz → 600 MHz.</tspan>
        </text>
      </g>
    </g>

    <!-- DOMAIN 3: MODEL & PROPOSAL FAULTS -->
    <g transform="translate(460, 0)">
      <rect width="210" height="195" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="24" rx="6" fill="#B87333"/>
      <rect x="0" y="18" width="210" height="6" fill="#B87333"/>
      <text class="tag-txt" x="10" y="16" fill="#FFFFFF">3. MODEL &amp; PROPOSAL FAULTS</text>

      <g transform="translate(10, 32)">
        <text class="body-txt" x="0" y="12">
          <tspan x="0" dy="0">• <tspan font-weight="700">OOD Prompt:</tspan> Nonsense string.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Hallucinated Pose:</tspan> Target out of reach.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Stale Intent Lease:</tspan> Emitted 800 ms late.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Singular Motion:</tspan> High condition number.</tspan>
        </text>
      </g>
    </g>

    <!-- DOMAIN 4: ELECTRICAL & MECHANICAL FAULTS -->
    <g transform="translate(690, 0)">
      <rect width="210" height="195" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="24" rx="6" fill="#A51C30"/>
      <rect x="0" y="18" width="210" height="6" fill="#A51C30"/>
      <text class="tag-txt" x="10" y="16" fill="#FFFFFF">4. ELECTRICAL &amp; PHYSICAL</text>

      <g transform="translate(10, 32)">
        <text class="body-txt" x="0" y="12">
          <tspan x="0" dy="0">• <tspan font-weight="700">Battery Sag:</tspan> 24V → 18V transient.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Motor Overheat:</tspan> Coil temp > 110°C.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Dynamic Obstacle:</tspan> Path blocked.</tspan>
          <tspan x="0" dy="16">• <tspan font-weight="700">Interlock Trip:</tspan> E-stop pushed.</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: CONTAINMENT AT THE PROPOSAL-PERMISSION BOUNDARY ================= -->
  <g transform="translate(20, 270)">
    <rect width="900" height="210" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/>
    <rect x="0" y="0" width="900" height="26" rx="6" fill="#059669"/>
    <rect x="0" y="20" width="900" height="6" fill="#059669"/>
    <text class="badge-txt" x="12" y="17" fill="#FFFFFF">✓ REAL-TIME MCU CONTAINMENT VERDICT: 100% CONTAINMENT OF ALL INJECTED VECTORS</text>

    <!-- 3 Core Responses -->
    <g transform="translate(20, 40)">
      <g transform="translate(0, 0)">
        <rect width="270" height="110" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
        <text class="badge-txt" x="10" y="18" fill="#059669">1. HARDWARE WATCHDOG INTERLOCK</text>
        <text class="body-txt" x="10" y="36">
          <tspan x="10" dy="0">• Detects MPU stall in &lt; 50 ms.</tspan>
          <tspan x="10" dy="16">• Instantly trips Category 0 STO.</tspan>
          <tspan x="10" dy="16">• Zero software cooperation required.</tspan>
        </text>
      </g>

      <g transform="translate(295, 0)">
        <rect width="270" height="110" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
        <text class="badge-txt" x="10" y="18" fill="#059669">2. CBF BARRIER PROJECTION</text>
        <text class="body-txt" x="10" y="36">
          <tspan x="10" dy="0">• Bounds trajectory in 65 μs.</tspan>
          <tspan x="10" dy="16">• Prevents obstacle collision.</tspan>
          <tspan x="10" dy="16">• Seamlessly projects into safe set.</tspan>
        </text>
      </g>

      <g transform="translate(590, 0)">
        <rect width="270" height="110" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
        <text class="badge-txt" x="10" y="18" fill="#059669">3. EXPIRING LEASE REVOCATION</text>
        <text class="body-txt" x="10" y="36">
          <tspan x="10" dy="0">• Rejects stale proposals (85mm drift).</tspan>
          <tspan x="10" dy="16">• Executes Category 2 Position Hold.</tspan>
          <tspan x="10" dy="16">• Flushes MPU action queue buffers.</tspan>
        </text>
      </g>
    </g>

    <text class="body-txt" x="20" y="180" font-weight="700" fill="#059669">
      Release Requirement: Zero physical collisions or current overstress across 5,000 automated bench fault injection runs.
    </text>
  </g>
</svg>
