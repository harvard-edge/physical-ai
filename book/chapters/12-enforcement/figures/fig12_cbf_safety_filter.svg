<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .main-title { font-weight: 800; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.6px; }
      .main-subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; font-weight: 400; }
      .panel-title { font-weight: 700; font-size: 12px; fill: #1F407A; letter-spacing: 0.3px; }
      .axis-label { font-size: 10px; fill: #475569; font-weight: 600; }
      .tick-label { font-size: 8.5px; fill: #64748B; }
      .math-text { font-family: "STIX Two Text", "Times New Roman", Georgia, serif; font-style: italic; }
      .code-font { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8.5px; }
      .badge-hdr { font-weight: 700; font-size: 9px; letter-spacing: 0.4px; }
      .bold-text { font-weight: 700; }
    </style>

    <!-- Drop Shadows -->
    <filter id="panelShadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ECFDF5" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="unsafeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF1F2" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="insetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007A87" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#007A87" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="halfspaceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F0FDFA" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="forbiddenU" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF1F2" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Master Header -->
  <text x="480" y="26" class="main-title">CONTROL BARRIER FUNCTIONS (CBF) &amp; MINIMAL INTERVENTION</text>
  <text x="480" y="42" class="main-subtitle">Forward Invariance in State Space and Orthogonal Quadratic Program Projection in Control Space</text>

  <!-- ========================================================================================= -->
  <!-- LEFT PANEL: (a) State Space Forward Invariance -->
  <!-- ========================================================================================= -->
  <g transform="translate(24, 56)">
    <rect width="444" height="462" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#panelShadow)"/>
    <rect width="444" height="28" rx="8" fill="#1F407A" fill-opacity="0.08"/>
    <text x="14" y="19" class="panel-title">(a) State Space Invariance: Safe Set C &amp; Tangential Filtering</text>

    <!-- Phase Space Plot Area -->
    <!-- Safe Set Region C: h(p, v) >= 0 (Left of h=0 curve) -->
    <!-- Boundary Curve: (256, 50) -> Q (275, 110) -> (355, 260) -->
    <path d="M 50 50 L 256 50 Q 280 110 355 260 L 50 260 Z" fill="url(#safeGrad)" stroke="none"/>
    
    <!-- Tracking Margin Inset Region: between h=0 and h_safe=0 -->
    <path d="M 226 50 Q 250 110 325 260 L 355 260 Q 280 110 256 50 Z" fill="url(#insetGrad)" stroke="none"/>

    <!-- Unsafe Region: Right of h=0 curve -->
    <path d="M 256 50 L 420 50 L 420 260 L 355 260 Q 280 110 256 50 Z" fill="url(#unsafeGrad)" stroke="none"/>

    <!-- Grid / Tick guidelines -->
    <line x1="50" y1="190" x2="420" y2="190" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="50" y1="120" x2="420" y2="120" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="200" y1="50" x2="200" y2="260" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="350" y1="50" x2="350" y2="260" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2 2"/>

    <!-- Boundary Lines -->
    <!-- True Physical Boundary: h(x) = 0 -->
    <path d="M 256 50 Q 280 110 355 260" fill="none" stroke="#1F407A" stroke-width="2.5"/>
    
    <!-- Inset Safety Margin Boundary: h_safe(x) = h(x) - delta_margin = 0 -->
    <path d="M 226 50 Q 250 110 325 260" fill="none" stroke="#007A87" stroke-width="1.6" stroke-dasharray="4 3"/>

    <!-- Axes -->
    <line x1="50" y1="260" x2="425" y2="260" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <line x1="50" y1="260" x2="50" y2="42" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <text x="420" y="275" class="axis-label" text-anchor="end">Position / Distance <tspan class="math-text">p</tspan> [m]</text>
    <text x="54" y="48" class="axis-label" text-anchor="start">Velocity <tspan class="math-text">v</tspan> [m/s]</text>

    <!-- Region Labels & Badges -->
    <rect x="62" y="60" width="105" height="32" rx="4" fill="#FFFFFF" fill-opacity="0.9" stroke="#10B981" stroke-width="1"/>
    <text x="114" y="73" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle">SAFE SET C</text>
    <text x="114" y="85" font-size="8" fill="#047857" text-anchor="middle" class="math-text">h(x) ≥ 0  (Admissible)</text>

    <rect x="348" y="60" width="82" height="32" rx="4" fill="#FFFFFF" fill-opacity="0.9" stroke="#A51C30" stroke-width="1"/>
    <text x="389" y="73" font-size="9" font-weight="700" fill="#A51C30" text-anchor="middle">UNSAFE SET</text>
    <text x="389" y="85" font-size="8" fill="#991B1B" text-anchor="middle" class="math-text">h(x) &lt; 0  (Forbidden)</text>

    <!-- Inset Margin Callout -->
    <line x1="240" y1="210" x2="260" y2="210" stroke="#007A87" stroke-width="1.2"/>
    <text x="218" y="202" font-size="8" font-weight="700" fill="#007A87" text-anchor="end">Inset Margin δ_margin</text>
    <text x="218" y="212" font-size="7" fill="#475569" text-anchor="end">Tracking Bound ε_track Buffer</text>

    <!-- Boundary Curve Label -->
    <text x="362" y="250" font-size="8.5" font-weight="700" fill="#1F407A">∂C: h(x) = 0</text>
    <text x="328" y="275" font-size="8" font-weight="700" fill="#007A87" text-anchor="end">h_safe(x) = 0</text>

    <!-- Operating Point on Inset Boundary x_0 = (p=1.5, v=1.5) -> (270, 135) -->
    <circle cx="270" cy="135" r="4" fill="#1F407A"/>
    <text x="255" y="130" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="end">State x(t)</text>

    <!-- Inward Gradient Vector ∇h(x) -->
    <line x1="270" y1="135" x2="205" y2="155" stroke="#1F407A" stroke-width="2" marker-end="url(#arr-navy)"/>
    <text x="195" y="153" font-size="8.5" font-weight="700" fill="#1F407A" text-anchor="end">∇h(x)</text>
    <text x="195" y="163" font-size="7" fill="#475569" text-anchor="end">Inward Normal</text>

    <!-- Tangent Line at x(t) -->
    <line x1="235" y1="50" x2="305" y2="220" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="238" y="44" font-size="7.5" fill="#64748B">Tangent Space T_C(x)</text>

    <!-- Trajectories -->
    <!-- 1. Nominal Policy: points into Unsafe Region -->
    <!-- Vector f(x, u_nom) from (270, 135) to (340, 105) -->
    <line x1="270" y1="135" x2="338" y2="106" stroke="#A51C30" stroke-width="2.2" marker-end="url(#arr-crimson)"/>
    <text x="345" y="105" font-size="8.5" font-weight="800" fill="#A51C30">f(x, u_nom)</text>
    <text x="345" y="115" font-size="7" fill="#A51C30">ḣ &lt; -γ h(x) (Violates Barrier)</text>

    <!-- Nominal Trajectory Trail -->
    <path d="M 120 230 Q 200 190 270 135 Q 310 100 370 70" fill="none" stroke="#A51C30" stroke-width="1.6" stroke-dasharray="3 3"/>

    <!-- 2. Filtered Action: Deflected Tangentially along Inset Boundary -->
    <!-- Vector f(x, u*) from (270, 135) to (305, 215) -->
    <line x1="270" y1="135" x2="303" y2="210" stroke="#007A87" stroke-width="2.5" marker-end="url(#arr-petrol)"/>
    <text x="312" y="205" font-size="8.5" font-weight="800" fill="#007A87">f(x, u*)</text>
    <text x="312" y="215" font-size="7" fill="#007A87">ḣ ≥ -γ h(x) (Safe)</text>

    <!-- Safe Filtered Trajectory Trail -->
    <path d="M 120 230 Q 200 190 270 135 Q 295 190 320 255" fill="none" stroke="#007A87" stroke-width="2.4"/>

    <!-- Bottom Mathematical Summary Card -->
    <rect x="12" y="295" width="420" height="152" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <rect x="20" y="304" width="190" height="18" rx="3" fill="#1F407A" fill-opacity="0.1"/>
    <text x="26" y="317" class="badge-hdr" fill="#1F407A">FORWARD INVARIANCE CERTIFICATE</text>
    
    <text x="20" y="337" font-size="9.5" class="code-font" fill="#1E293B">ḣ(x,u) = L_f h(x) + L_g h(x) u ≥ -γ h(x)</text>
    <text x="20" y="353" font-size="8.5" fill="#475569">• <tspan class="bold-text">Invariant Set:</tspan> Zero-superlevel set <tspan class="math-text">C = {x ∈ X | h(x) ≥ 0}</tspan> is forward invariant.</text>
    <text x="20" y="367" font-size="8.5" fill="#475569">• <tspan class="bold-text">Nagumo's Theorem:</tspan> Control vector field <tspan class="math-text">f(x, u*)</tspan> remains inside tangent cone <tspan class="math-text">T_C(x)</tspan>.</text>
    <text x="20" y="381" font-size="8.5" fill="#475569">• <tspan class="bold-text">Tracking Inset Margin:</tspan> <tspan class="math-text">h_safe(x) = h(x) - δ_margin</tspan> buffers tracking error <tspan class="math-text">ε_track</tspan>.</text>
    <text x="20" y="395" font-size="8.5" fill="#475569">• <tspan class="bold-text">Kinematic Inset Formula:</tspan> <tspan class="code-font">δ_margin = ε_p + (v ε_v)/a_max</tspan> (accounts for loop delay).</text>
    <text x="20" y="415" font-size="8.5" font-weight="700" fill="#007A87">Result: Policy commands are filtered tangentially without task abortion.</text>
  </g>

  <!-- ========================================================================================= -->
  <!-- RIGHT PANEL: (b) Control Input Space Minimal Intervention -->
  <!-- ========================================================================================= -->
  <g transform="translate(492, 56)">
    <rect width="444" height="462" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#panelShadow)"/>
    <rect width="444" height="28" rx="8" fill="#007A87" fill-opacity="0.08"/>
    <text x="14" y="19" class="panel-title" fill="#007A87">(b) Control Space: Orthogonal QP Projection onto Admissible Half-Space</text>

    <!-- Control Input 2D Space -->
    <!-- Saturation Box: [-0.5, 4.5] x [-0.5, 3.5] -> X: 85..335, Y: 82.5..262.5 -->
    <rect x="85" y="82.5" width="250" height="180" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="330" y="94" font-size="7.5" fill="#64748B" text-anchor="end">Actuator Saturation Envelope U_act</text>

    <!-- Admissible Control Half-Space Polygon: a^T u <= b (u1 + 2u2 <= 5) -->
    <!-- Line from (85, 116.25) to (335, 228.75) -->
    <!-- Region below the line within saturation box: (85, 116.25) -> (335, 228.75) -> (335, 262.5) -> (85, 262.5) -->
    <polygon points="85,116.25 335,228.75 335,262.5 85,262.5" fill="url(#halfspaceGrad)" stroke="none"/>

    <!-- Forbidden Control Half-Space: a^T u > b -->
    <polygon points="85,116.25 335,228.75 335,82.5 85,82.5" fill="url(#forbiddenU)" stroke="none"/>

    <!-- Active Barrier Hyperplane Line: a^T u = b -->
    <line x1="70" y1="109.5" x2="360" y2="240" stroke="#A51C30" stroke-width="2.4"/>
    <text x="360" y="252" font-size="8.5" font-weight="700" fill="#A51C30" text-anchor="end">Active Barrier: a^T u = b</text>

    <!-- Safe Half-Space Badge -->
    <rect x="95" y="215" width="130" height="26" rx="4" fill="#FFFFFF" fill-opacity="0.9" stroke="#0284C7" stroke-width="0.8"/>
    <text x="160" y="227" font-size="8" font-weight="700" fill="#0369A1" text-anchor="middle">ADMISSIBLE HALF-SPACE U_safe</text>
    <text x="160" y="237" font-size="7.5" fill="#0284C7" text-anchor="middle" class="code-font">a^T u ≤ b  (Safe Actions)</text>

    <!-- Axes: u1 (Torque 1) and u2 (Torque 2) -->
    <line x1="70" y1="240" x2="370" y2="240" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <line x1="110" y1="260" x2="110" y2="60" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
    <text x="365" y="235" class="axis-label" text-anchor="end">Joint Torque <tspan class="math-text">u₁</tspan> [N·m]</text>
    <text x="115" y="68" class="axis-label" text-anchor="start">Joint Torque <tspan class="math-text">u₂</tspan> [N·m]</text>

    <!-- Tick marks -->
    <text x="110" y="252" class="tick-label" text-anchor="middle">0</text>
    <text x="260" y="252" class="tick-label" text-anchor="middle">3.0</text>
    <text x="310" y="252" class="tick-label" text-anchor="middle">4.0</text>
    <text x="102" y="198" class="tick-label" text-anchor="end">1.0</text>
    <text x="102" y="108" class="tick-label" text-anchor="end">3.0</text>

    <!-- Nominal Unconstrained Command u_nom = (4.0, 3.0) -> (310, 105) -->
    <circle cx="310" cy="105" r="4.5" fill="#A51C30"/>
    <rect x="318" y="90" width="112" height="34" rx="4" fill="#FFFFFF" fill-opacity="0.9" stroke="#A51C30" stroke-width="0.8"/>
    <text x="324" y="103" font-size="9" font-weight="800" fill="#A51C30">u_nom = [4.0, 3.0]^T</text>
    <text x="324" y="113" font-size="7.5" fill="#A51C30">Policy Proposal (Unsafe)</text>
    <text x="324" y="122" font-size="7" fill="#991B1B">a^T u_nom = 10 &gt; 5</text>

    <!-- Filtered Optimal Command u* = (3.0, 1.0) -> (260, 195) -->
    <circle cx="260" cy="195" r="4.5" fill="#1F407A"/>
    <rect x="155" y="165" width="100" height="32" rx="4" fill="#FFFFFF" fill-opacity="0.9" stroke="#1F407A" stroke-width="0.8"/>
    <text x="250" y="177" font-size="9" font-weight="800" fill="#1F407A" text-anchor="end">u* = [3.0, 1.0]^T</text>
    <text x="250" y="187" font-size="7.5" fill="#1F407A" text-anchor="end">Optimal QP Projection</text>
    <text x="250" y="195" font-size="7" fill="#007A87" text-anchor="end">a^T u* = 5.0 (Boundary)</text>

    <!-- Orthogonal Projection Vector: from u_nom (310, 105) to u* (260, 195) -->
    <line x1="310" y1="105" x2="263" y2="189" stroke="#1F407A" stroke-width="2.5" marker-end="url(#arr-navy)"/>
    <text x="294" y="152" font-size="8.5" font-weight="700" fill="#1F407A">Δu = -λ a</text>
    <text x="294" y="162" font-size="7" fill="#1F407A">Minimal Intervention</text>

    <!-- Normal Vector a = [1, 2]^T at u* pointing towards u_nom -->
    <line x1="260" y1="195" x2="280" y2="159" stroke="#B87333" stroke-width="1.8" marker-end="url(#arr-bronze)"/>
    <text x="272" y="145" font-size="7.5" font-weight="700" fill="#B87333">Normal a</text>

    <!-- Right-angle symbol at u* -->
    <path d="M 265 186 L 273 190 L 268 199" fill="none" stroke="#1F407A" stroke-width="1.2"/>

    <!-- Comparison: Uncoordinated Heuristic Clamping u_clip = [3.5, 2.0]^T -> (285, 150) -->
    <circle cx="285" cy="150" r="3.5" fill="#D97706"/>
    <line x1="310" y1="105" x2="285" y2="150" stroke="#D97706" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="292" y="130" width="138" height="28" rx="3" fill="#FFFBEB" stroke="#D97706" stroke-width="0.8"/>
    <text x="296" y="141" font-size="7.5" font-weight="700" fill="#B45309">u_clip = [3.5, 2.0]^T (Scalar Clamp)</text>
    <text x="296" y="151" font-size="7" fill="#92400E">a^T u_clip = 7.5 &gt; 5.0 (STILL UNSAFE!)</text>

    <!-- Bottom Mathematical Summary Card -->
    <rect x="12" y="295" width="420" height="152" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

    <rect x="20" y="304" width="200" height="18" rx="3" fill="#007A87" fill-opacity="0.1"/>
    <text x="26" y="317" class="badge-hdr" fill="#007A87">QUADRATIC PROGRAM SAFETY FILTER</text>

    <text x="20" y="337" font-size="9.5" class="code-font" fill="#1E293B">u* = argmin_{u ∈ U} 1/2 ||u - u_nom||²  s.t.  a^T u ≤ b</text>
    <text x="20" y="353" font-size="8.5" fill="#475569">• <tspan class="bold-text">Closed-Form Analytical Solution:</tspan> <tspan class="code-font">u* = u_nom - (max(0, a^T u_nom - b) / ||a||²) a</tspan></text>
    <text x="20" y="367" font-size="8.5" fill="#475569">• <tspan class="bold-text">Zero Intervention Interior:</tspan> If <tspan class="math-text">a^T u_nom ≤ b</tspan>, then <tspan class="math-text">u* = u_nom</tspan> (unmodified policy intent).</text>
    <text x="20" y="381" font-size="8.5" fill="#475569">• <tspan class="bold-text">Coupled Multi-Axis Dynamics:</tspan> Preserves Cartesian wrench alignment vs scalar clipping.</text>
    <text x="20" y="395" font-size="8.5" fill="#475569">• <tspan class="bold-text">Policy Health Telemetry:</tspan> Rolling norm <tspan class="math-text">Σ ||u* - u_nom|| Δt</tspan> tracks upstream model drift.</text>
    <text x="20" y="415" font-size="8.5" font-weight="700" fill="#1F407A">Guarantee: Microsecond deterministic QP projection on embedded MCU SRAM.</text>
  </g>
</svg>
