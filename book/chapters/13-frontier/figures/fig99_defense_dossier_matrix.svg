<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">THE ORAL DEFENSE &amp; RELEASE VERDICT QUALIFICATION GATE</text>
  <text class="subtitle" x="20" y="46">Auditing the 11-artifact Cumulative Design Dossier across 4 review personas for a binding release verdict</text>

  <!-- ================= TOP: 4 EXPERT AUDIT DIMENSIONS ================= -->
  <g transform="translate(20, 60)">
    
    <!-- EXPERT 1: SILICON & EMBEDDED LEAD -->
    <g transform="translate(0, 0)">
      <rect width="210" height="235" rx="6" fill="#F0F4FA" stroke="#1F407A" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="24" rx="6" fill="#1F407A"/>
      <rect x="0" y="18" width="210" height="6" fill="#1F407A"/>
      <text class="tag-txt" x="10" y="16" fill="#FFFFFF">1. EMBEDDED &amp; SILICON LEAD</text>

      <g transform="translate(10, 32)">
        <text class="body-txt" x="0" y="12">
          <tspan x="0" dy="0">• Zero-copy DMABUF ring buffers.</tspan>
          <tspan x="0" dy="16">• PTP Exposure midpoint skew &lt; 5 μs.</tspan>
          <tspan x="0" dy="16">• FreeRTOS 1 kHz deterministic tick.</tspan>
          <tspan x="0" dy="16">• Watchdog countdown &lt; 50 ms.</tspan>
          <tspan x="0" dy="16">• Zero dynamic memory allocation.</tspan>
        </text>

        <rect y="115" width="190" height="30" rx="3" fill="#FFFFFF" stroke="#1F407A" stroke-width="1"/>
        <text class="badge-txt" x="8" y="14" fill="#1F407A">STATUS: SIGNED ✓</text>
        <text class="mono-txt" x="8" y="24" fill="#059669">P99 = 24.2 ms Bounded</text>
      </g>
    </g>

    <!-- EXPERT 2: EMBODIED ML LEAD -->
    <g transform="translate(230, 0)">
      <rect width="210" height="235" rx="6" fill="#EDF7F7" stroke="#007A87" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="24" rx="6" fill="#007A87"/>
      <rect x="0" y="18" width="210" height="6" fill="#007A87"/>
      <text class="tag-txt" x="10" y="16" fill="#FFFFFF">2. EMBODIED ML SPECIALIST</text>

      <g transform="translate(10, 32)">
        <text class="body-txt" x="0" y="12">
          <tspan x="0" dy="0">• Metric SE(3) spatial affordances.</tspan>
          <tspan x="0" dy="16">• Expiring intent lease TTL (500 ms).</tspan>
          <tspan x="0" dy="16">• C^2 quintic polynomial spline blend.</tspan>
          <tspan x="0" dy="16">• Governed episode failure slicing.</tspan>
          <tspan x="0" dy="16">• Bounded KV-cache memory.</tspan>
        </text>

        <rect y="115" width="190" height="30" rx="3" fill="#FFFFFF" stroke="#007A87" stroke-width="1"/>
        <text class="badge-txt" x="8" y="14" fill="#007A87">STATUS: SIGNED ✓</text>
        <text class="mono-txt" x="8" y="24" fill="#059669">Zero Causal Collapse</text>
      </g>
    </g>

    <!-- EXPERT 3: SYSTEM SAFETY LEAD -->
    <g transform="translate(460, 0)">
      <rect width="210" height="235" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="24" rx="6" fill="#A51C30"/>
      <rect x="0" y="18" width="210" height="6" fill="#A51C30"/>
      <text class="tag-txt" x="10" y="16" fill="#FFFFFF">3. SYSTEM SAFETY LEAD</text>

      <g transform="translate(10, 32)">
        <text class="body-txt" x="0" y="12">
          <tspan x="0" dy="0">• CBF forward invariance h(x) ≥ 0.</tspan>
          <tspan x="0" dy="16">• Dynamic stopping d_stop ≤ d_clear.</tspan>
          <tspan x="0" dy="16">• IEC 60204-1 Cat 0/1/2 fallback.</tspan>
          <tspan x="0" dy="16">• 5,000 seeded fault injection runs.</tspan>
          <tspan x="0" dy="16">• Complete STPA hazard matrix.</tspan>
        </text>

        <rect y="115" width="190" height="30" rx="3" fill="#FFFFFF" stroke="#A51C30" stroke-width="1"/>
        <text class="badge-txt" x="8" y="14" fill="#A51C30">STATUS: SIGNED ✓</text>
        <text class="mono-txt" x="8" y="24" fill="#059669">0 Physical Breaches</text>
      </g>
    </g>

    <!-- EXPERT 4: PRACTITIONER UX LEAD -->
    <g transform="translate(690, 0)">
      <rect width="210" height="235" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
      <rect x="0" y="0" width="210" height="24" rx="6" fill="#B87333"/>
      <rect x="0" y="18" width="210" height="6" fill="#B87333"/>
      <text class="tag-txt" x="10" y="16" fill="#FFFFFF">4. PRACTITIONER UX LEAD</text>

      <g transform="translate(10, 32)">
        <text class="body-txt" x="0" y="12">
          <tspan x="0" dy="0">• Clean, unambiguous C contracts.</tspan>
          <tspan x="0" dy="16">• Reproducible bench realization.</tspan>
          <tspan x="0" dy="16">• Manageable 6 ECTS workload.</tspan>
          <tspan x="0" dy="16">• Zero undocumented magic numbers.</tspan>
          <tspan x="0" dy="16">• Complete diagnostic logs.</tspan>
        </text>

        <rect y="115" width="190" height="30" rx="3" fill="#FFFFFF" stroke="#B87333" stroke-width="1"/>
        <text class="badge-txt" x="8" y="14" fill="#B87333">STATUS: SIGNED ✓</text>
        <text class="mono-txt" x="8" y="24" fill="#059669">100% Bench Reproducible</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: THE 3 BINDING RELEASE VERDICTS ================= -->
  <g transform="translate(20, 310)">
    
    <!-- VERDICT 1: DEPLOY (UNCONSTRAINED) -->
    <g transform="translate(0, 0)">
      <rect width="286" height="170" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/>
      <rect x="0" y="0" width="286" height="24" rx="6" fill="#059669"/>
      <rect x="0" y="18" width="286" height="6" fill="#059669"/>
      <text class="badge-txt" x="12" y="16" fill="#FFFFFF">★ VERDICT 1: DEPLOY</text>

      <g transform="translate(12, 34)">
        <text class="mono-txt" x="0" y="12" fill="#059669" font-weight="700">Full ODD Release Authorized</text>
        <text class="body-txt" x="0" y="30">• Passes all 4 qualification rungs.</text>
        <text class="body-txt" x="0" y="46">• 100% fault containment verified.</text>
        <text class="body-txt" x="0" y="62">• Unanimous 4-expert approval.</text>
        <text class="mono-txt" x="0" y="86" fill="#059669" font-weight="700">RESULT: Production Shipment</text>
      </g>
    </g>

    <!-- VERDICT 2: CONDITION (RESTRICTED) -->
    <g transform="translate(306, 0)">
      <rect width="286" height="170" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.2"/>
      <rect x="0" y="0" width="286" height="24" rx="6" fill="#B87333"/>
      <rect x="0" y="18" width="286" height="6" fill="#B87333"/>
      <text class="badge-txt" x="12" y="16" fill="#FFFFFF">⚠️ VERDICT 2: CONDITION</text>

      <g transform="translate(12, 34)">
        <text class="mono-txt" x="0" y="12" fill="#B87333" font-weight="700">Restricted ODD Operation</text>
        <text class="body-txt" x="0" y="30">• Speed derated to 0.5 m/s.</text>
        <text class="body-txt" x="0" y="46">• Human co-pilot required (α ≤ 0.5).</text>
        <text class="body-txt" x="0" y="62">• Requires secondary audit within 30d.</text>
        <text class="mono-txt" x="0" y="86" fill="#B87333" font-weight="700">RESULT: Supervised Pilot</text>
      </g>
    </g>

    <!-- VERDICT 3: REFUSE (BLOCKED) -->
    <g transform="translate(614, 0)">
      <rect width="286" height="170" rx="6" fill="#FEF2F2" stroke="#A51C30" stroke-width="1.2"/>
      <rect x="0" y="0" width="286" height="24" rx="6" fill="#A51C30"/>
      <rect x="0" y="18" width="286" height="6" fill="#A51C30"/>
      <text class="badge-txt" x="12" y="16" fill="#FFFFFF">❌ VERDICT 3: REFUSE</text>

      <g transform="translate(12, 34)">
        <text class="mono-txt" x="0" y="12" fill="#A51C30" font-weight="700">Shipment Blocked</text>
        <text class="body-txt" x="0" y="30">• Tail latency exceeds τ_world.</text>
        <text class="body-txt" x="0" y="46">• Fault injection boundary breach.</text>
        <text class="body-txt" x="0" y="62">• Missing empirical bench proofs.</text>
        <text class="mono-txt" x="0" y="86" fill="#A51C30" font-weight="700">RESULT: Redesign Required</text>
      </g>
    </g>
  </g>
</svg>
