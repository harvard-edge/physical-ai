<rect width="900" height="460" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="450.0" y="30" class="title">CAPSTONE DUAL-BRAIN HETEROGENEOUS SYSTEM ARCHITECTURE</text>
<text x="450.0" y="46" class="subtitle">Arduino Uno Q / STM32 NPU: Cortex-A MPU Deliberation ⟷ Shared TCM SRAM ⟷ Real-Time Cortex-M MCU Reflex Enforcer</text>
<rect x="25" y="68" width="270" height="330" rx="8" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="25" y="68" width="270" height="26" rx="8" fill="#1F407A" fill-opacity="0.12"/>
<text x="160.0" y="86" font-size="10" font-weight="700" fill="#1F407A" text-anchor="middle">1. HOST PROCESSOR (Linux MPU / NPU)</text>
<text x="39" y="115" font-size="11.5" font-weight="700" fill="#1A202C">High-Throughput Deliberation</text>
<text x="39" y="130" font-size="8.5" font-weight="600" fill="#1F407A">Cadence: 20–50 Hz · Non-Real-Time</text>
<text x="39" y="154" font-size="8.5" fill="#475569">• MIPI CSI-2 Camera DMA Ingestion</text>
<text x="39" y="176" font-size="8.5" fill="#475569">• Spatial Tokenizer (DINOv2 / MobileNet)</text>
<text x="39" y="198" font-size="8.5" fill="#475569">• SE(3) Dynamic Kinematic Frame Tree</text>
<text x="39" y="220" font-size="8.5" fill="#475569">• VLM Semantic Intent Grounding</text>
<text x="39" y="242" font-size="8.5" fill="#475569">• Diffusion / ACT Action Chunks (H=16)</text>
<text x="39" y="264" font-size="8.5" fill="#475569">• Asynchronous State Re-Anchoring</text>
<rect x="35" y="352" width="250" height="36" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="160.0" y="370" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">STOCHASTIC / UNTRUSTED SUBSTRATE</text>
<text x="160.0" y="384" font-size="7.5" fill="#64748B" text-anchor="middle">Subject to page faults, GC stalls, and tail spikes</text>
<rect x="315" y="68" width="270" height="330" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4,2"/>
<text x="450.0" y="92" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">SHARED MEMORY (TCM / SRAM)</text>
<text x="450.0" y="108" font-size="8.5" fill="#64748B" text-anchor="middle">Lock-Free Inter-Core Mailbox &amp; Seqlock</text>
<rect x="327" y="125" width="246" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<rect x="327" y="125" width="4" height="36" rx="2" fill="#B87333"/>
<text x="337" y="140" font-size="8.5" font-weight="700" fill="#B87333">Candidate Action Buffer p_t</text>
<text x="337" y="153" font-size="7.5" fill="#475569">H=16 Chunk Poses + Velocities (128 bytes)</text>
<rect x="327" y="169" width="246" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<rect x="327" y="169" width="4" height="36" rx="2" fill="#5B4B8A"/>
<text x="337" y="184" font-size="8.5" font-weight="700" fill="#5B4B8A">Expiring Intent Lease t_expire</text>
<text x="337" y="197" font-size="7.5" fill="#475569">Monotonic Timestamp Dead-Man Switch (8 bytes)</text>
<rect x="327" y="213" width="246" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<rect x="327" y="213" width="4" height="36" rx="2" fill="#215CAF"/>
<text x="337" y="228" font-size="8.5" font-weight="700" fill="#215CAF">World Model State ẑ_t</text>
<text x="337" y="241" font-size="7.5" fill="#475569">Fused SE(3) Bounding Primitives (64 bytes)</text>
<rect x="327" y="257" width="246" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<rect x="327" y="257" width="4" height="36" rx="2" fill="#DC2626"/>
<text x="337" y="272" font-size="8.5" font-weight="700" fill="#DC2626">Hardware Heartbeat Counter</text>
<text x="337" y="285" font-size="7.5" fill="#475569">20 Hz Monotonic Ping (4 bytes)</text>
<rect x="327" y="301" width="246" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<rect x="327" y="301" width="4" height="36" rx="2" fill="#007A87"/>
<text x="337" y="316" font-size="8.5" font-weight="700" fill="#007A87">Proprioceptive Telemetry</text>
<text x="337" y="329" font-size="7.5" fill="#475569">1 kHz Odometry &amp; Motor Currents (32 bytes)</text>
<rect x="605" y="68" width="270" height="330" rx="8" fill="#FFFFFF" stroke="#007A87" stroke-width="1.4" filter="url(#shadow)"/>
<rect x="605" y="68" width="270" height="26" rx="8" fill="#007A87" fill-opacity="0.12"/>
<text x="740.0" y="86" font-size="10" font-weight="700" fill="#007A87" text-anchor="middle">2. REFLEX ENFORCER (Real-Time MCU)</text>
<text x="619" y="115" font-size="11.5" font-weight="700" fill="#1A202C">Deterministic Safety Enforcer</text>
<text x="619" y="130" font-size="8.5" font-weight="600" fill="#007A87">Cadence: 1000 Hz · Hard Real-Time (Jitter &lt; 5 µs)</text>
<text x="619" y="154" font-size="8.5" fill="#475569">• 1000 Hz FreeRTOS Strict Priority Task</text>
<text x="619" y="176" font-size="8.5" fill="#475569">• Active-Set CBF QP Solver (h(x) ≥ 0)</text>
<text x="619" y="198" font-size="8.5" fill="#475569">• Dynamic Stopping Clearance Veto (d_stop ≤ d_gap)</text>
<text x="619" y="220" font-size="8.5" fill="#475569">• Watchdog Heartbeat Monitor (50 ms Timeout)</text>
<text x="619" y="242" font-size="8.5" fill="#475569">• Bumpless C² Takeover Smoothing S(α)</text>
<text x="619" y="264" font-size="8.5" fill="#475569">• PWM Gate Driver Current Loop Control</text>
<rect x="615" y="352" width="250" height="36" rx="5" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="1"/>
<text x="740.0" y="370" font-size="8.5" font-weight="700" fill="#10B981" text-anchor="middle">CERTIFIED SAFETY GUARANTEE</text>
<text x="740.0" y="384" font-size="7.5" fill="#475569" text-anchor="middle">Zero dynamic malloc · Strict forward invariance</text>
<line x1="295" y1="180" x2="315" y2="180" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-navy)"/>
<line x1="585" y1="180" x2="605" y2="180" stroke="#007A87" stroke-width="1.6" marker-end="url(#arr-petrol)"/>
<line x1="605" y1="280" x2="585" y2="280" stroke="#007A87" stroke-width="1.6" marker-end="url(#arr-petrol)"/>
<line x1="315" y1="280" x2="295" y2="280" stroke="#1F407A" stroke-width="1.6" marker-end="url(#arr-navy)"/>
<rect x="25" y="412" width="850" height="38" rx="6" fill="#A51C30" fill-opacity="0.06" stroke="#A51C30" stroke-width="1.2"/>
<text x="450.0" y="428" font-size="10" font-weight="700" fill="#A51C30" text-anchor="middle">ACTUATORS &amp; PHYSICAL ENVIRONMENT (W_t → W_t+1)</text>
<text x="450.0" y="442" font-size="8.5" fill="#475569" text-anchor="middle">BLDC Motors · Inverter Bridges · Contact Friction · Mechanical Inertia · Thermal Dissipation</text>
<line x1="740.0" y1="398" x2="740.0" y2="412" stroke="#007A87" stroke-width="1.8" marker-end="url(#arr-petrol)"/>
<line x1="160.0" y1="412" x2="160.0" y2="398" stroke="#1F407A" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-navy)"/>
</svg>
