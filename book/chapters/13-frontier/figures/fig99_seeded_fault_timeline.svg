<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">CROSS-LAYER SEEDED FAULT INJECTION &amp; DYNAMIC ARREST WAVEFORM</text>
  <text class="subtitle" x="20" y="46">Live telemetry: Linux MPU kernel crash at t = 50 ms → Watchdog trip at t = 85 ms → Safe arrest at t = 185 ms (d_stop = 5.2 cm &lt; 12.0 cm)</text>

  <!-- ================= TOP: TIME-SYNCHRONIZED TELEMETRY PLOTS ================= -->
  <g transform="translate(20, 60)">
    <rect width="900" height="280" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Plot Area -->
    <g transform="translate(50, 20)">
      
      <!-- 1. Linux MPU Heartbeat GPIO (Square wave dies at 50ms) -->
      <g transform="translate(0, 0)">
        <text class="mono-txt" x="0" y="12" fill="#1E293B" font-weight="700">1. Linux MPU Heartbeat GPIO (50 Hz Square Wave)</text>
        <line x1="0" y1="40" x2="800" y2="40" stroke="#CBD5E1" stroke-width="1"/>
        <!-- Toggle until t = 120 (50ms marker) -->
        <path d="M 0 40 L 30 40 L 30 15 L 60 15 L 60 40 L 90 40 L 90 15 L 120 15 L 120 40 L 800 40" fill="none" stroke="#1F407A" stroke-width="2"/>
        <text class="tag-txt" x="125" y="25" fill="#A51C30">⚡ KERNEL PANIC (t = 50 ms)</text>
      </g>

      <!-- 2. MCU Watchdog Countdown Timer (Decays 50ms to 0) -->
      <g transform="translate(0, 55)">
        <text class="mono-txt" x="0" y="12" fill="#1E293B" font-weight="700">2. MCU Hardware Watchdog Timer (Countdown to STO)</text>
        <line x1="0" y1="45" x2="800" y2="45" stroke="#CBD5E1" stroke-width="1"/>
        <!-- Sawtooth resetting until t=120, then decays to 0 at t=210 (85ms) -->
        <path d="M 0 15 L 60 45 L 60 15 L 120 30 L 120 15 L 210 45 L 800 45" fill="none" stroke="#B87333" stroke-width="2"/>
        <circle cx="210" cy="45" r="4" fill="#A51C30"/>
        <text class="tag-txt" x="215" y="35" fill="#A51C30">WATCHDOG TRIP (t = 85 ms)</text>
      </g>

      <!-- 3. Velocity & Dynamic Deceleration Profile -->
      <g transform="translate(0, 115)">
        <text class="mono-txt" x="0" y="12" fill="#1E293B" font-weight="700">3. End-Effector Velocity v(t) &amp; Category 1 Arrest</text>
        <line x1="0" y1="55" x2="800" y2="55" stroke="#CBD5E1" stroke-width="1"/>
        <!-- Velocity constant at 0.45 m/s until t=210, then dynamic braking down to 0 at t=460 (185ms) -->
        <path d="M 0 15 L 210 15 L 460 55 L 800 55" fill="none" stroke="#059669" stroke-width="2.5"/>
        <text class="tag-txt" x="240" y="32" fill="#059669">a_max = -4.5 m/s² (Braking)</text>
        <circle cx="460" cy="55" r="5" fill="#059669"/>
        <text class="tag-txt" x="465" y="48" fill="#059669">COMPLETE STOP (t = 185 ms)</text>
      </g>

      <!-- Time axis markers -->
      <line x1="0" y1="185" x2="800" y2="185" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-axis)"/>
      <text class="mono-txt" x="800" y="200" text-anchor="end" fill="#475569">Time t (ms) →</text>

      <!-- Vertical event lines -->
      <line x1="120" y1="15" x2="120" y2="185" stroke="#A51C30" stroke-width="1" stroke-dasharray="3,2"/>
      <text class="mono-txt" x="120" y="200" text-anchor="middle" font-weight="700" fill="#A51C30">50 ms</text>

      <line x1="210" y1="15" x2="210" y2="185" stroke="#B87333" stroke-width="1" stroke-dasharray="3,2"/>
      <text class="mono-txt" x="210" y="200" text-anchor="middle" font-weight="700" fill="#B87333">85 ms</text>

      <line x1="460" y1="15" x2="460" y2="185" stroke="#059669" stroke-width="1" stroke-dasharray="3,2"/>
      <text class="mono-txt" x="460" y="200" text-anchor="middle" font-weight="700" fill="#059669">185 ms</text>
    </g>
  </g>

  <!-- ================= BOTTOM: STOPPING DISTANCE PHYSICAL MARGIN ================= -->
  <g transform="translate(20, 355)">
    <rect width="900" height="125" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
    <rect x="0" y="0" width="900" height="24" rx="6" fill="#059669"/>
    <rect x="0" y="18" width="900" height="6" fill="#059669"/>
    <text class="badge-txt" x="12" y="16" fill="#FFFFFF">✓ PHYSICAL VERIFICATION: BOUNDED STOPPING MARGIN PROOF</text>

    <g transform="translate(16, 34)">
      <!-- Metric Bar Comparison -->
      <g transform="translate(0, 0)">
        <g transform="translate(0, 0)">
          <rect width="320" height="34" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
          <text class="mono-txt" x="10" y="16" fill="#059669" font-weight="700">Measured Stopping Distance:</text>
          <text class="mono-txt" x="10" y="28" fill="#1E293B">d_stop = 5.2 cm (Reaction: 1.6cm + Braking: 3.6cm)</text>
        </g>

        <g transform="translate(340, 0)">
          <rect width="260" height="34" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
          <text class="mono-txt" x="10" y="16" fill="#475569">Obstacle Clearance Envelope:</text>
          <text class="mono-txt" x="10" y="28" fill="#1E293B">d_clearance = 12.0 cm</text>
        </g>

        <g transform="translate(620, 0)">
          <rect width="245" height="34" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
          <text class="badge-txt" x="10" y="15" fill="#059669">VERIFIED SAFETY MARGIN:</text>
          <text class="mono-txt" x="10" y="28" font-weight="700" fill="#059669">+6.8 cm (Zero Contact!)</text>
        </g>
      </g>

      <text class="body-txt" x="0" y="55" fill="#334155">
        Conclusion: Even under total MPU hardware failure, the Reflex Brain brings the robot to a complete rest within physical clearance envelopes.
      </text>
    </g>
  </g>
</svg>
