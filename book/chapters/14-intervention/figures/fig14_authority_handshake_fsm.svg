<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" width="100%" height="100%">

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; font-size: 15px; fill: #1F407A; text-anchor: middle; letter-spacing: 0.5px; }
      .subtitle { font-size: 11px; fill: #64748B; text-anchor: middle; }
      .section-hdr { font-weight: 700; font-size: 13px; fill: #1F407A; letter-spacing: 0.3px; }
      .card-title { font-weight: 700; font-size: 11.5px; }
      .body-text { font-size: 10px; fill: #475569; }
      .bold-text { font-weight: 600; font-size: 10px; fill: #1A202C; }
      .small-text { font-size: 9px; fill: #64748B; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 9px; fill: #1F407A; font-weight: 600; }
      .badge-text { font-weight: 700; font-size: 9px; text-anchor: middle; }
    </style>


    <defs>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#215CAF"/>
      </marker>
      <marker id="arr-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
      </marker>
      <marker id="arr-petrol" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
      </marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
      </marker>
      <marker id="arr-bronze" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
      </marker>
      <marker id="arr-crimson" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
      </marker>
      <marker id="arr-coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
      </marker>
      <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5B4B8A"/>
      </marker>
      <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
      </marker>
      <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
      </filter>
    </defs>

<rect width="920" height="510" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="460.0" y="28" class="title">THE FOUR-PHASE AUTHORITY HANDSHAKE PROTOCOL &amp; DISCRETE STATE ARBITER</text>
<text x="460.0" y="44" class="subtitle">Deterministic 1 kHz Nervous-System Handshake: Autonomous Propose ⟶ Hardware Intercept ⟶ Operator Acknowledge ⟶ Bumpless Ramp ⟶ Active Authority</text>
<rect x="25" y="62" width="870" height="122" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
<text x="40" y="78" font-size="9.5" font-weight="700" fill="#1F407A" letter-spacing="0.4px">FOUR-PHASE AUTHORITY HANDSHAKE PIPELINE (1 kHz SYNCHRONOUS BUS)</text>
<rect x="35" y="86" width="196" height="86" rx="6" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="35" y="86" width="196" height="20" rx="6" fill="#215CAF" fill-opacity="0.12"/>
<text x="45" y="100" font-size="8.5" font-weight="700" fill="#215CAF">PHASE 1 · REQUEST</text>
<text x="45" y="119" font-size="9" font-weight="700" fill="#1A202C">Initiation Trigger</text>
<text x="45" y="133" font-size="7.5" fill="#475569">• Operator torque |τ| &gt; 4.0 N·m</text>
<text x="45" y="145" font-size="7.5" fill="#475569">• or Policy ODD departure</text>
<text x="45" y="157" font-size="7.5" fill="#475569">• u_prop flagged with lease intent</text>
<line x1="233" y1="129.0" x2="249" y2="129.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-slate)"/>
<rect x="252" y="86" width="196" height="86" rx="6" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="252" y="86" width="196" height="20" rx="6" fill="#5B4B8A" fill-opacity="0.12"/>
<text x="262" y="100" font-size="8.5" font-weight="700" fill="#5B4B8A">PHASE 2 · INTERCEPT &amp; AUTH</text>
<text x="262" y="119" font-size="9" font-weight="700" fill="#1A202C">Hardware Verification</text>
<text x="262" y="133" font-size="7.5" fill="#475569">• 1 kHz MCU intercepts token</text>
<text x="262" y="145" font-size="7.5" fill="#475569">• HMAC-SHA256 &amp; Nonce valid</text>
<text x="262" y="157" font-size="7.5" fill="#475569">• Freshness: Δt_transit &amp;le; 100 ms</text>
<line x1="450" y1="129.0" x2="466" y2="129.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-slate)"/>
<rect x="470" y="86" width="196" height="86" rx="6" fill="#FFFFFF" stroke="#B87333" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="470" y="86" width="196" height="20" rx="6" fill="#B87333" fill-opacity="0.12"/>
<text x="480" y="100" font-size="8.5" font-weight="700" fill="#B87333">PHASE 3 · COMMIT &amp; BLEND</text>
<text x="480" y="119" font-size="9" font-weight="700" fill="#1A202C">Bumpless Ramp</text>
<text x="480" y="133" font-size="7.5" fill="#475569">• Atomic swap at 1 ms tick</text>
<text x="480" y="145" font-size="7.5" fill="#475569">• C¹ blend: α(t) over τ_blend</text>
<text x="480" y="157" font-size="7.5" fill="#475569">• Integrators pre-biased to x(t)</text>
<line x1="668" y1="129.0" x2="684" y2="129.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-slate)"/>
<rect x="688" y="86" width="196" height="86" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="688" y="86" width="196" height="20" rx="6" fill="#10B981" fill-opacity="0.12"/>
<text x="698" y="100" font-size="8.5" font-weight="700" fill="#10B981">PHASE 4 · CONFIRM &amp; ACTIVE</text>
<text x="698" y="119" font-size="9" font-weight="700" fill="#1A202C">Active Authority</text>
<text x="698" y="133" font-size="7.5" fill="#475569">• Haptic confirmation feedback</text>
<text x="698" y="145" font-size="7.5" fill="#475569">• Human in command (α = 1.0)</text>
<text x="698" y="157" font-size="7.5" fill="#475569">• Active lease (T_lease &amp;le; 100 ms)</text>
<rect x="25" y="196" width="550" height="298" rx="8" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="25" y="196" width="550" height="24" rx="8" fill="#1F407A" fill-opacity="0.10"/>
<text x="39" y="212" font-size="9.5" font-weight="700" fill="#1F407A">DISCRETE AUTHORITY STATE MACHINE (S_t &amp;isin; &#123;Auto, Pending, Blend, Manual, Fallback&#125;)</text>
<rect x="39" y="232" width="158" height="88" rx="6" fill="#215CAF" fill-opacity="0.04" stroke="#215CAF" stroke-width="1.2"/>
<rect x="39" y="232" width="158" height="18" rx="6" fill="#215CAF" fill-opacity="0.15"/>
<text x="47" y="245" font-size="8.5" font-weight="700" fill="#215CAF">S_auto · AUTONOMOUS</text>
<text x="47" y="262" font-size="8" font-weight="600" fill="#1A202C">Authority: Policy (α = 0.0)</text>
<text x="47" y="276" font-size="7.5" fill="#475569">• High-level action chunks</text>
<text x="47" y="290" font-size="7.5" fill="#475569">• 1 kHz Enforcer bounds</text>
<text x="47" y="304" font-size="7.5" fill="#475569">• Background state tracking</text>
<rect x="221" y="232" width="158" height="88" rx="6" fill="#D97706" fill-opacity="0.05" stroke="#D97706" stroke-width="1.2"/>
<rect x="221" y="232" width="158" height="18" rx="6" fill="#D97706" fill-opacity="0.15"/>
<text x="229" y="245" font-size="8.5" font-weight="700" fill="#D97706">S_pending · PENDING</text>
<text x="229" y="262" font-size="8" font-weight="600" fill="#1A202C">Authority: Frozen / Check</text>
<text x="229" y="276" font-size="7.5" fill="#475569">• Handshake timer armed</text>
<text x="229" y="290" font-size="7.5" fill="#475569">• Token &amp; nonce validation</text>
<text x="229" y="304" font-size="7.5" fill="#DC2626">• Guard: t &amp;le; T_timeout (500ms)</text>
<rect x="403" y="232" width="158" height="88" rx="6" fill="#B87333" fill-opacity="0.05" stroke="#B87333" stroke-width="1.2"/>
<rect x="403" y="232" width="158" height="18" rx="6" fill="#B87333" fill-opacity="0.15"/>
<text x="411" y="245" font-size="8.5" font-weight="700" fill="#B87333">S_blend · BUMPLESS RAMP</text>
<text x="411" y="262" font-size="8" font-weight="600" fill="#1A202C">Authority: Dynamic Blend</text>
<text x="411" y="276" font-size="7.5" fill="#475569">• C¹ cubic schedule α(t)</text>
<text x="411" y="290" font-size="7.5" fill="#475569">• Window τ_blend &amp;ge; 1.5|Δu|/j_max</text>
<text x="411" y="304" font-size="7.5" fill="#475569">• Jerk bounded: j &amp;le; j_allowable</text>
<rect x="39" y="381" width="230" height="96" rx="6" fill="#DC2626" fill-opacity="0.05" stroke="#DC2626" stroke-width="1.3"/>
<rect x="39" y="381" width="230" height="18" rx="6" fill="#DC2626" fill-opacity="0.15"/>
<text x="47" y="394" font-size="8.5" font-weight="700" fill="#DC2626">S_fallback · DEGRADED FALLBACK</text>
<text x="47" y="411" font-size="8" font-weight="600" fill="#1A202C">Category 1 Controlled Deceleration</text>
<text x="47" y="425" font-size="7.5" fill="#475569">• Deterministic braking: a_brake = μ·g (6.87 m/s²)</text>
<text x="47" y="439" font-size="7.5" fill="#475569">• Monotonic lock: No upward transitions during motion</text>
<text x="47" y="453" font-size="7.5" fill="#475569">• Forensic buffer freeze: 10s pre/post trigger window</text>
<text x="47" y="467" font-size="7.5" fill="#10B981">• Exit: Zero velocity (v = 0) + Signed Re-init</text>
<rect x="331" y="381" width="230" height="96" rx="6" fill="#10B981" fill-opacity="0.05" stroke="#10B981" stroke-width="1.3"/>
<rect x="331" y="381" width="230" height="18" rx="6" fill="#10B981" fill-opacity="0.15"/>
<text x="339" y="394" font-size="8.5" font-weight="700" fill="#10B981">S_manual · ACTIVE HUMAN MANUAL</text>
<text x="339" y="411" font-size="8" font-weight="600" fill="#1A202C">Authority: Human Operator (α = 1.0)</text>
<text x="339" y="425" font-size="7.5" fill="#475569">• Direct steering / torque dispatch</text>
<text x="339" y="439" font-size="7.5" fill="#475569">• Continuous deadman lease (T_lease &amp;le; 100 ms)</text>
<text x="339" y="453" font-size="7.5" fill="#007A87">• Subordinate to Tier-1 Safety Barrier h(x) &amp;ge; 0</text>
<text x="339" y="467" font-size="7.5" fill="#64748B">• Shadow logging of background policy inferences</text>
<line x1="197" y1="262" x2="221" y2="262" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-bronze)"/>
<text x="209.0" y="256" font-size="7" font-weight="700" fill="#D97706" text-anchor="middle">Override Trigger</text>
<line x1="379" y1="262" x2="403" y2="262" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-bronze)"/>
<text x="391.0" y="256" font-size="7" font-weight="700" fill="#B87333" text-anchor="middle">Auth Verified</text>
<line x1="482.0" y1="320" x2="496.0" y2="381" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-teal)"/>
<text x="497.0" y="361" font-size="7" font-weight="700" fill="#10B981">Ramp Complete (α = 1.0)</text>
<line x1="300.0" y1="320" x2="184.0" y2="381" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-coral)"/>
<rect x="201" y="336" width="140" height="15" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.8"/>
<text x="271" y="347" font-size="7" font-weight="700" fill="#DC2626" text-anchor="middle">Timeout t &gt; T_timeout (500 ms)</text>
<line x1="331" y1="421" x2="269" y2="421" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-coral)"/>
<text x="300.0" y="415" font-size="7" font-weight="700" fill="#DC2626" text-anchor="middle">Lease Expired / Touch Loss (&gt;100 ms)</text>
<path d="M 79 381 C 79 345, 79 345, 79 320" fill="none" stroke="#215CAF" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<text x="79" y="340" font-size="7" font-weight="700" fill="#215CAF" text-anchor="middle">v = 0 &amp; Reset</text>
<rect x="588" y="196" width="307" height="298" rx="8" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="588" y="196" width="307" height="24" rx="8" fill="#5B4B8A" fill-opacity="0.10"/>
<text x="602" y="212" font-size="9.5" font-weight="700" fill="#5B4B8A">3-TIER ARBITRATION &amp; EVIDENCE AUDIT</text>
<rect x="598" y="228" width="287" height="48" rx="5" fill="#007A87" fill-opacity="0.05" stroke="#007A87" stroke-width="1"/>
<rect x="598" y="228" width="4" height="48" rx="2" fill="#007A87"/>
<text x="608" y="241" font-size="8" font-weight="700" fill="#007A87">TIER 1 · ABSOLUTE VETO (MCU REFLEX)</text>
<text x="608" y="254" font-size="7.5" font-weight="600" fill="#1A202C">1000 Hz Hard Real-Time Enforcer</text>
<text x="608" y="267" font-size="7" fill="#475569">CBF Invariant: h(x) &amp;ge; 0 · Over-current trip</text>
<rect x="598" y="282" width="287" height="48" rx="5" fill="#10B981" fill-opacity="0.05" stroke="#10B981" stroke-width="1"/>
<rect x="598" y="282" width="4" height="48" rx="2" fill="#10B981"/>
<text x="608" y="295" font-size="8" font-weight="700" fill="#10B981">TIER 2 · SUPERVISORY OVERRIDE</text>
<text x="608" y="308" font-size="7.5" font-weight="600" fill="#1A202C">Authenticated Human Input (α = 1.0)</text>
<text x="608" y="321" font-size="7" fill="#475569">Bounded deadman lease (T_lease &amp;le; 100 ms)</text>
<rect x="598" y="336" width="287" height="48" rx="5" fill="#215CAF" fill-opacity="0.05" stroke="#215CAF" stroke-width="1"/>
<rect x="598" y="336" width="4" height="48" rx="2" fill="#215CAF"/>
<text x="608" y="349" font-size="8" font-weight="700" fill="#215CAF">TIER 3 · PROPOSAL STREAM (STOCHASTIC)</text>
<text x="608" y="362" font-size="7.5" font-weight="600" fill="#1A202C">20–50 Hz Host MPU Action Chunks</text>
<text x="608" y="375" font-size="7" fill="#475569">Candidate action buffer u_prop (Diffusion / ACT)</text>
<rect x="598" y="394" width="287" height="82" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
<text x="608" y="409" font-size="8.5" font-weight="700" fill="#1A202C">64-BYTE FORENSIC EVIDENCE TUPLE</text>
<text x="608" y="422" font-size="7.5" font-family="monospace" fill="#1F407A">⟨t_PTP, S_auth, x_state, u_prop, u_enf, u_act, ID_op⟩</text>
<text x="608" y="436" font-size="7.2" fill="#475569">• IEEE 1588 PTP hardware timestamps (&lt;100 ns uncertainty)</text>
<text x="608" y="448" font-size="7.2" fill="#475569">• SHA-256 HMAC hash chaining into write-once ring buffer</text>
<text x="608" y="460" font-size="7.2" fill="#475569">• Deterministic logging: &lt;4 µs latency (zero dynamic malloc)</text>
</svg>
