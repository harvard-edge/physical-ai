<text x="837.5" y="186" font-size="10" font-weight="700" fill="#007A87" text-anchor="middle">THE NERVOUS SYSTEM: REFLEX ENFORCER</text>
<text x="712" y="210" font-size="11" font-weight="700" fill="#1A202C">Deterministic Invariant Filter (MCU)</text>
<text x="712" y="224" font-size="8.5" font-weight="600" fill="#007A87">Cadence: 1000 Hz · FreeRTOS / Cortex-M · Hard Real-Time</text>
<text x="712" y="244" font-size="8.5" fill="#475569">• Real-Time Active-Set QP Solver: h(x) ≥ 0 (Ch 12)</text>
<text x="712" y="261" font-size="8.5" fill="#475569">• Dynamic Stopping Clearance: d_stop(v) ≤ d_gap (Ch 2, 12)</text>
<text x="712" y="278" font-size="8.5" fill="#475569">• Lock-Free Inter-Core Mailbox &amp; Lease Check (Ch 4, 13)</text>
<text x="712" y="295" font-size="8.5" fill="#475569">• Shared Intervention &amp; C² Bumpless Takeover (Ch 14)</text>
<text x="712" y="312" font-size="8.5" fill="#475569">• Hardware Watchdog &amp; ISO 13849 Safety E-Stop (Ch 15, 16)</text>
<rect x="710" y="321" width="255" height="18" rx="4" fill="#007A87" fill-opacity="0.08"/>
<text x="837.5" y="334" font-size="8" font-weight="700" fill="#007A87" text-anchor="middle">PERMITS: Verified Real-Time Motor Commands u_t*</text>
<rect x="320" y="170" width="360" height="175" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4,3"/>
<rect x="320" y="170" width="360" height="24" rx="8" fill="#5B4B8A" fill-opacity="0.12"/>
<text x="500.0" y="186" font-size="9.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">THE PROPOSAL–PERMISSION CAUSAL INTERFACE</text>
<text x="500.0" y="208" font-size="10.5" font-weight="700" fill="#1A202C" text-anchor="middle">Hardware Architectural Separation (Ch 13, 17)</text>
<line x1="335" y1="220" x2="665" y2="220" stroke="#CBD5E1" stroke-width="1"/>
<text x="334" y="238" font-size="8.5" font-weight="700" fill="#5B4B8A">▸ Shared Memory TCM:</text>
<text x="334" y="250" font-size="8" fill="#475569">Zero-copy lock-free seqlock ring buffers</text>
<text x="334" y="262" font-size="8.5" font-weight="700" fill="#5B4B8A">▸ Dead-Man Leases:</text>
<text x="334" y="274" font-size="8" fill="#475569">Lease t_expire: halts if MPU stalls > 50 ms</text>
<text x="334" y="286" font-size="8.5" font-weight="700" fill="#5B4B8A">▸ Invariant Projection:</text>
<text x="334" y="298" font-size="8" fill="#475569">u_t* = argmin ||u - û||² s.t. L_f h + L_g h u + α(h) ≥ 0</text>
<text x="334" y="310" font-size="8.5" font-weight="700" fill="#5B4B8A">▸ Authority Priority:</text>
<text x="334" y="322" font-size="8" fill="#475569">Safety Reflex > Human Takeover > Learned Policy</text>
