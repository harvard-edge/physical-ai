<text x="162.5" y="186" font-size="10" font-weight="700" fill="#1F407A" text-anchor="middle">THE BRAIN: COGNITIVE DELIBERATION</text>
<text x="37" y="210" font-size="11" font-weight="700" fill="#1A202C">High-Capacity Stochastic Policy (MPU)</text>
<text x="37" y="224" font-size="8.5" font-weight="600" fill="#215CAF">Cadence: 20–50 Hz · Linux / NPU · Latency τ_infer</text>
<text x="37" y="244" font-size="8.5" fill="#475569">• VLM Semantic Goal Grounding (Ch 10)</text>
<text x="37" y="261" font-size="8.5" fill="#475569">• SE(3) Coordinate Frame Tree &amp; World Model (Ch 9)</text>
<text x="37" y="278" font-size="8.5" fill="#475569">• Diffusion / ACT Action Chunk Generation H=16 (Ch 11)</text>
<text x="37" y="295" font-size="8.5" fill="#475569">• Expiring Intent Lease Issuance t_expire (Ch 10)</text>
<text x="37" y="312" font-size="8.5" fill="#475569">• Epistemic Uncertainty &amp; Silent Distribution Shift (Ch 7, 17)</text>
<rect x="35" y="321" width="255" height="18" rx="4" fill="#1F407A" fill-opacity="0.08"/>
<text x="162.5" y="334" font-size="8" font-weight="700" fill="#1F407A" text-anchor="middle">EMITS: Candidate Action Trajectory Chunk û_t:t+H</text>
