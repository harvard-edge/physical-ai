<rect x="560" y="370" width="415" height="145" rx="8" fill="#A51C30" fill-opacity="0.04" stroke="#A51C30" stroke-width="1.3"/>
<rect x="560" y="370" width="415" height="24" rx="8" fill="#A51C30" fill-opacity="0.12"/>
<text x="767.5" y="386" font-size="10" font-weight="700" fill="#A51C30" text-anchor="middle">THE PHYSICAL PLANT &amp; NEWTONIAN ENVIRONMENT (W_t → W_t+1)</text>
<text x="574" y="410" font-size="10.5" font-weight="700" fill="#1A202C">Continuous Mechanics, Conservation Laws &amp; Irreversibility</text>
<text x="574" y="428" font-size="8.5" fill="#475569">• Inertial Momentum: Kinetic energy E_k = 1/2 m v² (No software rollback!)</text>
<text x="574" y="444" font-size="8.5" fill="#475569">• Tire/Surface Coulomb Friction Limits: F_friction ≤ μ N (Ch 2, 17)</text>
<text x="574" y="460" font-size="8.5" fill="#475569">• Non-Smooth Contact Dynamics: Painlevé paradoxes &amp; brittle yield (Ch 2)</text>
<text x="574" y="476" font-size="8.5" fill="#475569">• Actuator Dissipation: Thermal Joule heating P_loss = I²R, winding limits</text>
<text x="574" y="492" font-size="8.5" fill="#475569">• Physical State Update: W_t+1 = Dynamics(W_t, u_t*, External Disturbances)</text>
<line x1="837.5" y1="345" x2="837.5" y2="370" stroke="#A51C30" stroke-width="2" marker-end="url(#arr-crimson)"/>
<text x="845.5" y="363" font-size="8" font-weight="700" fill="#A51C30">Actuation Torques / PWM</text>
<rect x="25" y="370" width="515" height="145" rx="8" fill="#215CAF" fill-opacity="0.04" stroke="#215CAF" stroke-width="1.3"/>
<rect x="25" y="370" width="515" height="24" rx="8" fill="#215CAF" fill-opacity="0.12"/>
<text x="282.5" y="386" font-size="10" font-weight="700" fill="#215CAF" text-anchor="middle">SENSORY TRANSDUCTION &amp; INFORMATION-AGE PIPELINE</text>
<text x="39" y="410" font-size="10.5" font-weight="700" fill="#1A202C">Photons / Forces → Digital Bits (The Transduction Boundary)</text>
<text x="39" y="428" font-size="8.5" fill="#475569">• Transduction: MIPI CSI-2 CMOS, IMU gyros, optical wheel encoders (Ch 8)</text>
<text x="39" y="444" font-size="8.5" fill="#475569">• Zero-Copy Ingestion: DMA ring buffers, hardware PTP nanosecond timestamps</text>
<text x="39" y="460" font-size="8.5" fill="#475569">• Information Age Freshness: Total lag τ_total = τ_readout + τ_DMA + τ_infer + τ_act</text>
<text x="39" y="476" font-size="8.5" fill="#475569">• Spatial Displacement Lag: Unchecked motion during delay d_lag = v · τ_total (Ch 2, 17)</text>
<text x="39" y="492" font-size="8.5" fill="#475569">• Endogenous Feedback: Action u_t shifts robot pose, shaping future observations y_t+1</text>
<line x1="560" y1="442" x2="540" y2="442" stroke="#215CAF" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="552" y="436" font-size="8" font-weight="700" fill="#215CAF">Physical Ground Truth W_t</text>
<line x1="145" y1="370" x2="145" y2="345" stroke="#215CAF" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="151" y="361" font-size="8" font-weight="700" fill="#215CAF">Sensor Stream y_t (DMA)</text>
<path d="M 425 370 L 425 358 L 780 358 L 780 345" fill="none" stroke="#007A87" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-petrol)"/>
<text x="435" y="354" font-size="7.5" font-weight="600" fill="#007A87">1 kHz Fast Proprioceptive Odometry</text>
<rect x="25" y="530" width="950" height="74" rx="8" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.3"/>
<rect x="25" y="530" width="950" height="22" rx="8" fill="#DC2626" fill-opacity="0.12"/>
<text x="500.0" y="545" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="middle">CHAPTER 17 FRONTIER SYNTHESIS: THE BOUNDARY OF VERIFIABLE KNOWLEDGE</text>
<text x="35" y="568" font-size="9" font-weight="700" fill="#1A202C">1. Detectorless Blind Spots</text>
<text x="35" y="581" font-size="8" fill="#475569">States S_A &amp; S_B produce identical y(t) prior to</text>
<text x="35" y="593" font-size="8" fill="#475569">deadline t_deadline (e.g. internal voids, oil slicks).</text>
<text x="348.3333333333333" y="568" font-size="9" font-weight="700" fill="#1A202C">2. Astronomical Exposure Limits</text>
<text x="348.3333333333333" y="581" font-size="8" fill="#475569">Proving p ≤ 10⁻⁹/h takes n ≥ 3.0×10⁹ h (342k yrs).</text>
<text x="348.3333333333333" y="593" font-size="8" fill="#475569">Empirical sampling cannot certify open-world safety.</text>
<text x="661.6666666666666" y="568" font-size="9" font-weight="700" fill="#1A202C">3. Structural Containment Mandate</text>
<text x="661.6666666666666" y="581" font-size="8" fill="#475569">Where evidence ends, nervous system clamps authority</text>
<text x="661.6666666666666" y="593" font-size="8" fill="#475569">(v_clamp, torque limits) to render unknown harmless.</text>
