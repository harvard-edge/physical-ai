<rect width="980" height="460" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
<text x="490.0" y="28" class="title">THE DUAL EPISTEMIC BOUNDARIES: DETECTOR DEADLINES &amp; EXPOSURE WALLS</text>
<text x="490.0" y="44" class="subtitle">Why Empirical Testing Alone Cannot Settle Open-World Safety, Demanding Architectural Authority Limits and Closure Tests</text>
<rect x="27.5" y="66" width="295" height="370" rx="8" fill="#FFFFFF" stroke="#1F407A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="27.5" y="66" width="295" height="26" rx="8" fill="#1F407A" fill-opacity="0.12"/>
<text x="175.0" y="83" font-size="9.5" font-weight="700" fill="#1F407A" text-anchor="middle">1. OBSERVABILITY DEADLINE LIMIT</text>
<text x="39.5" y="110" font-size="10.5" font-weight="700" fill="#1A202C">Identical Pre-Harm Telemetry</text>
<text x="39.5" y="124" font-size="8.5" fill="#64748B">States S_A (Safe) vs S_B (Hazard) indistinguishable</text>
<rect x="39.5" y="136" width="271" height="150" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<line x1="57.5" y1="261" x2="298.5" y2="261" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
<text x="298.5" y="274" font-size="8" fill="#475569">Time t</text>
<line x1="57.5" y1="261" x2="57.5" y2="151" stroke="#475569" stroke-width="1.2"/>
<text x="61.5" y="158" font-size="8" fill="#475569">Telemetry y(t)</text>
<line x1="57.5" y1="186" x2="187.5" y2="186" stroke="#215CAF" stroke-width="2"/>
<text x="67.5" y="180" font-size="8" font-weight="700" fill="#215CAF">y_A(t) ≡ y_B(t) = y₀</text>
<line x1="142.5" y1="151" x2="142.5" y2="261" stroke="#D97706" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="142.5" y="148" font-size="7.5" font-weight="700" fill="#D97706" text-anchor="middle">t_deadline</text>
<line x1="187.5" y1="151" x2="187.5" y2="261" stroke="#A51C30" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="187.5" y="148" font-size="7.5" font-weight="700" fill="#A51C30" text-anchor="middle">t_harm (38 ms)</text>
<path d="M 187.5 186 Q 227.5 186 277.5 161" fill="none" stroke="#DC2626" stroke-width="2"/>
<text x="227.5" y="170" font-size="7.5" font-weight="700" fill="#DC2626">Fracture / Slip</text>
<rect x="57.5" y="244" width="180" height="14" rx="2" fill="#5B4B8A" fill-opacity="0.15" stroke="#5B4B8A" stroke-width="0.8"/>
<text x="147.5" y="254" font-size="7.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">Detection Latency τ_detect = 64 ms</text>
<text x="39.5" y="302" font-size="8.2" fill="#475569">• State S_A: Nominal surface (μ ≥ 0.60) / sound core</text>
<text x="39.5" y="319" font-size="8.2" fill="#475569">• State S_B: Oil slick (μ = 0.12) / internal void</text>
<text x="39.5" y="336" font-size="8.2" fill="#475569">• Pre-Contact: Zero optical or tactile signature</text>
<text x="39.5" y="353" font-size="8.2" fill="#475569">• τ_detect > t_harm: Contact fracture occurs before reflex can decelerate jaw (38 ms &lt; 64 ms)</text>
<text x="39.5" y="370" font-size="8.2" fill="#475569">• Theorem: When y_A(t) ≡ y_B(t) ∀ t ≤ t_deadline, safe intervention cannot exceed unconditioned prior.</text>
<rect x="342.5" y="66" width="295" height="370" rx="8" fill="#FFFFFF" stroke="#215CAF" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="342.5" y="66" width="295" height="26" rx="8" fill="#215CAF" fill-opacity="0.12"/>
<text x="490.0" y="83" font-size="9.5" font-weight="700" fill="#215CAF" text-anchor="middle">2. ASTRONOMICAL EXPOSURE WALL</text>
<text x="354.5" y="110" font-size="10.5" font-weight="700" fill="#1A202C">n ≥ ln(1/α) / p at 95% Confidence</text>
<text x="354.5" y="124" font-size="8.5" fill="#64748B">Required failure-free hours grows reciprocally with 1/p</text>
<rect x="354.5" y="136" width="271" height="42" rx="4" fill="#10B981" fill-opacity="0.06" stroke="#10B981" stroke-width="1"/>
<text x="362.5" y="152" font-size="9" font-weight="700" fill="#10B981">p ≤ 10⁻²/h (Consumer App)</text>
<text x="613.5" y="152" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="end">n ≥ 300 h</text>
<text x="362.5" y="168" font-size="8" fill="#64748B">Time: 12.5 days</text>
<text x="613.5" y="168" font-size="8" font-weight="600" fill="#10B981" text-anchor="end">Tractable (Unit Test)</text>
<rect x="354.5" y="184" width="271" height="42" rx="4" fill="#215CAF" fill-opacity="0.06" stroke="#215CAF" stroke-width="1"/>
<text x="362.5" y="200" font-size="9" font-weight="700" fill="#215CAF">p ≤ 10⁻⁴/h (Industrial Cobot)</text>
<text x="613.5" y="200" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="end">n ≥ 3.0×10⁴ h</text>
<text x="362.5" y="216" font-size="8" fill="#64748B">Time: 3.4 years</text>
<text x="613.5" y="216" font-size="8" font-weight="600" fill="#215CAF" text-anchor="end">Affordable (Bench Rig)</text>
<rect x="354.5" y="232" width="271" height="42" rx="4" fill="#B87333" fill-opacity="0.06" stroke="#B87333" stroke-width="1"/>
<text x="362.5" y="248" font-size="9" font-weight="700" fill="#B87333">p ≤ 10⁻⁶/h (Autonomous Transit)</text>
<text x="613.5" y="248" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="end">n ≥ 3.0×10⁶ h</text>
<text x="362.5" y="264" font-size="8" fill="#64748B">Time: 342 years</text>
<text x="613.5" y="264" font-size="8" font-weight="600" fill="#B87333" text-anchor="end">Fleet Limit (Correlated)</text>
<rect x="354.5" y="280" width="271" height="42" rx="4" fill="#A51C30" fill-opacity="0.06" stroke="#A51C30" stroke-width="1"/>
<text x="362.5" y="296" font-size="9" font-weight="700" fill="#A51C30">p ≤ 10⁻⁹/h (SIL-4 / ASIL-D)</text>
<text x="613.5" y="296" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="end">n ≥ 3.0×10⁹ h</text>
<text x="362.5" y="312" font-size="8" fill="#64748B">Time: 342,000 yrs</text>
<text x="613.5" y="312" font-size="8" font-weight="600" fill="#A51C30" text-anchor="end">LOGICALLY INSUFFICIENT</text>
<rect x="354.5" y="336" width="271" height="76" rx="5" fill="#A51C30" fill-opacity="0.08" stroke="#A51C30" stroke-width="1.2"/>
<text x="490.0" y="354" font-size="8.5" font-weight="700" fill="#A51C30" text-anchor="middle">WHY FLEET SAMPLING FAILS AT THE TAIL:</text>
<text x="362.5" y="369" font-size="7.5" fill="#475569">1. Correlated updates &amp; identical software reset trial clock</text>
<text x="362.5" y="381" font-size="7.5" fill="#475569">2. Safety drivers censor crashes → missing counterfactuals</text>
<text x="362.5" y="393" font-size="7.5" fill="#475569">3. Simulators test only pre-programmed physics disturbances</text>
<text x="362.5" y="405" font-size="7.5" fill="#475569">4. Conclusion: Ultra-reliability demands structural containment!</text>
<rect x="657.5" y="66" width="295" height="370" rx="8" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="657.5" y="66" width="295" height="26" rx="8" fill="#5B4B8A" fill-opacity="0.12"/>
<text x="805.0" y="83" font-size="9.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">3. RESIDUAL-CLAIMS REGISTER</text>
<text x="669.5" y="110" font-size="10.5" font-weight="700" fill="#1A202C">Converting Caveats to Engineering Work</text>
<text x="669.5" y="124" font-size="8.5" fill="#64748B">4 Mandatory Fields for Every Open Assumption</text>
<rect x="669.5" y="136" width="271" height="50" rx="4" fill="#F8FAFC" stroke="#1F407A" stroke-width="1"/>
<text x="677.5" y="150" font-size="8.5" font-weight="700" fill="#1F407A">FIELD 1: UNSUPPORTED CLAIM</text>
<text x="677.5" y="163" font-size="7.5" fill="#475569">e.g. Brake distance ≤ 0.49 m on concrete</text>
<text x="677.5" y="175" font-size="7.5" fill="#475569">Missing Observable: Surface friction μ &lt; 0.15</text>
<rect x="669.5" y="192" width="271" height="50" rx="4" fill="#F8FAFC" stroke="#A51C30" stroke-width="1"/>
<text x="677.5" y="206" font-size="8.5" font-weight="700" fill="#A51C30">FIELD 2: OPERATIONAL CONTAINMENT</text>
<text x="677.5" y="219" font-size="7.5" fill="#475569">Structural velocity clamp v ≤ 0.9 m/s</text>
<text x="677.5" y="231" font-size="7.5" fill="#475569">Kinetic energy Ek reduced 83% (1089 J → 182 J)</text>
<rect x="669.5" y="248" width="271" height="50" rx="4" fill="#F8FAFC" stroke="#5B4B8A" stroke-width="1"/>
<text x="677.5" y="262" font-size="8.5" font-weight="700" fill="#5B4B8A">FIELD 3: ACCOUNTABLE OWNER</text>
<text x="677.5" y="275" font-size="7.5" fill="#475569">Named Lead Drivetrain Engineer owns parameter lock;</text>
<text x="677.5" y="287" font-size="7.5" fill="#475569">Accepts operational throughput penalty</text>
<rect x="669.5" y="304" width="271" height="50" rx="4" fill="#F8FAFC" stroke="#007A87" stroke-width="1"/>
<text x="677.5" y="318" font-size="8.5" font-weight="700" fill="#007A87">FIELD 4: FALSIFIABLE CLOSURE TEST</text>
<text x="677.5" y="331" font-size="7.5" fill="#475569">Integrate polarimetric sensor + 1 kHz slip reflex;</text>
<text x="677.5" y="343" font-size="7.5" fill="#475569">Validated across N=1000 wet floor trials</text>
<rect x="669.5" y="368" width="271" height="44" rx="4" fill="#5B4B8A" fill-opacity="0.08" stroke="#5B4B8A" stroke-width="1.1"/>
<text x="805.0" y="383" font-size="8.5" font-weight="700" fill="#5B4B8A" text-anchor="middle">FALSIFICATION &amp; VERDICT GATE</text>
<text x="805.0" y="396" font-size="7.5" fill="#DC2626" text-anchor="middle">Relocated Assumption? → REJECT</text>
<text x="805.0" y="407" font-size="7.5" fill="#10B981" text-anchor="middle">Independent Evidence? → RETIRE GAP &amp; LIFT CLAMP</text>
</svg>
