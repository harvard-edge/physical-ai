<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748B; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #334155; line-height: 1.4; }
      .mono-txt { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 9.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; }
    </style>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1F407A"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" fill="#FFFFFF" rx="8"/>

  <!-- Header -->
  <text class="title" x="20" y="28">END-TO-END DUAL-BRAIN AGENT ARCHITECTURE ON ARDUINO UNO Q / PHYSICAL AI KIT</text>
  <text class="subtitle" x="20" y="46">Hardware co-design: Linux MPU (Host Brain) proposal cortex and bare-metal MCU (Reflex Brain) safety reflex over shared SRAM</text>

  <!-- ================= TOP: DUAL-BRAIN SILICON INTEGRATION ================= -->
  <g transform="translate(20, 60)">
    
    <!-- LEFT: HOST BRAIN (LINUX MPU) -->
    <g transform="translate(0, 0)">
      <rect width="400" height="300" rx="6" fill="#FDF8F0" stroke="#B87333" stroke-width="1.3"/>
      <rect x="0" y="0" width="400" height="26" rx="6" fill="#B87333"/>
      <rect x="0" y="20" width="400" height="6" fill="#B87333"/>
      <text class="tag-txt" x="12" y="17" fill="#FFFFFF">HOST BRAIN: LINUX MPU / NPU (UNTRUSTED PROPOSAL CORTEX)</text>

      <g transform="translate(14, 36)">
        <!-- Organ 1: Perception -->
        <rect width="372" height="42" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#B87333">STAGE 1 &amp; 2: PERCEPTION (30–60 Hz)</text>
        <text class="body-txt" x="8" y="30" fill="#1E293B">Zero-Copy DMABUF Ring Buffer → ViT/DINOv2 SE(3) Affordance Tokens</text>

        <!-- Organ 2: World Model & Intent -->
        <rect y="48" width="372" height="42" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#B87333">STAGE 3 &amp; 4: COGNITION &amp; INTENT (1–2 Hz)</text>
        <text class="body-txt" x="8" y="30" fill="#1E293B">Latent RSSM World Model + VLM Expiring Intent Leases (L_intent)</text>

        <!-- Organ 3: Action Chunking -->
        <rect y="96" width="372" height="42" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#B87333">STAGE 5: TRAJECTORY PLANNER (20–50 Hz)</text>
        <text class="body-txt" x="8" y="30" fill="#1E293B">Diffusion Policy / ACT H=16 Action Chunks with C^2 Jerk Continuity</text>

        <!-- Tail Jitter Note -->
        <rect y="145" width="372" height="40" rx="3" fill="#FEE2E2" stroke="#A51C30" stroke-width="1"/>
        <text class="badge-txt" x="8" y="15" fill="#A51C30">OPERATIONAL PROFILE:</text>
        <text class="body-txt" x="8" y="28" fill="#A51C30">Tail Latency: P99 = 45 ms (Subject to GC pauses and thermal throttle)</text>

        <text class="body-txt" x="0" y="205">
          • Emits expiring candidate intent leases to shared SRAM mailbox.
        </text>
      </g>
    </g>

    <!-- CENTER: SHARED SRAM & HARDWARE MAILBOX -->
    <g transform="translate(410, 0)">
      <rect width="80" height="300" rx="6" fill="#1E293B"/>
      <text class="badge-txt" x="40" y="20" text-anchor="middle" fill="#38BDF8">TCM</text>
      <text class="mono-txt" x="40" y="35" text-anchor="middle" fill="#94A3B8">SRAM</text>

      <g transform="translate(8, 50)">
        <rect width="64" height="40" rx="3" fill="#334155"/>
        <text class="mono-txt" x="32" y="18" text-anchor="middle" fill="#FCD34D">Intent</text>
        <text class="tag-txt" x="32" y="30" text-anchor="middle" fill="#94A3B8">Lease</text>

        <rect y="48" width="64" height="40" rx="3" fill="#334155"/>
        <text class="mono-txt" x="32" y="18" text-anchor="middle" fill="#38BDF8">Action</text>
        <text class="tag-txt" x="32" y="30" text-anchor="middle" fill="#94A3B8">Chunks</text>

        <rect y="96" width="64" height="40" rx="3" fill="#334155"/>
        <text class="mono-txt" x="32" y="18" text-anchor="middle" fill="#FCA5A5">Veto</text>
        <text class="tag-txt" x="32" y="30" text-anchor="middle" fill="#94A3B8">Flag</text>

        <rect y="144" width="64" height="40" rx="3" fill="#334155"/>
        <text class="mono-txt" x="32" y="18" text-anchor="middle" fill="#4ADE80">Actual</text>
        <text class="tag-txt" x="32" y="30" text-anchor="middle" fill="#94A3B8">State</text>
      </g>
    </g>

    <!-- RIGHT: REFLEX BRAIN (REAL-TIME MCU) -->
    <g transform="translate(500, 0)">
      <rect width="400" height="300" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.4"/>
      <rect x="0" y="0" width="400" height="26" rx="6" fill="#059669"/>
      <rect x="0" y="20" width="400" height="6" fill="#059669"/>
      <text class="tag-txt" x="12" y="17" fill="#FFFFFF">REFLEX BRAIN: DETERMINISTIC REAL-TIME MCU (SAFETY REFLEX)</text>

      <g transform="translate(14, 36)">
        <!-- Organ 1: CBF Enforcer -->
        <rect width="372" height="42" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#059669">STAGE 6: CONTROL BARRIER ENFORCER (1000 Hz)</text>
        <text class="body-txt" x="8" y="30" fill="#1E293B">Closed-Form QP Minimal Projection in 65 μs (h(x) ≥ 0, d_stop ≤ d_clear)</text>

        <!-- Organ 2: Hardware Interlock -->
        <rect y="48" width="372" height="42" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#059669">HARDWARE WATCHDOG &amp; LEASE MONITOR</text>
        <text class="body-txt" x="8" y="30" fill="#1E293B">50 ms Watchdog Countdown + IEC 60204-1 Cat 0/1/2 Fallback Hierarchy</text>

        <!-- Organ 3: Motor PWM -->
        <rect y="96" width="372" height="42" rx="4" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
        <text class="badge-txt" x="8" y="16" fill="#059669">PHYSICAL MOTOR GATE DRIVER (SOLE AUTHORITY)</text>
        <text class="body-txt" x="8" y="30" fill="#1E293B">Direct Timed PWM Phase Current Generation (Zero Dynamic Memory)</text>

        <!-- Deterministic Timing Profile -->
        <rect y="145" width="372" height="40" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
        <text class="badge-txt" x="8" y="15" fill="#059669">OPERATIONAL PROFILE:</text>
        <text class="body-txt" x="8" y="28" fill="#059669">Execution: 175 μs | Slack: 825 μs | Zero Jitter Guarantee</text>

        <text class="body-txt" x="0" y="205">
          • Holds exclusive physical gate driver PWM authority.
        </text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: INTEGRATION SUMMARY ================= -->
  <g transform="translate(20, 380)">
    <rect width="900" height="100" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="badge-txt" x="16" y="20" fill="#1E293B">THE ARDUINO UNO Q DUAL-BRAIN ARCHITECTURAL CONTRACT</text>

    <g transform="translate(16, 32)">
      <text class="body-txt" x="0" y="12">
        <tspan x="0" dy="0">1. <tspan font-weight="700">Proposal Privilege Separation:</tspan> The Linux MPU runs high-capacity AI models as untrusted proposal generators.</tspan>
        <tspan x="0" dy="16">2. <tspan font-weight="700">Deterministic Safety Invariants:</tspan> The Cortex-M4 MCU evaluates mathematical safety barriers at 1000 Hz, with zero OS or heap dependencies.</tspan>
        <tspan x="0" dy="16">3. <tspan font-weight="700">Panic Survivability:</tspan> Total Linux crash or NPU bus hang triggers unmaskable hardware fallback in &lt; 35 ms without physical injury.</tspan>
      </text>
    </g>
  </g>
</svg>
