<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiOS Operator View</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main class="app"><header class="stage"><div class="nameplate"><h1>MiOS Doctor</h1><div class="pill"><span class="dot"></span><span id="state">Loading…</span></div></div></header><section class="transcript" id="dashboard" aria-live="polite"></section></main><script>
async function refresh(){const responses=await Promise.all(['/api/doctor','/api/brain','/api/activity'].map(path=>fetch(path).then(r=>r.json())));const [d,b,a]=responses;document.getElementById('state').textContent=d.state;document.getElementById('dashboard').innerHTML='<h2>Checks</h2>'+d.checks.map(c=>`<p><strong>${c.id}</strong>: ${c.status} — ${c.observed}</p>`).join('')+`<h2>Brain summary</h2><p>${b.counts.entities} concepts, ${b.counts.claims} claims, redacted=${b.redacted}</p><h2>Recent activity</h2><p>${a.events.length} events</p>`}refresh();setInterval(refresh,5000);
</script></body></html>
