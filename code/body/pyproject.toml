[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-mini-playground"
version = "0.1.0"
description = "Kid-friendly skills library + MCP server for Reachy Mini."
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    "numpy",
    "mcp",
]

[project.scripts]
reachy-play = "reachy_playground.play:main"
reachy-mcp = "reachy_playground.server:main"

[tool.setuptools]
packages = ["reachy_playground"]
