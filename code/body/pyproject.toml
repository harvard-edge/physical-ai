[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mayas-reachy"
version = "0.1.0"
description = "Robot-native Maya's Reachy app, skills library, and MCP server."
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    "numpy",
    "mcp",
    "piper-tts>=1.4,<2",
]

[project.scripts]
reachy-play = "reachy_playground.play:main"
reachy-mcp = "reachy_playground.server:main"
mayas-reachy = "reachy_playground.app:main"

[project.entry-points."reachy_mini_apps"]
mayas_reachy = "reachy_playground.app:MayasReachyApp"

[tool.setuptools]
packages = ["reachy_playground"]

[tool.setuptools.package-data]
reachy_playground = ["assets/*.wav", "static/*"]
