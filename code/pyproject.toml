[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mayas-reachy"
version = "0.1.0"
description = "Robot-native teach-and-talk app for Maya's Reachy Mini."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2,<3",
    "pydantic>=2,<3",
    "reachy-mini>=1.9,<2; sys_platform == 'linux'",
    "piper-tts>=1.4,<2; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
mayas-reachy = "mayas_reachy.app:main"

[project.entry-points."reachy_mini_apps"]
mayas_reachy = "mayas_reachy.app:MayasReachyApp"

[tool.setuptools.packages.find]
where = ["."]
include = ["mayas_reachy*"]

[tool.setuptools.package-data]
mayas_reachy = ["assets/*.wav", "static/*"]
