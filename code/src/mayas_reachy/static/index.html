<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maya's Reachy — Bring Me to Life</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="app">
    <header class="stage">
      <div class="float">
        <svg class="robot" id="robot" viewBox="0 0 200 190" role="img"
             aria-label="A little robot with two antennas">
          <g class="antenna antenna--l">
            <line x1="80" y1="60" x2="66" y2="20" />
            <circle cx="66" cy="18" r="8" />
          </g>
          <g class="antenna antenna--r">
            <line x1="120" y1="60" x2="134" y2="20" />
            <circle cx="134" cy="18" r="8" />
          </g>
          <g class="head">
            <rect class="face" x="48" y="52" width="104" height="98" rx="36" />
            <g class="eyes">
              <circle class="eye" cx="82" cy="104" r="9" />
              <circle class="eye" cx="118" cy="104" r="9" />
            </g>
            <g class="grille">
              <rect x="86" y="128" width="28" height="4" rx="2" />
            </g>
          </g>
        </svg>
      </div>

      <div class="nameplate">
        <h1>Maya's Reachy</h1>
        <div class="pill" id="pill" role="status">
          <span class="dot"></span><span id="pillText">Waking up…</span>
        </div>
      </div>
    </header>

    <section class="transcript" id="log" aria-live="polite">
      <div class="seed" id="seed">
        <p class="eyebrow">Teach your robot</p>
        <p class="seed__lead">What should its name be?</p>
        <p class="seed__hint">Type below, or tap the mic, speak naturally, and tap again to stop:</p>
        <button class="chip-example" id="example" type="button">Your name is Pixel.</button>
        <button class="first-words" id="greet" type="button">Hear its first words</button>
      </div>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <button class="mic" id="mic" type="button" aria-label="Tap to talk" title="Tap to talk">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z" />
          <path d="M6 11a6 6 0 0 0 12 0M12 17v3" fill="none" />
        </svg>
      </button>
      <label class="visually-hidden" for="text">Message for the robot</label>
      <input id="text" name="text" type="text" maxlength="500" enterkeyhint="send"
             placeholder="Teach your robot something…" />
      <button class="send" id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12h14M12 5l7 7-7 7" fill="none" />
        </svg>
      </button>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
