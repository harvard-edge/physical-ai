schema_name: physical_ai_context_packet
schema_version: 1.0.0

packet:
  packet_id: CTX-FND-001
  packet_version: 1.0.0
  status: accepted_for_research_and_architecture
  wave_id: WAVE-FND-001
  book_id: BOOK-PAI-001
  created_on: 2026-07-14
  supersedes: null
  applies_to: [CH01, CH02, CH03, CH04]

canonical_sources:
  authoritative:
    - docs/BOOK-GOAL.md
    - docs/CHAPTER-OUTLINES.md
    - docs/AUTHORING-SYSTEM.md
    - docs/PRODUCTION-PLAN.md
    - docs/TRACEABILITY.md
    - docs/DECISIONS.md
    - docs/WAVE-1-BRIEFS.md
  excluded_as_authority:
    - docs/CURRICULUM.md
    - docs/OUTCOMES.md
    - docs/OUTLINE.md
    - docs/STRUCTURE.md

book:
  title: "Physical AI: Machine Learning Systems That Sense and Act"
  promise: >
    Teach a reader to turn an unfamiliar learned capability into a continuously
    operating physical system whose requirements, measurements, interfaces,
    authority, failure behavior, evidence, changes, and release claims can be
    defended.
  foundation_wave_argument: >
    A consequential physical loop creates requirements. Requirements create
    measurable claims. Measured claims determine the runtime.
  terminal_test: >
    Transfer the method to a model family, embodiment, environment, and
    computing platform not used in the canonical case.
  readers:
    assumed:
      - ordinary inference pipelines
      - deployed software services
      - basic sensors and actuators
    not_assumed:
      - robotics coursework
      - control theory
      - embedded real-time systems
      - prescribed hardware
  scope:
    learned_component_premise: >
      A learned component materially influences the action path through a
      proposal or decision.
    consequential_physical_feedback_test: >
      An accepted action changes task-relevant physical state and can alter
      later observation or choice.
    delegated_physical_authority_test: >
      The system has permission to move matter, expend energy, alter access,
      change an environmental process, or directly affect a person.
    exclusions:
      - hardware presence alone
      - feedback alone
      - a fixed controller alone
      - a capable model alone
      - a compressed robotics curriculum
      - a model catalog
      - a hardware manual
      - a sequence of successful demonstrations
  invariants:
    model_as_component: true
    platform_neutral_core: true
    concepts_complete_before_lab: true
    proposal_distinct_from_allowed_action: true
    no_invented_measurements: true

reader_facing_contract:
  opening:
    required: true
    allowed_forms: [physical_scene, failure, contradiction, natural_question]
    question_callout_required: false
  objective:
    required: true
    form: callout-objective
    count: 1
    placement: before_first_h2
    inner_title_required: false
    requirements:
      - one observable performance
      - one compact paragraph
      - written directly to the reader
  sections:
    chapter_specific_titles: true
    editorial_field_names_forbidden: true
  decision:
    required: true
    form: callout-decision
    count: 1
    requirements:
      - concrete engineering choice
      - binding evidence or assumption
      - dossier update sentence
  transfer:
    required: true
    generic_heading_required: false
  lab:
    required: true
    form: callout-lab
    count: 1
    must_be_last_reader_facing_block: true
  reader_facing_content_after_lab: forbidden

editorial_metadata:
  reader_facing: false
  required_fields:
    - entering_learner_state
    - misconception
    - crux
    - owned_concepts
    - borrowed_concepts
    - deferred_concepts
    - incoming_dossier_state
    - outgoing_dossier_state
    - downstream_dependency
    - next_chapter_may_assume
    - acceptance_tests
  forbidden_manuscript_headings:
    - Learning Objective
    - Opening Question
    - Entering State
    - Misconception
    - Crux
    - Owned Concepts
    - Borrowed Concepts
    - Deferred Concepts
    - Engineering Decision
    - Dossier Delta
    - What This Chapter Adds
    - Transfer Task
    - Downstream Dependency
    - Acceptance Test

notation:
  TERM-WORLD-STATE-001:
    symbol: W_t
    meaning: physical world state at time t
  TERM-OBSERVATION-001:
    symbol: o_t
    meaning: timestamped observation of the world
  TERM-BELIEF-001:
    symbol: b_t
    meaning: maintained belief used for a decision
  TERM-PROPOSAL-001:
    symbol: p_t
    meaning: learned proposal and its validity conditions
  TERM-PERMISSION-001:
    symbol: permit
    meaning: >
      check that a proposal satisfies current limits and authority before it
      becomes an action; implementation details are deferred
  TERM-ALLOWED-ACTION-001:
    symbol: u_t
    meaning: allowed action issued to the physical system
  TERM-DISTURBANCE-001:
    symbol: d_t
    meaning: disturbance or unmodeled influence
  prohibition: >
    No text or figure may use p_t and u_t interchangeably.

canonical_case:
  case_id: CASE-SWH-001
  name: Shared-Workspace Handler
  status: accepted
  implementation_status: platform_neutral
  description: >
    A system observes objects and people in a defined tabletop workspace,
    interprets a requested handling or sorting task, proposes a physical action,
    checks the proposal against temporal, spatial, and authority constraints,
    performs an allowed action, and observes the changed workspace.
  baseline_task: >
    Move or sort one ordinary object between approved zones after a request.
  explicit_non_goals:
    - hazardous-object handling
    - unrestricted operation around people
    - claims of safety or deployment readiness
  actors:
    - requester
    - nearby_person
    - operator
    - maintainer
  learned_component:
    role: produce p_t
    compatible_examples: [classifier, VLM, VLA, learned_policy]
    forbidden_authority: direct_unrestricted_actuation
  authority: >
    A request or approval authorizes a defined class of tasks. A separate
    permission check determines whether an individual proposal may become
    allowed action u_t.
  disturbances:
    - person_enters_after_observation
    - object_moves_after_observation
    - action_completes_late
    - action_is_duplicated_or_out_of_order
    - service_restarts_while_physical_state_persists
  evidence_policy:
    measured_values_present: false
    rule: >
      Numeric values remain unspecified until derived in Chapter 2 and
      operationalized in Chapter 3.
  progressive_reveal:
    CH01: {case_version: 0.1, artifact_ref: LOOP-001}
    CH02: {case_version: 0.2, artifact_ref: REQ-001}
    CH03: {case_version: 0.3, artifact_ref: MEAS-001}
    CH04: {case_version: 0.4, artifact_ref: RUN-001}

fault_taxonomy:
  availability:
    examples: [missing, unavailable, disconnected, crashed]
    first_owner: CH04
  timing:
    examples: [late, stale, expired, deadline_missing]
    first_owner: CH02
  ordering:
    examples: [duplicated, replayed, dropped, out_of_order]
    first_owner: CH04
  integrity:
    examples: [corrupted, spoofed, tampered, wrong_version]
    first_owner: CH04
    later_owner: CH13
  semantics:
    examples: [incorrect, incompatible, out_of_distribution, misframed]
    first_owner: CH01
  authority:
    examples: [unapproved, revoked, excessive, cannot_interrupt]
    first_owner: CH01
    later_owner: CH11
  physical_recovery:
    examples: [software_state_disagrees_with_body_or_world]
    first_owner: CH04

foundation_trace_chain: [LOOP-001, REQ-001, MEAS-001, RUN-001]

chapter_contracts:
  CH01:
    objective_id: OBJ-CH01-01
    decision_id: DEC-CH01-01
    artifact_id: LOOP-001
    case_version_out: 0.1
    capability: frame
    objective_callout: >
      After this chapter, you will be able to determine whether an unfamiliar
      learned system closes a consequential physical loop, draw its causal and
      authority path, and defend the boundary that must be engineered.
    decision: >
      Decide whether the system belongs in scope and choose the causal and
      authority boundary.
  CH02:
    objective_id: OBJ-CH02-01
    decision_id: DEC-CH02-01
    artifact_id: REQ-001
    consumes: [LOOP-001]
    case_version_out: 0.2
    capability: specify
  CH03:
    objective_id: OBJ-CH03-01
    decision_id: DEC-CH03-01
    artifact_id: MEAS-001
    consumes: [LOOP-001, REQ-001]
    case_version_out: 0.3
    capability: measure
  CH04:
    objective_id: OBJ-CH04-01
    decision_id: DEC-CH04-01
    artifact_id: RUN-001
    consumes: [LOOP-001, REQ-001, MEAS-001]
    case_version_out: 0.4
    capability: architect

generation_permissions:
  research_calls: allowed
  pedagogy_calls: allowed
  representation_briefs: allowed
  architecture_calls: allowed
  manuscript_drafting:
    status: chapter_1_opening_cluster_allowed
    scope:
      - chapter_1_opening_cluster
    conditions:
      - use_accepted_contract_and_source_packet
      - draft_one_connected_cluster_per_call
      - build_provisional_representations_in_parallel
      - do_not_accept_full_chapter_until_render_and_red_team_reviews_pass
