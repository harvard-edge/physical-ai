version: 0.3.0
status: active_phase_1a_local_only
default_decision: deny
constitutional_authority: vijay_janapa_reddi

roles:
  - id: coordinator
    may_propose: [experiment, architecture, task]
    may_implement: false
    may_decisively_review: false
    may_authorize: []
  - id: implementation_engineer
    may_propose: [implementation]
    may_implement: true
    may_decisively_review: false
    may_authorize: []
  - id: safety_implementation_engineer
    may_propose: [physical_implementation, stronger_control]
    may_implement: true
    may_decisively_review: false
    may_authorize: []
  - id: verification_engineer
    may_propose: [test, evaluation]
    may_implement: false
    may_decisively_review: true
    may_authorize: []
  - id: safety_reviewer
    may_propose: [stronger_control]
    may_implement: false
    may_decisively_review: true
    may_authorize: []
  - id: release_manager
    may_propose: [release]
    may_implement: false
    may_decisively_review: false
    may_authorize: [simulation]
  - id: principal_investigator
    may_propose: [any]
    may_implement: false
    may_decisively_review: false
    may_authorize:
      - governance
      - external_publication
      - paid_service
      - child_data_egress
      - physical_canary
      - expanded_capability

change_classes:
  - id: synthetic_local
    risk: low
    path_globs: ["evolution/fixtures/**"]
    required_checks: [schema, public_tests, fixture_policy_tests]
    required_reviews: [verification_engineer]
    human_approval: false
    auto_merge: false
  - id: non_physical_runtime
    risk: medium
    path_globs:
      - "code/app/events.py"
      - "code/app/conversation.py"
      - "code/app/static/**"
      - "code/tests/**"
    required_checks: [unit, contract, privacy, replay, resources]
    required_reviews: [verification_engineer]
    human_approval: false
    auto_merge: false
  - id: data_boundary_runtime
    risk: critical
    path_globs:
      - "code/app/cloud.py"
      - "code/app/memory.py"
      - "governance/privacy-policy.yml"
    required_checks: [unit, contract, privacy, deletion, egress, restore]
    required_reviews: [verification_engineer, safety_reviewer]
    human_approval: true
    auto_merge: false
  - id: physical_runtime
    risk: critical
    path_globs:
      - "code/app/app.py"
      - "code/app/policies.py"
      - "code/app/voice.py"
      - "code/dev/robot.py"
      - "mios/safety/**"
      - "mios/embodiment/**"
    required_checks:
      - unit
      - contract
      - action_envelope
      - protective_stop
      - watchdog
      - simulation
      - target_resources
    required_reviews: [verification_engineer, safety_reviewer]
    implementation_role: safety_implementation_engineer
    human_approval: true
    auto_merge: false
  - id: protected_control_plane
    risk: critical
    path_globs:
      - "governance/**"
      - "evaluation/protected/**"
      - "orchestrator/assurance/**"
      - "orchestrator/deployment/**"
      - ".github/workflows/**"
    required_checks: [all_protected]
    required_reviews: [verification_engineer, safety_reviewer]
    human_approval: true
    auto_merge: false

effect_overrides:
  - effects: [data_collection, retention, deletion, authentication, authorization, external_egress]
    risk: critical
    human_approval: true
  - effects: [actuator_authority, sensor_authority, protective_stop, watchdog, safety_envelope]
    risk: critical
    human_approval: true
  - effects: [evaluation_source, threshold, denominator, budget, governance, release_workflow]
    risk: critical
    human_approval: true
  - effects: [dependency, lockfile, build_toolchain, artifact_signing]
    risk: high
    human_approval: true
  - effects: [unknown_or_ambiguous]
    risk: critical
    human_approval: true

classification_policy:
  path_and_effect_rules_both_apply: true
  highest_risk_wins: true
  classifier_cannot_approve_its_own_change: true
  ambiguity_behavior: pause

separation_rules:
  - proposer_cannot_be: [decisive_evaluator, authorizer]
  - implementer_cannot_be: [decisive_evaluator, authorizer]
  - coordinator_cannot_override: [failed_protected_check, missing_human_approval]
  - ai_review_cannot_authorize: [physical_safety, governance, privacy_egress]
  - clean_context_required_for: [decisive_evaluation]
  - different_model_family_required_for: [consequential_architecture]

external_effects:
  github_publication: human_approval
  paid_model_call: budget_and_provider_approval
  physical_deployment: human_approval
  new_data_destination: human_approval

escalations:
  - condition: protected_check_failed
    recipient: principal_investigator
    controller_state: paused
  - condition: budget_exhausted
    recipient: principal_investigator
    controller_state: paused
  - condition: reviewer_disagreement
    recipient: principal_investigator
    controller_state: paused
  - condition: privacy_or_safety_incident
    recipient: principal_investigator
    controller_state: incident
