reservation_mode: atomic
on_exhaustion: pause
increase_requires: principal_investigator_attestation

active_limits:
  money_usd: 0
  model_tokens: 0
  model_input_tokens: 0
  model_output_tokens: 0
  paid_provider_calls: 0
  wall_clock_hours: 0
  storage_mb: 0
  wip_experiments: 0
  protected_evaluation_queries: 0
  physical_canaries: 0

requested_phase_1a_offline_substrate:
  period_days: 14
  money_usd: 0
  model_tokens: 0
  model_output_tokens: 0
  paid_provider_calls: 0
  wall_clock_hours: 40
  storage_mb: 2048
  wip_experiments: 1
  protected_evaluation_queries_per_experiment: 0
  physical_canaries: 0
  notes:
    - Use deterministic fixture workers only.
    - Candidate network, GitHub publication, model providers, and robot access remain denied.
    - An operator may fetch allowlisted workflow dependencies into a hashed lock and cache.
    - Phase 1B cannot activate without the Phase 1A attestation and a new approval.

requested_phase_1b_multimodel_pilot:
  period_days: 30
  money_usd: 200
  model_tokens: 10000000
  model_output_tokens: 2000000
  paid_provider_calls: 200
  wall_clock_hours: 100
  storage_mb: 10240
  wip_experiments: 2
  protected_evaluation_queries_per_experiment: 3
  physical_canaries: 0
  notes:
    - Subscription-backed calls still count toward provider-call and token budgets.
    - Record both actual charge and an imputed API-equivalent cost for comparison.
    - Deterministic fixture workers should prove orchestration before paid calls.
    - Physical canaries require a separate approval and supervised window.
  activation_requires:
    - phase_1a_exit_attestation
    - principal_investigator_attestation
    - approved_provider_profiles

per_experiment_caps:
  money_usd: 25
  model_tokens: 1000000
  wall_clock_hours: 12
  attempts_per_role: 3
  worktrees: 1

comparison_policy:
  matched_limits_required: true
  dimensions: [model, tools, input_tokens, output_tokens, wall_clock, provider_calls]
  unused_budget_is_reported: true
  failed_and_inconclusive_runs_consume_budget: true

alerts:
  - fraction: 0.50
    action: record
  - fraction: 0.80
    action: notify
  - fraction: 1.00
    action: pause_before_next_effect
