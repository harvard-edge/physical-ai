version: 1.0.0
status: active_phase_1a_local_research
scope:
  purpose: dependency_admission
  environments: [local_research, synthetic_evaluation]
  excludes: [project_license_selection, legal_clearance, public_distribution]

default_decision: deny
unknown_metadata: deny
malformed_expression: deny

spdx_allowlist:
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - LGPL-3.0-only
  - MIT
  - PSF-2.0

declared_aliases:
  Apache Software License: [Apache-2.0]
  BSD License: [BSD-3-Clause]
  ISC License: [ISC]
  MIT: [MIT]

classifier_aliases:
  "OSI Approved :: Apache Software License": [Apache-2.0]
  "OSI Approved :: BSD License": [BSD-3-Clause]
  "OSI Approved :: ISC License (ISCL)": [ISC]
  "OSI Approved :: MIT License": [MIT]

obligations:
  LGPL-3.0-only:
    - Preserve license and copyright notices in any distribution.
    - Review relinking and corresponding-source obligations before distribution.

review_triggers:
  - public_distribution
  - dependency_without_recognized_license_metadata
  - license_not_on_allowlist
  - copyleft_dependency_added_or_changed
