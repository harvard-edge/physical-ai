<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physical AI — Machine Learning Systems That Sense and Act</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --obsidian: #010918;
      --ink: #1A202C;
      --muted: #4A5568;
      --crimson: #A51C30;
      --petrol: #007A87;
      --structural: #1F407A;
      --paper: #ffffff;
      --rule: #E2E8F0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "STIX Two Text", "Times New Roman", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hairline {
      width: 100%;
      height: 3px;
      background: linear-gradient(to right, var(--crimson) 0 50%, var(--petrol) 50% 100%);
    }
    .page {
      width: min(720px, calc(100% - 2.5rem));
      margin: 2.5rem auto 3rem;
      text-align: center;
    }
    .cover {
      width: min(260px, 70vw);
      height: auto;
      border-radius: 2px;
      box-shadow: 0 10px 28px rgba(1, 9, 24, 0.18);
      margin-bottom: 1.75rem;
    }
    .eyebrow {
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.6rem;
    }
    h1 {
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-size: clamp(2rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0 0 0.4rem;
      color: var(--obsidian);
    }
    .subtitle {
      font-size: 1.15rem;
      font-style: italic;
      color: var(--muted);
      margin: 0 0 1.1rem;
    }
    .byline {
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-size: 0.92rem;
      color: var(--ink);
      margin: 0 0 0.25rem;
    }
    .affiliations {
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-size: 0.85rem;
      margin: 0 0 2rem;
    }
    .affiliations .harvard { color: var(--crimson); font-weight: 600; }
    .affiliations .pipe { color: #CBD5E1; padding: 0 0.6em; }
    .affiliations .eth { color: var(--petrol); font-weight: 600; }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.7rem 1.1rem;
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
    }
    nav a {
      color: var(--structural);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 0.12rem;
    }
    nav a:hover { border-bottom-color: var(--petrol); color: var(--petrol); }
    nav a.primary {
      background: var(--structural);
      color: #fff;
      padding: 0.45rem 0.95rem;
      border-bottom: none;
      border-radius: 2px;
    }
    nav a.primary:hover { background: var(--petrol); color: #fff; }
    footer {
      margin-top: auto;
      width: 100%;
      padding: 1rem 1.25rem 1.4rem;
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--rule);
    }
  </style>
</head>
<body>
  <div class="hairline"></div>
  <main class="page">
    <p class="eyebrow">Open textbook</p>
    <img class="cover" src="book/assets/cover.png" alt="Physical AI book cover">
    <h1>PHYSICAL AI</h1>
    <p class="subtitle">Machine Learning Systems That Sense and Act</p>
    <p class="byline">Vijay Janapa Reddi</p>
    <p class="affiliations">
      <span class="harvard">Harvard University</span><span class="pipe">|</span><span class="eth">ETH Zurich</span>
    </p>
    <nav>
      <a class="primary" href="book/_build/index.html">Read the book</a>
      <a href="https://github.com/harvard-edge/physical-ai/blob/dev/course/README.md">Course syllabus</a>
      <a href="labs/README.md">Labs</a>
      <a href="slides/course-overview.html">Slides</a>
    </nav>
  </main>
  <footer>
    Local preview · run <code>cd book && quarto preview</code> for the live textbook
  </footer>
</body>
</html>
