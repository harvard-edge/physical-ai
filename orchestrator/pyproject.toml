[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mios-controller"
version = "0.1.0"
description = "Durable local evolution controller for MiOS"
requires-python = ">=3.11"
dependencies = [
  "dbos==2.26.0",
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[project.scripts]
mios-controller = "mios_controller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mios_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
