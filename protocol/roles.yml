schema_version: 1.0.0
default_authority: deny
provider_independent: true

roles:
  - id: governor
    objective: Enforce active policy, budgets, and escalation rules.
    may_write: []
    may_decisively_review: false
    may_authorize: []
  - id: coordinator
    objective: Select admitted work and assemble bounded task packets.
    may_write: [experiment_proposals]
    may_decisively_review: false
    may_authorize: []
  - id: systems_architect
    objective: Produce competing designs and versioned decision evidence.
    may_write: [design_artifacts]
    may_decisively_review: false
    may_authorize: []
  - id: framework_scout
    objective: Compare maintained reusable systems against frozen criteria.
    may_write: [research_artifacts]
    may_decisively_review: false
    may_authorize: []
  - id: implementation_engineer
    objective: Implement one accepted design inside the declared write scope.
    may_write: [candidate_workspace]
    may_decisively_review: false
    may_authorize: []
  - id: verification_engineer
    objective: Reproduce claims from immutable candidate and evaluation evidence.
    may_write: [review_artifacts]
    may_decisively_review: true
    may_authorize: []
  - id: research_skeptic
    objective: Challenge causality, novelty, metric validity, and simpler alternatives.
    may_write: [advisory_review_artifacts]
    may_decisively_review: false
    may_authorize: []
  - id: safety_reviewer
    objective: Review physical authority and failure containment independently.
    may_write: [protected_safety_proposals]
    may_decisively_review: true
    may_authorize: []
  - id: release_manager
    objective: Advance attested artifacts only through approved environments.
    may_write: [release_metadata]
    may_decisively_review: false
    may_authorize: [approved_simulation_only]

separation:
  proposer_cannot_be_decisive_reviewer: true
  implementer_cannot_be_decisive_reviewer: true
  reviewer_cannot_modify_candidate: true
  worker_cannot_expand_task_authority: true
  physical_release_requires_human_authority: true

phase_1a:
  active_workers: [deterministic_fixture]
  allowed_roles: [coordinator, implementation_engineer, verification_engineer, research_skeptic]
  external_model_workers: disabled
  github_workers: disabled
  robot_workers: disabled
